<style>
:root{--fg:#111;--muted:#767676;--off:#c4c4c4;--now:#ffc400;--ok:#009e73;--alert:#d92d20;--todo:#fdecea;--todo-b:#f6c6bf;--soft:#f3f3f3;--jaune:#fff4cc;
  /* les 5 familles de modalités (provisoires, avant le choix du logo) */
  --f-faire:#111111;--f-recevoir:#2F67B1;--f-mesurer:#7B4FB8;--f-dire:#13878A;--f-regard:#8B5A2B;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
a{color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:8px clamp(16px,2.5vw,48px) 120px}
.menu{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 28px}
.menu button,.menu a{font:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:0;background:var(--soft);color:var(--fg);padding:10px 16px;cursor:pointer;text-decoration:none;border-radius:2px}
.menu .on{background:#111;color:#fff}
.kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:6px 0 8px;font-size:clamp(30px,4.5vw,50px);font-weight:900;letter-spacing:-.02em;line-height:1.02;display:flex;align-items:center;gap:14px}
.dot{width:18px;height:18px;border-radius:50%;background:var(--now);flex:none}
.lead{font-size:16px;max-width:760px;margin:0 0 32px}
h2{margin:0 0 6px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px}
section{margin-top:44px}
.todo4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.todo4 a{display:flex;align-items:center;gap:14px;background:var(--todo);padding:14px 16px;text-decoration:none;font-weight:800;font-size:14px;cursor:pointer}
.todo4 a b{font-size:26px;font-weight:900;color:var(--alert);min-width:34px}
.todo4 a.zero{background:var(--soft);color:var(--muted)} .todo4 a.zero b{color:var(--muted)}
.big4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px 24px}
.big4 b{display:block;font-size:34px;font-weight:900;line-height:1}
.big4 b i{font-style:normal;font-size:18px;color:var(--muted);font-weight:700}
.big4 span{display:block;font-size:13px;color:#4a4a4a;margin-top:6px}
.sel{display:inline-flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.sel button{font:inherit;font-weight:800;font-size:13px;border:2px solid #111;background:#fff;padding:8px 14px;cursor:pointer;border-radius:999px}
.sel button.on{background:#111;color:#fff}
.sel button[disabled]{border-color:#d8d8d8;color:#b0b0b0;cursor:default}
/* la frise : la FORME dit l'état, pas la couleur */
.band{margin:0 0 22px}
.band .bh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-weight:800}
.band .bh span{font-weight:600;color:var(--muted);font-size:13px}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{width:24px;height:24px;border:2px solid #111;background:#fff;border-radius:5px;padding:0;cursor:pointer;position:relative}
.cell.pret{background:#111}
.cell.cours{border-width:5px}
.cell.rev{border-style:dashed}
.cell.sel,.row.sel{box-shadow:0 0 0 3px var(--now)}
.cell.ghost{opacity:.18}
.cell.ep{border-radius:50%}
.band .bf{font-size:12.5px;color:#4a4a4a;margin-top:8px}
.leg{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:#4a4a4a;margin-top:14px}
.leg span{display:inline-flex;align-items:center;gap:8px}.leg .cell{cursor:default;width:16px;height:16px}
.leg .cell.cours{border-width:4px}
.bloc a.bl{display:flex;gap:14px;align-items:flex-start;text-decoration:none;padding:12px 0;cursor:pointer}
.bloc a.bl i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;border:2px solid #111}
.bloc a.bl i.r{background:var(--alert);border-color:var(--alert)} .bloc a.bl i.j{background:var(--now);border-color:var(--now)}
.bloc a.bl b{display:block}.bloc a.bl small{display:block;color:#4a4a4a;font-size:13px}
.bloc a.bl em{margin-left:auto;font-style:normal;font-weight:800;font-size:13px;white-space:nowrap}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 12px 10px 0}
table.t td{padding:14px 12px 14px 0;vertical-align:top}
table.t tr.vide td{background:var(--todo);padding-left:10px}
table.t td small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.btn{font:inherit;font-weight:800;font-size:13px;border:0;background:#111;color:#fff;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.l{background:none;color:#111;padding:6px 0;text-decoration:underline}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft)}
.pill.ok{background:#e3f4ee;color:#00694c}.pill.no{background:var(--todo);color:#b42318}
.barre{height:8px;background:var(--soft);margin:2px 0 6px;max-width:220px}.barre i{display:block;height:100%;background:#111}
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:26px}
.fiche div b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.chaine{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chaine div{background:var(--soft);padding:12px 14px}.chaine b{font-size:26px;font-weight:900;display:block}.chaine span{font-size:12.5px;color:#4a4a4a}
.chaine .alerte{background:var(--jaune)}
/* croisement */
.cx{display:grid;grid-template-columns:minmax(150px,1.3fr) repeat(4,minmax(70px,1fr));gap:4px;align-items:stretch}
.cx .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px}
.cx .s{font-weight:800;padding:10px 6px;font-size:14px}
.cx button{font:inherit;border:0;background:var(--soft);padding:10px 6px;cursor:pointer;text-align:center}
.cx button b{font-size:20px;font-weight:900;display:block}.cx button small{font-size:11px;color:#4a4a4a;display:block}
.cx button.zero{background:var(--todo)}.cx button.un{background:var(--jaune)}
.cx button.trou{background:repeating-linear-gradient(135deg,var(--jaune) 0 8px,#fff 8px 14px);outline:2px dashed #111}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tuiles div{background:var(--soft);padding:12px 14px}.tuiles b{font-size:22px;font-weight:900}.tuiles span{display:block;font-size:13px;margin-bottom:6px;font-weight:700}
.tuiles .barre i{background:var(--c,#111)}
/* référentiel : arbre + panneau */
.ref{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media(min-width:1100px){.ref.arb{grid-template-columns:minmax(0,1fr) 340px}}
.filtre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.filtre label{font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;margin-left:auto}
.axe>button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;font:inherit;font-weight:900;font-size:17px;padding:12px 0;cursor:pointer;text-align:left}
.axe>button small{font-weight:600;color:var(--muted);font-size:13px}
.sc{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 4px 30px}
.row{display:grid;grid-template-columns:22px 28px minmax(0,1fr) 120px 150px 110px;gap:10px;align-items:center;padding:9px 6px 9px 8px;cursor:pointer;font-size:14px}
.row:hover{background:var(--soft)}
.row .cell{width:18px;height:18px;border-width:2px}.row .cell.cours{border-width:4px}
.row b{font-weight:800}.row small{color:var(--muted);font-size:12px;display:block}
.row.ext{opacity:.5}
.row .ni{font-size:12.5px;color:#4a4a4a}
.row .sp{display:flex;gap:3px}.sp i{width:11px;height:11px;border-radius:50%;border:2px solid #111;box-sizing:border-box}.sp i.p{background:#111}.sp i.n{border-color:#d8d8d8}
.row .pa{display:flex;gap:4px;flex-wrap:wrap}.pa i{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;padding:2px 5px;border-radius:3px}
.row .et{font-size:12px;font-weight:700}
.poignee{color:#b0b0b0;letter-spacing:-2px;font-weight:900}
.panneau{background:var(--soft);padding:18px;align-self:start;position:sticky;top:12px}
.panneau h3{margin:4px 0 10px;font-size:18px;font-weight:900}
.panneau dl{margin:0}.panneau dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:12px}.panneau dd{margin:3px 0 0}
.etapes{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}.etapes span{font-size:10px;text-align:center;font-weight:700}.etapes .cell{display:block;width:100%;height:12px;border-radius:2px;border-width:2px;margin-bottom:3px}
.etapes .cell.cours{border-width:4px}
.msg{padding:24px 0;font-size:16px}
details.rep summary{cursor:pointer;list-style:none;font-weight:900;font-size:18px;display:flex;gap:12px;align-items:center}
details.rep summary::-webkit-details-marker{display:none}
.note{font-size:12px;color:var(--muted);margin-top:30px}
.demo{display:inline-block;background:#ff3b1f;color:#fff;font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;margin:0 0 14px}

.cran{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.cran .sel{margin:0}
.c2{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.c2i{display:grid;grid-template-columns:34px 22px minmax(0,1fr) 150px 110px;gap:10px;align-items:center;padding:8px;cursor:grab;background:#fff}
.c2i:hover{background:var(--soft)}
.c2i .n{font-weight:900;color:var(--muted);text-align:right}
.c2i .cell{width:18px;height:18px;border-width:2px}.c2i .cell.cours{border-width:4px}
.c2i.sel{box-shadow:0 0 0 3px var(--now)}
.c2i.over,.cell.over{box-shadow:0 0 0 3px var(--now);background:var(--jaune)}
.c2i .pa{display:flex;gap:4px;flex-wrap:wrap}.pa i{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;padding:2px 5px;border-radius:3px}
.c2i small{display:block;color:var(--muted);font-size:12px}
.cell[draggable=true]{cursor:grab}
.cell.alerte::after{content:"!";position:absolute;right:-7px;top:-9px;background:var(--alert);color:#fff;font-size:10px;font-weight:900;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.c1 .tete{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;margin-bottom:18px}
.c1 .regl{display:flex;flex-wrap:wrap;gap:16px}
.c1 .regl label{font-size:12px;font-weight:700;color:var(--muted);display:block;min-width:170px}
.c1 .cols{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.c1 .col{background:var(--soft);padding:12px;border-top:5px solid var(--fam,#111);min-width:190px}
.c1 .col.gris{opacity:.5;border-top-color:#c4c4c4}
.c1 .col h4{margin:0 0 2px;font-size:15px;font-weight:900}.c1 .col .fm{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fam,#767676);margin-bottom:10px}
.c1 select,.c1 input[type=text],.c1 input[type=number]{font:inherit;font-size:13px;font-weight:700;width:100%;border:0;border-bottom:2px solid #111;background:transparent;padding:6px 2px;margin:2px 0 8px}
.c1 textarea{font:inherit;font-size:13px;width:100%;border:2px solid #111;background:#fff;padding:6px;min-height:54px;margin:2px 0 6px}
.c1 .ct{background:#fff;padding:8px;margin-bottom:6px;font-size:13px}.c1 .ct b{display:block;font-size:12px}
.c1 .cm{background:#fff;border-left:4px solid var(--f-regard);padding:6px 8px;margin-bottom:6px;font-size:12.5px}
.c1 .pied{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px}
.c1 .pied b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);padding:4px 8px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0}
.chip button{border:0;background:none;cursor:pointer;font-weight:900;padding:0}
.nouv{background:var(--soft);padding:16px;margin:0 0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end}
.nouv label{font-size:12px;font-weight:700;color:var(--muted);display:block}
.nouv select,.nouv input[type=text]{font:inherit;font-weight:700;width:100%;border:0;border-bottom:2px solid #111;background:transparent;padding:6px 2px}
.toast{position:fixed;top:12px;right:16px;background:#111;color:#fff;padding:8px 14px;font-weight:800;font-size:13px;z-index:60;max-width:70vw}
.toast.err{background:var(--alert)}
@media(max-width:900px){.row{grid-template-columns:22px 26px minmax(0,1fr)}.row .ni,.row .sp,.row .pa,.row .et{display:none}}
</style>

<script>(function(){
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* ---------- constantes du cadre de l'offre (réglages à venir : migration 66) ---------- */
var CADRE={masterclass:18,videosParJournee:6,audiosParSeance:10,delaiRelectureJoursOuvres:5};

var ETAT={ecr:['À écrire','ecr'],tou:['À tourner','cours'],mon:['Au montage','cours'],rel:['À relire','cours'],pret:['Prêt à vendre','pret'],rep:['À revoir','rev']};
var FAM={fiche:['Recevoir','--f-recevoir'],video_mere:['Recevoir','--f-recevoir'],audio:['Recevoir','--f-recevoir'],capsule:['Recevoir','--f-recevoir'],planche:['Recevoir','--f-recevoir'],auto_test:['Mesurer','--f-mesurer'],quiz:['Mesurer','--f-mesurer'],exercice:['Faire','--f-faire'],exercice_chronometre:['Faire','--f-faire'],exercice_depot:['Le regard des autres','--f-regard'],masterclass:['Recevoir','--f-recevoir']};
var TYPEN={fiche:'Fiches',video_mere:'Vidéos-mères',audio:'Audios',auto_test:'Auto-tests',exercice:'Exercices',exercice_depot:'Exercices avec dépôt'};
var D={mods:[],lien:[],rang:[],etap:[],cont:[],prereq:[],parc:null,fiches:[],sit:[],plan:{},offre:null,comm:[],err:[]};

function mods(){return D.mods.filter(function(m){return m.genre==='module';});}
function exts(){return D.mods.filter(function(m){return m.genre==='ressource_externe';});}
function eps(){return D.mods.filter(function(m){return m.genre==='epreuve_niveau';}).sort(function(a,b){return a.ordre-b.ordre;});}
function byCode(c){return D.mods.filter(function(m){return m.code===c;})[0];}
function liensDe(c){return D.lien.filter(function(l){return l.module_code===c;});}
function isP(l){return l.role==='principal';}
function cellMods(sit,niv,role){return D.lien.filter(function(l){return l.situation_code===sit&&l.niveau===niv&&(!role||l.role===role)&&(byCode(l.module_code)||{}).genre==='module';}).map(function(l){return byCode(l.module_code);});}
function sitsPL(){return D.sit.filter(function(s){return s.fiche_code==='PL';}).sort(function(a,b){return a.idx-b.idx;});}
function sitNom(s){return s.nom||s.intitule;}
function shape(m){return ETAT[m.etat]?ETAT[m.etat][1]:'ecr';}
function cnt(L,f){return L.filter(f).length;}
function pct(a,b){return b?Math.round(100*a/b):0;}
function barre(a,b,c){return '<div class="barre"><i style="width:'+pct(a,b)+'%'+(c?';background:var('+c+')':'')+'"></i></div>';}
function holes(){var o=[];sitsPL().forEach(function(s){[1,2,3,4].forEach(function(n){var P=cellMods(s.situation_code,n,'principal');var ch=cellMods(s.situation_code,n);if(!P.length)o.push({sit:s,niv:n,n:0,aussi:ch.length});});});return o;}
function trous(){var o=[];sitsPL().forEach(function(s){[1,2,3,4].forEach(function(n){var P=cellMods(s.situation_code,n,'principal');var T=P.filter(function(m){return m.trou_signale&&m.etat==='ecr';});if(T.length)o.push({sit:s,niv:n,mods:T});});});return o;}
function rangsNiveau(n){return D.rang.filter(function(r){return r.niveau===n;}).sort(function(a,b){return a.rang-b.rang;});}
function bandMods(n){return rangsNiveau(n).map(function(r){return byCode(r.module_code);}).filter(function(m){return m&&m.genre==='module'&&m.niveau_entree===n;});}

/* ---------- rendu : tableau de bord (A1) ---------- */
function todoBloc(){
  var h=holes().length,p1=cnt(mods(),function(m){return m.priorite==='P1'&&m.etat==='ecr';}),ex=cnt(exts(),function(m){return !m.ext;}),mc=Math.max(0,CADRE.masterclass-cnt(mods(),function(m){return m.atelier&&m.atelier.masterclass;}));
  var L=[[h,'cases du métier sans module principal','F:cx'],[p1,'modules prioritaires à écrire','F:arbre'],[ex,'ressources externes à décider','F:arbre'],[mc,'masterclass à désigner','F:arbre']];
  return '<section><h2><i class="dot"></i>À faire aujourd’hui</h2><div class="todo4" style="margin-top:12px">'+L.map(function(x){return '<a data-go="'+x[2]+'" class="'+(x[0]?'':'zero')+'"><b>'+x[0]+'</b>'+x[1]+'</a>';}).join('')+'</div></section>';
}
function chiffres(){
  var M=mods(),E=eps(),tot=M.length+E.length,pr=cnt(M,function(m){return m.etat==='pret';})+cnt(E,function(m){return m.etat==='pret';});
  var rel=D.mods.filter(function(m){return m.etat==='rel'&&(m.genre==='module'||m.genre==='epreuve_niveau');});
  var plus=rel.length?Math.max.apply(null,rel.map(function(m){return Math.floor((Date.now()-new Date(m.maj_le).getTime())/86400000);})):0;
  var V=D.cont.filter(function(c){return c.type==='video_mere';}),A=D.cont.filter(function(c){return c.type==='audio';});
  var q=function(L){return L.reduce(function(a,c){return a+c.quantite;},0);},fait=function(L){return L.filter(function(c){return c.etat==='mon'||c.etat==='rel'||c.etat==='pret';}).reduce(function(a,c){return a+c.quantite;},0);};
  var jours=Math.ceil(q(V)/CADRE.videosParJournee)+Math.ceil(q(A)/CADRE.audiosParSeance),dates=Object.keys(D.plan.dates||{}).filter(function(k){return D.plan.dates[k];}).length;
  var sc=sitsPL().filter(function(s){return [1,2,3,4].some(function(n){return cellMods(s.situation_code,n,'principal').length;});}).length;

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-t],[data-go],[data-sel],[data-vue],[data-fs],[data-axe],[data-cell]');if(!t)return;var d=t.dataset;
  if(d.t){S.tab=d.t;location.hash=d.t;render();scrollTo(0,0);return;}
  if(d.go){aller(d.go);return;}
  if(d.cell!==undefined){S.cell=S.cell===d.cell?'':d.cell;render();return;}
  if(d.axe){S.open[d.axe]=!S.open[d.axe];render();return;}
  if(d.fs!==undefined){S.sit=d.fs;render();return;}
  if(d.vue){S.view=d.vue;if(S.tab==='K'){S.tab='F';}render();var r=$('s-ref');if(r)r.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(d.sel){S.sel=S.sel===d.sel&&S.view==='arbre'?'':d.sel;if(S.tab==='K'){S.tab='F';S.view='frise';}var m=byCode(S.sel);if(m&&S.view==='arbre')S.open[m.axe]=true;render();var r2=$('s-ref');if(r2&&S.tab==='F'&&e.target.closest('.cell'))r2.scrollIntoView({behavior:'smooth',block:'start'});return;}
});
document.addEventListener('change',function(e){var t=e.target,a=t.dataset&&t.dataset.act;
  if(t.id==='prio'){S.prio=t.checked;render();return;}
  if(!a)return;var m=byCode(S.sel);
  if(a==='etatmod'&&m)etatModule(m.code,t.value);
  else if(a==='essai'&&m)majModule(m.code,{essai_securise:t.value==='oui'?true:(t.value==='non'?false:null)},'essai sécurisé');
  else if(a==='prio'&&m)majModule(m.code,{priorite:t.checked?'P1':'P2'},'priorité');
  else if(a==='etatetape'&&m)etatEtape(m.code,t.dataset.e,t.value);
  else if(a==='etatcont')etatCont(t.dataset.id,t.value);
  else if(a==='addpre'&&m&&t.value)prerequis(m.code,t.value,true);
});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-cran],[data-niv]');if(!b)return;var d=b.dataset,m=byCode(S.sel);
  if(d.cran){S.cran=+d.cran;render();return;}
  if(d.niv){S.niv=+d.niv;render();return;}
  if(d.act==='nouveau'){S.nouveau=!S.nouveau;render();return;}
  if(d.act==='creer'){creerModule();return;}
  if(d.act==='delpre'&&m){prerequis(m.code,d.p,false);return;}
  if(d.act==='addcm'&&m){var ta=document.querySelector('textarea[data-cm="'+d.e+'"]'),sc=document.querySelector('input[data-cs="'+d.e+'"]');ajouterCommentaire(m.code,d.e,ta&&ta.value,sc&&sc.value);}
});

/* ---------- chargement ---------- */
async function lire(nom,q){try{var r=await q;if(r.error){D.err.push(nom);return [];}return r.data||[];}catch(x){D.err.push(nom);return [];}}
async function charger(){
  var sb=window.VSF&&VSF.sb;
  if(TEST){return;}
  var s=await sb.auth.getSession();
  if(!s.data.session){location.replace('connexion.html?suite='+encodeURIComponent(location.href));return;}
  var a=await sb.rpc('vsf_est_admin'),rl=await sb.rpc('vsf_est_relecteur');
  if(a.data!==true){$('app').innerHTML='<div class="kick">Offre Ambassadeurs</div><h1><i class="dot"></i>Accès réservé</h1><p class="lead">'+(rl.data===true?'Votre vue de maître artisan arrive à l’étape suivante. En attendant, utilisez la page de relecture.':'Cette page est réservée à Skolantreuz.')+'</p><p><a class="btn" href="'+(rl.data===true?'production.html#R':'./')+'">'+(rl.data===true?'Ouvrir la relecture →':'Retour')+'</a></p>';return;}
  var q=function(t,c){return sb.from(t).select(c||'*');};
  var r=await Promise.all([lire('modules',q('vsf_prod_modules').order('ordre')),lire('liens',q('vsf_form_module_situations')),lire('rangs',q('vsf_form_rangs_calcules')),lire('étapes',q('vsf_form_module_etapes')),lire('contenus',q('vsf_form_contenus')),
    lire('parcours',q('vsf_form_parcours')),lire('fiches',q('vsf_fiches_metiers')),lire('situations',q('vsf_fiche_situations')),lire('planning',q('vsf_prod_planning','cle,valeur')),lire('offre',sb.from('vsf_offres').select('intitule,statut,vendeur:vsf_vendeurs(statut,contrat_accepte_le)').ilike('intitule','%lettres%').limit(1)),lire('échanges',q('vsf_form_commentaires').order('cree_le',{ascending:false}).limit(500)),lire('prérequis',q('vsf_form_prerequis'))]);
  USER=s.data.session.user.id;
  D.mods=r[0];D.lien=r[1];D.rang=r[2];D.etap=r[3];D.cont=r[4];D.parc=r[5][0]||null;D.fiches=r[6];D.sit=r[7];(r[8]||[]).forEach(function(x){D.plan[x.cle]=x.valeur;});D.offre=r[9][0]||null;D.comm=r[10];D.prereq=r[11];
  if(!D.mods.length){$('app').innerHTML='<div class="kick">Offre Ambassadeurs</div><h1><i class="dot"></i>Rien à afficher</h1><p class="lead">Aucun module : les migrations 36 à 65 ne sont pas toutes installées.</p>';return;}
  var h=(location.hash||'').slice(1);if('KFTR'.indexOf(h)>-1&&h.length===1)S.tab=h;
  render();
}
/* branche de test : seulement en local, avec un jeu de données fictif ou copié, jamais en ligne */
window.PV2={init:function(data){TEST=true;D=Object.assign(D,data);D.plan=D.plan||{};D.prereq=D.prereq||[];D.err=[];D.cont.forEach(function(c,i){if(c.id==null)c.id='t'+i;});render();},etat:function(){return {S:S,D:D};}};
if(location.hostname==='localhost'||location.hostname==='127.0.0.1'){fetch('pv2-test-data.json').then(function(r){return r.ok?r.json():null;}).then(function(j){if(j)window.PV2.init(j);else charger();}).catch(charger);}else charger();
})();
