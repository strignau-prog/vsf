<!doctype html>
<html lang="fr" data-public>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’Éclaireur — VRAI-SAVOIRFAIRE</title>
<meta name="description" content="Trois minutes, sans compte : trois métiers qui te ressemblent, ce que tu as déjà en commun avec eux, et le baromètre du mois.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="vsf-logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<style>:root{--fg:#111;--muted:#767676;--off:#c4c4c4;--now:#ffc400;--ok:#009e73;--todo:#fdecea;--font:'Inter','Helvetica Neue',Arial,sans-serif;--gut:clamp(16px,4vw,56px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
/* bandeau public */
.top{position:sticky;top:0;z-index:50;background:#fff;display:flex;align-items:center;gap:28px;padding:14px var(--gut);transition:box-shadow .2s}
.top.sh{box-shadow:0 6px 14px -10px rgba(0,0,0,.35)}
.menu{display:flex;gap:26px;flex:1;justify-content:center;flex-wrap:wrap}
.menu a{white-space:nowrap;font-weight:800;font-size:14.5px;color:#111;text-decoration:none}
.menu a:hover{color:var(--now)}
.top .brand{color:#111;text-decoration:none;flex:none}
.menu a.on{position:relative}
.menu a.on::after{content:"";position:absolute;left:50%;bottom:-9px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--now)}
.login{font-weight:800;font-size:14px;color:var(--muted);text-decoration:none;flex:none}
.login:hover{color:var(--now)}
@media(max-width:820px){.top{flex-wrap:wrap;gap:10px}.menu{order:3;flex-basis:100%;justify-content:flex-start;gap:18px;overflow-x:auto;flex-wrap:nowrap}.login{margin-left:auto}}
/* scène */
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:calc(100vh - 60px);gap:0}
@media(max-width:900px){.stage{grid-template-columns:1fr;min-height:0}}
.panel{padding:40px var(--gut) 48px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:3;background:#fff}
@media(max-width:900px){.panel{order:2;padding-top:24px}}
.sky{position:relative;overflow:hidden;min-height:560px;background:#fff}
@media(max-width:900px){.sky{order:1}}
.field{position:absolute;inset:0}
@media(max-width:900px){.sky{height:auto;min-height:0}.field{position:relative;height:58vh;min-height:380px;overflow:hidden}.fin .field{height:260px;min-height:0}}
.sky svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.b{position:absolute;left:0;top:0;transition:transform 1.4s cubic-bezier(.3,.7,.2,1),opacity .8s;will-change:transform}
.b span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:#fff;border:1.5px solid #111;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:800;animation:drift 7s ease-in-out infinite alternate;cursor:default}
.b.far span{border-color:#d8d8d8;color:#b0b0b0;font-weight:700}
.b.near span{border-width:2px}
.b.top3 span{background:#ffc400;border-color:#ffc400}
.b i{font-style:normal;font-size:10px;font-weight:900}
.b .tg{color:#009e73}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(6px,-8px)}100%{transform:translate(-5px,5px)}}
.me{position:absolute;transition:transform 1.2s cubic-bezier(.3,.7,.2,1),opacity .6s;z-index:2}
.me div{width:92px;height:92px;border-radius:50%;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:800;line-height:1.15;padding:8px;box-shadow:0 0 0 10px rgba(255,196,0,.25)}
.me div b{font-size:16px;font-weight:900;color:#ffc400}
/* panneau de questions */
.kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:10px 0 14px;font-size:clamp(34px,4.6vw,60px);font-weight:900;line-height:1.02;letter-spacing:-.02em}
.focus.play{animation:focus .8s ease-out both}
@keyframes focus{from{filter:blur(10px);opacity:0}to{filter:blur(0);opacity:1}}
.mk{display:inline-block}.play .mk{animation:up .7s .6s both}
@keyframes up{0%{transform:translateY(.35em);opacity:0;color:var(--now)}40%{transform:none;opacity:1;color:var(--now)}100%{color:#111}}
.lead{font-size:17px;max-width:520px;margin:0 0 28px;color:#333}
.start,.back{align-self:flex-start}
.start{display:inline-flex;align-items:center;gap:14px;background:none;border:0;padding:0;font-size:clamp(22px,2.6vw,30px);font-weight:900;cursor:pointer}
.start .dot{width:22px;height:22px;border-radius:50%;background:var(--now);animation:beat 2.6s ease-in-out infinite}
.start:hover{color:var(--now)}
@keyframes beat{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.35)}90%{transform:scale(1)}}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.prog{display:flex;gap:4px;margin-bottom:22px;max-width:420px}
.prog i{flex:1;height:5px;background:#eee}.prog i.d{background:#111}.prog i.n{background:var(--now)}
.q{font-size:clamp(24px,2.8vw,34px);font-weight:900;line-height:1.1;letter-spacing:-.01em;margin:6px 0 8px}
.qh{font-size:14px;color:var(--muted);margin:0 0 18px}
.srch{display:flex;align-items:center;gap:8px;padding:12px 12px;border-bottom:2px solid #111;max-width:460px}
.srch.todo{background:var(--todo)}
.srch input{flex:1;border:0;background:transparent;font:inherit;font-size:18px;font-weight:800;outline:none;min-width:0}
.srch.todo input::placeholder{color:#b42318}
.srch{position:relative}
.srch input{padding:0;margin:0}
.caret{position:absolute;left:12px;top:50%;width:2px;height:1.25em;margin-top:-.62em;background:#b42318;animation:bl 1s steps(1) infinite;pointer-events:none}
.srch:focus-within .caret,.srch:has(input:not(:placeholder-shown)) .caret{display:none}
.srch input::placeholder{padding-left:6px}
@keyframes bl{50%{opacity:0}}
.sugg{display:flex;flex-direction:column;max-width:460px}
.sugg button{background:none;border:0;padding:11px 12px;text-align:left;font-size:15.5px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sugg button small{font-weight:600;color:var(--muted);font-size:12px}
.sugg button:hover{color:var(--now)}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-width:560px}
.chips button{background:#fff;border:2px solid #111;padding:9px 13px;font-size:14.5px;font-weight:700;cursor:pointer;border-radius:999px}
.chips button:hover{color:var(--now)}
.chips button.on{background:#111;color:#fff}
.chips.todo button:not(.on){border-color:#b42318;color:#b42318;background:var(--todo)}
.sel{position:relative;max-width:300px;margin-top:16px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;font-weight:800;border:0;border-bottom:2px solid #111;padding:12px 36px 10px 12px;background:transparent;cursor:pointer}
.sel.todo{background:var(--todo)}.sel.todo select{color:#b42318}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;border-right:2.5px solid #111;border-bottom:2.5px solid #111;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.nav{display:flex;align-items:center;gap:22px;margin-top:28px;flex-wrap:wrap}
.next{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;font-size:22px;font-weight:900;color:var(--off);cursor:not-allowed}
.next .dot{width:18px;height:18px;border-radius:50%;background:var(--off)}
.next.ready{color:#111;cursor:pointer}.next.ready .dot{background:var(--now)}.next.ready:hover{color:var(--now)}
.back{background:none;border:0;padding:0;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer}
.back:hover{color:var(--now)}
.why{font-size:13px;color:#b42318;margin-top:8px;min-height:1.2em}
.me-card{border-top:4px solid #111;padding-top:14px}
.me-card h3{margin:0 0 4px;font-size:22px;font-weight:900}
.me-card .ln{font-size:14px;margin:4px 0}
.me-card .ln b{font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tags span{font-size:12px;font-weight:800;background:#f3f3f3;padding:4px 9px;border-radius:999px}
/* cibles */
.cards{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:26px;padding:24px var(--gut) 24px 24px;pointer-events:none}
@media(max-width:900px){.cards{position:static;align-items:stretch;padding:16px var(--gut)}}
.pth{fill:none;stroke:#ffc400;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:drawp .9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes drawp{to{stroke-dashoffset:0}}
.tk{position:absolute;left:0;top:0;z-index:4;animation:tkin .2s both}.tk span{display:inline-block;white-space:nowrap;background:#ffc400;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}.tk.set span{background:#111;color:#ffc400}
@keyframes tkin{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.cards.wait .cd{opacity:0;translate:-48px 0;scale:.9;pointer-events:none}
.cnt{font-size:56px;font-weight:900;line-height:1;margin:18px 0 4px;font-variant-numeric:tabular-nums}
.cd{pointer-events:auto;position:relative;z-index:2;width:fit-content;max-width:min(300px,100%);padding:10px 14px;background:#fff;border:2px solid #111;cursor:pointer;text-align:left;animation:flt 6s ease-in-out infinite alternate;transition:opacity .5s,translate .7s cubic-bezier(.2,1.3,.4,1),scale .7s cubic-bezier(.2,1.3,.4,1),background .3s,box-shadow .3s}
.cd:nth-child(2){animation-delay:-2s;margin-right:44px}.cd:nth-child(3){animation-delay:-4s}
@media(max-width:900px){.cd{width:100%;max-width:none}.cd:nth-child(2){margin-right:0}}
.field,.sig{scroll-margin-top:110px}
.cd:hover .cn{color:var(--now)}
.cd.on{background:#fff8dc;box-shadow:6px 6px 0 #ffc400}
.cd .vf{margin-top:8px;font-size:12.5px;font-weight:800;color:#111}
.cd:hover .vf{color:var(--now)}
.cd .ck2{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cd .cn{font-size:18px;font-weight:900;line-height:1.1;margin:3px 0 6px}
.cd .bd{display:flex;gap:6px;flex-wrap:wrap}
.cd .bd span{font-size:11px;font-weight:800;padding:3px 8px;background:#f3f3f3;border-radius:999px}
.cd .bd .rc{background:#e3f4ee;color:#006b4e}.cd .bd .ia{background:#111;color:#fff}.cd .bd .rr{background:#fff4cc}
.cd .pp{font-size:12px;margin-top:6px;color:#333}
@keyframes flt{0%{transform:translate(0,0) rotate(-.4deg)}100%{transform:translate(-6px,-10px) rotate(.4deg)}}
/* fiche signalétique */
.sig{padding:40px var(--gut) 24px;max-width:1240px;margin:0 auto;scroll-margin-top:70px}
.sig h2{font-size:clamp(28px,3.4vw,42px);font-weight:900;margin:6px 0 4px;letter-spacing:-.01em}
.sig .sub{font-size:15px;color:#4a4a4a;margin:0 0 24px}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.sg{grid-template-columns:1fr}}
.sg>div{background:#f3f3f3;padding:16px 18px}
.sg h4{margin:0 0 8px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14.5px;font-weight:700}
.sg li{display:flex;gap:8px}
.sg .big{font-size:34px;font-weight:900;line-height:1.05}
.sg .big small{display:block;font-size:13px;font-weight:600;color:#4a4a4a;margin-top:4px}
.acc{margin:20px 0 28px;padding:20px;border:2px solid #111}
.acs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:900px){.acs{grid-template-columns:1fr 1fr}}
.acs>div{background:#f3f3f3;padding:14px}.acs b{font-size:26px;line-height:1}.acs h5{margin:8px 0 4px;font-size:15px;font-weight:900}.acs p{margin:0;font-size:13px;color:#333}
.acx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 20px}@media(max-width:900px){.acx{grid-template-columns:1fr}}.acx>div{border:2px solid #111;padding:14px}.acx h5{margin:0 0 6px;font-size:15px;font-weight:900}.acx p{margin:0;font-size:13.5px;color:#333;line-height:1.5}.acx a{color:#111;font-weight:800;text-decoration:none}.acx a:hover{color:var(--now)}.acs a,.acc .ln a{color:#111;font-weight:800;text-decoration:none}.acs a:hover,.acc .ln a:hover{color:var(--now)}.pay{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:#111;color:#fff;padding:2px 6px;margin-left:4px;vertical-align:2px}.pay.free{background:#e3f4ee;color:#006b4e}
.cta{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:28px 0 8px}
.cta .start{font-size:26px}
.cta a{font-weight:800;color:#111;text-decoration:none;font-size:16px}.cta a:hover{color:var(--now)}
.keep{display:flex;gap:10px;max-width:520px;margin-top:10px;align-items:center}
.keep input{flex:1;font:inherit;font-size:15px;border:0;border-bottom:2px solid #111;padding:10px 4px;background:transparent}
.keep button{background:#111;color:#fff;border:0;padding:11px 14px;font-weight:900;cursor:pointer}
.keep button:hover{color:var(--now)}
.kc{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#333;margin-top:10px;max-width:520px;cursor:pointer}.kc input{margin-top:2px}.kmsg{font-size:13px;margin:8px 0 0;min-height:1.2em;color:#b42318}.kmsg.ok{color:#006b4e}
/* baromètre */
.baro{padding:56px var(--gut) 96px;max-width:1240px;margin:0 auto}
.baro h2{font-size:clamp(28px,3.4vw,42px);font-weight:900;margin:6px 0 6px;letter-spacing:-.01em}
.baro .sub{font-size:15px;color:#4a4a4a;margin:0 0 6px;max-width:780px}
.demo{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:#ff3b1f;color:#fff;padding:4px 8px;margin:6px 0 24px}
.bg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.bg{grid-template-columns:1fr}}
.bc{background:#f3f3f3;padding:18px}
.bc h3{margin:0 0 4px;font-size:18px;font-weight:900;display:flex;gap:8px;align-items:center}
.bc p{margin:0 0 12px;font-size:13px;color:#4a4a4a}
.br{width:100%;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;border-left:4px solid transparent;transition:border-color .2s;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;padding:9px 11px;margin-bottom:5px;font-size:14px;font-weight:800}
.br:hover>span:first-child{color:var(--now)}.br.on{border-left-color:var(--now);background:#fff8dc}
.sig2{padding:28px 0 0;max-width:none}
.br small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.br .v{font-size:12px;font-weight:900;white-space:nowrap}
.v.up{color:#009e73}.v.hi{color:#111}.v.ia{color:#4a4a4a}
.src{font-size:12px;color:var(--muted);margin-top:14px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* résultat : la hauteur suit le contenu ; la fiche vient juste dessous, puis le baromètre, comme une même histoire */
.stage:has(.sky.fin){min-height:0}
.sky.fin{min-height:0;height:auto}
.sky.fin .cards{position:relative;min-height:440px;padding-block:20px}
@media(max-width:900px){.sky.fin .cards{min-height:0}}
.sig:not(.hide){border-top:4px solid #ffc400;padding-top:24px;max-width:none;margin:0}
.baro{padding:28px var(--gut) 56px;max-width:none;margin:0}
.sig,.baro{padding-left:var(--gut);padding-right:var(--gut)}
.sg,.bg{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1100px){.sg,.bg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.sg,.bg{grid-template-columns:1fr}}
.br>span:last-child::after{content:"  → fiche";color:#767676;font-weight:700;font-size:12px}
.cd.on::after{content:"";position:absolute;left:50%;bottom:-26px;width:0;height:26px;border-left:4px solid #ffc400;transform:translateX(-2px)}

/* ---- refonte du 9 novembre (maquette) : ouverture plein écran, 3 chapitres, curseurs « peu importe » ---- */
.stage{position:relative;transition:grid-template-columns .9s cubic-bezier(.6,0,.2,1)}
.stage.intro{grid-template-columns:minmax(0,0fr) minmax(0,7fr);min-height:calc(100svh - var(--hh,64px))}
.stage.intro .panel{padding-left:0;padding-right:0;opacity:0;overflow:hidden}
.panel{transition:opacity .6s .35s,padding .9s cubic-bezier(.6,0,.2,1)}
.stage.intro .sky{background:#fff;min-height:calc(100svh - var(--hh,64px))}
.sky{transition:background .9s}
.intro .b{transition-duration:4.2s;transition-timing-function:ease-in-out}
.intro .b span{background:transparent}
.intro .b.z1 span{scale:.82;opacity:.45;filter:blur(1px)}
.intro .b.z2 span{scale:.68;opacity:.22;filter:blur(2.2px)}
.hero{--hc:#111;--hd:#a3a3a3;--hg:rgba(255,255,255,.94);position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px var(--gut);color:var(--hc);cursor:pointer;transition:opacity .5s,transform .7s cubic-bezier(.6,0,.2,1)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 58% 42% at 50% 50%,var(--hg) 38%,rgba(255,255,255,0) 76%);pointer-events:none}
.hero>*{position:relative}
.stage:not(.intro) .hero{opacity:0;transform:translateY(-40px);pointer-events:none}
.h1x{position:relative;display:inline-block;font-size:clamp(24px,3.4vw,44px);font-weight:900;letter-spacing:-.01em;line-height:1.1;color:var(--hc)}
.h1x svg{position:absolute;left:-3%;top:48%;width:106%;height:.3em;overflow:visible}
.h1x path{fill:none;stroke:#ff3b1f;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.play .h1x{animation:focus .8s 1.2s both,dim .6s 3.6s forwards}
@keyframes dim{to{color:var(--hd)}}
.play .h1x path{animation:drawp 1.4s 2.2s cubic-bezier(.45,0,.4,1) forwards}
.hero h1{margin:16px 0 18px;font-size:clamp(38px,6.6vw,100px);color:var(--hc);line-height:.98;letter-spacing:-.03em;max-width:none}
.hero h1.play{animation:grow 1.3s 3.8s cubic-bezier(.2,.75,.2,1) both}
@keyframes grow{0%{opacity:0;transform:scale(.12);filter:blur(6px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
.hero h1 .mk{animation:upw 1.1s 4.9s both}
@keyframes upw{0%{color:var(--hc)}25%{color:var(--now);transform:translateY(-.1em)}70%{color:var(--now);transform:none}100%{color:var(--hc)}}
.hero .sub2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--hd);margin:0 0 30px;animation:focus .8s 5.1s both}
.hero .start{color:var(--hc);animation:focus .8s 5.4s both;align-self:center}
.hero .start:hover{color:var(--now)}
.hero .cap{position:absolute;right:var(--gut);bottom:22px;text-align:right;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero .cap span{display:block;margin-top:5px;font-weight:400;letter-spacing:.06em;text-transform:none;font-size:12px}
@media(max-width:900px){.hero::before{background:radial-gradient(ellipse 100% 36% at 50% 50%,var(--hg) 60%,rgba(255,255,255,0) 92%)}.stage.intro{grid-template-columns:1fr}.stage.intro .panel{display:none}.stage.intro .sky{height:calc(100svh - var(--hh,84px))}.stage.intro .field{height:100%}.hero .cap{left:var(--gut);right:auto;text-align:left}}
.chap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:24px;max-width:520px}
.chap span{border-top:5px solid #eee;padding-top:7px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#b0b0b0;line-height:1.25}
.chap span.d{border-top-color:#111;color:#111}.chap span.n{border-top-color:var(--now);color:#111}
.sls{display:flex;flex-direction:column;gap:22px;max-width:520px;margin-top:4px}

  var ab=e.target.closest('.accb');if(ab){var box=ab.closest('.sig').querySelector('.acc');box.classList.toggle('hide');ab.textContent='Découvrir l’accompagnement VSF '+(box.classList.contains('hide')?'↓':'↑');return;}
  if(e.target.closest('.shut')){S.bpick=-1;sig();return;}
  var r=e.target.closest('[data-bm]');if(r){S.bpick=+r.dataset.bm===S.bpick?-1:+r.dataset.bm;sig();if(S.bpick>=0)setTimeout(function(){$('sig2').scrollIntoView({behavior:RED?'auto':'smooth',block:'start'});},60);}});
/* « Garder » : l'e-mail et les réponses ne partent qu'ici, avec la case de consentement cochée (RGPD) */
document.addEventListener('click',async function(e){var b=e.target.closest('.keepgo');if(!b)return;
  var box=b.closest('.keepw'),em=box.querySelector('.em'),ck=box.querySelector('.cons'),msg=box.querySelector('.kmsg');msg.className='kmsg';
  var mail=em.value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){msg.textContent='Saisis une adresse e-mail valide.';return;}
  if(!ck.checked){msg.textContent='Coche la case pour que nous gardions tes réponses.';return;}
  if(!(window.VSF&&VSF.sb)){msg.textContent='Impossible de garder tes réponses pour le moment.';return;}
  b.disabled=true;
  var rep={metier:{code:S.job&&S.job.c,nom:S.job&&S.job.n,duree:DUR[+S.dur],savoir_faire:S.job?S.job.sf.filter(function(x,k){return S.sf[k];}).map(function(x){return x[0];}):[]},avant:S.prevs.map(function(p){return {code:p.j.c,nom:p.j.n,duree:DUR[+p.dur],savoir_faire:p.j.sf.filter(function(x,k){return p.sf[k];}).map(function(x){return x[0];})};}),reponses:S.a,regard:S.want,region:S.reg||null,cibles:S.top.map(function(x){return x[0].m.n;}),demo:true};
  var r=await VSF.sb.rpc('vsf_eclaireur_garder',{p_email:mail,p_reponses:rep,p_consentement:true});
  b.disabled=false;
  if(r.error){msg.textContent=(r.error.code==='VSF08'&&r.error.message)?r.error.message:'Impossible de garder tes réponses pour le moment.';return;}
  msg.className='kmsg ok';msg.textContent='C’est gardé. Rien d’autre n’est enregistré.';
});

/* ---------- ouverture : textes modifiables (eclaireur-textes.json), puis la page s'ouvre au clic, à la molette ou au glissement ---------- */
function topH(){var e=document.querySelector('.vsf-menu');return e?e.offsetHeight:0;}
var TEXTES={barre:'La fin du travail',titre:'Vivre ce que t’aimes bien faire.',accroche:'3 minutes · sans compte · 3 métiers viennent à toi',legende:'L’Éclaireur',legende2:'Le tour de France des métiers, chaque mois'};
function heroHtml(){var t=TEXTES.titre.replace(/fa(i)re/,'fa<span class="mk">$1</span>re');
  return '<div class="h1x">'+esc(TEXTES.barre)+'<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M1 6 C 20 3, 35 8, 52 5 S 85 7, 99 4"/></svg></div><h1 class="play">'+t+'</h1><p class="sub2">'+esc(TEXTES.accroche)+'</p><button class="start" id="go"><span class="dot"></span>Commencer →</button><div class="cap">'+esc(TEXTES.legende)+'<span>'+esc(TEXTES.legende2)+'</span></div>';}
function poserHero(){var h=$('hero');h.innerHTML=heroHtml();h.classList.remove('play');void h.offsetWidth;h.classList.add('play');}
var WH=null;
function whirl(){clearInterval(WH);if(S.st===0&&!RED)WH=setInterval(function(){if(S.st===0)layout();},4000);}
function openIt(){if(S.st!==0)return;S.st=1;clearInterval(WH);render();var t0=Date.now();(function f(){layout();if(Date.now()-t0<1000)requestAnimationFrame(f);})();
  if(innerWidth<900)setTimeout(function(){scrollTo({top:$('panel').getBoundingClientRect().top+scrollY-topH()-8,behavior:RED?'auto':'smooth'});},350);
  setTimeout(function(){var q=$('jq');if(q)q.focus({preventScroll:true});},950);}
$('hero').addEventListener('click',openIt);
$('hero').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openIt();}});
addEventListener('wheel',function(e){if(S.st===0&&e.deltaY>0&&scrollY<10){e.preventDefault();openIt();}},{passive:false});
var ty=null;addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchmove',function(e){if(S.st===0&&ty!==null&&ty-e.touches[0].clientY>30&&scrollY<10){openIt();ty=null;}},{passive:true});
document.documentElement.style.setProperty('--hh',topH()+'px');
poserHero();
try{fetch('eclaireur-textes.json?'+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j){Object.keys(j).forEach(function(k){if(typeof j[k]==='string'&&j[k].trim())TEXTES[k]=j[k];});poserHero();}}).catch(function(){});}catch(e){}
bubbles();baro();$('bubbles').classList.add('nt');render();setTimeout(function(){$('bubbles').classList.remove('nt');layout();},60);whirl();
addEventListener('resize',layout);
