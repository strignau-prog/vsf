function fiche(m,label,src){var done=S.st>=8&&S.job,t=done?myTags():{},com=m.sf.filter(function(g){return t[g];}),nw=m.sf.filter(function(g){return !t[g];}),p=prox(m);
  var sj=[];if(done)['v','m','l','a','w'].forEach(function(k){Object.keys(S.a[k]).forEach(function(v){if(S.a[k][v]&&m.p[k].indexOf(v)>=0)sj.push(lab(k,v));});});
  var reg=S.reg&&S.reg!=='Toute la France'?S.reg:'Bretagne';
  var trait=[].concat(m.p.m.map(function(v){return lab('m',v);}),m.p.l.map(function(v){return lab('l',v);}),m.p.v.map(function(v){return lab('v',v);}));
  var h='<div class="kick">Fiche signalétique · '+label+'</div><h2>'+(m.art?'◆ ':'')+m.n+'</h2>'+
   (done?'<p class="sub">De vous à '+m.n.toLowerCase()+' : ce que vous avez déjà, ce qui serait nouveau, et le temps que ça prendrait.</p>':'<p class="sub">Ce métier en bref. Faites le parcours en 3 minutes pour le comparer avec vous.</p>')+'<div class="sg">'+
   (done?'<div><h4>Ce que vous avez déjà en commun · '+com.length+'</h4><ul>'+(com.map(function(g){return '<li>✓ '+TAGN[g]+'</li>';}).join('')||'<li>Peu de choses : c’est un vrai virage.</li>')+'</ul></div><div><h4>Ce qui serait nouveau · '+nw.length+'</h4><ul>'+nw.map(function(g){return '<li>○ '+TAGN[g]+'</li>';}).join('')+'</ul></div><div><h4>Ce qui rejoint ce qui compte pour vous</h4><ul>'+(sj.slice(0,5).map(function(s){return '<li>● '+s+'</li>';}).join('')||'<li>Peu de points communs : à vérifier en immersion.</li>')+'</ul></div>'
        :'<div><h4>Ce que fait ce métier</h4><ul>'+m.sf.map(function(g){return '<li>○ '+TAGN[g]+'</li>';}).join('')+'</ul></div><div><h4>Ce qui le caractérise</h4><ul>'+trait.slice(0,6).map(function(s){return '<li>● '+s+'</li>';}).join('')+'</ul></div><div><h4>Et vous ?</h4><ul><li>✓ en commun</li><li>○ à apprendre</li><li>● ce qui compte pour vous</li></ul><small style="display:block;margin-top:8px;color:#4a4a4a">apparaissent après le parcours.</small></div>')+
   '<div><h4>Durée approximative de reconversion</h4><div class="big">'+(done?duree(p):'?')+'<small>'+(done?'avec un accompagnement, en gardant une activité. Le diagnostic complet la précise.':'calculée à partir de vos savoir-faire.')+'</small></div></div><div><h4>Où ça embauche · baromètre de novembre</h4><div class="big">'+(m.t>=3?'Beaucoup':(m.t===2?'Oui':(m.t===1?'Un peu':'Peu')))+'<small>'+(m.t>=2?reg+' en tête ; offres en hausse ce mois.':'Des offres rares, souvent par le bouche-à-oreille et les ateliers.')+(m.up?' Demande en hausse pour ce métier rare.':'')+'</small></div></div><div><h4>Repère IA</h4><div class="big" style="font-size:24px">'+iaTxt(m)+'<small>'+(m.ia==='faible'?'Le cœur du métier est un geste et un jugement humains.':(m.ia==='moyenne'?'Une partie des tâches change ; le geste reste.':'Beaucoup de tâches sont déjà automatisables.'))+'</small></div></div></div>';
  if(done)h+='<div class="cta"><button class="start build"><span class="dot"></span>Construire mon chemin vers ce métier →</button><button class="back accb" style="font-size:16px;color:#111">Découvrir l’accompagnement VSF ↓</button></div><div class="acc hide"><div class="kick">L’accompagnement VSF · vers '+(m.art?'◆ ':'')+m.n+'</div><span class="demo" style="background:#ffc400;color:#111">Esquisse à valider</span><div class="acs"><div><b>◉</b><h5>Diagnostic complet <small class="pay">payant</small></h5><p>Fiche métier enrichie, verdict de sens entre ce métier et 2 autres.</p></div><div><b>⌂</b><h5>Immersion <small class="pay free">gratuit</small></h5><p>Jusqu’à 1 mois en atelier : un dispositif public (PMSMP). VSF vous aide à la préparer. <a href="https://www.service-public.gouv.fr/particuliers/vosdroits/F14102" target="_blank" rel="noopener">En savoir plus ↗</a></p></div><div><b>▶</b><h5>Parcours de modules</h5><p>Tutos, dépôts corrigés, mentorat, Thérèse. Module par module, tests gratuits.</p></div><div><b>★</b><h5>Reconnaissance</h5><p>Épreuve, jury, badge.</p></div></div><div class="acx"><div><h5>◇ Qui vous accompagne</h5><p>Un Ambassadeur du métier, en atelier.<br>Thérèse, entre deux rendez-vous.</p></div><div><h5>€ Financer</h5><p>Des dispositifs existent, on vous aide à les explorer.<br><a href="https://www.moncompteformation.gouv.fr" target="_blank" rel="noopener">CPF ↗</a> · <a href="https://www.service-public.gouv.fr/particuliers/vosdroits/F14018" target="_blank" rel="noopener">Transitions Pro ↗</a></p></div></div><button class="start build"><span class="dot"></span>Créer mon compte · diagnostic déjà rempli →</button></div><p class="note">Le diagnostic complet reprend tout ce que vous venez de dire : vous ne ressaisissez rien.</p><div class="keepw"><div class="keep"><input class="em" type="email" autocomplete="email" placeholder="votre e-mail, pour garder votre constellation" aria-label="E-mail"><button class="keepgo" type="button">Garder →</button></div><label class="kc"><input type="checkbox" class="cons"> J’accepte que VraiSavoirFaire garde mon e-mail et mes réponses.</label><p class="kmsg" role="status" aria-live="polite"></p></div>';
  else h+='<div class="cta"><button class="start cmp"><span class="dot"></span>Me comparer à ce métier · 3 minutes →</button></div>';
  return h+(src==='b'?'<p><button class="back shut">× Fermer</button></p>':'');}
function sig(){var el=$('sig');if(S.pick<0||!S.top[S.pick]){el.classList.add('hide');}else{el.classList.remove('hide');var x=S.top[S.pick];el.innerHTML=fiche(x[0].m,x[1],'c');}
  var e2=$('sig2');if(!e2)return;if(S.bpick<0){e2.classList.add('hide');e2.innerHTML='';}else{e2.classList.remove('hide');e2.innerHTML=fiche(M[S.bpick],'baromètre de novembre','b');}
  [].forEach.call(document.querySelectorAll('[data-bm]'),function(b){b.classList.toggle('on',+b.dataset.bm===S.bpick);});}
/* ---------- baromètre ---------- */
function baro(){var H=M.filter(function(m){return m.t>=3&&m.ia==='faible';}).slice(0,6),R=M.filter(function(m){return m.art&&m.up;}).slice(0,6),I=M.filter(function(m){return m.ia==='forte';}),G=M.filter(function(m){return m.ia==='faible'&&!m.art;}).slice(0,3);
  $('baro').innerHTML='<div class="kick">Le tour de France des métiers · chaque mois</div><h2>Le baromètre de novembre 2026</h2><p class="sub">Les métiers qui recrutent et ont du sens, les métiers rares qui montent, et ceux que l’IA transforme le plus. C’est lui qui oriente votre constellation. Cliquez un métier pour sa fiche.</p><span class="demo">Données de démonstration</span>'+
   '<div class="bg"><div class="bc"><h3>↗ Ça recrute, et ça a du sens</h3><p>Tension forte, faible exposition à l’IA.</p>'+H.map(function(m,k){return '<button class="br" data-bm="'+m.i+'"><span>'+m.n+'<small>'+['Bretagne, Pays de la Loire','partout','Auvergne-Rhône-Alpes','Normandie','Occitanie','Île-de-France'][k]+'</small></span><span class="v up">↗ +'+(4+k*2)+' %</span></button>';}).join('')+'</div>'+
   '<div class="bc"><h3>◆ Rares, et qui montent</h3><p>Métiers d’art dont la demande grandit.</p>'+R.map(function(m,k){return '<button class="br" data-bm="'+m.i+'"><span>◆ '+m.n+'<small>'+['ateliers, patrimoine','patrimoine, hôtellerie','restauration','luxe, ateliers','monuments historiques','décoration'][k]+'</small></span><span class="v hi">'+['+18','+12','+9','+15','+7','+6'][k]+' %</span></button>';}).join('')+'</div>'+
   '<div class="bc"><h3>◎ L’IA et les métiers</h3><p>Exposition des tâches à l’IA générative.</p>'+I.map(function(m){return '<button class="br" data-bm="'+m.i+'"><span>'+m.n+'<small>beaucoup de tâches automatisables</small></span><span class="v ia">très exposé</span></button>';}).join('')+G.map(function(m){return '<button class="br" data-bm="'+m.i+'"><span>'+m.n+'<small>le geste humain compte</small></span><span class="v up">◎ peu exposé</span></button>';}).join('')+'</div></div>'+
   '<section class="sig sig2 hide" id="sig2"></section><p class="src">Mis à jour le 1er novembre 2026. Sources prévues : offres d’emploi France Travail par code ROME (chaque mois), indicateurs de tension de la DARES, indice d’exposition à l’IA générative de l’OIT relié aux codes ROME via ESCO, et la liste des 281 métiers d’art.</p>';}
/* ---------- calcul : 3 chemins puis 3 cibles ---------- */
var TK=[],TKT=[];
function calc(){S.calc=true;render();var names=M.map(function(m){return m.n;}),n=0,tot=M.length,box=$('tks');
  TKT.push(setInterval(function(){n=Math.min(tot,n+1);var c=$('cnt');if(c)c.textContent=n;},1900/tot));
  S.top.forEach(function(x,k){var e=TK[k];if(!e)return;
    TKT.push(setTimeout(function(){var d=document.createElement('div');d.className='tk';d.innerHTML='<span></span>';box.appendChild(d);
      var sp=d.firstChild,iv=setInterval(function(){sp.textContent=names[Math.floor(Math.random()*names.length)];place();},70);TKT.push(iv);
      function place(){var w=sp.offsetWidth;d.style.transform='translate('+(innerWidth>=900?e[0]-w-6:e[0]-w/2+60)+'px,'+(e[1]-15)+'px)';}
      TKT.push(setTimeout(function(){clearInterval(iv);sp.textContent=(x[0].m.art?'◆ ':'')+x[0].m.n;d.classList.add('set');place();},1500+k*250-(k*250+700)+k*120));},k*250+700));});
  TKT.push(setTimeout(function(){TKT.forEach(function(t){clearInterval(t);clearTimeout(t);});TKT=[];box.innerHTML='';S.calc=false;
    [].forEach.call(document.querySelectorAll('.cd'),function(c,k){c.style.transitionDelay=(k*.15)+'s';setTimeout(function(){c.style.transitionDelay='';},1200);});
    render();},2900));}
function stopCalc(){TKT.forEach(function(t){clearInterval(t);clearTimeout(t);});TKT=[];$('tks').innerHTML='';S.calc=false;}
/* ---------- moteur ---------- */
function render(){panel();S.top=S.st>=8?pick3():[];$('sky').classList.toggle('fin',S.st>=8);cards();layout();sig();}
$('panel').addEventListener('click',function(e){var t=e.target.closest('#go,#nx,#bk,[data-sf],[data-dur],[data-a],[data-w],#pyes,#redo');if(!t)return;
  if(t.id==='go'){S.st=1;render();return;}
  if(t.id==='redo'){stopCalc();S.st=0;S.job=null;S.sf={};S.dur='';S.prev=null;S.prevAsk=false;S.a={w:{},m:{},l:{},a:{},v:{},r:{}};S.want='';S.pick=-1;S.bpick=-1;S.q=0;render();return;}
  if(t.id==='bk'){if(S.st===4&&S.q>0)S.q--;else S.st--;render();return;}
  if(t.id==='pyes'){S.prevAsk=true;render();return;}
  if(t.dataset.sf!==undefined){S.sf[t.dataset.sf]=!S.sf[t.dataset.sf];render();return;}
  if(t.dataset.dur!==undefined){S.dur=t.dataset.dur;render();return;}
  if(t.dataset.a){var Q=QS[S.q],v=t.dataset.a;if(Q.max===1){S.a[Q.k]={};S.a[Q.k][v]=true;}else S.a[Q.k][v]=!S.a[Q.k][v];render();return;}
  if(t.dataset.w){S.want=t.dataset.w;render();return;}
  if(t.id==='nx'){if(!t.classList.contains('ready'))return;
    if(S.st===4&&S.q<QS.length-1){S.q++;render();return;}
    if(S.st===5){S.st=6;render();setTimeout(function(){S.st=8;S.top=pick3();if(RED)render();else calc();if(innerWidth<900)setTimeout(function(){scrollTo({top:$('field').getBoundingClientRect().top+scrollY-$('top').offsetHeight-8,behavior:RED?'auto':'smooth'});},200);},RED?50:1300);return;}
    S.st++;render();}});
$('panel').addEventListener('change',function(e){if(e.target.id==='dur'){S.dur=e.target.value;render();}if(e.target.id==='reg'){S.reg=e.target.value;}});
$('cards').addEventListener('click',function(e){var b=e.target.closest('[data-cd]');if(!b)return;S.pick=+b.dataset.cd;cards();sig();setTimeout(function(){$('sig').scrollIntoView({behavior:'smooth',block:'start'});},60);});
document.addEventListener('click',function(e){var b=e.target.closest('.build');if(b){b.innerHTML='<span class="dot"></span>Ouverture du diagnostic complet, déjà rempli…';return;}
  if(e.target.closest('.cmp')){S.bpick=-1;sig();S.st=1;render();scrollTo({top:0,behavior:RED?'auto':'smooth'});return;}
  var ab=e.target.closest('.accb');if(ab){var box=ab.closest('.sig').querySelector('.acc');box.classList.toggle('hide');ab.textContent='Découvrir l’accompagnement VSF '+(box.classList.contains('hide')?'↓':'↑');return;}
  if(e.target.closest('.shut')){S.bpick=-1;sig();return;}
  var r=e.target.closest('[data-bm]');if(r){S.bpick=+r.dataset.bm===S.bpick?-1:+r.dataset.bm;sig();if(S.bpick>=0)setTimeout(function(){$('sig2').scrollIntoView({behavior:RED?'auto':'smooth',block:'start'});},60);}});
/* « Garder » : l'e-mail et les réponses ne partent qu'ici, avec la case de consentement cochée (RGPD) */
document.addEventListener('click',async function(e){var b=e.target.closest('.keepgo');if(!b)return;
  var box=b.closest('.keepw'),em=box.querySelector('.em'),ck=box.querySelector('.cons'),msg=box.querySelector('.kmsg');msg.className='kmsg';
  var mail=em.value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){msg.textContent='Saisissez une adresse e-mail valide.';return;}
  if(!ck.checked){msg.textContent='Cochez la case pour que nous gardions vos réponses.';return;}
  if(!(window.VSF&&VSF.sb)){msg.textContent='Impossible de garder vos réponses pour le moment.';return;}
  b.disabled=true;
  var rep={metier:{code:S.job&&S.job.c,nom:S.job&&S.job.n,duree:DUR[+S.dur],savoir_faire:S.job?S.job.sf.filter(function(x,k){return S.sf[k];}).map(function(x){return x[0];}):[]},avant:S.prev?{code:S.prev.c,nom:S.prev.n}:null,reponses:S.a,regard:S.want,region:S.reg||null,cibles:S.top.map(function(x){return x[0].m.n;}),demo:true};
  var r=await VSF.sb.rpc('vsf_eclaireur_garder',{p_email:mail,p_reponses:rep,p_consentement:true});
  b.disabled=false;
  if(r.error){msg.textContent=(r.error.code==='VSF08'&&r.error.message)?r.error.message:'Impossible de garder vos réponses pour le moment.';return;}
  msg.className='kmsg ok';msg.textContent='C’est gardé. Rien d’autre n’est enregistré.';
});
bubbles();baro();render();
addEventListener('resize',layout);
addEventListener('scroll',function(){$('top').classList.toggle('sh',scrollY>4);},{passive:true});
})();
