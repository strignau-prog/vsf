<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Admin — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<style>
  :root{--rouge-pale:#fdeaea;--jaune-pale:#fff6d6;--vert-pale:#e3f5ee;--vert:#009e73;--jaune:#ffc400;--gris:#c4c4c4}
  .adm{max-width:none;margin:0 auto;padding:8px clamp(16px,2.5vw,48px) 96px}
  h1{font-size:clamp(40px,6vw,64px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:34px 0 8px}
  .sous{color:var(--cap);font-size:17px;margin:0 0 30px}
  .dec{border:2.5px solid var(--ink);border-radius:22px;padding:24px 28px 26px;margin:0 0 34px}
  .dec h2{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:0 0 18px}.dec h2 small{font-size:15px;font-weight:500;color:var(--cap);margin-left:10px;letter-spacing:0}
  .dec-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
  .dl{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 18px;border-radius:14px;text-decoration:none;color:var(--ink)}
  .dl.rouge{background:var(--rouge-pale)}.dl.jaune{background:var(--jaune-pale)}.dl.vert{background:var(--vert-pale)}
  .dl b.n{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .dl .t{font-weight:800;font-size:17px;line-height:1.2}.dl .p{color:var(--cap);font-size:14.5px;line-height:1.3}
  .dl .go{font-weight:800;white-space:nowrap}
  .dl:hover .go{text-decoration:underline}
  .rien{font-size:19px;font-weight:800;color:var(--vert)}
  /* volets */
  .vol{border-top:1.5px solid var(--line)}.vol:last-of-type{border-bottom:1.5px solid var(--line)}
  .vol-t{display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;background:none;border:0;padding:22px 4px;font:inherit;color:var(--ink);cursor:pointer}
  .vol-t .n{font-size:clamp(24px,2.6vw,32px);font-weight:900;letter-spacing:-.025em}
  .vol-t small{font-size:15px;color:var(--cap);font-weight:500}
  .vol-t small b{color:#c2321f;background:var(--rouge-pale);padding:2px 9px;border-radius:999px;font-weight:800}
  .vol-t .fl{margin-left:auto;font-size:24px;line-height:1;color:var(--cap);transition:transform .2s}
  .vol.open .vol-t .fl{transform:rotate(90deg);color:var(--ink)}
  .vol-c{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
  .vol.open .vol-c{grid-template-rows:1fr}
  .vol-i{overflow:hidden;min-height:0}.vol-i > div{padding:0 4px 30px}
  @media (prefers-reduced-motion:reduce){.vol-c,.vol-t .fl{transition:none}}
  @media (max-width:700px){
    .vol-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:start;padding:18px 2px}
    .vol-t .n{grid-column:1;font-size:22px;line-height:1.15}
    .vol-t small{grid-column:1;font-size:13.5px;line-height:1.35}
    .vol-t .fl{grid-column:2;grid-row:1;padding-top:4px}
    .dl{grid-template-columns:44px minmax(0,1fr)}
    .dl .go{grid-column:2}
    .dec{padding:18px 16px 20px;border-radius:18px}
    .dec h2{font-size:24px}
  }
  .bl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:30px 40px}
  .b h3{font-size:19px;font-weight:900;margin:0 0 8px}
  .b p{margin:4px 0;color:var(--cap);font-size:15px;line-height:1.4}.b p b{color:var(--ink)}
  .num{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 10px}
  .num div b{display:block;font-size:34px;font-weight:900;line-height:1;letter-spacing:-.03em}.num div span{font-size:13px;color:var(--cap)}
  .ch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 10px}
  .ch div{border-radius:10px;padding:10px 6px;text-align:center;background:#f4f4f4}.ch b{display:block;font-size:24px;font-weight:900}.ch span{font-size:12px;color:var(--cap)}
  .ch .y{background:var(--jaune-pale)}.ch .g{background:var(--vert-pale)}
  .pt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--gris)}.pt.v{background:var(--vert)}.pt.j{background:var(--jaune)}.pt.r{background:#e0533d}
  .lk{font-weight:800;color:var(--ink);text-decoration:none}.lk:hover{text-decoration:underline}
  .sw{display:inline-flex;align-items:center;gap:10px;margin-top:6px;font-weight:800}
  .sw button{width:46px;height:26px;border-radius:999px;border:2px solid var(--ink);background:#fff;position:relative;cursor:pointer;padding:0}
  .sw button::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:left .15s}
  .sw button[aria-checked=true]{background:var(--ink)}.sw button[aria-checked=true]::after{left:23px;background:#fff}
  .sw button:disabled{opacity:.45;cursor:not-allowed}
  .msg{font-weight:700;min-height:1.2em;margin:0 0 8px}
  .leg{font-size:13px;color:var(--cap);margin:30px 0 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<link rel="stylesheet" href="vsf-icones.css"><link rel="stylesheet" href="vsf-epure.css"><link rel="stylesheet" href="vsf-logo.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="vsf-menu.css">
</head>
<body>
<script src="vsf-menu.js"></script>
<main class="adm" id="app"><p class="legende">Chargement…</p></main>

<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb, A = null, OUVERT = {};
var jour = function (d) { if (!d) return '—'; try { return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '') + '.'; } catch (e) { return '—'; } };
var euros = function (n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' €'; };
var pl = function (n, s, p) { return n + ' ' + (n > 1 ? (p || s + 's') : s); };

function versA2F() { location.replace('admin-2fa.html?suite=' + encodeURIComponent('admin-v2.html')); }
async function demarrer() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.replace('connexion.html?mode=connexion&suite=' + encodeURIComponent(location.href)); return; }
  var et = await sb.rpc('vsf_a2f_etat');
  if (et.error || !et.data) { $('app').innerHTML = '<h1>Pas encore disponible.</h1><p class="sous">Les migrations 46 à 48 ne sont pas installées.</p>'; return; }
  if (!et.data.super_admin) { $('app').innerHTML = '<h1>Accès réservé.</h1><a class="lk" href="./">Retour</a>'; return; }
  if (!et.data.session_a2f) return versA2F();
  menuAdmin();
  await charger();
  dessiner();
}
async function charger() {
  var r = await sb.rpc('vsf_admin_accueil');
  if (r.error && (r.error.code === 'VSF09' || /Double authentification/i.test(r.error.message || ''))) { versA2F(); return; }
  A = r.data || null; A && (A._err = ''); if (!A) A = { _err: 'Le tableau n’est pas disponible : la migration 48 est-elle installée ?', a_decider: [], personnes: {}, contenus: {}, argent: {}, conformite: {} };
}
function menuAdmin() {
  var blocs = document.querySelectorAll('#vsfMenuDroite, .vsf-mi-mobile');
  for (var i = 0; i < blocs.length; i++) {
    if (blocs[i].querySelector('[data-admin-lien]')) continue;
    var a = document.createElement('a'); a.className = 'vsf-mi vsf-mi-droite on'; a.href = 'admin-v2.html'; a.setAttribute('aria-current', 'page'); a.setAttribute('data-admin-lien', '1'); a.textContent = 'Admin';
    blocs[i].insertBefore(a, blocs[i].firstChild);
  }
}
function volet(id, num, titre, resume, rouge, html) {
  return '<section class="vol' + (OUVERT[id] ? ' open' : '') + '" id="vol-' + id + '"><button type="button" class="vol-t" data-vol="' + id + '" aria-expanded="' + (OUVERT[id] ? 'true' : 'false') + '"><span class="n">' + num + ' · ' + E(titre) + '</span><small>' + E(resume) + (rouge ? ' · <b>' + rouge + ' à traiter</b>' : '') + '</small><span class="fl" aria-hidden="true">›</span></button><div class="vol-c"><div class="vol-i"><div>' + html + '</div></div></div></section>';
}
function aDecider() {
  var L = A.a_decider || [];
  if (!L.length) return '<p class="rien">Rien à décider.</p>';
  return '<div class="dec-l">' + L.map(function (x) {
    return '<a class="dl ' + E(x.couleur) + '" href="' + E(x.lien) + '"><b class="n">' + E(x.nombre) + '</b><span><span class="t">' + E(x.titre) + '</span><br><span class="p">' + E(x.phrase) + '</span></span><span class="go">Voir →</span></a>';
  }).join('') + '</div>';
}
function sPersonnes() {
  var p = A.personnes || {};
  return '<div class="bl"><div class="b"><h3>Comptes</h3><div class="num"><div><b>' + (p.comptes || 0) + '</b><span>comptes</span></div><div><b>' + (p.ateliers || 0) + '</b><span>ateliers</span></div><div><b>' + (p.collectifs || 0) + '</b><span>collectifs</span></div><div><b>' + (p.suspendus || 0) + '</b><span>suspendus</span></div></div><p><a class="lk" href="admin-personnes.html">Ouvrir « Personnes et structures » →</a></p></div>' +
    '<div class="b"><h3>Liens de diagnostic sans compte</h3><p><b>' + (p.liens_actifs || 0) + '</b> actif' + ((p.liens_actifs || 0) > 1 ? 's' : '') + ' sur ' + (p.liens || 0) + '</p><p><a class="lk" href="admin-personnes.html">Voir les liens →</a></p></div>' +
    '<div class="b"><h3>Ambassadeurs</h3><p><span class="pt v"></span>' + (p.ambassadeurs_valides || 0) + ' validé' + ((p.ambassadeurs_valides || 0) > 1 ? 's' : '') + ' sur ' + (p.ambassadeurs || 0) + '</p></div></div>';
}
function sContenus() {
  var c = A.contenus || {}, lots = c.lots || [];
  var etat = { en_validation: ['j', 'en validation'], pas_commence: ['', 'pas commencé'], en_cours: ['j', 'en cours'], fait: ['v', 'fait'] };
  return '<div class="bl"><div class="b"><h3>Référentiel ROME</h3><p>Dernière synchro : ' + jour(c.rome_synchro) + ' · ' + (c.rome_fiches || 0) + ' fiches</p></div>' +
    '<div class="b"><h3>Fiches VSF</h3><div class="ch"><div><b>' + (c.profils_faits || 0) + '</b><span>profils légers sur ' + (c.profils_total || 0) + '</span></div><div><b>' + (c.ecartees || '—') + '</b><span>écartées · ' + (c.cas_limites || 0) + ' cas limites</span></div><div class="y"><b>' + (c.a_valider || 0) + '</b><span>à valider</span></div><div class="g"><b>' + (c.publiees || 0) + '</b><span>publiées</span></div></div>' +
    lots.map(function (l) { var e = etat[l.etat] || ['', l.etat]; return '<p><span class="pt ' + e[0] + '"></span>' + E(l.nom) + ' · ' + e[1] + '</p>'; }).join('') + '<p>' + pl(c.demandes_attente || 0, 'demande') + ' à la demande en attente</p></div>' +
    '<div class="b"><h3>Données du diagnostic</h3><p><span class="pt v"></span>' + (c.donnees_validees || 0) + ' validées</p><p><span class="pt j"></span>' + (c.donnees_exemples || 0) + ' exemples à vérifier sur les textes officiels</p><p><a class="lk" href="admin.html">Modifier →</a></p></div>' +
    '<div class="b"><h3>Baromètre</h3><p>Mis à jour le ' + jour(c.barometre_maj) + '</p><p>En tête : ' + E((c.barometre_top || []).map(function (x) { return x.libelle; }).filter(Boolean).slice(0, 3).join(', ') || '—') + '</p></div></div>';
}
function sArgent() {
  var g = A.argent || {}, ia = g.ia || {};
  return '<div class="bl"><div class="b"><h3>Diagnostics</h3><div class="num"><div><b>' + (g.diag_en_cours || 0) + '</b><span>en cours</span></div><div><b>' + (g.diag_termines || 0) + '</b><span>terminés</span></div><div><b>' + (g.diag_payes || 0) + '</b><span>payés</span></div></div><p>Prix : <b>' + (g.prix_diagnostic != null ? euros(g.prix_diagnostic) : 'à fixer') + '</b></p></div>' +
    '<div class="b"><h3>Offres de formation</h3>' + ((g.offres || []).map(function (o) { return '<p><span class="pt ' + (o.statut === 'publiee' ? 'v' : 'j') + '"></span>' + E(o.intitule) + ' · ' + (o.statut === 'publiee' ? 'publiée' : o.statut === 'pilote' ? 'pilote' : 'brouillon') + '</p>'; }).join('') || '<p>Aucune offre.</p>') + '</div>' +
    '<div class="b"><h3>À reverser</h3><p>Encaissé ' + euros(g.encaisse_total) + ' · à reverser <b>' + euros(g.a_reverser_total) + '</b> · viré ' + euros(g.reverse_total) + '</p><p><a class="lk" href="admin.html">Noter un virement →</a></p></div>' +
    '<div class="b"><h3>Dépense IA</h3><p><span class="pt ' + (ia.allumee ? 'v' : '') + '"></span>' + (ia.allumee ? 'IA allumée' : 'IA éteinte') + ' · mode ' + (ia.mode === 'auto' ? 'automatique sous le plafond' : 'accord demande par demande') + '</p><p>Dépense du mois : <b>' + Number(ia.depense_mois || 0).toFixed(2).replace('.', ',') + ' €</b> sur un plafond de ' + euros(ia.plafond_mensuel) + '</p><p>Plafond par défaut : 50 $ par lot ; au-delà, ton accord écrit.</p><p><a class="lk" href="admin.html">Régler l’IA →</a></p></div>' +
    '<div class="b"><h3>Tarifs</h3><p>Lecture seule : les tarifs de Maurice ne se modifient pas ici.</p><p><a class="lk" href="tarifs.html">Voir les tarifs →</a></p></div></div>';
}
function sConformite() {
  var k = A.conformite || {}, cgv = k.cgv, s = k.sauvegarde || {}, ai = k.ailleurs || {};
  return '<div class="bl"><div class="b"><h3>CGV</h3><p><span class="pt ' + (cgv && cgv.statut === 'en_vigueur' ? 'v' : 'j') + '"></span>' + (cgv ? 'Version ' + E(cgv.version) + ' · ' + jour(cgv.date) + ' · ' + (cgv.statut === 'en_vigueur' ? 'en vigueur' : 'provisoire, à faire relire par un juriste') : 'Aucune version') + '</p></div>' +
    '<div class="b"><h3>RGPD</h3><p>' + pl(k.retraits_accord || 0, 'retrait d’accord « visible par l’entreprise »', 'retraits d’accord « visible par l’entreprise »') + '</p><p>Demandes d’export et de suppression : depuis la fiche d’un compte, dans « Personnes et structures ».</p></div>' +
    '<div class="b"><h3>Historique</h3>' + ((k.historique || []).map(function (h) { return '<p>' + jour(h.le) + ' · ' + E(h.action) + '</p>'; }).join('') || '<p>Rien pour l’instant.</p>') + '</div>' +
    '<div class="b"><h3>Santé technique</h3><p><span class="pt ' + (s.fait ? 'v' : 'j') + '"></span>Test de sauvegarde du diagnostic : ' + E(s.fait ? 'fait' : (s.rapport || 'rapport attendu')) + '</p></div>' +
    '<div class="b"><h3>Option « Ailleurs »</h3><p>' + (ai.validation_juridique ? 'Validation juridique faite.' : 'Cachée · verrouillée jusqu’à la validation juridique.') + '</p><div class="sw"><button type="button" role="switch" id="swAilleurs" aria-checked="' + (ai.visible ? 'true' : 'false') + '"' + (ai.validation_juridique ? '' : ' disabled') + ' aria-label="Option Ailleurs visible"></button><span>' + (ai.visible ? 'Visible' : 'Cachée') + '</span></div></div></div>';
}
function dessiner() {
  var n = (A.a_decider || []).length, p = A.personnes || {}, c = A.contenus || {}, g = A.argent || {}, k = A.conformite || {};
  var date = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('app').innerHTML = '<h1>Admin</h1><p class="sous">Réservé au super admin · rôle en base + double authentification · ' + E(date) + '</p>' +
    '<p class="msg" id="msg" role="alert">' + E(A._err || '') + '</p>' +
    '<section class="dec" aria-label="À décider"><h2>À décider <small>' + (n ? pl(n, 'point') + ' · le reste attend' : '') + '</small></h2>' + aDecider() + '</section>' +
    volet('personnes', 1, 'Personnes et structures', pl(p.comptes || 0, 'compte') + ' · ' + pl(p.ateliers || 0, 'atelier') + ' · ' + pl(p.collectifs || 0, 'collectif'), p.a_traiter || 0, sPersonnes()) +
    volet('contenus', 2, 'Contenus', (c.rome_fiches || 0) + ' fiches ROME · ' + (c.profils_faits || 0) + ' profils légers sur ' + (c.profils_total || 0), (c.a_valider || 0) + (c.cas_limites || 0), sContenus()) +
    volet('argent', 3, 'Argent', pl(g.diag_en_cours || 0, 'diagnostic') + ' en cours · à reverser ' + euros(g.a_reverser_total), 0, sArgent()) +
    volet('conformite', 4, 'Conformité et système', 'CGV ' + ((k.cgv && k.cgv.statut === 'en_vigueur') ? 'en vigueur' : 'provisoires') + ' · sauvegarde ' + ((k.sauvegarde && k.sauvegarde.fait) ? 'testée' : 'à tester'), (k.sauvegarde && k.sauvegarde.fait) ? 0 : 1, sConformite()) +
    '<p class="leg">Rouge pâle = à faire par toi · jaune = en cours · vert = fait · gris = inactif. Tout est replié à chaque ouverture.</p>';
}
document.addEventListener('click', async function (e) {
  var t = e.target.closest('[data-vol]');
  if (t) { var id = t.getAttribute('data-vol'); OUVERT[id] = !OUVERT[id]; $('vol-' + id).classList.toggle('open', !!OUVERT[id]); t.setAttribute('aria-expanded', OUVERT[id] ? 'true' : 'false'); return; }
  var sw = e.target.closest('#swAilleurs');
  if (sw && !sw.disabled) { var veut = sw.getAttribute('aria-checked') !== 'true'; var r = await sb.rpc('vsf_admin_ailleurs', { p_visible: veut }); if (r.error) { $('msg').textContent = 'Verrouillée : la validation juridique n’est pas faite.'; return; } await charger(); var o = OUVERT; dessiner(); }
});
demarrer();
</script>
<script src="vsf-icones.js"></script><script src="vsf-pop.js"></script><script src="vsf-logo.js"></script><script src="vsf-session.js"></script>
</body>
</html>
