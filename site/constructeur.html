<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constructeur de parcours — VRAI-SAVOIRFAIRE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="vsf-logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<style>
:root{--fg:#111;--muted:#767676;--now:#ffc400;--ok:#0a8a5a;--alert:#d92d20;--soft:#f3f3f3;--jaune:#fff4cc;--accent:#ffc400;--rosep:#fdecea;--vertp:#e3f6ee;
  --f-faire:#111111;--f-recevoir:#2F67B1;--f-mesurer:#7B4FB8;--f-dire:#13878A;--f-regard:#8B5A2B;--hh:110px;
  --moucheté-brun:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='11'/><feColorMatrix values='0 0 0 0 0.40  0 0 0 0 0.31  0 0 0 0 0.20  0 0 0 22 -16.4'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --moucheté-clair:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='23'/><feColorMatrix values='0 0 0 0 0.64  0 0 0 0 0.61  0 0 0 0 0.56  0 0 0 22 -16.4'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --moucheté-clair-sur-brun:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.90  0 0 0 0 0.85  0 0 0 0 0.77  0 0 0 24 -19.6'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --font:'Inter','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
.wrap{max-width:1700px;margin:0 auto;padding:12px clamp(16px,2.5vw,40px) 80px}
.kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:6px 0 4px;font-size:clamp(26px,3.6vw,40px);font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--now);flex:none}
h2{margin:0 0 10px;font-size:18px;font-weight:900}
h3{margin:0 0 6px;font-size:14px;font-weight:800}
.demo{display:inline-block;background:var(--jaune);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--alert);font-weight:700}
.btn{font:inherit;font-weight:800;font-size:13px;border:2px solid #111;background:#fff;padding:8px 14px;cursor:pointer;border-radius:999px;color:#111}
.btn.plein{background:#111;color:#fff}.btn[disabled]{opacity:.35;cursor:default}
.btn.petit{padding:3px 10px;font-size:12px}
.btn.fantome{border-color:transparent;background:rgba(0,0,0,.06)}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#fff}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.code{background:#111;color:#fff}.chip.a-relire{background:var(--jaune)}.chip.relu{background:var(--vertp);color:#056b4d}
.msg{margin:10px 0;padding:10px 12px;background:var(--jaune);border-radius:6px;font-weight:700}
textarea:focus,input:focus,select:focus{outline:2px solid var(--now)}
/* mise en page : menu | travail | (aperçu épinglé) */
.cols{display:grid;gap:26px;align-items:start}
@media(max-width:1180px){.cols{grid-template-columns:1fr !important}}
.arbre{position:sticky;top:calc(60px + var(--hh) + 14px);max-height:calc(100vh - var(--hh) - 90px);overflow-y:auto;padding-right:6px}
@media(max-width:1180px){.arbre{position:static;max-height:none}}
.arbre button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;border:0;background:none;padding:7px 8px;cursor:pointer;border-radius:4px}
.arbre button.sel{background:var(--jaune);font-weight:800}
.arbre .ax{font-weight:900;margin:14px 0 2px;font-size:13px;letter-spacing:.04em}
.arbre .ch{font-weight:700;color:var(--muted);font-size:12.5px;margin:8px 0 0 4px}
.forme{width:14px;height:14px;border:2px solid #111;border-radius:4px;flex:none;background:#fff}
.forme.plein{background:#111}.forme.epais{border-width:5px}
/* barre haute fixe d'un module */
.haut{position:sticky;top:60px;z-index:20;background:#fff;padding:10px 0 10px;margin:8px 0 14px;box-shadow:0 8px 14px -10px rgba(0,0,0,.25)}
.haut .id{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.haut .id b{font-size:17px;font-weight:900}
.haut .dr{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.etapes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.etapes button{font:inherit;text-align:left;border:0;cursor:pointer;padding:7px 10px;border-radius:8px;background:var(--soft);display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px;color:#111}
.etapes button .f{width:16px;height:16px;border:2px solid #111;border-radius:50%;flex:none;background:#fff}
.etapes button .f.fait{background:#111}.etapes button .f.cours{border-width:5px}
.etapes button.ici{background:var(--jaune);box-shadow:inset 0 -4px 0 var(--now)}
.etapes small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
@media(max-width:900px){.etapes{grid-template-columns:repeat(3,1fr)}}
.ariane{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:800;font-size:14px;margin:0 0 8px}
.ariane a{color:#111;text-decoration:none;border-radius:6px;padding:2px 6px;cursor:pointer}.ariane a:hover{background:var(--soft)}.ariane .s{color:var(--muted)}
/* durées des journées */
.jh{display:flex;gap:8px;align-items:center;margin:0 0 6px}.jh h3{margin:0}
.info{display:inline-flex;width:18px;height:18px;border-radius:50%;border:2px solid #111;align-items:center;justify-content:center;font-size:11px;font-weight:900;cursor:help}
.jours{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.jours .j{font:inherit;font-size:12px;font-weight:800;border:2px solid #111;border-radius:999px;padding:3px 11px;background:#fff;cursor:pointer;color:#111}
.jours .j.on{background:#111;color:#fff}
.jours .j.trop{background:var(--rosep);border-color:var(--alert);color:var(--alert)}.jours .j.trop.on{background:var(--alert);color:#fff}
.alerte{color:var(--alert);font-weight:700;font-size:14px;margin:4px 0 12px}
.jbox{background:var(--soft);border-radius:10px;padding:12px 14px;margin:6px 0 16px}
.jbox .ji{display:flex;gap:10px;align-items:center;padding:5px 0;flex-wrap:wrap}
.jbox .ji .nom{font-weight:700;min-width:240px}
.jbox .tot{margin-top:6px;font-weight:800;font-size:13px}
/* étapes */
.bloc{margin:0 0 20px;padding:14px 18px 10px;border-left:8px solid var(--c);background:var(--t);border-radius:0 10px 10px 0;scroll-margin-top:calc(60px + var(--hh) + 10px)}
.bloc.grise{opacity:.6}
.bloc .tete{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bloc h3.eh{margin:0;font-size:23px;font-weight:900;letter-spacing:-.01em}
.bloc .cpt{margin-left:auto;font-weight:800;font-size:13px;color:var(--c)}
.bloc .expl{color:#555;margin:2px 0 8px;font-size:14px}
.cont{display:flex;gap:12px;align-items:center;padding:8px 0;flex-wrap:wrap}
.cont svg.pic{width:22px;height:22px;flex:none;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cont .nom{font-weight:800;min-width:200px}
.cont .btn{margin-left:auto;padding:5px 14px;font-size:12px}
.obl{font-size:12px;font-weight:700;color:#333}.obl.manque::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alert);margin-right:6px}
.opt{font-size:12px;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted)}
.etat{font-size:12px;font-weight:800;border-radius:999px;padding:3px 11px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.etat.afaire{background:#fff;color:#333}.etat.afaire.obl2{background:var(--rosep);color:var(--alert)}
.etat.afaire i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;display:inline-block}
.etat.bro{background:var(--jaune)}.etat.relu{background:var(--vertp);color:#056b4d}
details.imp-det{margin:26px 0 0}
details.imp-det summary{cursor:pointer;font-weight:800;font-size:15px}
textarea.json{width:100%;min-height:150px;font:12.5px/1.45 ui-monospace,Consolas,monospace;border:0;background:var(--soft);padding:12px;border-radius:6px;resize:vertical}
.res{margin:12px 0;padding:12px 14px;background:var(--soft);border-radius:6px}
.res.ko{background:var(--rosep)}.res.ok{background:var(--vertp)}
.res ul{margin:6px 0 0;padding-left:18px}
.manque h3{margin-top:16px}.manque li{margin:3px 0}
/* éditeur : cartes numérotées reliées */
.usage{background:var(--soft);border-radius:8px;padding:11px 14px;margin:0 0 16px;font-size:14px}
.nav2{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.fil{position:relative;margin:0 0 0 34px}
.fil::before{content:"";position:absolute;left:-22px;top:14px;bottom:14px;width:4px;background:#dcdcdc;border-radius:2px}
.fil .brique{position:relative;margin:0 0 4px;background:#fff;border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.09);border-left:8px solid var(--c)}
.fil .brique::before{content:attr(data-n);position:absolute;left:-42px;top:12px;width:28px;height:28px;border-radius:50%;background:#111;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.fil .brique.drop-av{box-shadow:0 -4px 0 var(--now),0 4px 14px rgba(0,0,0,.09)}
.fil .brique.drop-ap{box-shadow:0 4px 0 var(--now),0 4px 14px rgba(0,0,0,.09)}
.fil .brique.drag{opacity:.45}
.empl{outline:2px dashed #aaa;outline-offset:-4px}
.bh{display:flex;gap:10px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.bh svg{width:22px;height:22px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bh .t{font-weight:900;font-size:16px}.bh .tt{color:#333;font-size:14px}
.bh .vu{font-size:12px;color:var(--muted);width:100%;padding-left:36px}
.bh .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bh .acts .btn{padding:3px 9px;font-size:12px}
.poignee{cursor:grab;color:#999;font-size:18px;letter-spacing:-3px;user-select:none}
.bb{padding:0 16px 14px 16px}.bb.ferme{display:none}
.brique .hint{margin-top:6px;font-size:12px;font-weight:700;color:var(--ok)}
.brique .hint .err{font-weight:800}
.brique .acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.brique .acts2 .btn{padding:4px 11px;font-size:12px}.brique label.btn{cursor:pointer}
.tip{position:relative}.tip:hover::after{content:attr(data-tip);position:absolute;bottom:130%;right:0;background:#111;color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:40;pointer-events:none}
.poignee.tip:hover::after{left:0;right:auto}
.plus{display:flex;align-items:center;justify-content:center;margin:0 0 4px;min-height:22px;flex-wrap:wrap;gap:6px}
.plus button.p{font:inherit;font-weight:900;border:2px dashed #aaa;background:#fff;border-radius:999px;width:28px;height:22px;line-height:16px;font-size:14px;color:#555;cursor:pointer}
.plus .ch2{display:flex;gap:6px;flex-wrap:wrap;background:var(--soft);padding:6px 8px;border-radius:8px}
.ajout{margin:16px 0 0;padding:14px;background:var(--soft);border-radius:10px}
.ajout .ch{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.ajout .carte{font:inherit;text-align:left;border:0;cursor:pointer;background:#fff;border-radius:8px;padding:10px 12px;width:230px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.07)}
.ajout .carte b{display:block}.ajout .carte span{font-size:12.5px;color:#555}
.bas{display:flex;gap:10px;margin:20px 0 0;flex-wrap:wrap;align-items:center}
.media{display:block;max-width:100%;border-radius:6px}
.brique img.media,.brique video.media{max-width:240px;margin:8px 0}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:12px;font-weight:800;margin-bottom:3px}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{width:100%;font:inherit;border:0;background:var(--soft);padding:8px 10px;border-radius:6px;caret-color:#111}
.fld textarea{resize:vertical}
.rep-ed{margin:8px 0}
.rline{display:flex;gap:8px;align-items:center}
.rline input[type=text]{flex:1;border:0;background:var(--soft);padding:8px 10px;border-radius:6px;font:inherit}
.rep-ed .ret{width:calc(100% - 28px);margin:4px 0 4px 28px;border:0;background:var(--soft);padding:7px 10px;border-radius:6px;font:inherit;font-size:13px}
.puce{width:16px;text-align:center}
/* aperçu apprenant : panneau qu'on ouvre et qu'on ferme */
.ap{display:none;flex-direction:column;background:#fff}
.ap.ouvert{display:flex}
.ap.flot{position:fixed;top:60px;right:0;bottom:0;width:min(430px,100vw);z-index:30;padding:14px 16px;box-shadow:-12px 0 30px rgba(0,0,0,.2)}
.ap.epingle{position:sticky;top:calc(60px + var(--hh) + 14px);max-height:calc(100vh - var(--hh) - 90px)}
@media(max-width:900px){.ap.flot{top:0;width:100vw}}
.aph{display:flex;align-items:center;gap:8px;margin-bottom:10px}.aph h2{margin:0}.aph .dr{margin-left:auto;display:flex;gap:6px}
.apc{overflow-y:auto;flex:1;min-height:0;padding-right:4px}
.ap .fm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;flex:none}
.ap .fm .cpt{font-weight:800;font-size:13px;min-width:54px;text-align:center}
.ap .fm button{font:inherit;font-weight:800;font-size:13px;border:2px solid #111;background:#fff;padding:7px 13px;cursor:pointer;border-radius:999px}
.ap .fm button.on{background:#111;color:#fff}
.tel{width:320px;max-width:100%;height:min(600px,calc(100vh - 260px));min-height:420px;margin:0 auto;border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.tel .top{padding:12px 14px 6px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.tel .top i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tel .rail{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.tel .ecran{flex:0 0 100%;scroll-snap-align:start;padding:10px 16px 16px;overflow-y:auto}
.tel .pts{display:flex;gap:5px;justify-content:center;padding:8px 0 12px}
.tel .pts i{width:7px;height:7px;border-radius:50%;background:#d5d5d5}.tel .pts i.on{background:#111}
.ord{border:1px solid #d9d9d9;border-radius:8px;padding:14px;background:#fff}
.ord .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.imp{background:#fff;border:1px solid #cfcfcf;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:22px 24px;margin:0 0 14px;font-size:12.5px}
.imp .ent{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px;padding-bottom:8px;border-bottom:3px solid var(--accent)}
.imp .pied{margin-top:12px;font-size:10.5px;color:#555}
.imp .case{display:inline-block;width:12px;height:12px;border:1.5px solid #111;margin-right:7px;vertical-align:-2px}
.imp .qr{display:inline-flex;width:64px;height:64px;border:2px solid #111;align-items:center;justify-content:center;font-size:10px;font-weight:800;text-align:center}
.ab{margin:0 0 12px;padding:0 0 0 12px;border-left:5px solid var(--c,#111)}
.ab .ent2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--c,#111)}
.ab h4{margin:2px 0 4px;font-size:15px}.ab p{margin:0 0 6px}
.ab .ph{border:2px dashed #999;border-radius:6px;padding:14px 10px;text-align:center;color:#555;font-size:12.5px;background:#fafafa}
.ab .ph b{display:block;font-size:13px;color:#111}
.ab .rep{display:block;width:100%;text-align:left;font:inherit;border:2px solid #111;background:#fff;padding:9px 11px;margin:5px 0;border-radius:8px;cursor:pointer}
.ab .rep.pris{background:var(--jaune)}
.ab .ret{font-size:13px;margin:4px 0 8px;padding:8px 10px;background:var(--soft);border-radius:6px}
.ab .minu{display:inline-block;font-weight:800;font-size:12px;border:2px solid #111;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.ab .pt{font-weight:800}

/* aperçu à la charte de l'atelier : réglages lus dans vsf_form_chartes.theme */
.tel.themee,.ord.themee{background-color:var(--fclair,#F6F4F2)}
.tel.themee.fond-blanc,.ord.themee.fond-blanc{--carte-et:var(--sec,#C4AE8F);background-image:var(--moucheté-clair)}
.tel.themee.fond-brun,.ord.themee.fond-brun{--carte-et:#fff;background-color:var(--sec,#C4AE8F);background-image:var(--moucheté-brun),var(--moucheté-clair-sur-brun)}
.bandeau-at{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:4px solid var(--accent);background-color:var(--sec,#C4AE8F);background-image:var(--moucheté-brun),var(--moucheté-clair-sur-brun);flex:none}
.fond-blanc .bandeau-at{background-color:#fff;background-image:var(--moucheté-clair)}
.bandeau-at img{height:56px;width:auto;display:block}
.bandeau-at .nom{font-family:var(--fd,'Fjalla One'),Impact,sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:.03em;line-height:1.1;color:#000}
.bandeau-at .nom small{display:block;font-family:Inter,Arial,sans-serif;text-transform:none;font-size:11px;color:#3a3226;letter-spacing:0}
.themee .et{margin:0 0 12px;background:#111;padding:3px;clip-path:polygon(0 13px,13px 0,calc(100% - 13px) 0,100% 13px,100% calc(100% - 13px),calc(100% - 13px) 100%,13px 100%,0 calc(100% - 13px))}
.themee .et .in.ab{margin:0;border-left:0;padding:12px 14px;background:var(--carte-et,#fff);clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
.themee .ab h4{font-family:var(--fd,'Fjalla One'),Impact,sans-serif;text-transform:uppercase;font-weight:400;font-size:19px;letter-spacing:.02em}
.themee .ab .rep{border-color:var(--accent);border-radius:8px;background:#fff}
.themee .ab .rep.pris{background:var(--accent);color:#fff}
.themee .ab .btn{border-radius:8px;border-color:var(--accent);color:var(--accent)}
.themee .ab .ent2{color:var(--c)}
.themee.police-atelier .ab p,.themee.police-atelier .ab .rep,.themee.police-atelier .ab .note,.themee.police-atelier .ab .ent2,.themee.police-atelier .ab .ret{font-family:var(--ft,'Source Code Pro'),monospace;font-weight:600;font-size:12.5px}
.thb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
</style>

<body>
<div class="wrap" id="app"><div class="kick">Constructeur de parcours</div><h1><i class="dot"></i>Chargement…</h1></div>
<script src="vsf-menu.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

/* ---------- durées : calculées à partir des briques, jamais saisies ---------- */
function secBrique(b){var c=b.champs||{},t=b.type;
  if(t==='carte')return Math.max(3,Math.round(mots(c.texte)*60/200));
  if(t==='image')return reglage('duree_image_s',10);
  if(t==='video')return Math.round((+c.duree_min||0)*60);
  if(t==='question')return b.version==='B'?0:reglage('duree_question_s',20);
  if(t==='exercice')return Math.round((+c.duree_min||0)*60);
  if(t==='depot')return reglage('duree_depot_photo_s',60);
  return 0;}
function secContenu(c){
  var bs=briquesDe(c.id);
  if(c.type==='series_guidees'){var ex=bs.filter(function(b){return b.type==='exercice';});return ex.length?Math.max.apply(null,ex.map(secBrique)):0;}
  return bs.reduce(function(a,b){return a+secBrique(b);},0);}
function fmtSec(s){if(s<=0)return '0 s';if(s<60)return Math.round(s)+' s';var m=Math.round(s/6)/10;return String(m).replace('.',',')+' min';}
function fmtContenu(c){return c.type==='series_guidees'?fmtSec(secContenu(c))+' par jour':fmtSec(secContenu(c));}

/* ---------- les journées ---------- */
function jours(m){
  var rap=reglage('rappel_minutes',2)*60,rows=[];
  var ser=contenu(m.code,'faire','series_guidees'),ex=ser?briquesDe(ser.id).filter(function(b){return b.type==='exercice';}):[];
  var it0=[];['essayer','constater','regarder'].forEach(function(e){
    if(e==='essayer'&&m.essai_securise===false)return;
    MODELE[e].forEach(function(t){var c=contenu(m.code,e,t);if(etatC(c)!=='afaire')it0.push({nom:nomType(t),id:c.id,sec:secContenu(c)});});});
  rows.push({n:'Jour 0',items:it0,rap:0,sec:it0.reduce(function(a,x){return a+x.sec;},0),txt:'Premier contact : essayer, constater, regarder. Pas de rappel ce jour-là.'});
  if(!ex.length)return rows;
  var quiz=contenu(m.code,'faire','quiz_deux_versions'),qd=Math.min(QUIZ_JOUR,ex.length);
  ex.forEach(function(b,i){var c=b.champs||{},it=[{nom:'Séries guidées · '+(c.jour||'J'+(i+1)),id:ser.id,sec:secBrique(b)}];
    if(i+1===qd&&etatC(quiz)!=='afaire')it.push({nom:'Quiz en 2 versions',id:quiz.id,sec:secContenu(quiz)});
    rows.push({n:c.jour||('J'+(i+1)),items:it,rap:rap,sec:rap+it.reduce(function(a,x){return a+x.sec;},0),txt:'Rappel de '+(rap/60)+' min, puis la séance du jour'+(i+1===qd&&etatC(quiz)!=='afaire'?' et le quiz (séance raccourcie)':'')+'.'});});
  var fin=[];['comparer','ancrer'].forEach(function(e){MODELE[e].forEach(function(t){var c=contenu(m.code,e,t);if(etatC(c)!=='afaire')fin.push({nom:nomType(t),id:c.id,sec:secContenu(c)});});});
  fin.push({nom:'Vocal de bilan (commun à tous les modules)',id:null,sec:reglage('duree_vocal_s',90)});
  rows.push({n:'J'+(ex.length+1),items:fin,rap:rap,sec:rap+fin.reduce(function(a,x){return a+x.sec;},0),txt:'Le dépôt et le vocal viennent le jour qui suit la dernière séance.'});
  return rows;}
function journees(m){
  var rows=jours(m),max=reglage('journee_max_min',12),rap=reglage('rappel_minutes',2);if(rows.length<2)return '';
  var tip='Une journée = rappel de '+rap+' min + séance. Les rappels J+1, J+7, J+30 sont automatiques.';
  var trop=rows.filter(function(r){return r.sec>max*60;}).length;
  var h='<div class="jh"><h3>Durée des journées <span class="note">(au plus '+max+' min)</span></h3><span class="info" title="'+esc(tip)+'">i</span></div><div class="jours">'+
    rows.map(function(r,i){var over=r.sec>max*60;return '<button class="j'+(over?' trop':'')+(S.jour===i?' on':'')+'" data-jour="'+i+'" title="'+esc(tip)+'">'+esc(r.n)+' · '+Math.ceil(r.sec/60-1e-9)+' min'+(over?' · trop long':'')+'</button>';}).join('')+'</div>';
  if(trop)h+='<p class="alerte">'+trop+' journée'+(trop>1?'s dépassent':' dépasse')+' '+max+' minutes : raccourcis une séance ou décale un contenu.</p>';
  if(S.jour!==null&&rows[S.jour]){var r=rows[S.jour];
    h+='<div class="jbox"><b>'+esc(r.n)+'</b> · <span class="note">'+esc(r.txt)+'</span>'+(r.rap?'<div class="ji"><span class="nom">Rappel</span><span class="meta">'+fmtSec(r.rap)+'</span></div>':'')+
      r.items.map(function(x){return '<div class="ji"><span class="nom">'+esc(x.nom)+'</span><span class="meta">'+fmtSec(x.sec)+'</span>'+(x.id?'<button class="btn petit" data-voir="'+esc(x.id)+'">Ouvrir</button>':'')+'</div>';}).join('')+
      '<div class="tot">Total : '+fmtSec(r.sec)+(r.sec>max*60?' <span class="err">· plus que '+max+' min</span>':'')+'</div></div>';}
  return h;}

/* ---------- états d'une étape ---------- */
function etatEtape(m,i){
  var e=ETAPES[i][0];
  if(e==='essayer'&&m.essai_securise===false)return {s:'fait',cpt:'essai non sécurisé : rien à écrire',grise:true};
  var mod=MODELE[e],O=mod.filter(oblig),ec=0,re=0,any=false;
  mod.forEach(function(t){var s=etatC(contenu(m.code,e,t));if(s!=='afaire')any=true;if(oblig(t)){if(s!=='afaire')ec++;if(s==='relu')re++;}});
  return {s:re===O.length?'fait':(any?'cours':'afaire'),cpt:O.length?ec+' sur '+O.length+' écrit'+(O.length>1?'s':''):'rien d’obligatoire',grise:false};}
var LIB_ETAT={fait:'fait',cours:'en cours',afaire:'à faire'};
function barreEtapes(m,ici){
  return '<div class="etapes">'+ETAPES.map(function(e,i){var st=etatEtape(m,i);
    return '<button data-etape="'+i+'" class="'+(ici===i?'ici':'')+'"><span class="f '+(st.s==='fait'?'fait':st.s==='cours'?'cours':'')+'"></span><span>'+(i+1)+' · '+e[1]+'<small>'+LIB_ETAT[st.s]+'</small></span></button>';}).join('')+'</div>';}

  if(['pret','rel'].indexOf(m.etat)>-1)return 'plein';return n?'epais':'';}

  axes.forEach(function(a){
    h+='<div class="ax">'+esc(a.code+' · '+a.titre)+'</div>';
    D.chap.filter(function(c){return c.axe_id===a.id;}).sort(function(a,b){return a.ordre-b.ordre;}).forEach(function(c){
      h+='<div class="ch">'+esc((c.code?c.code+' · ':'')+c.titre)+'</div>';

function ligneContenu(m,e,t,i){

  var chip=st==='afaire'?'<span class="etat afaire'+(o?' obl2':'')+'"><i></i>À faire</span>':st==='relu'?'<span class="etat relu">Relu</span>':'<span class="etat bro">Brouillon · à relire</span>';
  var meta=st==='afaire'?'':'<span class="meta">'+nb+' brique'+(nb>1?'s':'')+' · '+fmtContenu(c)+'</span>';
  var btn=st==='afaire'?'<button class="btn plein" data-creer="'+e+'|'+t+'">Créer</button>':'<button class="btn" data-voir="'+esc(c.id)+'">Ouvrir</button>';
  return '<div class="cont"><svg class="pic"><use href="#i-'+ICONE[t]+'"/></svg><span class="nom">'+esc(nomType(t))+'</span>'+libO+chip+meta+btn+'</div>';}

    nc++;
    c.briques.forEach(function(b,k){
      var champs=Object.assign({},b);delete champs.type;delete champs.version;
      D.briq.push({id:'b'+(id0++),contenu_id:ex.id,rang:k+1,type:b.type,champs:champs,version:b.version||null,emplacement:(b.type==='image'||b.type==='video')});nb++;
      if(b.type==='carte'&&mots(b.texte)>60)av.push('Carte « '+b.titre+' » : '+mots(b.texte)+' mots (au plus 60).');
      if(b.type==='image'&&mots(b.legende)>5)av.push('Légende « '+b.legende+' » : plus de 5 mots.');
      if(b.type==='video'&&(b.duree_min||0)>4)av.push('Vidéo « '+b.titre+' » : plus de 4 minutes.');
    });
  });
  D.briq.forEach(function(b){var c=contenuParId(b.contenu_id);if(c&&c.module_code===m.code)verif+=(JSON.stringify(b.champs).match(/\[à vérifier/g)||[]).length;});
  if(m.etat==='ecr')m.etat='bro';
  return {ok:true,module:m.code,contenus:nc,briques:nb,avertissements:av,a_verifier:j.a_verifier||[],mentions_a_verifier:verif};
}

/* ---------- les clics ---------- */
var SEL='[data-mod],[data-voir],[data-valider],[data-fmt],[data-act],[data-rep],[data-bmv],[data-brouillon],[data-badd],[data-bdel],[data-bdelno],[data-bver],[data-radd],[data-rdel],[data-etape],[data-jour],[data-creer],[data-plus],[data-ins],[data-plier],[data-voirbr],[data-th]';
function garderScroll(f){var y=window.scrollY;f();window.scrollTo(0,y);}
document.addEventListener('click',function(e){
  var t=e.target.closest(SEL);if(!t||t.disabled)return;var d=t.dataset;
  if(d.mod){S.mod=d.mod;S.cont=null;S.res=null;S.rep={};S.msg='';S.jour=null;S.tout=false;S.plusPos=null;render();window.scrollTo(0,0);return;}
  if(d.voir){S.cont=d.voir;S.tout=false;S.msg='';S.plusPos=null;S.confirmDel=null;render();window.scrollTo(0,0);return;}
  if(d.etape!==undefined){var i=+d.etape;if(S.cont){S.cont=null;S.msg='';}render();var el=$('etape-'+i);if(el)el.scrollIntoView({block:'start'});return;}
  if(d.jour!==undefined){garderScroll(function(){S.jour=(S.jour===+d.jour?null:+d.jour);render();});return;}
  if(d.creer){var pc=d.creer.split('|');creerContenu(S.mod,pc[0],pc[1]);return;}
  if(d.plus!==undefined){garderScroll(function(){S.plusPos=(S.plusPos===+d.plus?null:+d.plus);render();});return;}
  if(d.ins){var pi=d.ins.split('|');inserer(pi[0],pi[1],+pi[2]);return;}
  if(d.plier){garderScroll(function(){S.plie[d.plier]=!S.plie[d.plier];render();});return;}
  if(d.voirbr){ouvrirApercu(d.voirbr);return;}
  if(d.th==='police'){var t1=theme()||{};majTheme({police_atelier_texte:!t1.police_atelier_texte});return;}
  if(d.th==='fond'){var t2=theme()||{};majTheme({fond_ecran:t2.fond_ecran==='brun'?'blanc':'brun'});return;}
  if(d.bmv){var pp=d.bmv.split('|');deplacer(pp[0],+pp[1]);return;}
  if(d.valider){valider(d.valider);return;}
  if(d.brouillon){repasserBrouillon(d.brouillon);return;}
  if(d.fmt){S.fmt=d.fmt;majApercu();return;}
  if(d.act==='menu'){garderScroll(function(){S.arbreOuvert=!S.arbreOuvert;prefsSauver();render();});return;}
  if(d.act==='ap'){if(S.apOuvert)fermerApercu();else ouvrirApercu();return;}
  if(d.act==='fermerap'){fermerApercu();return;}
  if(d.act==='epingler'){S.apEpingle=!S.apEpingle;prefsSauver();garderScroll(render);return;}
  if(d.act==='tout'){S.tout=!S.tout;majApercu();return;}
  if(d.act==='retour'){S.cont=null;S.msg='';S.confirmDel=null;render();window.scrollTo(0,0);return;}
  if(d.act==='tester'){S.rep={};S.fmt='tel';S.tout=false;var m0=byCode(S.mod),xs=m0?ecrans(m0):[];ouvrirApercu(xs.length?xs[0].b.id:null);return;}
  if(d.badd){var pa=d.badd.split('|'),n0=briquesDe(pa[0]).length;inserer(pa[0],pa[1],n0);return;}
  if(d.bdelno){garderScroll(function(){S.confirmDel=null;render();});return;}
  if(d.bdel){if(S.confirmDel===d.bdel){supprimerBrique(d.bdel);}else{garderScroll(function(){S.confirmDel=d.bdel;render();});}return;}
  if(d.bver){versionB(d.bver);return;}
  if(d.radd){var bb=briqueParId(d.radd);if(bb){bb.champs.reponses=(bb.champs.reponses||[]).concat([{texte:'',bonne:false,retour:''}]);garderScroll(function(){sauver(bb);render();});}return;}
  if(d.rdel){var pr=d.rdel.split('|'),bq=briqueParId(pr[0]);if(bq&&bq.champs.reponses&&bq.champs.reponses.length>2){bq.champs.reponses.splice(+pr[1],1);garderScroll(function(){sauver(bq);render();});}else{S.msg='Une question garde au moins 2 réponses.';render();}return;}
  if(d.act==='prev'||d.act==='next'){var rl=$('rail');if(rl){rl.scrollBy({left:(d.act==='next'?1:-1)*rl.clientWidth,behavior:'auto'});setTimeout(majCpt,60);}return;}
  if(d.act==='pg'){var sh=document.querySelectorAll('.apc .imp')[+d.p];if(sh)sh.scrollIntoView({behavior:'auto',block:'start'});return;}
  if(d.act==='importer'){importer();return;}
  if(d.rep){var p=d.rep.split('|');S.rep[p[0]]=+p[1];majApercu();return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.apOuvert)fermerApercu();});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.bf)return;
  var b=briqueParId(t.dataset.bf);if(!b)return;
  b.champs=b.champs||{};setP(b.champs,t.dataset.p,t.dataset.num?(+t.value||0):t.value);
  var card=t.closest('.brique'),hh=card&&card.querySelector('.hint');if(hh)hh.innerHTML=hint(b);
  var tt=card&&card.querySelector('.tt');if(tt)tt.textContent=titreBrique(b);
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset||{};
  if(d.bf){var b0=briqueParId(d.bf);if(b0){var gf=(d.p==='format');garderScroll(function(){sauver(b0).then(function(){if(gf)garderScroll(render);});});}return;}
  if(d.bonne){var pb=d.bonne.split('|'),b1=briqueParId(pb[0]);if(b1){b1.champs.reponses.forEach(function(r,k){r.bonne=(k===+pb[1]);});var h1=t.closest('.brique').querySelector('.hint');if(h1)h1.innerHTML=hint(b1);sauver(b1);}return;}
  if(d.bcol){var pc=d.bcol.split('|'),b2=briqueParId(pc[0]);if(b2)colonne(b2,pc[1],t.value||null);return;}
  if(d.upr&&t.files[0]){var pu=d.upr.split('|');televerserReponse(pu[0],+pu[1],t.files[0]);return;}
  if(t.id==='parc'){S.parc=t.value;S.mod=null;S.cont=null;S.res=null;render();return;}
  if(d.up&&t.files[0]){televerser(d.up,t.files[0]);return;}
  if(t.id==='fic'&&t.files[0]){var fr=new FileReader();fr.onload=function(){$('json').value=fr.result;};fr.readAsText(t.files[0]);}
});
document.addEventListener('scroll',function(e){var r=e.target;if(r&&r.id==='rail')majCpt();},true);
/* glisser-déposer des briques : on attrape la poignée ⋮⋮ */
document.addEventListener('mousedown',function(e){var p=e.target.closest&&e.target.closest('.poignee');if(p){var c=p.closest('.brique');if(c)c.draggable=true;}});
document.addEventListener('mouseup',function(){Array.prototype.forEach.call(document.querySelectorAll('.brique[draggable="true"]'),function(c){c.draggable=false;});});
function nettoyerDnd(){S.drag=null;S.dropId=null;Array.prototype.forEach.call(document.querySelectorAll('.brique.drag,.brique.drop-av,.brique.drop-ap'),function(c){c.classList.remove('drag','drop-av','drop-ap');c.draggable=false;});}
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.brique');if(!c||!c.draggable)return;S.drag=c.dataset.bid;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',S.drag);}catch(x){}c.classList.add('drag');});
document.addEventListener('dragover',function(e){
  var c=e.target.closest&&e.target.closest('.brique');if(!S.drag||!c||c.dataset.bid===S.drag)return;
  e.preventDefault();var r=c.getBoundingClientRect(),av=e.clientY<r.top+r.height/2;
  Array.prototype.forEach.call(document.querySelectorAll('.brique.drop-av,.brique.drop-ap'),function(x){x.classList.remove('drop-av','drop-ap');});
  c.classList.add(av?'drop-av':'drop-ap');S.dropId=c.dataset.bid;S.dropAv=av;});
document.addEventListener('drop',function(e){if(!S.drag||!S.dropId)return;e.preventDefault();var a=S.drag,b=S.dropId,av=S.dropAv;nettoyerDnd();deposer(a,b,av);});
document.addEventListener('dragend',nettoyerDnd);

/* ---------- chargement ---------- */
async function lire(nom,q){try{var r=await q;if(r.error){D.err.push(nom);return [];}return r.data||[];}catch(x){D.err.push(nom);return [];}}
async function recharger(){
  var q=function(t){return sb().from(t).select('*');};
  var r=await Promise.all([lire('modules',q('vsf_prod_modules').order('ordre')),lire('contenus',q('vsf_form_contenus')),lire('briques',q('vsf_form_briques')),lire('axes',q('vsf_form_axes')),lire('chapitres',q('vsf_form_chapitres')),lire('chartes',q('vsf_form_chartes')),lire('liens',q('vsf_form_module_situations')),lire('situations',q('vsf_fiche_situations'))]);
  D.mods=r[0];D.cont=r[1];D.briq=r[2];D.axes=r[3];D.chap=r[4];D.chartes=r[5];D.liens=r[6];D.sit=r[7];
  await signer();
}
async function charger(){
  var s=await sb().auth.getSession();
  if(!s.data.session){location.replace('connexion.html?suite='+encodeURIComponent(location.href));return;}
  S.uid=s.data.session.user.id;prefsCharger();
  var a=await sb().rpc('vsf_est_admin');
  if(a.data!==true){$('app').innerHTML='<div class="kick">Constructeur de parcours</div><h1><i class="dot"></i>Accès réservé</h1><p>Cette page est réservée à Skolantreuz.</p><p><a class="btn" href="./">Retour</a></p>';return;}
  D.parcs=await lire('parcours',sb().from('vsf_form_parcours').select('*').order('cree_le'));
  (await lire('réglages',sb().from('vsf_form_reglages').select('cle,valeur'))).forEach(function(x){D.regl[x.cle]=x.valeur;});
  await recharger();
  var demande=new URLSearchParams(location.search).get('parcours');
  var p=D.parcs.filter(function(x){return x.code===demande;})[0]||D.parcs.filter(function(x){return x.demo;})[0]||D.parcs[0];
  S.parc=p&&p.id;render();
}

window.CP={init:function(data){TEST=true;D=Object.assign(D,data);D.regl=D.regl||{};S.parc=(D.parcs[0]||{}).id;render();},etat:function(){return {S:S,D:D};}};
if(!(location.hostname==='localhost'||location.hostname==='127.0.0.1'))charger();
})();
