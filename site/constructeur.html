<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constructeur de parcours — VRAI-SAVOIRFAIRE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="vsf-logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<style>
:root{--fg:#111;--muted:#767676;--now:#ffc400;--ok:#009e73;--alert:#d92d20;--soft:#f3f3f3;--jaune:#fff4cc;--accent:#ffc400;
  --f-faire:#111111;--f-recevoir:#2F67B1;--f-mesurer:#7B4FB8;--f-dire:#13878A;--f-regard:#8B5A2B;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
.wrap{max-width:1700px;margin:0 auto;padding:12px clamp(16px,2.5vw,40px) 80px}
.kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:6px 0 4px;font-size:clamp(26px,3.6vw,40px);font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--now);flex:none}
h2{margin:0 0 10px;font-size:18px;font-weight:900}
h3{margin:0 0 6px;font-size:14px;font-weight:800}
.lead{max-width:720px;margin:0 0 20px;color:#333}
.demo{display:inline-block;background:var(--jaune);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.cols{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(340px,520px);gap:28px;align-items:start}
@media(max-width:1180px){.cols{grid-template-columns:1fr}}
.arbre button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;border:0;background:none;padding:7px 8px;cursor:pointer;border-radius:4px}
.arbre button.sel{background:var(--jaune);font-weight:800}
.arbre .ax{font-weight:900;margin:14px 0 2px;font-size:13px;letter-spacing:.04em}
.arbre .ch{font-weight:700;color:var(--muted);font-size:12.5px;margin:8px 0 0 4px}
.forme{width:14px;height:14px;border:2px solid #111;border-radius:4px;flex:none;background:#fff}
.forme.plein{background:#111}.forme.epais{border-width:5px}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.chip.a-relire{background:var(--jaune)}.chip.relu{background:#e3f6ee;color:#056b4d}
.btn{font:inherit;font-weight:800;font-size:13px;border:2px solid #111;background:#fff;padding:8px 14px;cursor:pointer;border-radius:999px}
.btn.plein{background:#111;color:#fff}.btn[disabled]{opacity:.35;cursor:default}
.etape{margin:0 0 18px;padding:0 0 0 14px;border-left:5px solid #111}
.etape .eh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;font-weight:900}
.etape .eh span{font-weight:600;color:var(--muted);font-size:13px}
.cont{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0}
.cont .nom{font-weight:700;min-width:170px}
.cont .btn{padding:5px 11px;font-size:12px}
.cont .vide{color:var(--muted)}
textarea.json{width:100%;min-height:150px;font:12.5px/1.45 ui-monospace,Consolas,monospace;border:0;background:var(--soft);padding:12px;border-radius:6px;resize:vertical}
textarea.json:focus,input:focus{outline:2px solid var(--now)}
.res{margin:12px 0;padding:12px 14px;background:var(--soft);border-radius:6px}
.res.ko{background:#fdecea}.res.ok{background:#e3f6ee}
.res ul{margin:6px 0 0;padding-left:18px}
.manque h3{margin-top:16px}.manque li{margin:3px 0}
.brique{margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:6px;font-size:14px}
.brique b{font-weight:800}.brique .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.empl{border:2px dashed #999;background:#fff}
/* aperçu apprenant */
.ap{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
.ap h2{flex:none}
.apc{overflow-y:auto;flex:1;min-height:0;padding-right:4px}
.arbre{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;padding-right:6px}
@media(max-width:1180px){.ap,.arbre{position:static;max-height:none}.apc{overflow:visible}}
.ap .fm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;flex:none}
.ap .fm .cpt{font-weight:800;font-size:13px;min-width:54px;text-align:center}
.ap .fm button{font:inherit;font-weight:800;font-size:13px;border:2px solid #111;background:#fff;padding:7px 13px;cursor:pointer;border-radius:999px}
.ap .fm button.on{background:#111;color:#fff}
.tel{width:320px;max-width:100%;height:min(600px,calc(100vh - 260px));min-height:420px;margin:0 auto;border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.tel .top{padding:12px 14px 6px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.tel .top i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tel .rail{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.tel .ecran{flex:0 0 100%;scroll-snap-align:start;padding:10px 16px 16px;overflow-y:auto}
.tel .pts{display:flex;gap:5px;justify-content:center;padding:8px 0 12px}
.tel .pts i{width:7px;height:7px;border-radius:50%;background:#d5d5d5}.tel .pts i.on{background:#111}
.ord{border:1px solid #d9d9d9;border-radius:8px;padding:14px;background:#fff}
.ord .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.imp{background:#fff;border:1px solid #cfcfcf;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:22px 24px;margin:0 0 14px;font-size:12.5px}
.imp .ent{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px;padding-bottom:8px;border-bottom:3px solid var(--accent)}
.imp .pied{margin-top:12px;font-size:10.5px;color:#555}
.imp .case{display:inline-block;width:12px;height:12px;border:1.5px solid #111;margin-right:7px;vertical-align:-2px}
.imp .qr{display:inline-flex;width:64px;height:64px;border:2px solid #111;align-items:center;justify-content:center;font-size:10px;font-weight:800;text-align:center}
.ab{margin:0 0 12px;padding:0 0 0 12px;border-left:5px solid var(--c,#111)}
.ab .ent2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--c,#111)}
.ab h4{margin:2px 0 4px;font-size:15px}
.ab p{margin:0 0 6px}
.ab .ph{border:2px dashed #999;border-radius:6px;padding:14px 10px;text-align:center;color:#555;font-size:12.5px;background:#fafafa}
.ab .ph b{display:block;font-size:13px;color:#111}
.ab .rep{display:block;width:100%;text-align:left;font:inherit;border:2px solid #111;background:#fff;padding:9px 11px;margin:5px 0;border-radius:8px;cursor:pointer}
.ab .rep.pris{background:var(--jaune)}
.ab .ret{font-size:13px;margin:4px 0 8px;padding:8px 10px;background:var(--soft);border-radius:6px}
.ab .minu{display:inline-block;font-weight:800;font-size:12px;border:2px solid #111;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.ab .pt{font-weight:800}
.note{font-size:12.5px;color:var(--muted)}
.media{display:block;max-width:100%;border-radius:6px}
.brique img.media,.brique video.media{max-width:240px;margin:8px 0}
.brique .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.brique .acts .btn{padding:4px 11px;font-size:12px}
.brique label.btn{cursor:pointer}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:12px;font-weight:800;margin-bottom:3px}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{width:100%;font:inherit;border:0;background:#fff;padding:8px 10px;border-radius:6px;caret-color:#111}
.fld textarea{resize:vertical}
.fld.court{display:inline-block;width:auto;margin-right:18px}
.fld.court input[type=number]{width:90px}
.rowf{display:flex;gap:16px;align-items:flex-end;margin:8px 0 14px;flex-wrap:wrap}
.rep-ed{margin:8px 0}
.rline{display:flex;gap:8px;align-items:center}
.rline input[type=text]{flex:1;border:0;background:#fff;padding:8px 10px;border-radius:6px;font:inherit}
.rep-ed .ret{width:calc(100% - 28px);margin:4px 0 4px 28px;border:0;background:#fff;padding:7px 10px;border-radius:6px;font:inherit;font-size:13px}
.puce{width:16px;text-align:center}
.btn.petit{padding:3px 10px;font-size:12px}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#fff}
.addb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:16px 0}
.acts2{display:flex;gap:6px;flex-wrap:wrap}
.brique .hint{margin-top:6px}
.msg{margin:10px 0;padding:10px 12px;background:var(--jaune);border-radius:6px;font-weight:700}
.jours{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.jours .j{font-size:12px;font-weight:800;border:2px solid #111;border-radius:999px;padding:3px 10px;background:#fff}
.jours .j.trop{background:#fdecea;border-color:var(--alert);color:var(--alert)}
.err{color:var(--alert);font-weight:700}
</style>

</head>
<body>
<div class="wrap" id="app"><div class="kick">Constructeur de parcours</div><h1><i class="dot"></i>Chargement…</h1></div>
<script src="vsf-menu.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var TEST=false;
var D={parcs:[],axes:[],chap:[],mods:[],cont:[],briq:[],imps:[],chartes:[],err:[]};
var S={parc:null,mod:null,cont:null,fmt:'tel',res:null,rep:{},ecran:0,urls:{},msg:'',uid:null,confirmDel:null};

var ETAPES=[['essayer','Essayer'],['constater','Constater'],['regarder','Regarder'],['faire','Faire'],['comparer','Comparer'],['ancrer','Ancrer']];
var TYPES={consigne_essai:['Consigne d’essai','--f-faire'],grille_mesure:['Grille de mesure','--f-mesurer'],photo_erreur_type:['Photos d’erreur type','--f-regard'],fiche_geste:['Fiche geste','--f-recevoir'],planche_geste:['Planche de geste','--f-recevoir'],capsule_video:['Capsule vidéo','--f-recevoir'],series_guidees:['Séries guidées J1 à J7','--f-faire'],quiz_deux_versions:['Quiz en 2 versions','--f-mesurer'],consigne_depot:['Consigne de dépôt','--f-mesurer'],critere_j30:['Critère à J+30','--f-dire'],
  fiche:['Fiche','--f-recevoir'],video_mere:['Vidéo-mère','--f-recevoir'],capsule:['Capsule','--f-recevoir'],planche:['Planche','--f-recevoir'],audio:['Audio','--f-recevoir'],auto_test:['Auto-test','--f-mesurer'],quiz:['Quiz','--f-mesurer'],exercice_chronometre:['Exercice chronométré','--f-faire'],exercice:['Exercice','--f-faire'],exercice_depot:['Dépôt','--f-mesurer'],masterclass:['Masterclass','--f-recevoir']};
var ETATS={ecr:'À écrire',bro:'Brouillon préparé',rsk:'Relu par Skolantreuz',tou:'À tourner',mon:'Au montage',rel:'À relire',pret:'Prêt à vendre',rep:'À revoir'};
var famille=function(t){return (TYPES[t]||['',' --f-faire'])[1].trim();};
var nomType=function(t){return (TYPES[t]||[t])[0];};
var byCode=function(c){return D.mods.filter(function(m){return m.code===c;})[0]||null;};
var QUIZ_JOUR=4; /* règles du 18 nov. : le quiz tombe le jour 4 de « Faire » (ou le dernier jour s'il y en a moins) et la séance de ce jour est raccourcie ; le dépôt et le vocal viennent le jour suivant la dernière séance */
var reglage=function(cle,def){var v=D.regl&&D.regl[cle];return typeof v==='number'?v:def;};
var mots=function(s){s=String(s||'').trim();return s?s.split(/\s+/).length:0;};

function sb(){return window.VSF&&VSF.sb;}
/* ---------- données ---------- */
function modulesDuParcours(){return D.mods.filter(function(m){return m.parcours_id===S.parc;}).sort(function(a,b){return a.ordre-b.ordre;});}
function contenusDe(code){return D.cont.filter(function(c){return c.module_code===code;});}
function briquesDe(id){return D.briq.filter(function(b){return b.contenu_id===id;}).sort(function(a,b){return a.rang-b.rang;});}
function charte(){var c=D.chartes.filter(function(x){return x.parcours_id===S.parc;})[0]||{};return c;}
function parcours(){return D.parcs.filter(function(p){return p.id===S.parc;})[0]||{};}

/* ---------- affichage ---------- */
function render(){
  var p=parcours(),m=S.mod?byCode(S.mod):null;
  document.documentElement.style.setProperty('--accent',(charte().couleur_accent)||'#ffc400');
  var opts=D.parcs.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===S.parc?' selected':'')+'>'+esc(x.nom)+(x.demo&&!/démonstration/i.test(x.nom)?' (démonstration)':'')+'</option>';}).join('');
  var h='<div class="kick">Constructeur de parcours · partie 1 : import d’un brouillon et aperçu</div>'+
    '<h1><i class="dot"></i>'+esc(p.nom||'Parcours')+(p.demo?'<span class="demo">démo</span>':'')+'</h1>'+
    '<p class="lead">Choisis un module, importe son brouillon, relis-le dans l’aperçu apprenant.'+(p.demo?' Ce parcours est une démonstration : aucun apprenant ne le voit, rien n’est compté.':'')+'</p>'+
    '<p><select id="parc" class="btn" aria-label="Parcours">'+opts+'</select> <a class="btn" href="production-v2.html">← Production</a></p>';
  h+='<div class="cols"><nav class="arbre" id="arbre">'+arbre()+'</nav><main id="centre">'+(m?centre(m):'<p class="note">Choisis un module à gauche.</p>')+'</main><aside class="ap" id="ap">'+(m?apercuWrap(apercu(m),m):'')+'</aside></div>';
  $('app').innerHTML=h;
}
function formeEtat(m){var n=contenusDe(m.code).filter(function(c){return briquesDe(c.id).length>0;}).length;   /* « commencé » = au moins un contenu avec des briques ; les contenus seulement prévus ne comptent pas */
  if(['pret','rel'].indexOf(m.etat)>-1)return 'plein';return n?'epais':'';}
function arbre(){
  var mods=modulesDuParcours(),h='';
  var axes=D.axes.filter(function(a){return a.parcours_id===S.parc;}).sort(function(a,b){return a.ordre-b.ordre;});
  axes.forEach(function(a){
    h+='<div class="ax">'+esc(a.code+' · '+a.titre)+'</div>';
    D.chap.filter(function(c){return c.axe_id===a.id;}).sort(function(a,b){return a.ordre-b.ordre;}).forEach(function(c){
      h+='<div class="ch">'+esc((c.code?c.code+' · ':'')+c.titre)+'</div>';
      mods.filter(function(m){return m.chapitre_id===c.id;}).forEach(function(m){h+=ligne(m);});
    });
  });
  var sans=mods.filter(function(m){return !m.chapitre_id;});
  if(sans.length){h+='<div class="ax">Sans chapitre</div>';sans.forEach(function(m){h+=ligne(m);});}
  return h||'<p class="note">Aucun module dans ce parcours.</p>';
}
function ligne(m){return '<button data-mod="'+esc(m.code)+'" class="'+(m.code===S.mod?'sel':'')+'"><span class="forme '+formeEtat(m)+'"></span><span>'+esc(m.titre)+'<br><span class="note">'+esc(m.code)+'</span></span></button>';}

function centre(m){
  if(S.cont){var cc=D.cont.filter(function(x){return x.id===S.cont;})[0];if(cc)return editeur(m,cc);}
  var cs=contenusDe(m.code),h='<h2>'+esc(m.titre)+'</h2><p><span class="chip">'+esc(ETATS[m.etat]||m.etat)+'</span> <span class="chip">'+esc(m.code)+'</span> '+
    '<span class="chip">Essai sécurisé : '+(m.essai_securise===true?'oui':m.essai_securise===false?'non':'à choisir')+'</span></p>';
  if(S.msg&&!S.cont)h+='<p class="msg">'+esc(S.msg)+'</p>';
  h+=journees(m);
  ETAPES.forEach(function(e,i){
    var grise=(m.essai_securise===false&&e[0]==='essayer');
    var liste=cs.filter(function(c){return c.etape===e[0];});
    h+='<div class="etape" style="border-left-color:var(--f-'+['faire','mesurer','recevoir','faire','mesurer','dire'][i]+')"><div class="eh">'+(i+1)+' · '+e[1]+(grise?'<span>grisée : essai non sécurisé</span>':'')+'</div>';
    if(!liste.length)h+='<div class="cont"><span class="vide">Aucun contenu</span></div>';
    liste.forEach(function(c){
      var nb=briquesDe(c.id).length;
      h+='<div class="cont"><span class="nom">'+esc(nomType(c.type))+'</span><span class="chip '+(!nb?'':c.relecture==='relu'?'relu':'a-relire')+'">'+(!nb?'à écrire':c.relecture==='relu'?'relu':'brouillon · à relire')+'</span><span class="note">'+nb+' brique'+(nb>1?'s':'')+(c.duree_min?' · '+c.duree_min+' min':'')+(c.obligatoire===false?' · facultatif':'')+'</span>'+
        '<button class="btn" data-voir="'+esc(c.id)+'">'+(nb?'Ouvrir':'Écrire')+'</button>'+(c.relecture!=='relu'&&nb?'<button class="btn plein" data-valider="'+esc(c.id)+'">Valider ce contenu</button>':'')+(c.relecture==='relu'&&nb?'<button class="btn" data-brouillon="'+esc(c.id)+'" title="À faire avant de réimporter une nouvelle version de ce contenu">Repasser en brouillon</button>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='<h2>Importer un brouillon</h2><p class="note">Un fichier JSON par module. Tout arrive « brouillon · à relire ». Les images et vidéos ne sont que des emplacements.</p>'+
    '<p><input type="file" id="fic" accept=".json,application/json"></p><textarea class="json" id="json" placeholder="Colle ici le contenu du fichier JSON, ou choisis le fichier ci-dessus"></textarea>'+
    '<p><button class="btn plein" data-act="importer">Importer pour ce module</button></p><div id="res">'+resultat()+'</div>';
  return h;
}
function journees(m){
  var cs=contenusDe(m.code),max=reglage('journee_max_min',12),rap=reglage('rappel_minutes',2),dur=function(c){return +c.duree_min||0;};
  var serie=cs.filter(function(c){return c.type==='series_guidees';})[0];if(!serie)return '';
  var ex=briquesDe(serie.id).filter(function(b){return b.type==='exercice';});if(!ex.length)return '';
  var quiz=cs.filter(function(c){return c.type==='quiz_deux_versions';})[0],qd=Math.min(QUIZ_JOUR,ex.length);
  var fin=cs.filter(function(c){return c.etape==='comparer'||c.etape==='ancrer';}).reduce(function(a,c){return a+dur(c);},0);
  var d0=cs.filter(function(c){return ['essayer','constater','regarder'].indexOf(c.etape)>-1;}).reduce(function(a,c){return a+dur(c);},0);
  var rows=[{n:'Jour 0',t:d0,txt:'sans rappel'}];
  ex.forEach(function(b,i){var c=b.champs||{},t=(+c.duree_min||0)+(i+1===qd&&quiz?dur(quiz):0)+rap;
    rows.push({n:c.jour||('J'+(i+1)),t:t,txt:(i+1===qd&&quiz?'quiz · ':'')+'rappel '+rap+' min'});});
  /* règle du 18 nov. : le dépôt (Comparer) et le vocal (Ancrer) viennent le jour qui suit la dernière séance */
  if(fin>0)rows.push({n:'J'+(ex.length+1),t:fin+rap,txt:'dépôt et vocal · rappel '+rap+' min'});
  var trop=rows.filter(function(r){return r.t>max;}).length;
  return '<h3>Durée des journées <span class="note">(au plus '+max+' min)</span></h3><div class="jours">'+rows.map(function(r){return '<span class="j'+(r.t>max?' trop':'')+'" title="'+esc(r.txt)+'">'+esc(r.n)+' · '+r.t+' min'+(r.t>max?' · trop long':'')+'</span>';}).join('')+'</div>'+(trop?'<p class="err">'+trop+' journée'+(trop>1?'s dépassent':' dépasse')+' '+max+' minutes : raccourcis une séance ou décale un contenu.</p>':'');
}
function media(b){var u=b.fichier&&S.urls[b.fichier],c=b.champs||{};
  if(b.type==='image'&&u)return '<img class="media" src="'+esc(u)+'" alt="'+esc(c.legende||'')+'">';
  if(b.type==='video'&&u)return '<video class="media" controls preload="metadata" src="'+esc(u)+'"></video>';
  return '';}
/* ---------- éditeur de briques (section 3 ter du prompt du constructeur) ---------- */

    var feuille=function(titre,corps,pg){return '<div class="imp"><div class="ent"><span>'+ent+'</span><span>'+esc(titre)+'</span></div>'+corps+'<div class="pied">'+ent+' · '+esc(m.code)+' · version 1 · relu : à fixer · '+esc(ch.mention_droits||'mention de droits : texte à fixer')+' · page '+pg+'</div></div>';};
    h+=feuille(m.titre,xs.map(function(x){return ab(x,'imp');}).join(''),1);
    var corr=xs.filter(function(x){return x.b.type==='question'&&(x.b.champs.reponses||[]).some(function(r){return r.bonne;});});
    if(corr.length)h+=feuille('Corrigé (verso)','<h4>Corrigé</h4>'+corr.map(function(x){var c=x.b.champs;return '<p><b>'+esc(c.question)+'</b><br>✓ '+esc((c.reponses.filter(function(r){return r.bonne;})[0]||{}).texte)+'</p>';}).join(''),2);
  }
  return h;
}

async function televerser(id,file){
  var b=D.briq.filter(function(x){return x.id===id;})[0];if(!b)return;
  var c=D.cont.filter(function(x){return x.id===b.contenu_id;})[0],m=c&&byCode(c.module_code),y0=window.scrollY;
  var max=(b.type==='video'?50:10)*1048576;
  if(file.size>max){S.msg='Fichier trop lourd ('+Math.round(file.size/1048576)+' Mo) : '+(b.type==='video'?'50':'10')+' Mo au plus.';render();window.scrollTo(0,y0);return;}
  var ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
  var path=(m?m.parcours_id+'/'+m.code:'divers')+'/'+b.id+'-'+Date.now()+'.'+ext;
  if(TEST){S.urls[path]=URL.createObjectURL(file);b.fichier=path;b.emplacement=false;await toucher(b.contenu_id);S.msg='Fichier ajouté (essai local).';render();window.scrollTo(0,y0);return;}
  var up=await sb().storage.from('vsf-contenus').upload(path,file,{contentType:file.type||undefined,upsert:false});
  if(up.error){S.msg='Le fichier n\u2019a pas été enregistré : '+up.error.message+(/not found|bucket/i.test(up.error.message)?' — le stockage privé « vsf-contenus » est à créer dans Supabase (Storage, New bucket, privé).':'');render();window.scrollTo(0,y0);return;}
  var r=await sb().from('vsf_form_briques').update({fichier:path,emplacement:false,maj_le:new Date().toISOString()}).eq('id',b.id);
  if(r.error){S.msg='Le fichier est envoyé mais la brique n\u2019a pas été mise à jour : '+r.error.message;render();window.scrollTo(0,y0);return;}
  b.fichier=path;b.emplacement=false;await toucher(b.contenu_id);await signer();S.msg='Fichier ajouté. Le contenu repasse en « brouillon · à relire ».';render();window.scrollTo(0,y0);

/* ---------- import de test (en local seulement : reprend les règles de la fonction vsf_form_importer_brouillon) ---------- */
function importLocal(j){
  var m=byCode(j.module),msg=null;
  if(!m)msg='Le module « '+j.module+' » n’existe pas.';
  else if(j.titre_attendu&&j.titre_attendu!==m.titre)msg='Le titre du module (« '+m.titre+' ») ne correspond pas à celui du fichier (« '+j.titre_attendu+' »). Rien n’est importé.';
  else if(j.demo&&!m.demo)msg='Ce fichier est marqué « démo » : il ne s’applique qu’à un module de démonstration.';
  if(msg)return {ok:false,message:msg};
  var av=[],nc=0,nb=0,verif=0,id0=D.briq.length+D.cont.length+1;
  if(typeof j.essai_securise==='boolean'&&m.essai_securise==null)m.essai_securise=j.essai_securise;
  (j.contenus||[]).forEach(function(c,i){
    var ex=D.cont.filter(function(x){return x.module_code===m.code&&x.etape===c.etape&&x.type===c.type;})[0];
    if(!ex){ex={id:'c'+(id0++),module_code:m.code,etape:c.etape,type:c.type,etat:'bro',obligatoire:c.obligatoire!==false,duree_min:c.duree_min||null,relecture:'brouillon'};D.cont.push(ex);}
    else{D.briq=D.briq.filter(function(b){return b.contenu_id!==ex.id;});ex.relecture='brouillon';}
    nc++;
    c.briques.forEach(function(b,k){
      var champs=Object.assign({},b);delete champs.type;delete champs.version;
      D.briq.push({id:'b'+(id0++),contenu_id:ex.id,rang:k+1,type:b.type,champs:champs,version:b.version||null,emplacement:(b.type==='image'||b.type==='video')});nb++;
      if(b.type==='carte'&&mots(b.texte)>60)av.push('Carte « '+b.titre+' » : '+mots(b.texte)+' mots (au plus 60).');
      if(b.type==='image'&&mots(b.legende)>5)av.push('Légende « '+b.legende+' » : plus de 5 mots.');
      if(b.type==='video'&&(b.duree_min||0)>4)av.push('Vidéo « '+b.titre+' » : plus de 4 minutes.');
    });
  });
  D.briq.forEach(function(b){var c=D.cont.filter(function(x){return x.id===b.contenu_id;})[0];if(c&&c.module_code===m.code)verif+=(JSON.stringify(b.champs).match(/\[à vérifier\]/g)||[]).length;});
  if(m.etat==='ecr')m.etat='bro';
  return {ok:true,module:m.code,contenus:nc,briques:nb,avertissements:av,a_verifier:j.a_verifier||[],mentions_a_verifier:verif};
}

async function lire(nom,q){try{var r=await q;if(r.error){D.err.push(nom);return [];}return r.data||[];}catch(x){D.err.push(nom);return [];}}
async function recharger(){
  var q=function(t){return sb().from(t).select('*');};
  var r=await Promise.all([lire('modules',q('vsf_prod_modules').order('ordre')),lire('contenus',q('vsf_form_contenus')),lire('briques',q('vsf_form_briques')),lire('axes',q('vsf_form_axes')),lire('chapitres',q('vsf_form_chapitres')),lire('chartes',q('vsf_form_chartes'))]);
  D.mods=r[0];D.cont=r[1];D.briq=r[2];D.axes=r[3];D.chap=r[4];D.chartes=r[5];

}
async function charger(){
  var s=await sb().auth.getSession();
  if(!s.data.session){location.replace('connexion.html?suite='+encodeURIComponent(location.href));return;}
  S.uid=s.data.session.user.id;
  var a=await sb().rpc('vsf_est_admin');
  if(a.data!==true){$('app').innerHTML='<div class="kick">Constructeur de parcours</div><h1><i class="dot"></i>Accès réservé</h1><p class="lead">Cette page est réservée à Skolantreuz.</p><p><a class="btn" href="./">Retour</a></p>';return;}
  D.parcs=await lire('parcours',sb().from('vsf_form_parcours').select('*').order('cree_le'));
  (await lire('réglages',sb().from('vsf_form_reglages').select('cle,valeur'))).forEach(function(x){if(typeof x.valeur==='number'){D.regl=D.regl||{};D.regl[x.cle]=x.valeur;}});
  await recharger();
  var demande=new URLSearchParams(location.search).get('parcours');
  var p=D.parcs.filter(function(x){return x.code===demande;})[0]||D.parcs.filter(function(x){return x.demo;})[0]||D.parcs[0];
  S.parc=p&&p.id;render();
}
