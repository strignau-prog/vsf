<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Accès privés — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<style>
  .wrap.large{max-width:760px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .chips button{background:#fff;border:2px solid #111;padding:9px 14px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;border-radius:999px;min-height:44px}
  .chips button.on{background:#111;color:#fff}
  .mdp-ligne{display:flex;align-items:center;gap:10px}
  .mdp-ligne input{flex:1;font-weight:800;letter-spacing:.06em}
  .resultat{margin-top:30px}
  .resultat .valeur{display:block;font-weight:800;font-size:17px;overflow-wrap:anywhere;margin:2px 0 8px}
  .resultat .mdp-grand{font-size:30px;font-weight:900;letter-spacing:.08em}
  .ligne{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0}
  .ligne .qui{min-width:0}
  .ligne .qui b{display:block;font-weight:800;overflow-wrap:anywhere}
  .ligne .qui span{font-size:14px;color:var(--cap);overflow-wrap:anywhere}
  .ligne .actions{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .etat{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;margin-right:6px}
  .etat.off{color:#767676}
  .bouton.petit{min-height:44px;font-size:12px;padding:10px 0}
  @media (max-width:520px){.ligne{flex-direction:column;align-items:flex-start}.ligne .actions{justify-content:flex-start}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<link rel="stylesheet" href="vsf-largeur.css"><link rel="stylesheet" href="vsf-icones.css"><link rel="stylesheet" href="vsf-epure.css"><link rel="stylesheet" href="vsf-logo.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="vsf-menu.css">
</head>
<body>
<script src="vsf-menu.js"></script>
<main class="wrap large" id="app"><p class="legende">Chargement…</p></main>
<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb;
var form = { type: 'entreprise', jours: 30, mdp: '' };
var jour = function (d) { try { return new Date(d).toLocaleDateString('fr-FR'); } catch (e) { return ''; } };
var lienDe = function (code) { return location.origin + '/acces.html?c=' + encodeURIComponent(code); };
/* le message s'ouvre dans Gmail, depuis la boîte contact@vraisavoirfaire.fr (il faut y être connecté dans ce navigateur) */
var EXPEDITEUR = 'contact@vraisavoirfaire.fr';
function gmail(a, sujet, corps) { return 'https://mail.google.com/mail/u/' + encodeURIComponent(EXPEDITEUR) + '/?view=cm&fs=1&tf=1&to=' + encodeURIComponent(a || '') + '&su=' + encodeURIComponent(sujet) + '&body=' + encodeURIComponent(corps); }
var MAIL_OK = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

/* mot de passe lisible : 12 caractères sans lettres ambiguës (pas de l, o, i, 0, 1), par groupes de 4 */
function motDePasse() {
  var alpha = 'abcdefghjkmnpqrstuvwxyz23456789', n = 12, out = [], oct = new Uint8Array(n * 2), i = 0;
  crypto.getRandomValues(oct);
  while (out.length < n && i < oct.length) { if (oct[i] < 248) out.push(alpha[oct[i] % alpha.length]); i++; }   // 248 = 31 × 8 : tirage sans biais
  while (out.length < n) { var o = new Uint8Array(1); crypto.getRandomValues(o); if (o[0] < 248) out.push(alpha[o[0] % alpha.length]); }
  return out.join('').replace(/(.{4})(?=.)/g, '$1-');
}

async function copier(texte, bouton) {
  try { await navigator.clipboard.writeText(texte); }
  catch (e) {
    var t = document.createElement('textarea'); t.value = texte; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e2) { /* rien */ } document.body.removeChild(t);
  }
  if (bouton) { var avant = bouton.textContent; bouton.textContent = 'Copié'; setTimeout(function () { bouton.textContent = avant; }, 1500); }
}

async function demarrer() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.replace('connexion.html?mode=connexion&suite=' + encodeURIComponent(location.href)); return; }
  var a = await sb.rpc('vsf_est_admin');
  if (a.error || a.data !== true) { $('app').innerHTML = '<h1>Accès réservé.</h1><a class="bouton" href="./">Retour</a>'; return; }
  form.mdp = motDePasse();
  dessiner();
  await lister();
}

function dessiner() {
  $('app').innerHTML =
    '<p class="etiquette">Administrateur</p>' +
    '<h1>Accès privés.</h1>' +
    '<p class="legende">Un lien et un mot de passe pour faire un diagnostic, sans créer de compte. Envoyez le lien et le mot de passe par deux canaux différents.</p>' +

    '<p class="etiquette">Diagnostic</p>' +
    '<div class="chips" id="cType" role="radiogroup" aria-label="Diagnostic">' +
      '<button type="button" role="radio" data-t="entreprise">Entreprise</button><button type="button" role="radio" data-t="travailleur">Travailleur</button></div>' +

    '<label class="champ" for="qui">Pour qui</label>' +
    '<input id="qui" type="text" autocomplete="off" maxlength="120" placeholder="nom de l’entreprise ou de la personne">' +

    '<label class="champ" for="dest">E-mail du destinataire</label>' +
    '<input id="dest" type="email" inputmode="email" autocomplete="off" maxlength="200" placeholder="prenom@exemple.fr">' +

    '<p class="etiquette">Valable</p>' +
    '<div class="chips" id="cJours" role="radiogroup" aria-label="Durée">' +
      '<button type="button" role="radio" data-j="7">7 jours</button><button type="button" role="radio" data-j="30">30 jours</button><button type="button" role="radio" data-j="90">90 jours</button></div>' +

    '<label class="champ" for="mdp">Mot de passe</label>' +
    '<div class="mdp-ligne"><input id="mdp" type="text" autocomplete="off" spellcheck="false" value="' + E(form.mdp) + '">' +
      '<button type="button" class="bouton petit" id="bNouveau">Un autre</button></div>' +

    '<p class="message" id="msg" role="alert"></p>' +
    '<button type="button" class="bouton" id="bCreer" data-texte>Créer l’accès</button>' +
    '<div class="resultat" id="resultat"></div>' +

    '<h2>Accès créés</h2>' +
    '<p class="message" id="msgListe" role="alert"></p><div id="liste"></div>';
  marquer();
  $('cType').addEventListener('click', function (e) { var b = e.target.closest('[data-t]'); if (!b) return; form.type = b.getAttribute('data-t'); marquer(); });
  $('cJours').addEventListener('click', function (e) { var b = e.target.closest('[data-j]'); if (!b) return; form.jours = parseInt(b.getAttribute('data-j'), 10); marquer(); });
  $('bNouveau').addEventListener('click', function () { form.mdp = motDePasse(); $('mdp').value = form.mdp; });
  $('bCreer').addEventListener('click', creer);
}
function marquer() {
  [].forEach.call($('cType').querySelectorAll('button'), function (b) { var on = b.getAttribute('data-t') === form.type; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  [].forEach.call($('cJours').querySelectorAll('button'), function (b) { var on = parseInt(b.getAttribute('data-j'), 10) === form.jours; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}

async function creer() {
  var qui = $('qui').value.trim(), mdp = $('mdp').value.trim();
  $('msg').textContent = '';
  if (qui.length < 2) { $('msg').textContent = 'Indiquez pour qui.'; $('qui').focus(); return; }
  if (mdp.length < 10) { $('msg').textContent = 'Le mot de passe doit faire au moins 10 caractères.'; return; }
  $('bCreer').disabled = true;
  var dest = ($('dest').value || '').trim().toLowerCase();
  if (dest && !MAIL_OK.test(dest)) { $('msg').textContent = 'L’adresse e-mail n’est pas valide.'; $('dest').focus(); $('bCreer').disabled = false; return; }
  var r = await sb.rpc('vsf_acces_creer', { p_type: form.type, p_libelle: qui, p_mdp: mdp, p_jours: form.jours, p_email: dest || null });
  $('bCreer').disabled = false;
  if (r.error || !r.data) { $('msg').textContent = /permission|VSF07/i.test(String(r.error && r.error.message)) ? 'Action refusée : droit manquant.' : ((r.error && r.error.message) || 'Échec. Réessayez.'); return; }
  var lien = lienDe(r.data.code);
  $('resultat').innerHTML =
    '<p class="etiquette">Accès créé · ' + (form.type === 'entreprise' ? 'diagnostic entreprise' : 'diagnostic travailleur') + ' · ' + E(qui) + '</p>' +
    '<p class="legende">Lien</p><span class="valeur">' + E(lien) + '</span>' +
    '<button type="button" class="bouton petit" id="cLien">Copier le lien</button>' +
    '<p class="legende" style="margin-top:18px">Mot de passe</p><span class="valeur mdp-grand">' + E(mdp) + '</span>' +
    '<button type="button" class="bouton petit" id="cMdp">Copier le mot de passe</button>' +
    '<p class="legende" style="margin-top:18px">Notez-le : le mot de passe n’est plus affiché ensuite. Valable jusqu’au ' + E(jour(r.data.expire_le)) + '.</p>' +
    '<p class="etiquette" style="margin-top:24px">Envoyer par e-mail' + (dest ? ' · ' + E(dest) : '') + '</p>' +
    '<button type="button" class="bouton" id="gLien" data-texte>Écrire le message du lien (Gmail)</button><br>' +
    '<button type="button" class="bouton discret" id="gMdp" data-texte>Écrire le message du mot de passe (Gmail)</button>' +
    '<p class="legende">Gmail s’ouvre dans un nouvel onglet, depuis ' + E(EXPEDITEUR) + ', avec le message prêt à envoyer. Le lien et le mot de passe partent dans deux messages séparés.</p>';
  var genre = form.type === 'entreprise' ? 'entreprise' : 'travailleur', fin = jour(r.data.expire_le);
  $('gLien').addEventListener('click', function () {
    window.open(gmail(dest, 'Votre accès au diagnostic VraiSavoirFaire', 'Bonjour,\n\nVoici votre accès au diagnostic ' + genre + ' de VraiSavoirFaire, préparé pour ' + qui + ' :\n\n' + lien + '\n\nLe mot de passe vous arrive dans un second message. Ce lien est valable jusqu’au ' + fin + '.\n\nCordialement,\nVraiSavoirFaire\n' + EXPEDITEUR + '\n'), '_blank', 'noopener');
  });
  $('gMdp').addEventListener('click', function () {
    window.open(gmail(dest, 'Mot de passe de votre accès VraiSavoirFaire', 'Bonjour,\n\nVoici le mot de passe qui accompagne le lien reçu dans mon message précédent :\n\n' + mdp + '\n\nCordialement,\nVraiSavoirFaire\n' + EXPEDITEUR + '\n'), '_blank', 'noopener');
  });
  $('cLien').addEventListener('click', function (e) { copier(lien, e.currentTarget); });
  $('cMdp').addEventListener('click', function (e) { copier(mdp, e.currentTarget); });
  $('qui').value = ''; $('dest').value = ''; form.mdp = motDePasse(); $('mdp').value = form.mdp;
  await lister();
}

function etatDe(a) {
  if (!a.actif) return ['Révoqué', true];
  if (new Date(a.expire_le) < new Date()) return ['Expiré', true];
  if (a.bloque) return ['Bloqué 15 min', true];
  return ['Valable jusqu’au ' + jour(a.expire_le), false];
}
async function lister() {
  var r = await sb.rpc('vsf_acces_lister');
  if (r.error) { $('msgListe').textContent = 'La liste n’est pas disponible. La migration 38 est-elle installée ?'; return; }
  $('msgListe').textContent = '';
  var l = r.data || [];
  $('liste').innerHTML = l.length ? l.map(function (a) {
    var e = etatDe(a);
    return '<div class="ligne" data-id="' + E(a.id) + '"><div class="qui"><b>' + E(a.libelle) + '</b>' +
      '<span>' + (a.type === 'entreprise' ? 'Diagnostic entreprise' : 'Diagnostic travailleur') + (a.destinataire ? ' · ' + E(a.destinataire) : '') + ' · créé le ' + E(jour(a.cree_le)) + ' · ' +
      (a.ouvertures ? 'ouvert ' + a.ouvertures + ' fois, dernière le ' + E(jour(a.derniere_ouverture)) : 'pas encore ouvert') + '</span></div>' +
      '<div class="actions"><span class="etat' + (e[1] ? ' off' : '') + '">' + E(e[0]) + '</span>' +
      '<button type="button" class="bouton petit" data-act="lien" data-code="' + E(a.code) + '">Copier le lien</button>' +
      (a.actif ? '<button type="button" class="bouton petit" data-act="revoquer">Révoquer</button>' : '') + '</div></div>';
  }).join('') : '<p class="legende">Aucun accès pour l’instant.</p>';
}
document.addEventListener('click', async function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (b.getAttribute('data-act') === 'lien') { copier(lienDe(b.getAttribute('data-code')), b); return; }
  if (b.getAttribute('data-act') === 'revoquer') {
    if (b.getAttribute('data-sur') !== '1') { b.setAttribute('data-sur', '1'); b.textContent = 'Confirmer'; setTimeout(function () { if (b.isConnected) { b.removeAttribute('data-sur'); b.textContent = 'Révoquer'; } }, 4000); return; }
    var id = b.closest('[data-id]').getAttribute('data-id');
    var r = await sb.rpc('vsf_acces_revoquer', { p_id: id });
    if (r.error) { $('msgListe').textContent = 'Échec. Réessayez.'; return; }
    await lister();
  }
});
demarrer();
</script>
<script src="vsf-icones.js"></script><script src="vsf-pop.js"></script><script src="vsf-logo.js"></script><script src="vsf-session.js"></script>
</body>
</html>
