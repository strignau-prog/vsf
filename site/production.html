<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production des modules — VRAI-SAVOIRFAIRE</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="vsf-logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<style>:root{--fg:#111;--muted:#767676;--off:#c4c4c4;--now:#ffc400;--ok:#009e73;--todo:#fdecea;--todo-b:#f6c6bf;--pil:#f3f3f3;--cor:#fff4cc;--sup:#f3f3f3;--res:#fafafa;--font:'Inter','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,56px)}
.wrap{max-width:1440px;margin:0 auto;padding:8px clamp(16px,4vw,56px) 120px}
/* stepper = processus */
.steps{display:flex;align-items:center;gap:0;margin:16px 0 56px;overflow-x:auto;scrollbar-width:none}
.stp{display:flex;align-items:center;gap:10px;flex:none;background:none;border:0;padding:6px 0;font:inherit;cursor:pointer;color:var(--off)}
.stp .c{width:28px;height:28px;border-radius:50%;border:2px solid var(--off);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
.stp .l{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.stp.now{color:var(--fg)} .stp.now .c{background:var(--now);border-color:var(--now);color:#111}
.stp.done{color:var(--fg)} .stp.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.link{width:clamp(16px,4vw,56px);height:2px;background:var(--off);flex:none;margin:0 12px}
.link.done{background:var(--ok)}
.kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:8px 0 8px;font-size:clamp(30px,4.5vw,50px);font-weight:900;letter-spacing:-.02em;line-height:1.02;display:flex;align-items:center;gap:14px}
.lead{font-size:16px;max-width:720px;margin:0 0 48px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--now);flex:none;display:inline-flex;align-items:center;justify-content:center}
.dot.ok{background:var(--ok)}
.dot.ok::after{content:"";width:8px;height:4px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
@media(min-width:1000px){.grid{grid-template-columns:minmax(290px,3fr) minmax(0,9fr);gap:40px}}
h2{margin:0 0 6px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px 32px}
section+section{margin-top:48px}
/* à remplir : fond rouge pâle */
.todo{background:var(--todo);transition:background .4s}
.sel{position:relative;margin-left:32px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:17px;font-weight:800;color:#111;border:0;border-bottom:2px solid #111;padding:14px 40px 12px 14px;background:transparent;cursor:pointer}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:9px;height:9px;border-right:2.5px solid #111;border-bottom:2.5px solid #111;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel.todo select{color:#b42318}
/* postes */
.postes{margin-left:0;display:flex;flex-direction:column;gap:4px;padding:8px 0}
.postes.todo{padding:8px 12px}
.po{padding:6px 0}
.poh{display:flex;align-items:center;gap:12px;min-height:44px}
.box{width:20px;height:20px;border:2px solid #111;border-radius:4px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;padding:0}
.box.on{background:#111}
.box.on::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.box.sm{width:16px;height:16px;border-width:2px}
.box.sm.on::after{width:7px;height:4px;border-width:2px}
.pn{font-weight:800;font-size:16px;cursor:pointer;flex:1}
.po:not(.on) .pn{color:#4a4a4a;font-weight:600}
.ini{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;background:#111;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.03em}
.po:not(.on) .ini{background:#e8e8e8;color:#767676}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{width:28px;height:28px;border:0;background:none;font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.qty b{min-width:18px;text-align:center}
.sum{font-size:12.5px;color:var(--muted);margin:-4px 0 6px 32px}
.sf{margin:4px 0 10px 32px;display:flex;flex-direction:column;gap:2px}
.sfr{display:flex;align-items:center;gap:10px;min-height:32px;font-size:14px;cursor:pointer}
.sfr .z{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px}
.z.P{background:var(--pil)} .z.C{background:var(--cor)} .z.S{background:var(--sup)}
.sfr.off{color:var(--off)}
.adj{margin:2px 0 6px 32px;display:flex;flex-direction:column;gap:4px}
.adj .lab{font-size:12px;color:#767676}
.adj .sel{margin-left:0}
.adj .sel select{font-size:14px;padding:9px 34px 8px 10px}
.adj .sel::after{right:10px;width:7px;height:7px}
.share{display:flex;height:8px;margin:6px 0 2px;max-width:260px}
.share i{display:block;height:100%}
.sharel{font-size:12px;color:#4a4a4a;font-weight:600}
.cost{margin-left:32px;display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:320px}
.cost input{width:90px;font:inherit;font-size:20px;font-weight:900;border:0;border-bottom:2px solid #111;background:transparent;padding:4px 2px}
.cost span{font-weight:800}
.hrs{margin:6px 0 4px 32px;display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 10px;max-width:260px}
.hrs input{width:64px;font:inherit;font-size:16px;font-weight:900;border:0;border-bottom:2px solid #111;background:transparent;padding:2px}
.dq{margin:6px 0 4px 32px;display:flex;flex-direction:column;gap:4px}
.dq .lab{font-size:12.5px;font-weight:700}
.dq .sel{margin-left:0}
.dq .sel select{font-size:14px;padding:9px 34px 8px 10px}
.dq .sel::after{right:10px;width:7px;height:7px}
.incl{font-size:12.5px;font-weight:700;margin:-2px 0 4px 32px}
.cell.ask{background:var(--todo);opacity:1}
.cell.ask .t{color:#b42318}
.cell.ask select{font:inherit;font-size:12.5px;font-weight:700;border:0;border-bottom:2px solid #b42318;background:transparent;padding:4px 0;width:100%;color:#b42318}
.cell.ext{opacity:.6}
.cell.ext .x{font-size:12px;font-weight:700;color:#767676}
.srch{margin-left:32px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid #111}
.srch input{flex:1;border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;outline:none;min-width:0}
.srch input::placeholder{color:#b42318;font-weight:700;opacity:.8}
.srch:not(.todo) input::placeholder{color:#c4c4c4}
.srch:focus-within .caret{display:none}
.sugg{margin-left:32px;display:flex;flex-direction:column}
.sugg button{background:none;border:0;padding:10px 12px;text-align:left;font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sugg button small{font-weight:500;color:#767676;font-size:12px}
.sugg button:hover{color:#ffc400}
.or{margin:14px 0 8px 32px;font-size:12px;color:#767676;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.grp{margin:18px 0 4px 32px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#767676}
.row1{display:flex;align-items:stretch;gap:10px;margin-top:6px}
.row1 .sel{flex:1;min-width:0}
.row1 .hrs{margin:0;max-width:none;flex:none;padding:0 10px;border-bottom:2px solid #111;display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.row1 .hrs input{width:44px;border:0;font-size:15px}
.hok{width:20px;height:20px;border:2px solid #b42318;border-radius:4px;background:#fff;cursor:pointer;padding:0;margin-left:4px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.hok.on{background:#111;border-color:#111}
.hok.on::after{content:"";width:8px;height:4px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.hok:hover{border-color:#111}
.pills .ini.ext{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #111}
.pext{background:none;border:0;padding:0 4px;font:inherit;font-size:11px;font-weight:700;color:#b0b0b0;cursor:pointer;opacity:0;transition:opacity .2s}
.cell:hover .pext,.pext:focus,.pext.on{opacity:1}
.pext:hover{color:#111}
@media(hover:none){.pext{opacity:1}}
.demo{background:none;border:0;font:inherit;font-size:13px;font-weight:700;color:#767676;cursor:pointer}
.demo:hover{color:var(--now)}
.stp[data-go]{cursor:pointer}
.side section{margin-top:0}
.side section+section{margin-top:40px}
@media(min-width:1000px){.side{position:sticky;top:16px;align-self:start}}
.howto{margin-left:32px;display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:26px 90px 1fr;align-items:baseline;font-size:14px}
.hrow .kp{font-size:18px;font-weight:900}
.hrow span:last-child{color:#4a4a4a}
.feux{margin:14px 0 0 32px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:700}
.feux span{display:inline-flex;align-items:center;gap:6px}
.fx{width:18px;height:18px;border-radius:50%;display:inline-block;box-sizing:border-box;border:2px solid #c4c4c4;background:#fff;padding:0;cursor:pointer;flex:none}
.fx.g{border-color:#009e73}.fx.y{border-color:#e0ac00}.fx.r{border-color:#ff3b1f}
.fx.g.on{background:#009e73}.fx.y.on{background:#ffc400;border-color:#ffc400}.fx.r.on{background:#ff3b1f}
.fx:hover{transform:scale(1.15)}
.prog2{margin-left:32px;display:flex;align-items:baseline;gap:10px}
.prog2 b{font-size:34px;font-weight:900}
.prog2 span{color:#767676;font-size:13px}
.pbar{margin:6px 0 10px 32px;height:6px;background:#f0f0f0}
.pbar i{display:block;height:100%;background:#111;width:0;transition:width .4s}
.lnk2{margin-left:32px;background:none;border:0;padding:0;font:inherit;font-weight:800;cursor:pointer}
.lnk2:hover{color:var(--now)}
.freed{margin-left:32px;display:flex;align-items:baseline;gap:10px}
.freed b{font-size:34px;font-weight:900}
.freed span{color:#767676;font-size:13px}
.mcell{background:#fff;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;position:relative;border-top:4px solid #e2e2e2;transition:background .3s}
.mcell.todo{background:var(--todo)}
.mcell.w-g{border-top-color:#009e73}.mcell.w-y{border-top-color:#ffc400}.mcell.w-r{border-top-color:#ff3b1f}
.mcell .t{font-weight:800;font-size:14px;line-height:1.2}
.mcell.todo .t{color:#b42318}
.mcell .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#767676;font-weight:700;flex-wrap:wrap}
.mcell .meta .ini{background:#e9e9e9;color:#111;height:18px;min-width:22px;font-size:9.5px}
.krow{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
.krow .kp{font-size:14px;font-weight:900;text-align:center}
.krow .kl{color:#4a4a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .fxs{display:flex;gap:5px}
.mcell .n{font-size:11px;font-weight:900;color:var(--muted)}
.mcell.extc{opacity:.5;border-top-color:#e2e2e2}
.alg{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;margin-top:4px}
.alg .box{width:16px;height:16px}
.alg .box.on::after{width:7px;height:4px;border-width:2px}
.client{margin-top:8px;background:#111;color:#fff;padding:14px 18px 16px}
.client .bh b{color:#fff}
.client .bh span{color:#c4c4c4}
.client .cells{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.client .cells{grid-template-columns:1fr}}
.client .mcell{color:#111}
.frag{font-size:20px !important}
.kbox{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.mcell .meta{min-height:20px}
.krow{min-height:22px}
.alg{min-height:22px}
@media(min-width:701px){.cells.C .krow{grid-template-columns:18px 1fr}.cells.C .krow .kl{display:none}.cells.C .krow .fxs{justify-content:flex-end}}
.leg{margin-left:auto;font-size:12px;font-weight:700;color:#4a4a4a}
@media(max-width:700px){.leg{display:none}#map .cells{grid-template-columns:1fr !important}}
.axl{margin-left:32px;display:flex;flex-direction:column;gap:4px}
.axr{display:grid;grid-template-columns:20px 1fr auto;grid-template-rows:auto 4px;column-gap:10px;row-gap:5px;align-items:center;background:none;border:0;padding:8px 0;font:inherit;text-align:left;cursor:pointer;color:#767676}
.axr b{font-weight:800;font-size:15px}
.axr .cn{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.axr .sd{width:20px;height:20px;border-radius:50%;border:2px solid #c4c4c4;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center}
.axr .br{grid-column:2/4;height:4px;background:#f0f0f0}
.axr .br i{display:block;height:100%;background:#111}
.axr.on{color:#111}.axr.on .sd{background:var(--now);border-color:var(--now)}
.axr.dn{color:#111}.axr.dn .sd{background:var(--ok);border-color:var(--ok)}
.axr.dn .sd::after{content:"";width:8px;height:4px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.axr:hover b{color:var(--now)}
.mode{margin-left:32px;display:flex;flex-direction:column;gap:6px}
.mode button{display:flex;gap:10px;align-items:flex-start;background:none;border:0;padding:6px 0;font:inherit;text-align:left;cursor:pointer;font-size:13px;color:#4a4a4a}
.mode button b{display:block;font-size:15px;color:#111}
.mode i{width:18px;height:18px;border-radius:50%;border:2px solid #111;box-sizing:border-box;flex:none;margin-top:2px}
.mode button.on i{background:#111;box-shadow:inset 0 0 0 3px #fff}
.cmp{margin:12px 0 0 32px;display:grid;grid-template-columns:96px 96px;gap:6px;position:relative;width:198px}
.cq4{height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f3f3f3;transition:background .4s}
.cq4 small{font-size:10px;font-weight:800;letter-spacing:.08em}
.cq4 b{font-size:24px;font-weight:900}
.cq4 span{font-size:10px}
.axh h2{font-size:clamp(24px,3vw,34px);margin:0}
.axh p{margin:4px 0 28px;color:#767676}
.qc{padding:20px 20px 16px;margin-bottom:24px;transition:background .3s;scroll-margin-top:24px}
.qc.todo{background:var(--todo)}
.qmeta{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#767676;display:flex;gap:12px;flex-wrap:wrap}
.qt{display:flex;gap:12px;align-items:flex-start;font-size:clamp(18px,2vw,22px);font-weight:900;line-height:1.25;margin:8px 0 14px}
.qt .dot{margin-top:3px}
.lv4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.lv4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.lv4{grid-template-columns:1fr}}
.lvl{background:#fff;border:0;border-top:4px solid #f0f0f0;padding:10px 10px 8px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:opacity .2s}
.lvl .lh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.lvl .lh i{width:16px;height:16px;border-radius:50%;border:2px solid #111;box-sizing:border-box;flex:none}
.lvl .lb{display:flex;gap:2px;margin-left:auto}.lvl .lb u{width:9px;height:4px;background:#e2e2e2}.lvl .lb u.f{background:#111}
.lvl .ln{display:block;min-height:2.6em;font-size:13px;font-weight:700;color:#4a4a4a;line-height:1.3;margin:-2px 0 2px 24px}
.lvl.on .ln{color:#111}
.qc.done .lvl.pr:not(.on){opacity:.6}
.lvl ul{margin:0;padding:0 0 0 0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.35;color:#4a4a4a}
.lvl li{display:flex;gap:7px}
.lvl li::before{content:"·";font-weight:900}
.lvl.pr li::before{content:"";width:13px;height:13px;border:1.5px solid #111;border-radius:3px;flex:none;margin-top:1px}
.lvl.pr li.ck::before{background:#111}
.lvl.pr li.ck{color:#111}
.lvl:hover .lh{color:var(--now)}
.lvl.on{border-top-color:var(--now)}
.lvl.on .lh{font-size:14.5px}
.lvl.on .lh i{background:var(--ok);border-color:var(--ok)}
.lvl.on ul{color:#111}
.qc.done .lvl:not(.on){opacity:.32}
.qc.done .lvl:not(.on):hover{opacity:1}
.res3{font-size:13px;font-weight:800;margin-top:10px}
.art{color:#111;font-weight:900}
.seals{display:flex;flex-wrap:wrap;gap:6px 10px;margin:4px 0 10px}
.seal{font-size:12px;font-weight:800;padding:4px 10px;background:#111;color:#fff}
.eng{margin-left:32px;display:flex;flex-direction:column}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px 54px;align-items:center;min-height:44px;padding:0 8px;font-size:14px;font-weight:700}
.erow.todo{background:var(--todo)}
.erow.eh{min-height:24px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#767676}
.erow.eh span{text-align:center}
.er{justify-self:center;width:18px;height:18px;border-radius:50%;border:2px solid #111;background:#fff;padding:0;cursor:pointer}
.er.on{background:#111;box-shadow:inset 0 0 0 3px #fff}
.erow.todo .er{border-color:#b42318}
.krow.ex .kp{color:#111}
.krow.ex .kl{color:#111}
.krow.sp{visibility:hidden}
.sl{font-size:12px}
.axr .cn small{font-weight:600;color:#767676;font-size:11px}
.qsl{color:#111;background:#ffe9a8;padding:1px 6px}

.mini{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#767676;margin-bottom:14px}
.hold .kl{color:#111}
.hb{min-width:26px;height:20px;border:2px solid #111;background:#fff;font:inherit;font-size:11px;font-weight:800;cursor:pointer;padding:0 4px}
.hb.on{background:#111;color:#fff}
.hb.one.on{background:#ff3b1f;border-color:#ff3b1f}
.toc{margin-left:32px;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 0;font-weight:800;font-size:14px;color:#111;text-decoration:none}
.toc a i{width:22px;height:22px;border-radius:50%;background:#f3f3f3;font-style:normal;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:none}
.toc a:hover{color:#ffc400}
.rb{margin-bottom:56px;scroll-margin-top:84px}
.rb h3{font-size:24px;font-weight:900;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.rb h3 i{width:26px;height:26px;border-radius:50%;background:#111;color:#fff;font-style:normal;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.rb .sub{font-size:14px;color:#4a4a4a;margin:0 0 18px 38px;max-width:760px}
.hero{background:#111;color:#fff;padding:28px 32px}
.hero .k{color:#ffc400;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hero .pn{font-size:clamp(34px,5vw,56px);font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:6px 0}

/* Lecture : vsf_prod_modules (migration 36). Enregistrement : après chaque action, on compare chaque module à son dernier état enregistré et on n'écrit que ce qui a changé.

var DB={role:'',snap:{},plan:{},busy:false,timer:null,vu:{}};
function dit(etat,txt){var e=$('etatSauv');if(!e)return;e.className='sauv '+(etat||'');e.title=txt||'';e.setAttribute('aria-label',txt||'');}
function mapRow(r){var f=r.formats||{};
  var d={c:r.code,t:r.titre,sc:r.sous_chapitre||'',sub:(r.sous_chapitre||'').split(' ')[0],ax:r.axe,lv:r.niveaux,mo:r.modalite||'',st:r.statut_ref,du:r.duree_min||0,pr:r.pratique_min||0,
    fi:f.fi||0,vi:f.vi||0,au:f.au||0,qz:f.qz||0,ex:f.ex||0,de:f.de||0,vt:f.vt||0,ju:f.ju||0,ep:!!r.epreuve,p:r.priorite||'P2',tr:r.tournage||'',stg:r.etat,
    cm:(r.commentaires||[]).map(function(c){return [c.t||0,c.texte||'',c.le||'',c.auteur||''];}),links:r.liens||[],at:r.atelier||{},fx:f};
  if(r.ext)S.ext[d.c]=r.ext;if(r.prix)S.prix[d.c]=r.prix;return d;}
function payload(d){var f=Object.assign({},d.fx,{fi:d.fi,vi:d.vi,au:d.au,qz:d.qz,ex:d.ex,de:d.de,vt:d.vt,ju:d.ju});
  return {etat:d.stg,liens:d.links,ext:S.ext[d.c]||null,prix:S.prix[d.c]||null,formats:f,atelier:d.at||{},
    commentaires:d.cm.map(function(c){return {t:c[0],texte:c[1],le:c[2]||'',auteur:c[3]||''};})};}
function snapAll(){CAPS.forEach(function(d){DB.snap[d.c]=JSON.stringify(payload(d));});DB.plan=JSON.stringify({dates:S.dates,tw:S.tw});}
async function flush(){
  if(DB.busy)return;DB.busy=true;dit('en-cours','Enregistrement…');var err=false;
  try{
    for(var i=0;i<CAPS.length;i++){var d=CAPS[i],p=payload(d),js=JSON.stringify(p);if(DB.snap[d.c]===js)continue;
      if(DB.role==='relecteur'){
        if((d.stg==='pret'||d.stg==='rep')&&DB.vu[d.c]==='rel'){
          var r=await VSF.sb.rpc('vsf_prod_relire',{p_code:d.c,p_decision:d.stg==='pret'?'valide':'reprise',p_commentaires:p.commentaires});
          if(r.error){err=true;console.warn(r.error);d.stg='rel';continue;} DB.vu[d.c]=d.stg;DB.snap[d.c]=js;
        } else {DB.snap[d.c]=js;}              // un commentaire seul reste dans la page jusqu'à la décision
      } else {
        var r2=d.nouveau?await VSF.sb.from('vsf_prod_modules').insert(Object.assign({code:d.c,titre:d.t,ordre:CAPS.indexOf(d)+1,axe:d.ax,sous_chapitre:d.sc,niveaux:d.lv,modalite:d.mo,statut_ref:d.st,priorite:d.p,tournage:d.tr},p)):await VSF.sb.from('vsf_prod_modules').update(Object.assign({},p,{maj_le:new Date().toISOString()})).eq('code',d.c);
        if(r2.error){err=true;console.warn(r2.error);continue;} d.nouveau=false;DB.snap[d.c]=js;
      }
    }
    if(DB.role==='admin'){var pj=JSON.stringify({dates:S.dates,tw:S.tw});if(pj!==DB.plan){var r3=await VSF.sb.from('vsf_prod_planning').upsert([{cle:'dates',valeur:S.dates,maj_le:new Date().toISOString()},{cle:'plans_tournes',valeur:S.tw,maj_le:new Date().toISOString()}],{onConflict:'cle'});if(r3.error){err=true;console.warn(r3.error);}else DB.plan=pj;}}
  }catch(e){err=true;console.warn(e);}
  DB.busy=false;dit(err?'erreur':'ok',err?'Non enregistré. Nouvel essai à la prochaine action.':'Enregistré');
}
function planifier(){clearTimeout(DB.timer);dit('en-cours','Enregistrement…');DB.timer=setTimeout(flush,900);}
['click','change','input'].forEach(function(ev){document.addEventListener(ev,function(e){if(!DB.role)return;if(e.target&&e.target.closest&&e.target.closest('#app,#tabs'))setTimeout(planifier,0);},true);});   // phase de capture : le bouton cliqué peut disparaître au rendu
/* le contenu saisi dans l'atelier (consigne, ressources, critères, questions…) est gardé par module */
document.addEventListener('input',function(e){var t=e.target;if(!t.dataset||!t.dataset.fk)return;var k=t.dataset.fk.split('|'),d=byCode(k[0]);if(!d)return;d.at=d.at||{};d.at[k[1]]=t.value;});
async function charger(){
  var s=await VSF.sb.auth.getSession();
  if(!s.data.session){location.replace('connexion.html?suite='+encodeURIComponent(location.href));return;}
  var a=await VSF.sb.rpc('vsf_est_admin');var rl=await VSF.sb.rpc('vsf_est_relecteur');
  var admin=a.data===true,relecteur=rl.data===true;
  if(!admin&&!relecteur){$('app').innerHTML='<div class="kick">Production des modules</div><h1>Accès réservé</h1><p class="lead">Cette page est réservée à Skolantreuz et aux Ambassadeurs validés.</p><p><a class="btn3" href="./">Retour</a></p>';return;}
  DB.role=admin?'admin':'relecteur';
  var m=await VSF.sb.from('vsf_prod_modules').select('*').order('ordre');
  if(m.error||!m.data||!m.data.length){$('app').innerHTML='<div class="kick">Production des modules</div><h1>Rien à afficher</h1><p class="lead">'+(m.error?'Les tables ne sont pas installées : migration 36 à jouer.':'Aucun module : migration 37 (import des 137 lignes) à jouer.')+'</p>';return;}
  CAPS=m.data.map(mapRow);CAPS.forEach(function(d){DB.vu[d.c]=d.stg;});
  if(admin){
    var pl=await VSF.sb.from('vsf_prod_planning').select('cle,valeur');(pl.data||[]).forEach(function(x){if(x.cle==='dates')S.dates=x.valeur||{};if(x.cle==='plans_tournes')S.tw=x.valeur||{};});
    var dg=await VSF.sb.rpc('vsf_diagnostics_chiffres');if(dg.data){S.dg={ent:(dg.data.en_cours||0)+(dg.data.termines||0)+(dg.data.a_payer||0),fin:dg.data.termines||0};}
    var wt=await VSF.sb.from('vsf_demandes_prevenir').select('geste');var g={};(wt.data||[]).forEach(function(x){g[x.geste]=(g[x.geste]||0)+1;});S.wait=Object.keys(g).map(function(k){return [k,g[k]];}).sort(function(x,y){return y[1]-x[1];});
  } else {
    S.t='R';document.querySelectorAll('#tabs button').forEach(function(b){if(b.dataset.t!=='R')b.style.display='none';});
  }
  snapAll();dit('ok','Enregistré');render();
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&DB.role){clearTimeout(DB.timer);flush();}});
charger();

window.addEventListener('scroll',function(){document.querySelector('.top').classList.toggle('sh',scrollY>4);},{passive:true});
})();
</script>
