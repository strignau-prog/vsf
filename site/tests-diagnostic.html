<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tests du diagnostic</title>
<style>
:root{--fg:#111;--bg:#fff;--mut:#6b6b6b;--ok:#009e73;--ko:#c2321f}
@media (prefers-color-scheme:dark){:root{--fg:#f2f2f2;--bg:#111;--mut:#a0a0a0;--ok:#35c79b;--ko:#ff7a66}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Inter,system-ui,sans-serif;padding:32px clamp(16px,4vw,56px)}
h1{font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.03em;margin:0 0 6px}
p{color:var(--mut);margin:0 0 28px;max-width:70ch}
.t{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0}
.t b{font-weight:800}.t small{display:block;color:var(--mut);font-size:13px}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.res{font-size:22px;font-weight:900;margin:28px 0 0}
iframe{position:absolute;left:-9999px;width:1400px;height:900px;border:0}
</style>
</head>
<body>
<h1>Tests du diagnostic entreprise</h1>
<p>Résultats de référence de la démo du diagnostic v10 et réglage des seuils des feux. La page ouvre le diagnostic en mode démo, sans aucune donnée réelle, et vérifie les résultats attendus.</p>
<div id="liste"></div>
<div class="res" id="bilan">Calcul en cours…</div>
<iframe id="f" title="diagnostic en démo"></iframe>
<script>
(function(){
  var F=document.getElementById('f'),L=document.getElementById('liste'),bilan=document.getElementById('bilan'),ok=0,tot=0;
  var pause=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  function ligne(passe,titre,attendu,obtenu){tot++;if(passe)ok++;
    var d=document.createElement('div');d.className='t';
    d.innerHTML='<span class="'+(passe?'ok':'ko')+'" aria-hidden="true">'+(passe?'✓':'✗')+'</span><span><b></b><small></small></span><span class="'+(passe?'ok':'ko')+'">'+(passe?'réussi':'échec')+'</span>';
    d.querySelector('b').textContent=titre;d.querySelector('small').textContent='attendu : '+attendu+' · obtenu : '+obtenu;L.appendChild(d);}
  function lancer(){
    (async function(){
      try{
        var w=F.contentWindow,d=w.document,V=w.V10;
        if(!V)throw new Error('Le diagnostic ne s’est pas ouvert.');
        d.getElementById('demo').click();await pause(1200);
        var tpos=d.getElementById('tpos').textContent,x2c=d.getElementById('x2c').textContent;
        ligne(/^3 \/ 4 /.test(tpos),'3 personnes sur 4 positionnées','3 / 4',tpos.slice(0,12));
        ligne(/^3 regards/.test(x2c),'3 regards à croiser','3 regards',x2c.slice(0,16));
        V.setStep(4);await pause(600);var n=d.querySelectorAll('.crr').length;
        ligne(n===6,'6 lignes dans les regards croisés','6',String(n));
        V.setStep(5);await pause(600);var c=(d.querySelector('.cart b')||{}).textContent;
        ligne(c==='4','4 modules dans le panier','4',String(c));
        /* les seuils sont réglables : un seuil plus exigeant change le feu */
        var S=V.SEUILS,av=V.calcFeu('c2');
        ligne(!!av&&av.f[0]==='g','Étape « Concevoir » : qualité verte avec les seuils du modèle','vert',av?av.f[0]:'—');
        S.qualite_vert=5;var ap=V.calcFeu('c2');S.qualite_vert=3;
        ligne(!!ap&&ap.f[0]!=='g','Qualité : un seuil vert à 5 la fait passer au jaune ou au rouge','pas vert',ap?ap.f[0]:'—');
        var h=V.calcFeu('c1');
        ligne(!!h&&h.f[1]==='g','Étape « Recevoir la demande » : 2 personnes savent faire seules, tenue verte','vert',h?h.f[1]:'—');
        S.tenue_vert=4;var h2=V.calcFeu('c1');S.tenue_vert=2;
        ligne(!!h2&&h2.f[1]==='y','Tenue : un seuil vert à 4 personnes la fait passer au jaune','jaune',h2?h2.f[1]:'—');
        var s3=V.calcFeu('s3');
        ligne(!!s3&&s3.f[2]==='r','Étape « Planning » : tout le temps fait sous le niveau 3, efficience rouge','rouge',s3?s3.f[2]:'—');
        S.temps_bas_jaune=1.01;var s3b=V.calcFeu('s3');S.temps_bas_jaune=.5;
        ligne(!!s3b&&s3b.f[2]==='y','Efficience : un seuil jaune relevé à 100 % la fait passer au jaune','jaune',s3b?s3b.f[2]:'—');
      }catch(e){ligne(false,'Le diagnostic a pu être ouvert','ouvert',String(e.message||e));}
      bilan.textContent=ok+' réussis sur '+tot;bilan.className='res '+(ok===tot?'ok':'ko');document.title=(ok===tot?'✓ ':'✗ ')+ok+'/'+tot+' · Tests du diagnostic';
    })();
  }
  F.addEventListener('load',function(){setTimeout(lancer,800);});
  F.src='diagnostic-entreprise.html?demo=1&t='+Date.now();      /* toujours la version à jour, jamais celle du cache */
})();
</script>
</body>
</html>
