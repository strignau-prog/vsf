<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Tableau de bord — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<style>
  .wrap.large{max-width:760px}
  .chiffres{display:flex;flex-wrap:wrap;gap:6px 28px;margin:10px 0 4px}
  .chiffres div{min-width:90px}
  .chiffres b{display:block;font-size:34px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
  .chiffres span{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--cap)}
  .ligne{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0}
  .ligne .qui{min-width:0}
  .ligne .qui b{display:block;font-weight:800;overflow-wrap:anywhere}
  .ligne .qui span{font-size:14px;color:var(--cap);overflow-wrap:anywhere}
  .ligne .qui span.alerte{color:var(--ink);font-weight:800}
  .ligne .actions{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .etat{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;margin-right:6px}
  .bouton.petit{min-height:44px;font-size:12px;padding:10px 0}
  h2 .ico-btn{vertical-align:middle;margin-left:6px}
  @media (max-width:520px){.ligne{flex-direction:column;align-items:flex-start}.ligne .actions{justify-content:flex-start}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<link rel="stylesheet" href="vsf-largeur.css"><link rel="stylesheet" href="vsf-icones.css"><link rel="stylesheet" href="vsf-epure.css"><link rel="stylesheet" href="vsf-logo.css"></head>
<body>
<header class="haut">
  <a class="marque" href="./">VRAI-SAVOIRFAIRE</a>
  <button class="bouton discret" id="bSortir" style="display:none" onclick="sortir()">Me déconnecter</button>
</header>
<main class="wrap large" id="app"><p class="legende">Chargement…</p></main>

<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb;
var moi = { id: null, super: false };
var ADMIN_METIERS = 'https://fastidious-kringle-8ac4c1.netlify.app/admin-metiers.html';
var jour = function (d) { try { return new Date(d).toLocaleDateString('fr-FR'); } catch (e) { return ''; } };

function dire(id, texte) { var m = $(id); if (m) { m.textContent = texte || ''; if (texte && m.scrollIntoView) m.scrollIntoView({ block: "center" }); } }
function messageErreur(e) {
  var m = String((e && e.message) || e || '');
  if (e && e.code === 'VSF01' || /VSF01|vendeur est valid/i.test(m)) return 'Offre bloquée : son ambassadeur métier n’est pas validé.';
  if (e && e.code === 'VSF08') return /e-mail/i.test(m) ? 'Validation refusée : e-mail manquant.' : 'Validation refusée : contrat non accepté.';
  if (/permission|row-level|policy/i.test(m)) return 'Action refusée : droit manquant.';
  return 'Échec. Réessayez.';
}

/* ───── accès ───── */
async function demarrer() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.replace('connexion.html?suite=' + encodeURIComponent(location.href)); return; }
  moi.id = s.data.session.user.id;
  $('bSortir').style.display = '';
  var a = await sb.rpc('vsf_est_admin');
  if (a.error || a.data !== true) {
    return $('app').innerHTML = '<h1>Accès réservé.</h1><a class="bouton" href="./">Retour</a>';
  }
  var su = await sb.rpc('vsf_est_super');
  moi.super = su.data === true;
  dessiner();
  await Promise.all([chargerComptes(), chargerDiagnostics(), chargerFiches(), chargerVendeurs(), chargerReversements()]);
}
async function sortir() { await sb.auth.signOut(); location.replace('./'); }

/* ───── squelette ───── */
function dessiner() {
  $('app').innerHTML =
    '<p class="etiquette">' + (moi.super ? 'Super administrateur' : 'Administrateur') + '</p>' +
    '<h1>Tableau de bord</h1>' +

    '<h2>Comptes</h2><div class="chiffres" id="chiffres"><div><b>…</b><span>Personnes</span></div></div>' +
    '<p class="message" id="msgComptes" role="alert"></p><div id="listeComptes"></div>' +

    '<h2>Diagnostics</h2><div class="chiffres" id="chiffresDiag"><div><b>…</b><span>À payer</span></div></div><p class="message" id="msgDiag" role="alert"></p>' +

    '<h2>Fiches</h2><div class="chiffres" id="chiffresIA"><div><b>…</b><span>IA</span></div></div>' +
    '<p class="legende">Aucune dépense sans votre accord : l’IA est éteinte tant que vous ne l’allumez pas.</p>' +
    '<p class="message" id="msgIA" role="alert"></p><div id="reglIA"></div><div id="listeDemandes"></div>' +

    '<h2>Ambassadeurs</h2>' +
    '<p class="legende">Aucune offre ne s’ouvre tant que son ambassadeur n’est pas validé.</p>' +
    '<p class="message" id="msgVendeurs" role="alert"></p><div id="listeVendeurs"></div>' +
    '<h2>Offres</h2><div id="listeOffres"></div>' +
    '<h2>À reverser</h2>' +
    '<p class="legende">État de gestion, pas une facture.</p>' +
    '<p class="message" id="msgReverse" role="alert"></p><div id="listeReverse"></div>' +

    '<h2>Entités <a class="bouton" href="entites.html">Ouvrir les entités</a></h2>' +

    '<h2>CGV</h2>' +
    '<p class="legende">Version provisoire, à relire avec votre comptable.</p>';
}

/* ───── fiches : l'IA ne dépense rien sans l'accord de Stéphane (règle posée en base, migration 28) ───── */
var IA = { actif: false, plafond: 0 };
async function chargerFiches() {
  var r = await sb.from('vsf_ia_reglages').select('actif,mode,plafond_mensuel_eur,cout_estime_fiche_eur').maybeSingle();
  if (r.error || !r.data) { $('chiffresIA').innerHTML = ''; dire('msgIA', 'Non installé : migration 28 à jouer.'); return; }
  var debut = new Date(); debut.setDate(1); debut.setHours(0, 0, 0, 0);
  var j = await sb.from('vsf_ia_journal').select('cout_eur').gte('cree_le', debut.toISOString());
  var depense = (j.data || []).reduce(function (s, x) { return s + Number(x.cout_eur || 0); }, 0);
  var dem = await sb.from('vsf_fiches_demandes').select('id,libelle,statut,cout_estime_eur,message').in('statut', ['en_attente', 'approuvee', 'en_cours', 'echec']).order('cree_le');
  var liste = dem.data || [];
  IA.actif = r.data.actif; IA.plafond = Number(r.data.plafond_mensuel_eur);
  $('chiffresIA').innerHTML =
    '<div><b>' + (r.data.actif ? 'Allumée' : 'Éteinte') + '</b><span>IA</span></div>' +
    '<div><b>' + euros(Math.round(depense * 100) / 100) + '</b><span>Dépensé ce mois</span></div>' +
    '<div><b>' + euros(IA.plafond) + '</b><span>Plafond</span></div>' +
    '<div><b>' + liste.filter(function (x) { return x.statut === 'en_attente'; }).length + '</b><span>À décider</span></div>';
  $('reglIA').innerHTML = moi.super
    ? '<div class="ligne"><div class="qui"><b>Réglage</b><span><input type="text" inputmode="decimal" id="iaPlafond" value="' + IA.plafond + '" aria-label="Plafond mensuel en euros" style="width:90px"> € par mois</span></div>' +
      '<div class="actions"><button class="bouton petit" data-texte onclick="regler(' + (!IA.actif) + ')">' + (IA.actif ? 'Éteindre l’IA' : 'Allumer l’IA') + '</button>' +
      '<button class="bouton petit" onclick="regler(' + IA.actif + ')">Enregistrer</button></div></div>'
    : '';
  var ETATS = { en_attente: 'À décider', approuvee: 'Approuvée', en_cours: 'En cours', echec: 'Échec' };
  $('listeDemandes').innerHTML = liste.map(function (x) {
    var act = '';
    if (x.statut === 'en_attente') {
      act = '<button class="bouton petit" onclick="decider(\'' + x.id + '\',true)">Valider</button><button class="bouton petit" onclick="decider(\'' + x.id + '\',false)">Refuser</button>';
    } else if (x.statut === 'approuvee') {
      act = '<button class="bouton petit" onclick="confirmer(this,\'Générer (≈ ' + euros(Number(x.cout_estime_eur || 0)) + ') ?\',function(){generer(\'' + x.id + '\')})">Générer</button>';
    }
    return '<div class="ligne"><div class="qui"><b>' + E(x.libelle) + '</b><span>' + (x.statut === 'echec' && x.message ? '<span class="alerte">' + E(x.message) + '</span>' : '≈ ' + euros(Number(x.cout_estime_eur || 0))) + '</span></div>' +
      '<div class="actions"><span class="etat">' + ETATS[x.statut] + '</span>' + act + '</div></div>';
  }).join('');
}
async function regler(actif) {
  dire('msgIA', '');
  var p = parseFloat(String($('iaPlafond').value).replace(',', '.'));
  var r = await sb.rpc('vsf_ia_regler', { p_actif: actif, p_mode: 'accord', p_plafond: isNaN(p) ? -1 : p });
  if (r.error) { console.error(r.error); return dire('msgIA', 'Réglage refusé : plafond entre 0 et 500 €.'); }
  chargerFiches();
}
async function decider(id, accord) {
  dire('msgIA', '');
  var r = await sb.rpc('vsf_fiche_decider', { p_demande: id, p_accord: accord });
  if (r.error) { console.error(r.error); return dire('msgIA', 'Décision impossible.'); }
  chargerFiches();
}
async function generer(id) {
  dire('msgIA', '');
  var r = await sb.functions.invoke('generer-fiche', { body: { demande_id: id } });
  if (r.error) { console.error(r.error); dire('msgIA', 'Moteur non déployé ou refusé : rien n’a été dépensé.'); }
  chargerFiches();
}

/* ───── diagnostics entreprise : des nombres seulement, jamais le contenu ───── */
async function chargerDiagnostics() {
  var r = await sb.rpc('vsf_diagnostics_chiffres');
  if (r.error || !r.data) { $('chiffresDiag').innerHTML = ''; dire('msgDiag', 'Non installé : migration 23 à jouer.'); return; }
  var d = r.data;
  var prix = d.tarif_defini ? euros(d.tarif_eur) : 'xx €';
  $('chiffresDiag').innerHTML =
    '<div><b>' + d.en_cours + '</b><span>En cours</span></div>' +
    '<div><b>' + d.termines + '</b><span>Terminés</span></div>' +
    '<div><b>' + d.a_payer + '</b><span>À payer</span></div>' +
    '<div><b>' + prix + '</b><span>Prix</span></div>';
}

/* ───── comptes ───── */
async function chargerComptes() {
  var comptes = await Promise.all(['verifie', 'en_attente', 'suspendu'].map(function (st) {
    return sb.from('vsf_personnes').select('user_id', { count: 'exact', head: true }).eq('statut', st);
  }));
  var n = comptes.map(function (r) { return r.count || 0; });
  $('chiffres').innerHTML =
    '<div><b>' + (n[0] + n[1] + n[2]) + '</b><span>Personnes</span></div>' +
    '<div><b>' + n[0] + '</b><span>Vérifiées</span></div>' +
    '<div><b>' + n[1] + '</b><span>À confirmer</span></div>' +
    '<div><b>' + n[2] + '</b><span>Suspendues</span></div>';
  var r = await sb.from('vsf_personnes').select('user_id,prenom,nom,email,statut,cree_le').order('cree_le', { ascending: false }).limit(50);
  if (r.error) { dire('msgComptes', messageErreur(r.error)); return; }
  var lignes = (r.data || []).map(function (p) {
    var nom = ((p.prenom || '') + ' ' + (p.nom || '')).trim() || 'Sans nom';
    var soi = p.user_id === moi.id;
    var action = soi ? '' :
      (p.statut === 'suspendu'
        ? '<button class="bouton petit" onclick="changerCompte(\'' + p.user_id + '\',\'verifie\',this)">Rétablir</button>'
        : '<button class="bouton petit" onclick="confirmer(this,\'Suspendre ?\',function(){changerCompte(\'' + p.user_id + '\',\'suspendu\')})">Suspendre</button>');
    // l'état normal (vérifié) ne s'écrit pas : seuls « À confirmer » et « Suspendu » se lisent
    var etat = p.statut === 'verifie' ? '' : '<span class="etat">' + ({ en_attente: 'À confirmer', suspendu: 'Suspendu' })[p.statut] + '</span>';
    return '<div class="ligne"><div class="qui"><b>' + E(nom) + '</b><span>' + E(p.email || '') + '</span></div>' +
      '<div class="actions">' + etat + action + '</div></div>';
  });
  $('listeComptes').innerHTML = lignes.join('');
}
async function changerCompte(uid, statut) {
  dire('msgComptes', '');
  var r = await sb.from('vsf_personnes').update({ statut: statut }).eq('user_id', uid);
  if (r.error) { console.error(r.error); return dire('msgComptes', messageErreur(r.error)); }
  chargerComptes();
}

/* ───── vendeurs et offres ───── */
async function chargerVendeurs() {
  var v = await sb.from('vsf_vendeurs').select('id,nom,atelier,email,statut,contrat_accepte_le,cree_le').order('cree_le', { ascending: false });
  if (v.error) { dire('msgVendeurs', messageErreur(v.error)); return; }
  var lv = (v.data || []).map(function (x) {
    // règle : « Validé » exige un e-mail et un contrat accepté (vérifiée aussi par la base, migration 24)
    var manque = [];
    if (!x.email) manque.push('e-mail manquant');
    if (!x.contrat_accepte_le) manque.push('contrat à accepter');
    var complet = !manque.length;
    var incoherent = x.statut === 'valide' && !complet;          // validé à tort : à signaler
    var actions = x.statut === 'valide'
      ? '<button class="bouton petit" onclick="confirmer(this,\'Suspendre ?\',function(){changerVendeur(\'' + x.id + '\',\'suspendu\')})">Suspendre</button>'
      : (complet ? '<button class="bouton petit" onclick="confirmer(this,\'Valider ?\',function(){changerVendeur(\'' + x.id + '\',\'valide\')})">Valider</button>' : '');
    var nom = E(x.nom) + (x.atelier && x.atelier !== x.nom ? ' · ' + E(x.atelier) : '');   // pas de doublon nom / atelier
    var sous = [];
    if (x.email) sous.push(E(x.email));
    if (manque.length) sous.push('<span class="alerte">' + (incoherent ? 'À corriger : ' : '') + manque.join(' · ') + '</span>');
    return '<div class="ligne"><div class="qui"><b>' + nom + '</b><span>' + sous.join(' · ') + '</span></div>' +
      '<div class="actions"><span class="etat">' +
      ({ valide: 'Validé', en_attente: 'En attente', suspendu: 'Suspendu' })[x.statut] + '</span>' + actions + '</div></div>';
  });
  $('listeVendeurs').innerHTML = lv.join('');

  var o = await sb.from('vsf_offres').select('id,intitule,statut,vendeur:vsf_vendeurs(nom)').order('cree_le', { ascending: false });
  if (o.error) { dire('msgVendeurs', messageErreur(o.error)); return; }
  var ORDRE = ['brouillon', 'pilote', 'publiee'];
  var NOMS = { brouillon: 'Brouillon', pilote: 'Pilote', publiee: 'Publiée' };
  var VERBE = { pilote: 'Pilote', publiee: 'Publier' };      // le geste, pas la phrase
  var lo = (o.data || []).map(function (x) {
    var i = ORDRE.indexOf(x.statut);
    var act = '';
    if (i < ORDRE.length - 1) act += '<button class="bouton petit" onclick="confirmer(this,\'' + VERBE[ORDRE[i + 1]] + ' ?\',function(){changerOffre(\'' + x.id + '\',\'' + ORDRE[i + 1] + '\')})">' + VERBE[ORDRE[i + 1]] + '</button>';
    if (i > 0) act += '<button class="bouton petit" onclick="changerOffre(\'' + x.id + '\',\'brouillon\')">Remettre en brouillon</button>';
    return '<div class="ligne"><div class="qui"><b>' + E(x.intitule) + '</b><span>' + E((x.vendeur && x.vendeur.nom) || '') + '</span></div>' +
      '<div class="actions"><span class="etat">' + NOMS[x.statut] + '</span>' + act + '</div></div>';
  });
  $('listeOffres').innerHTML = lo.join('');
}
async function changerVendeur(id, statut) {
  dire('msgVendeurs', '');
  var m = { statut: statut };
  if (statut === 'valide') { m.valide_par = moi.id; m.valide_le = new Date().toISOString(); }
  var r = await sb.from('vsf_vendeurs').update(m).eq('id', id);
  if (r.error) { console.error(r.error); return dire('msgVendeurs', messageErreur(r.error)); }
  chargerVendeurs();
}
async function changerOffre(id, statut) {
  dire('msgVendeurs', '');
  var r = await sb.from('vsf_offres').update({ statut: statut }).eq('id', id);
  if (r.error) { console.error(r.error); return dire('msgVendeurs', messageErreur(r.error)); }
  chargerVendeurs();
}

/* Confirmation en deux temps, sans fenêtre : le bouton change de texte, un second clic confirme. */
/* ───── à reverser aux ambassadeurs métier (état de gestion, pas une facture) ───── */
var euros = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f') + '\u00a0€'; };
var REV = { mensuel: [] };
async function chargerReversements() {
  var a = await sb.from('vsf_a_reverser').select('*').order('nom');
  var m = await sb.from('vsf_a_reverser_mensuel').select('*').order('mois', { ascending: false });
  if (a.error || m.error) { dire('msgReverse', 'État non installé : mise à jour de la base à faire.'); return; }
  REV.mensuel = m.data || [];
  var l = (a.data || []).map(function (x) {
    return '<div class="ligne"><div class="qui"><b>' + E(x.nom) + '</b><span>Encaissé ' + euros(x.encaisse_eur) + ' · Skolantreuz ' + euros(x.part_plateforme_eur) +
      ' · dû ' + euros(x.du_eur) + ' · viré ' + euros(x.deja_reverse_eur) + '</span></div>' +
      '<div class="actions">' + (x.reste_eur > 0 ? '<span class="etat">Reste ' + euros(x.reste_eur) + '</span>' : '') +
      (x.reste_eur > 0 ? '<button class="bouton petit" onclick="formVirement(this,\'' + x.vendeur_id + '\',' + x.reste_eur + ')">Virement fait</button>' : '') + '</div></div>';
  });
  $('listeReverse').innerHTML = l.join('') +
    (REV.mensuel.length ? '<p><button class="bouton petit" onclick="exporterCsv()">Exporter en CSV</button></p>' : '');
}
function formVirement(bouton, id, reste) {
  var zone = bouton.parentNode, memoire = zone.innerHTML;
  zone.innerHTML = '<input type="text" inputmode="numeric" id="vMontant" value="' + reste + '" aria-label="Montant viré, en euros" style="width:90px"> ' +
    '<input type="text" id="vRef" placeholder="Référence" aria-label="Référence du virement" style="width:180px">';
  var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'bouton petit'; ok.textContent = 'Enregistrer';
  var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Annuler';
  ok.onclick = function () {
    var mt = parseInt($('vMontant').value, 10);
    if (!(mt > 0) || mt > reste) { dire('msgReverse', 'Montant entre 1 € et ' + euros(reste) + '.'); return; }
    enregistrerVirement(id, mt, $('vRef').value.trim());
  };
  non.onclick = function () { zone.innerHTML = memoire; };
  zone.appendChild(ok); zone.appendChild(non); $('vMontant').focus();
}
async function enregistrerVirement(id, montant, ref) {
  dire('msgReverse', '');
  var r = await sb.from('vsf_reversements').insert({ vendeur_id: id, montant_eur: montant, reference: ref || null, cree_par: moi.id });
  if (r.error) { console.error(r.error); return dire('msgReverse', messageErreur(r.error)); }
  chargerReversements();
}
function exporterCsv() {
  var lignes = [['Ambassadeur métier', 'Mois', 'Ventes', 'Encaissé (€)', 'Part de Skolantreuz (€)', 'À reverser (€)']];
  REV.mensuel.forEach(function (x) { lignes.push([x.nom, x.mois, x.ventes, x.encaisse_eur, x.part_plateforme_eur, x.du_eur]); });
  var csv = '\ufeff' + lignes.map(function (l) { return l.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'etat-de-reversement.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* Confirmation visible, sans fenêtre : la ligne propose « Oui » ou « Non ». Rien ne part tant que l'on n'a pas répondu. */
function confirmer(bouton, texte, action) {
  var zone = bouton.parentNode, memoire = zone.innerHTML;
  zone.innerHTML = '<span class="etat fort">' + E(texte) + '</span>';
  var oui = document.createElement('button'); oui.type = 'button'; oui.className = 'bouton petit'; oui.textContent = 'Oui';
  var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Non';
  oui.onclick = function () { zone.innerHTML = '<span class="etat">En cours…</span>'; action(); };
  non.onclick = function () { zone.innerHTML = memoire; };
  zone.appendChild(oui); zone.appendChild(non); oui.focus();
}

demarrer();
</script>
<script src="vsf-icones.js"></script><script src="vsf-pop.js"></script><script src="vsf-logo.js"></script></body>
</html>
