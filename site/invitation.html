<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Invitation — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<style>
  .wrap.petit{max-width:620px}
  .nom-inv{font-weight:900}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<link rel="stylesheet" href="vsf-largeur.css"><link rel="stylesheet" href="vsf-icones.css"><link rel="stylesheet" href="vsf-epure.css"><link rel="stylesheet" href="vsf-logo.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="vsf-menu.css">
</head>
<body>
<script src="vsf-menu.js"></script>
<main class="wrap petit" id="app"><p class="legende">Chargement…</p></main>

<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb, J = new URLSearchParams(location.search).get('j') || '';
var LIBELLE = { entreprise: 'entreprise', personne: 'compte personnel', collectif: 'collectif' };

function ecran(etiquette, titre, html) { $('app').innerHTML = '<p class="etiquette">' + E(etiquette) + '</p><h1>' + titre + '</h1>' + (html || ''); }
function raison(r) {
  return ({ annulee: 'Cette invitation a été annulée.', expiree: 'Cette invitation a expiré. Demandez-en une nouvelle à contact@vraisavoirfaire.fr.', deja_acceptee: 'Cette invitation a déjà été utilisée. Connectez-vous avec votre adresse e-mail.' })[r] || 'Ce lien n’est pas valable. Vérifiez-le ou demandez-en un nouveau à contact@vraisavoirfaire.fr.';
}
async function demarrer() {
  if (!J) return ecran('Invitation', 'Lien incomplet.', '<p class="legende">' + raison('inconnue') + '</p><a class="bouton" data-texte href="./">Retour à l’accueil</a>');
  var a = await sb.rpc('vsf_invitation_apercu', { p_jeton: J });
  var d = a.data;
  if (a.error || !d) return ecran('Invitation', 'Pas disponible.', '<p class="legende">Réessayez dans un instant.</p>');
  if (!d.valide) return ecran('Invitation', 'Invitation non valable.', '<p class="legende">' + E(raison(d.raison)) + '</p>' + (d.raison === 'deja_acceptee' ? '<a class="bouton" data-texte href="connexion.html?mode=connexion">Me connecter</a>' : '<a class="bouton discret" data-texte href="./">Retour à l’accueil</a>'));
  var s = await sb.auth.getSession();
  if (!s.data.session) {
    var suite = location.href;
    return ecran('Vous êtes invité·e', 'Créez votre ' + E(LIBELLE[d.type] || 'compte') + '.',
      '<p class="legende">VraiSavoirFaire vous invite à créer le compte de <span class="nom-inv">' + E(d.nom) + '</span>. Une adresse e-mail suffit : vous recevez un code pour la confirmer, sans mot de passe à retenir.</p>' +
      '<p class="legende">Utilisez l’adresse <b>' + E(d.email) + '</b> : l’invitation lui est réservée.</p>' +
      '<a class="bouton" data-texte href="connexion.html?mode=creation&mail=' + encodeURIComponent(d.email) + '&suite=' + encodeURIComponent(suite) + '">Créer mon compte</a><br>' +
      '<a class="bouton discret" data-texte href="connexion.html?mode=connexion&mail=' + encodeURIComponent(d.email) + '&suite=' + encodeURIComponent(suite) + '">J’ai déjà un compte</a>');
  }
  var r = await sb.rpc('vsf_invitation_accepter', { p_jeton: J });
  if (r.error || !r.data) {
    var m = String((r.error && r.error.message) || '');
    return ecran('Invitation', 'Impossible pour le moment.', '<p class="legende">' + E(/autre adresse/i.test(m) ? 'Vous êtes connecté·e avec une autre adresse que celle invitée (' + d.email + '). Déconnectez-vous puis recommencez avec la bonne adresse.' : (m.length < 200 ? m : 'Réessayez dans un instant.')) + '</p>' +
      '<button class="bouton" data-texte id="bSortir" type="button">Me déconnecter</button>');
  }
  var t = r.data.type;
  if (t === 'entreprise') return ecran('Compte créé', 'Bienvenue.', '<p class="legende">Votre entreprise <span class="nom-inv">' + E(r.data.nom) + '</span> est créée et vous en êtes le dirigeant ou la dirigeante. Vous pouvez commencer le diagnostic.</p><a class="bouton" data-texte href="diagnostic-entreprise.html">Commencer le diagnostic</a>');
  if (t === 'collectif') return ecran('Compte créé', 'Bienvenue.', '<p class="legende">Votre compte est créé. Nous rattachons <span class="nom-inv">' + E(r.data.nom) + '</span> à votre compte et nous vous prévenons dès que c’est fait.</p><a class="bouton discret" data-texte href="./">Retour à l’accueil</a>');
  return ecran('Compte créé', 'Bienvenue.', '<p class="legende">Votre compte est prêt. Vous pouvez découvrir L’Éclaireur ou ouvrir votre compte.</p><a class="bouton" data-texte href="eclaireur.html">Ouvrir L’Éclaireur</a><br><a class="bouton discret" data-texte href="connexion.html">Mon compte</a>');
}
document.addEventListener('click', async function (e) { if (e.target.closest('#bSortir')) { await sb.auth.signOut(); location.reload(); } });
demarrer();
</script>
<script src="vsf-icones.js"></script><script src="vsf-pop.js"></script><script src="vsf-logo.js"></script><script src="vsf-session.js"></script>
</body>
</html>
