<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Double authentification — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<style>
  .wrap.large{max-width:560px}
  .qr{display:block;width:200px;height:200px;margin:18px 0;image-rendering:crisp-edges}
  .secret{font:800 15px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.06em;word-break:break-all;margin:6px 0 18px;user-select:all}
  .code{font:900 34px Inter,sans-serif;letter-spacing:.3em;width:7.2em;max-width:100%;padding:8px 0;border:0;border-bottom:2px solid #111;background:transparent;color:#111}
  .code:focus{outline:none}
  .etape{margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cap)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<link rel="stylesheet" href="vsf-largeur.css"><link rel="stylesheet" href="vsf-icones.css"><link rel="stylesheet" href="vsf-epure.css"><link rel="stylesheet" href="vsf-logo.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="vsf-menu.css">
</head>
<body>
<script src="vsf-menu.js"></script>
<main class="wrap large" id="app"><p class="legende">Chargement…</p></main>

<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb;
var P = new URLSearchParams(location.search);
/* la page où l'on retourne une fois la double authentification faite : seulement une page de ce site */
var SUITE = (function () { var s = P.get('suite') || 'admin.html'; return /^[a-z0-9._-]+(\?[^#]*)?$/i.test(s) ? s : 'admin.html'; })();

function ecran(html) { $('app').innerHTML = html; var c = $('code'); if (c) c.focus(); }
function suite() { location.replace(SUITE); }

async function demarrer() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.replace('connexion.html?suite=' + encodeURIComponent(location.href)); return; }
  var et = await sb.rpc('vsf_a2f_etat');
  if (et.error || !et.data) { return ecran('<h1>Pas encore disponible.</h1><p class="legende">La migration 46 n’est pas installée.</p><a class="bouton" href="./">Retour</a>'); }
  if (!et.data.super_admin) { return ecran('<h1>Accès réservé.</h1><a class="bouton" href="./">Retour</a>'); }
  var aal = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.data && aal.data.currentLevel === 'aal2') return suite();
  var lf = await sb.auth.mfa.listFactors();
  var verifies = ((lf.data && lf.data.totp) || []).filter(function (f) { return f.status === 'verified'; });
  if (verifies.length) return defi(verifies[0].id);
  /* aucun facteur : on en crée un (les facteurs commencés mais jamais vérifiés sont retirés pour repartir proprement) */
  var anciens = ((lf.data && lf.data.all) || []).filter(function (f) { return f.status === 'unverified'; });
  for (var i = 0; i < anciens.length; i++) { await sb.auth.mfa.unenroll({ factorId: anciens[i].id }); }
  var en = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Admin VSF ' + new Date().toISOString().slice(0, 10) });
  if (en.error || !en.data) { return ecran('<h1>Impossible pour le moment.</h1><p class="legende">La double authentification n’est pas activée dans Supabase (Authentication, Multi-Factor).</p><a class="bouton" href="./">Retour</a>'); }
  inscrire(en.data);
}
function inscrire(f) {
  ecran(
    '<p class="etape">Double authentification · une seule fois</p><h1>Active ton application d’authentification.</h1>' +
    '<p>Scanne ce code avec une application d’authentification (Google Authenticator, Authy, 1Password…).</p>' +
    '<img class="qr" alt="Code à scanner" src="' + E(f.totp.qr_code) + '">' +
    '<p class="legende">Ou saisis cette clé à la main :</p><div class="secret">' + E(f.totp.secret) + '</div>' +
    '<p>Puis écris le code à 6 chiffres affiché par l’application.</p>' +
    '<input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Code à 6 chiffres">' +
    '<p class="message" id="msg" role="alert"></p><button type="button" class="bouton" id="ok" data-texte>Activer</button>');
  $('ok').onclick = function () { verifier(f.id); };
  $('code').onkeydown = function (e) { if (e.key === 'Enter') verifier(f.id); };
}
function defi(id) {
  ecran(
    '<p class="etape">Double authentification</p><h1>Code à 6 chiffres.</h1>' +
    '<p>Ouvre ton application d’authentification et écris le code de VraiSavoirFaire.</p>' +
    '<input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Code à 6 chiffres">' +
    '<p class="message" id="msg" role="alert"></p><button type="button" class="bouton" id="ok" data-texte>Continuer</button>');
  $('ok').onclick = function () { verifier(id); };
  $('code').onkeydown = function (e) { if (e.key === 'Enter') verifier(id); };
}
async function verifier(id) {
  var code = ($('code').value || '').replace(/\s/g, '');
  if (!/^\d{6}$/.test(code)) { $('msg').textContent = 'Le code a 6 chiffres.'; return; }
  $('ok').disabled = true; $('msg').textContent = '';
  var r = await sb.auth.mfa.challengeAndVerify({ factorId: id, code: code });
  $('ok').disabled = false;
  if (r.error) { $('msg').textContent = 'Code refusé. Vérifie l’heure de ton téléphone et réessaie.'; $('code').value = ''; $('code').focus(); return; }
  suite();
}
demarrer();
</script>
<script src="vsf-icones.js"></script><script src="vsf-pop.js"></script><script src="vsf-logo.js"></script><script src="vsf-session.js"></script>
</body>
</html>
