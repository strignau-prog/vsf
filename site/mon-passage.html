    <p>Un métier qui a du sens, c'est un métier qui rejoint ce que vous avez déjà vécu et ce que vous voulez vivre demain — jamais un score, jamais une promesse.</p>

<script>
const ROME_SYNC_URL = 'https://uuuigousvpijskbdhcal.supabase.co/functions/v1/rome-sync';
const KEY = 'sb_publishable__YuNj5XCo5YF8lwhwTu5OQ_RDM1Eesp';
const MAURICE_REST = 'https://uuuigousvpijskbdhcal.supabase.co/rest/v1';
const HEADERS = { apikey:KEY, Authorization:'Bearer '+KEY };
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normaliser(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
async function rechercherMetiers(v){
  if(v.trim().length < 2) return [];
  const res = await fetch(ROME_SYNC_URL, { method:'POST', headers:{ 'Content-Type':'application/json', ...HEADERS }, body: JSON.stringify({ recherche: v }) });
  if(!res.ok) throw new Error('recherche indisponible ('+res.status+')');
  const data = await res.json();
  return data.resultats || [];
}
async function fetchCompetences(codeRome){
  const res = await fetch(`${MAURICE_REST}/rome_competences_cache?code_rome=eq.${codeRome}&select=id,type,libelle,code_competence`, { headers: HEADERS });
  if(!res.ok) throw new Error('compétences indisponibles ('+res.status+')');
  return res.json();
}

// --- statut métiers d'art ---
const STATUT_LABELS = { repertorie:"Répertorié métiers d'art", proche:"Proche d'un métier d'art", a_verifier:"Correspondance à vérifier", non_repertorie:"Hors liste métiers d'art" };
const OVERRIDES = { 'peintre en lettres':'a_verifier' };
const MOTS_TROP_GENERIQUES = new Set(['peinture','peintre','metier','ouvrage','fabricant','decorateur','artisan','atelier','graphique','restaurateur']);
function calculerStatutMetierArt(libelle, referentiel){
  // ROME nomme souvent un métier "Forme masculine / Forme féminine de X" (ex. "Tailleur /
  // Tailleuse de pierre") alors que le référentiel métiers d'art liste la forme plane
  // ("Tailleur de pierre") — sans ce nettoyage, une correspondance exacte réelle serait
  // manquée à cause de la seule notation, pas d'une vraie différence de métier.
  const sansVariante = String(libelle).replace(/\s*\/\s*\S+/, '');
  const cle = normaliser(sansVariante);
  if(OVERRIDES[cle]) return { statut:OVERRIDES[cle], domaine:null, correspondance:null };
  for(const dom of referentiel.domaines) for(const m of dom.metiers) if(normaliser(m)===cle) return { statut:'repertorie', domaine:dom.nom, correspondance:m };
  const sing = m => m.endsWith('s') && m.length>4 ? m.slice(0,-1) : m;
  const motsApp = cle.split(/\s+/).filter(m=>m.length>=4).map(sing);
  let candidatGenerique = null;
  for(const dom of referentiel.domaines){
    for(const m of dom.metiers){
      const motsM = normaliser(m).split(/\s+/).filter(x=>x.length>=4).map(sing);
      const communs = motsApp.filter(x=>motsM.includes(x));
      if(!communs.length) continue;
      const specifiques = communs.filter(x=>!MOTS_TROP_GENERIQUES.has(x));
      if(specifiques.length) return { statut:'proche', domaine:dom.nom, correspondance:m };
      if(!candidatGenerique) candidatGenerique = { domaine:dom.nom, correspondance:m };
    }
  }
  if(candidatGenerique) return { statut:'a_verifier', domaine:candidatGenerique.domaine, correspondance:candidatGenerique.correspondance };
  return { statut:'non_repertorie', domaine:null, correspondance:null };
}

const QUARTIERS = [
  { cle:'realiser', titre:"Ce que l'on réalise", couleur:'#111111', regex:/réalis|créat|créer|produi|conçoi|concevoi|fabriqu|construi|élabor/i },
  { cle:'travailler', titre:"Ce que l'on travaille", couleur:'#111111', regex:/matière|support|outil|matériau|équipement|machine|logiciel|produit/i },
  { cle:'attention', titre:"Ce qui demande de l'attention", couleur:'#111111', regex:/sécurité|qualité|précision|risque|contrôl|vérifi|conform|hygiène/i },
  { cle:'apprendre', titre:"Ce que l'on apprend dans le temps", couleur:'#111111', regex:/perfectionn|évolu|actualis|formation|apprentiss|progress|veille/i },
  { cle:'verifier', titre:"Ce qui se vérifie dans le réel", couleur:'#111111', regex:/condition|environnement|rythme|terrain|chantier|atelier|client/i },
];
function classerRoue(comp){
  const buckets = { realiser:[], travailler:[], attention:[], apprendre:[], verifier:[] };
  for(const c of comp){
    const q = QUARTIERS.find(q=>q.regex.test(c.libelle));
    if(q) buckets[q.cle].push(c.libelle);
  }
  return buckets;
}
// Le classement par mots-clés génériques (classerRoue) est calibré sur le vocabulaire ROME —
// il échoue souvent sur les phrases du référentiel métiers d'art (vocabulaire différent) et
// laisse la roue à 0 partout. Quand on a la fiche détaillée, on sait déjà quelle colonne
// correspond à quel quartier : on range directement, sans deviner par mot-clé.
function classerRoueDepuisFiche(fiche){
  const buckets = { realiser:[], travailler:[], attention:[], apprendre:[], verifier:[] };
  const ajouter = (cle, ...champs) => { for(const c of champs){ const v = fiche[c]; if(v) buckets[cle].push(v); } };
  ajouter('realiser', 'actRealiser','actConcevoir','actAssembler','actRestaurer','sfVerbes');
  ajouter('travailler', 'matieres','outils','produits','techniques');
  ajouter('attention', 'ctxRisques','sfPrecision','saConservation');
  ajouter('apprendre', 'transObservation','transRepetition','transSeuils','transVocabulaire','transConditions','evolNumerique','evolMateriaux');
  ajouter('verifier', 'ctxStructure','ctxCollectif','ctxCadences','ctxCommande','actGerer','actPresenter','actAnalyser','actPreparer');
  return buckets;
}
function renderRoue(nom, buckets, declares, code, ficheArt){
  const actif = etat.quartActif || 'realiser';
  const R = 42; // rayon en % du conteneur
  const positions = QUARTIERS.map((q,i)=>{
    const angle = -90 + i*72;
    const rad = angle*Math.PI/180;
    return { left: 50+R*Math.cos(rad), top: 50+R*Math.sin(rad) };
  });
  const q = QUARTIERS.find(x=>x.cle===actif);
  const items = buckets[actif]||[];
  const declNorm = declares.map(d=>normaliser(d.libelle));
  const sourceLabel = code ? 'ROME' : (ficheArt ? 'référentiel métiers d\'art' : 'INMA');
  const sourceLabelPhrase = code ? 'ROME' : (ficheArt ? 'du référentiel métiers d\'art' : 'INMA');
  return `<div class="roueSection">
    <h3>Le métier cible, en cinq briques</h3>
    <div class="sub">Un classement approximatif par mots-clés sur les vraies données ${sourceLabelPhrase} de « ${esc(nom)} », pas une vérité scientifique.</div>
    <div class="roueWrap">
      <div class="roueCentre">${esc(nom)}</div>
      ${QUARTIERS.map((qq,i)=>`<button type="button" class="quartBtn ${qq.cle===actif?'active':''}" data-quart="${qq.cle}" style="left:${positions[i].left}%;top:${positions[i].top}%;background:${qq.couleur}">${esc(qq.titre)}<span class="n">${(buckets[qq.cle]||[]).length}</span></button>`).join('')}
    </div>
    <div class="roueDetail">
      <h5>${esc(q.titre)}</h5>
      ${items.length ? `<ul>${items.slice(0,6).map(l=>`<li>${esc(l)}${declNorm.some(n=>normaliser(l).includes(n))?' <span class="st st-doc">déjà déclaré</span>':` <span class="st st-hyp">documenté ${sourceLabel}</span>`}</li>`).join('')}</ul>` : `<p style="font-size:13.5px;color:var(--muted)">Non disponible dans les données actuellement en cache pour ce métier.</p>`}
      <div class="note">Ce que les sources décrivent · ce que vous avez déclaré · ce qu'il faudra vérifier avec un professionnel.</div>
    </div>
  </div>`;
}

let fichesMetiersArt = null;
let fichesMetiersArtIndex = null;
async function chargerFichesDetaillees(){
  if(fichesMetiersArt) return fichesMetiersArt;
  try{
    fichesMetiersArt = await (await fetch('data/fiches-metiers-art-detaillees.json')).json();

  return fichesMetiersArt;
}

function premierCodeRome(fiche){
  if(!fiche || !fiche.codesRome) return null;
  const m = fiche.codesRome.match(/[A-Z]\d{4}/);
  return m ? m[0] : null;
}

// Fusion volontairement profonde d'un niveau (pas Object.assign, qui écraserait entièrement
// un sous-objet comme axe1 s'il existe déjà en localStorage sans les derniers champs ajoutés —
// ça a réellement fait planter le premier rendu la première fois qu'un champ a été ajouté).
function fusionner(defaut, sauve){
  const r = { ...defaut };
  for(const cle in sauve){
    r[cle] = (sauve[cle] && typeof sauve[cle]==='object' && !Array.isArray(sauve[cle]) && defaut[cle] && typeof defaut[cle]==='object')
      ? { ...defaut[cle], ...sauve[cle] } : sauve[cle];
  }
  return r;
}

// Les fiches métiers d'art (INMA) sont rédigées en prose ("Le X réalise...", pas des listes
// ROME à l'infinitif) : on ne peut pas réutiliser extraireVerbe() telle quelle. On reconnaît
// ici les verbes conjugués les plus courants du livret et on affiche leur infinitif.
const LEMMES_VERBES_INMA = { 'réalise':'Réaliser','restaure':'Restaurer','utilise':'Utiliser','travaille':'Travailler','fabrique':'Fabriquer','assemble':'Assembler','façonne':'Façonner','crée':'Créer','taille':'Tailler','sculpte':'Sculpter','tresse':'Tresser','tisse':'Tisser','peint':'Peindre','dessine':'Dessiner','grave':'Graver','polit':'Polir','coupe':'Couper','colle':'Coller','chauffe':'Chauffer','moule':'Mouler','coule':'Couler','découpe':'Découper','choisit':'Choisir','maîtrise':'Maîtriser','transforme':'Transformer','décore':'Décorer','applique':'Appliquer','construit':'Construire','prépare':'Préparer','orne':'Orner','monte':'Monter','pose':'Poser','conçoit':'Concevoir','produit':'Produire','fixe':'Fixer','installe':'Installer','entretient':'Entretenir','répare':'Réparer','imprime':'Imprimer','dore':'Dorer','sertit':'Sertir','tourne':'Tourner','perce':'Percer','ajuste':'Ajuster','mélange':'Mélanger','assure':'Assurer','forge':'Forger','soude':'Souder','plie':'Plier','recouvre':'Recouvrir','habille':'Habiller','tend':'Tendre','fond':'Fondre','sculptent':'Sculpter' };
function extraireVerbesDeTexte(texte){
  const trouves = []; const vus = new Set();
  const mots = String(texte).toLowerCase().match(/[a-zàâäéèêëïîôöùûüçœ]+/g) || [];
  for(const m of mots){
    const inf = LEMMES_VERBES_INMA[m];
    if(inf && !vus.has(inf)){ vus.add(inf); trouves.push({ verbe:inf, origine:null }); }
    if(trouves.length>=12) break;
  }
  return trouves;
}

async function chargerVerbesCible(){

    // La fiche métier d'art fournit des verbes déjà à l'infinitif (ex. "Fendre, tailler,
    // percer, poser") — bien plus fiable que d'en déduire depuis la prose du livret INMA.
    const verbes = fiche && fiche.sfVerbes
      ? fiche.sfVerbes.split(',').map(v=>v.trim()).filter(Boolean).slice(0,12).map(v=>({ verbe: v.charAt(0).toUpperCase()+v.slice(1), origine:null }))
      : (etat.voeu.descriptionInma ? extraireVerbesDeTexte(etat.voeu.descriptionInma) : []);
    const texteMatieres = fiche ? [fiche.matieres, fiche.produits, fiche.outils].filter(Boolean).join(' ') : (etat.voeu.descriptionInma||'');

  }
  try{
    const comp = await fetchCompetences(etat.voeu.codeRome);
    const sf = comp.filter(c=>c.type==='savoir-faire');
    const vus = new Set(); const verbes = [];
    for(const c of sf){
      const v = extraireVerbe(c.libelle);
      if(v && !vus.has(v.toLowerCase())){ vus.add(v.toLowerCase()); verbes.push({ verbe:v, origine:c.libelle }); }
      if(verbes.length>=12) break;
    }
    etat.axe1.adaptatif = verbes.length>0;
    etat.axe1.verbesDisponibles = verbes.length ? verbes : AXE1_GENERIQUES.map(v=>({verbe:v,origine:null}));
    etat.axe1.matieresCible = extraireMatieresCible(comp);
    etat.axe1.cibleChargee = cleCibleAspirations(etat.voeu);
  }catch(e){ etat.axe1.adaptatif = false; etat.axe1.verbesDisponibles = AXE1_GENERIQUES.map(v=>({verbe:v,origine:null})); etat.axe1.matieresCible = []; etat.axe1.cibleChargee = null; }
  sauver();
}

// Cherche la meilleure correspondance ROME réelle pour un nom de métier d'art. Ne renvoie
// JAMAIS le premier résultat par défaut : sans mot significatif commun avec la requête, un
// métier ROME sans rapport (ex. "Ouvrier des voieries urbaines" pour un métier de pavage)
// serait sinon assigné silencieusement — bug réel signalé et corrigé ici.
function meilleureCorrespondanceMetierArt(nom, res){
  const cle = normaliser(nom);
  const sansVariante = s => normaliser(String(s).replace(/\s*\/\s*\S+/, ''));
  const exact = res.find(r => normaliser(r.libelle)===cle || normaliser(r.libelleMetier)===cle || sansVariante(r.libelleMetier)===cle);
  if(exact) return exact;
  const motsCle = cle.split(/\s+/).filter(m=>m.length>=4);
  if(!motsCle.length) return null;
  let meilleur = null, meilleurScore = 0;
  for(const r of res){
    const motsR = normaliser(r.libelleMetier).split(/\s+/).filter(m=>m.length>=4);
    const communs = motsCle.filter(m=>motsR.includes(m)).length;
    if(communs > meilleurScore){ meilleurScore = communs; meilleur = r; }
  }
  return meilleurScore>0 ? meilleur : null;
}
// Quand aucune fiche ROME ne correspond à un métier d'art (écart de vocabulaire entre les

// sèches" chez France Travail), on ne bloque plus la personne : on poursuit avec la définition
// du métier telle qu'écrite dans le livret INMA lui-même — jamais une fiche inventée.

    // La table de correspondance ROME/RNCP a été recherchée individuellement, métier par métier
    // (pas un mot-clé automatique) : on la préfère à toute recherche approximative quand elle
    // conclut positivement ("Direct" ou "Partiel" avec un vrai code).
    const codeCure = ficheArt && (ficheArt.niveauCorrespondanceRome==='Direct' || ficheArt.niveauCorrespondanceRome==='Partiel') ? premierCodeRome(ficheArt) : null;
    if(codeCure){
      etat.voeuRequeteOriginale = nom;

      sauver(); render();

    }
    const res = await rechercherMetiers(nom);
    const trouve = res.length ? meilleureCorrespondanceMetierArt(nom, res) : null;
    if(!trouve){
      if(!descriptionInma && !ficheArt){ etat.voeuArtErreur = `« ${nom} » : aucune fiche ROME ni description disponible pour ce métier — réessayez ou choisissez un autre métier de la liste.`; render(); return; }
      etat.voeuRequeteOriginale = nom;
      etat.voeu = { libelleMetier: nom, libelle: nom, codeRome: null, descriptionInma, ficheArt };
    } else {
      etat.voeuRequeteOriginale = nom;
      etat.voeu = { ...trouve, ficheArt };
    }
    etat.axe1.verbesChoisis = []; etat.axe1.verbesDisponibles = null; etat.axe1.adaptatif = false;
    sauver(); render();
    await chargerVerbesCible(); render();
  }catch(e){ etat.voeuArtErreur = 'Recherche indisponible (réseau ou limite temporaire) — réessayez dans un instant.'; render(); }
}

/* ============================ ÉTAPE 3 — 3 PISTES ============================ */
function motsSignificatifs(libelles){
  const compte = {};
  for(const l of libelles){
    for(const m of normaliser(l).split(/[^a-z0-9]+/)){
      if(m.length<5 || MOTS_VIDES.has(m)) continue;
      compte[m] = (compte[m]||0)+1;
    }
  }
  return Object.entries(compte).sort((a,b)=>b[1]-a[1]).map(([m])=>m);
}
function attendre(ms){ return new Promise(r=>setTimeout(r,ms)); }
function choisirCandidat(res, exclu, referentiel){
  const dispo = res.filter(r=>!exclu.has(r.codeRome));
  if(!dispo.length) return null;
  if(etat.metierArtMode && referentiel){
    const art = dispo.find(r=>calculerStatutMetierArt(r.libelleMetier, referentiel).statut==='repertorie');
    if(art) return { candidat:art, metierArtTrouve:true };
  }
  return { candidat:dispo[0], metierArtTrouve:false };
}
async function calculerPistes(){
  const referentiel = etat.metierArtMode ? await chargerReferentiel() : null;
  const declares = etat.experiences.flatMap(e=>[...e.comp.savoir,...e.comp['savoir-faire'],...e.comp['savoir-etre']].filter(x=>x.coche).map(x=>x.libelle));
  const codesExistants = new Set(etat.experiences.map(e=>e.choix.codeRome));
  let procheExistant = null;
  let erreurRecherche = false;
  const motsExp = motsSignificatifs(declares.length?declares:etat.experiences.map(e=>e.choix.libelleMetier));
  for(const mot of motsExp.slice(0,3)){
    try{
      const res = await rechercherMetiers(mot);
      const choix = choisirCandidat(res, new Set([...codesExistants, etat.voeu.codeRome]), referentiel);
      if(choix){ procheExistant = { ...choix.candidat, motCle:mot, metierArtTrouve:choix.metierArtTrouve }; break; }
    }catch(e){ erreurRecherche = true; }
    await attendre(350);
  }
  let procheVoeu = null;
  await attendre(350);
  try{
    const res = await rechercherMetiers(etat.voeuRequeteOriginale || etat.voeu.libelleMetier);
    const exclu = new Set([etat.voeu.codeRome, ...(procheExistant?[procheExistant.codeRome]:[])]);
    const choix = choisirCandidat(res, exclu, referentiel);
    if(choix) procheVoeu = { ...choix.candidat, metierArtTrouve:choix.metierArtTrouve };
  }catch(e){ erreurRecherche = true; }
  etat.pistes = { voeu: etat.voeu, procheExistant, procheVoeu, erreurRecherche };
  sauver();
}

/* ============================ ÉTAPE 4 — MON PASSAGE ============================ */
function motsSignificatifsDe(texte){
  return normaliser(texte).split(/[^a-z0-9]+/).filter(m=>m.length>=5 && !MOTS_VIDES.has(m));
}
// Une correspondance exacte (même code, ou libellé rigoureusement identique) reste le cas
// normal quand les deux côtés viennent de ROME. Mais dès qu'une des deux sources est le
// référentiel métiers d'art (vocabulaire différent de ROME), une correspondance exacte est
// presque toujours impossible même pour des métiers très proches (ex. Couvreur → Chaumier,
// tous deux couverture) — sans repli, "Éléments communs" et la roue tombent à zéro alors que
// le rapprochement existe bel et bien. On ajoute donc un rapprochement par mots significatifs
// partagés (seuil : 2 mots d'au moins 5 lettres), explicitement marqué "à vérifier" et non
// "documenté", pour ne jamais faire passer une hypothèse pour une certitude.
function comparer(declares, comp){
  const savoirFaireCible = comp.filter(c=>c.type==='savoir-faire');
  const cibleTouchee = new Set();
  const communs = [];
  const dejaVu = new Set();
  for(const d of declares){
    const normD = normaliser(d.libelle);
    if(dejaVu.has(normD)) continue;
    let idxExact = comp.findIndex(c => (d.code && c.code_competence && d.code===c.code_competence) || normaliser(c.libelle)===normD);
    if(idxExact>=0){
      communs.push({ libelle:d.libelle, exact:true }); dejaVu.add(normD);
      const idxSf = savoirFaireCible.indexOf(comp[idxExact]); if(idxSf>=0) cibleTouchee.add(idxSf);
      continue;
    }
    const motsD = motsSignificatifsDe(d.libelle);
    if(!motsD.length) continue;
    let meilleurIdx = -1, meilleurScore = 0;
    comp.forEach((c,i)=>{
      const score = motsSignificatifsDe(c.libelle).filter(m=>motsD.includes(m)).length;
      if(score > meilleurScore){ meilleurScore = score; meilleurIdx = i; }
    });
    if(meilleurScore>=2){
      communs.push({ libelle:d.libelle, exact:false }); dejaVu.add(normD);
      const idxSf = savoirFaireCible.indexOf(comp[meilleurIdx]); if(idxSf>=0) cibleTouchee.add(idxSf);
    }
  }
  const aApprendreTous = savoirFaireCible.filter((c,i)=>!cibleTouchee.has(i)).map(c=>c.libelle);
  const physiques = ['Effort physique','Bruit / poussière','Hauteur','Port de charges'];
  const aVerifierConditions = etat.axe3.conditions.filter(c=>physiques.includes(c));
  // Compteurs "X sur Y" volontairement locaux à chaque rubrique (jamais un score ou un
  // pourcentage global de correspondance au métier — voir cadrage) : juste rendre visible
  // combien d'éléments sur le total déclaré/décrit sont concernés.
  return { communs, aApprendre: aApprendreTous.slice(0,6), aApprendreTotal: aApprendreTous.length, savoirFaireCibleTotal: savoirFaireCible.length, aVerifierConditions };
}

/* ============================ ÉTAPE 5 — MON PASSAGE ============================ */
// À défaut de fiche ROME, la fiche métier d'art détaillée (activités, savoir-faire, savoirs)
// fournit une bien meilleure base de comparaison qu'un simple découpage de phrases.
function comparerDepuisFicheArt(fiche){
  const champs = [
    ['actAnalyser','savoir-faire'],['actConcevoir','savoir-faire'],['actPreparer','savoir-faire'],
    ['actRealiser','savoir-faire'],['actAssembler','savoir-faire'],['actRestaurer','savoir-faire'],
    ['actGerer','savoir-faire'],['actPresenter','savoir-faire'],
    ['sfVerbes','savoir-faire'],['sfPrecision','savoir-faire'],['sfTacite','savoir-faire'],
    ['saMatieres','savoir'],['saHistoire','savoir'],['saDessin','savoir'],['saProcedes','savoir'],['saConservation','savoir'],
  ];
  const items = [];
  for(const [cle,type] of champs){ const v = fiche[cle]; if(v) items.push({ type, libelle:v, code_competence:null }); }
  return items;
}
async function renderEtapePassage(){
  const cible = etat.pisteChoisie===1?etat.pistes.voeu:etat.pisteChoisie===2?etat.pistes.procheExistant:etat.pistes.procheVoeu;
  if(!cible) return '<div class="empty">Choisissez d\'abord une piste à l\'étape précédente.</div>';
  const code = cible.codeRome, nom = cible.libelleMetier;
  const ficheArt = cible.ficheArt || null;
  const [compRome, referentiel] = await Promise.all([ code ? fetchCompetences(code) : Promise.resolve([]), chargerReferentiel() ]);
  // Sans fiche ROME, on utilise en priorité la fiche métier d'art détaillée (activités,
  // savoir-faire, savoirs réellement distingués) ; à défaut seulement, un découpage de phrases
  // de la définition du livret INMA — jamais une vraie liste de compétences ROME. Le sourçage
  // réel reste visible dans "Sources et limites".
  const comp = code ? compRome : (ficheArt ? comparerDepuisFicheArt(ficheArt) : (cible.descriptionInma ? cible.descriptionInma.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>8).map(libelle=>({ type:'savoir-faire', libelle, code_competence:null })) : []));
  const statutArt = referentiel ? calculerStatutMetierArt(nom, referentiel) : null;
  const declaresExperience = etat.experiences.flatMap(e=>[...e.comp.savoir,...e.comp['savoir-faire'],...e.comp['savoir-etre']].filter(x=>x.coche));
  const declaresDiplomes = etat.diplomes.filter(d=>d.coche).map(d=>({ libelle:d.libelle, code:null }));
  const declaresVerbes = etat.axe1.verbesChoisis.map(v=>{
    const origine = (etat.axe1.verbesDisponibles||[]).find(x=>x.verbe===v);
    return { libelle: origine && origine.origine ? origine.origine : v, code:null };
  });
  // Le sensoriel (axe1) n'entre pas dans la comparaison : c'est un signal de "pourquoi ça vous
  // attire", pas une déclaration de "ce que vous savez faire" — la comparaison directionnelle
  // reste réservée à l'expérience réelle, aux diplômes et aux verbes d'activité choisis.
  const declares = [...declaresExperience, ...declaresVerbes, ...declaresDiplomes];
  const cmp = comparer(declares, comp);
  const statutPiste = cmp.communs.length>=2 ? 'Piste proche à vérifier' : (cmp.communs.length===1 ? 'Piste à construire' : 'Piste de découverte');
  const phrase = cmp.communs.length
    ? `Vous pourriez explorer <b>${esc(nom)}</b> : vous avez déjà déclaré « ${esc(cmp.communs[0].libelle)} », un point commun ${cmp.communs[0].exact?'':'probable '}avec ce métier.`
    : `Vous pourriez explorer <b>${esc(nom)}</b> — aucune correspondance automatique évidente avec ce que vous avez coché, ce qui n'exclut rien : à vérifier avec un professionnel.`;
  const goulots = GOULOTS[code] || (ficheArt && ficheArt.sfTacite ? [`${ficheArt.sfTacite} — hypothèse sourcée du référentiel métiers d'art, à valider par un professionnel.`] : ["Aucune compétence-goulot rédigée pour ce métier à ce jour — à vérifier avec un professionnel avant de s'engager."]);
  const rythme = RYTHME[code] || null;
  const envTravail = ficheArt ? [ficheArt.ctxStructure, ficheArt.ctxCollectif, ficheArt.ctxCadences, ficheArt.ctxRisques, ficheArt.ctxCommande].filter(Boolean) : [];
  const depart = etat.experiences.length===1 ? etat.experiences[0].choix.libelleMetier : 'Votre expérience';
  const ctx = { code, nom, comp, cmp, statutArt, statutPiste, phrase, goulots, rythme, declares, ficheArt };

  return `
  <div style="font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);margin-bottom:8px">Votre passage vers ${esc(nom)}</div>
  ${statutArt ? `<span class="badge b-${statutArt.statut}">${STATUT_LABELS[statutArt.statut]}</span>` : ''}<span class="stPiste">${statutPiste}</span>

  <div class="passageGrid">
    <div class="passageCol">
      <div class="orbitWrap">
        <div class="orbitStage">
          <svg class="orbitPath" viewBox="0 0 1000 220" preserveAspectRatio="none"><path d="M80,120 C300,30 700,30 920,120" stroke="var(--line)" stroke-width="2" fill="none"/></svg>
          <div class="orbCenter dep" style="left:0">${esc(depart)}<span class="sub">Départ</span></div>
          <button class="orbStep" style="left:28%;top:108px;background:#fff">Déjà là<br><span style="font-weight:400">${cmp.communs.length||0}</span></button>
          <button class="orbStep" style="left:50%;top:58px;background:#fff">À apprendre<br><span style="font-weight:400">${cmp.aApprendre.length||0}</span></button>
          <button class="orbStep" style="left:72%;top:108px;background:#fff">À vérifier<br><span style="font-weight:400">${cmp.aVerifierConditions.length||0}</span></button>
          <div class="orbCenter cib" style="left:100%">${esc(nom)}<span class="sub">Cible</span></div>
        </div>
      </div>
      <div class="phraseCentrale">${phrase}</div>
    </div>
    <div class="passageCol">${renderCalques(ctx)}</div>
  </div>

  <div class="passageGrid">
    <div class="passageCol">
      <div class="zRow"><div class="k"><span class="kIcon kIcon-ok">✓</span>Éléments communs<span class="kCount">${cmp.communs.length} sur ${declares.length} déclarés</span></div><div>${cmp.communs.length?`<ul>${cmp.communs.map(c=>`<li>${esc(c.libelle)} ${c.exact?`<span class="st st-doc">déclaré + documenté ${code?'ROME':(ficheArt?'référentiel métiers d\'art':'INMA')}</span>`:`<span class="st st-verif">rapprochement probable, à vérifier</span>`}</li>`).join('')}</ul>`:'Aucun élément commun trouvé automatiquement.'}</div></div>
      <div class="zRow"><div class="k"><span class="kIcon kIcon-dev">↗</span>Apprentissages à développer<span class="kCount">${cmp.aApprendreTotal} sur ${cmp.savoirFaireCibleTotal} savoir-faire</span></div><div><ul>${cmp.aApprendre.map(c=>`<li>${esc(c)} <span class="st st-verif">à vérifier</span></li>`).join('')||'<li>Non disponible</li>'}</ul>${cmp.aApprendreTotal>cmp.aApprendre.length?`<div class="fixedNote">${cmp.aApprendreTotal-cmp.aApprendre.length} autre(s) non affiché(s) ici.</div>`:''}</div></div>
      <div class="zRow"><div class="k"><span class="kIcon kIcon-warn">⚠</span>Compétences-goulots</div><div><ul>${goulots.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div></div>
      ${ficheArt ? `<div class="zRow"><div class="k">Environnement de travail</div><div>${envTravail.length?`<ul>${envTravail.map(e=>`<li>${esc(e)} <span class="st st-hyp">référentiel métiers d'art</span></li>`).join('')}</ul>`:'Non renseigné pour ce métier.'}</div></div>` : ''}
      <div class="zRow"><div class="k">Diplômes</div><div>${declaresDiplomes.length?declaresDiplomes.map(d=>`${esc(d.libelle)} <span class="st st-doc">déclaré</span>`).join(', '):'Aucun diplôme déclaré coché à l\'étape Mon expérience.'}</div></div>
      <div class="zRow"><div class="k">Conditions à vérifier</div><div>${cmp.aVerifierConditions.length?cmp.aVerifierConditions.map(esc).join(', '):'Aucune contrainte physique particulière déclarée.'} <span class="st st-doc">déclaré</span></div></div>
      <div class="zRow"><div class="k">Sources et limites</div><div>${code ? `France Travail ROME 4.0 (${code}), ${comp.length} éléments en cache.` : (ficheArt ? `Pas de fiche ROME pour ce métier — ${comp.length} éléments issus de la fiche détaillée du référentiel métiers d'art (activités, savoir-faire, savoirs), pas une vraie liste de compétences ROME.` : `Pas de fiche ROME pour ce métier — ${comp.length} phrases extraites de la définition officielle de l'Institut des Métiers d'Art (INMA), pas une vraie liste de compétences ROME.`)} ${statutArt?'Référentiel métiers d\'art V2 (livret INMA officiel).':'Référentiel métiers d\'art non chargé.'}${ficheArt?` Correspondance ROME/RNCP et fiche détaillée : recherche individuelle par métier — ${esc(ficheArt.statut)}.`:''} Comparaison par rapprochement de codes/mots-clés, jamais un score global. <a href="https://benevolent-marigold-64a0a1.netlify.app/12mars-donnees-methode" target="_blank" rel="noopener">Comment cette lecture est-elle construite ?</a></div></div>
    </div>
    <div class="passageCol">${renderRoue(nom, (!code && ficheArt) ? classerRoueDepuisFiche(ficheArt) : classerRoue(comp), declares, code, ficheArt)}</div>
  </div>

  <div class="zRow" style="margin-top:26px;padding-top:22px;border-top:1px solid var(--line)"><div class="k">Repère de parcours</div><div class="repere">${rythme || "Nous pouvons décrire les apprentissages à prévoir, mais nous ne disposons pas encore de données assez solides pour proposer un ordre de grandeur utile."}<div class="fixedNote">Cette estimation est un repère de parcours, pas une promesse. Elle doit être confirmée par une mise en situation et un positionnement avec un professionnel.</div></div></div>

  <div class="toolbar"><button class="btn" id="btnPrecedent4">← Revoir mon objectif</button><button class="btn" id="btnRecommencer">Recommencer</button></div>
  `;
}

/* ============================ MOTEUR DE RENDU + ÉVÉNEMENTS ============================ */
let etapePrecedenteRendue = null;
async function render(){
  renderSteps();
  const app = document.getElementById('app');
  // Préserve le focus et la position du curseur : sans ça, retaper vite dans un champ de
  // recherche pendant qu'un render() (debounce) reconstruit le DOM fait perdre le focus et
  // "avale" les lettres tapées après coup — bug réel signalé, reproduit et corrigé ici.
  const actif = document.activeElement;
  const gardeFocus = actif && (actif.id==='expRecherche' || actif.id==='voeuRecherche' || actif.id==='voeuArtFiltre');
  const idFocus = gardeFocus ? actif.id : null;
  const selStart = gardeFocus ? actif.selectionStart : null;
  const selEnd = gardeFocus ? actif.selectionEnd : null;

  // Un changement d'étape doit remonter en haut de page (sinon l'écran "Nous préparons vos
  // pistes" ou une nouvelle étape apparaît hors champ si on avait scrollé plus bas). Un simple
  // clic à l'intérieur d'une même étape (calques, roue, accordéons...) reconstruit tout le DOM
  // de #app et ne doit PAS faire sauter la page — on restaure alors la position exacte.
  const changementEtape = etapePrecedenteRendue !== etat.etape;
  etapePrecedenteRendue = etat.etape;
  const scrollAvant = window.scrollY;
  document.querySelector('.wrap').classList.toggle('wrapWide', etat.etape==='passage');

  if(etat.etape==='accueil') app.innerHTML = renderEtapeAccueil();
  else if(etat.etape==='experience') app.innerHTML = renderEtapeExperience();
  else if(etat.etape==='aspirations'){
    app.innerHTML = renderEtapeAspirations();
    if(etat.voeu && etat.axe1.cibleChargee!==cleCibleAspirations(etat.voeu)) chargerVerbesCible().then(render);
    if(etat.metierArtMode && !referentielMetiersArt) chargerReferentiel().then(render);
    if(etat.metierArtMode && !fichesMetiersArt) chargerFichesDetaillees().then(render);
  }
  else if(etat.etape==='preparation') app.innerHTML = renderEtapePreparation();
  else if(etat.etape==='pistes') app.innerHTML = renderEtapePistes();
  else if(etat.etape==='objectif'){ app.innerHTML = '<div class="empty">Préparation de votre objectif…</div>'; app.innerHTML = await renderEtapeObjectif(); }
  else if(etat.etape==='passage'){ app.innerHTML = '<div class="empty">Préparation de votre passage…</div>'; app.innerHTML = await renderEtapePassage(); }
  wireEvents();

  if(idFocus){
    const el = document.getElementById(idFocus);
    if(el){ el.focus(); try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
  if(changementEtape) window.scrollTo(0,0); else window.scrollTo(0, scrollAvant);
}
function wireEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-porte]').forEach(b=>b.addEventListener('click', ()=>{ etat.metierArtMode = b.dataset.porte==='art'; etat.etape='experience'; sauver(); render(); }));
  const expInput = document.getElementById('expRecherche');
  if(expInput) expInput.addEventListener('input', ()=>{
    etat.expRecherche = expInput.value; clearTimeout(expTimer);
    if(expInput.value.trim().length<2){ etat.expSuggestions=[]; render(); return; }
    expTimer = setTimeout(async ()=>{ try{ etat.expSuggestions = (await rechercherMetiers(expInput.value)).slice(0,8); }catch(e){ etat.expSuggestions=[]; } render(); }, 300);
  });
  const voeuInput = document.getElementById('voeuRecherche');
  if(voeuInput) voeuInput.addEventListener('input', ()=>{
    etat.voeu = null; etat.voeuRecherche = voeuInput.value; clearTimeout(expTimer);
    if(voeuInput.value.trim().length<2){ etat.voeuSuggestions=[]; render(); return; }
    expTimer = setTimeout(async ()=>{ try{ etat.voeuSuggestions = (await rechercherMetiers(voeuInput.value)).slice(0,8); }catch(e){ etat.voeuSuggestions=[]; } render(); }, 300);
  });
  const voeuArtInput = document.getElementById('voeuArtFiltre');
  if(voeuArtInput) voeuArtInput.addEventListener('input', ()=>{ etat.voeuArtFiltre = voeuArtInput.value; render(); });
  app.querySelectorAll('[data-toggle-domaine]').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.toggleDomaine; etat.voeuArtOuvert[id]=!etat.voeuArtOuvert[id]; render(); }));
  app.querySelectorAll('[data-choisir-metier-art]').forEach(b=>b.addEventListener('click', ()=>choisirVoeuMetierArt(b.dataset.choisirMetierArt)));
  app.querySelectorAll('[data-effacer-voeu-art]').forEach(b=>b.addEventListener('click', ()=>{ etat.voeu=null; etat.axe1.verbesChoisis=[]; etat.axe1.verbesDisponibles=null; etat.axe1.adaptatif=false; sauver(); render(); }));
  app.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click', ()=>ajouterExperience(etat.expSuggestions[+b.dataset.i])));
  app.querySelectorAll('[data-voeu-i]').forEach(b=>b.addEventListener('click', ()=>{
    etat.voeuRequeteOriginale = etat.voeuRecherche; etat.voeu = etat.voeuSuggestions[+b.dataset.voeuI]; etat.voeuSuggestions=[];
    etat.axe1.verbesChoisis = []; etat.axe1.verbesDisponibles = null; etat.axe1.adaptatif = false;
    sauver(); render();
    chargerVerbesCible().then(render);
  }));
  app.querySelectorAll('[data-toggle-verbe]').forEach(b=>b.addEventListener('click', ()=>{ const v=b.dataset.toggleVerbe; const i=etat.axe1.verbesChoisis.indexOf(v); if(i>=0) etat.axe1.verbesChoisis.splice(i,1); else etat.axe1.verbesChoisis.push(v); sauver(); render(); }));
  app.querySelectorAll('[data-toggle-sensoriel]').forEach(b=>b.addEventListener('click', ()=>{ const v=b.dataset.toggleSensoriel; const i=etat.axe1.sensoriel.indexOf(v); if(i>=0) etat.axe1.sensoriel.splice(i,1); else etat.axe1.sensoriel.push(v); sauver(); render(); }));
  app.querySelectorAll('[data-toggle-mode-apprentissage]').forEach(b=>b.addEventListener('click', ()=>{ const v=b.dataset.toggleModeApprentissage; const i=etat.axe1.modesApprentissage.indexOf(v); if(i>=0) etat.axe1.modesApprentissage.splice(i,1); else etat.axe1.modesApprentissage.push(v); sauver(); render(); }));
  app.querySelectorAll('[data-qvct]').forEach(b=>b.addEventListener('click', ()=>{ const [cle,val]=b.dataset.qvct.split('|'); etat.axe3.qvct[cle] = etat.axe3.qvct[cle]===val ? '' : val; sauver(); render(); }));
  app.querySelectorAll('[data-toggle-rse]').forEach(b=>b.addEventListener('click', ()=>{ const v=b.dataset.toggleRse; const i=etat.axe3.rse.indexOf(v); if(i>=0) etat.axe3.rse.splice(i,1); else etat.axe3.rse.push(v); sauver(); render(); }));
  app.querySelectorAll('[data-taille-collectif]').forEach(b=>b.addEventListener('click', ()=>{ etat.axe4.tailleCollectif = etat.axe4.tailleCollectif===b.dataset.tailleCollectif ? '' : b.dataset.tailleCollectif; sauver(); render(); }));
  app.querySelectorAll('[data-intensite-client]').forEach(b=>b.addEventListener('click', ()=>{ etat.axe4.intensiteClient = etat.axe4.intensiteClient===b.dataset.intensiteClient ? '' : b.dataset.intensiteClient; sauver(); render(); }));
  app.querySelectorAll('[data-toggle-consulte]').forEach(b=>b.addEventListener('click', ()=>{ etat.axe4.consulte = !etat.axe4.consulte; sauver(); render(); }));
  app.querySelectorAll('[data-retirer]').forEach(b=>b.addEventListener('click', ()=>{ etat.experiences.splice(+b.dataset.retirer,1); sauver(); render(); }));
  app.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', ()=>{ const [ei,cle]=b.dataset.toggle.split('|'); etat.experiences[+ei].ouvert[cle]=!etat.experiences[+ei].ouvert[cle]; render(); }));
  app.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('change', ()=>{ const [ei,cle,i]=b.dataset.check.split('|'); etat.experiences[+ei].comp[cle][+i].coche = b.checked; sauver(); }));
  app.querySelectorAll('[data-tout-cocher]').forEach(b=>b.addEventListener('change', ()=>{ const [ei,cle]=b.dataset.toutCocher.split('|'); etat.experiences[+ei].comp[cle].forEach(it=>it.coche=b.checked); sauver(); render(); }));
  app.querySelectorAll('[data-anciennete]').forEach(sel=>sel.addEventListener('change', ()=>{ etat.experiences[+sel.dataset.anciennete].anciennete = sel.value; sauver(); }));
  app.querySelectorAll('[data-check-diplome]').forEach(b=>b.addEventListener('change', ()=>{ etat.diplomes[+b.dataset.checkDiplome].coche = b.checked; sauver(); }));
  const tcd = document.querySelector('[data-tout-cocher-diplome]'); if(tcd) tcd.addEventListener('change', ()=>{ etat.diplomes.forEach(d=>d.coche=tcd.checked); sauver(); render(); });
  ['autreNom','autreAnnees'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', ()=>{ etat.autresBrouillon[id==='autreNom'?'nom':'annees']=el.value; }); });
  const autrePreuve = document.getElementById('autrePreuve'); if(autrePreuve) autrePreuve.addEventListener('change', ()=>{ etat.autresBrouillon.preuve = autrePreuve.value; });
  const btnAutre = document.getElementById('btnAjouterAutre');
  if(btnAutre) btnAutre.addEventListener('click', ()=>{
    const b = etat.autresBrouillon, msg = document.getElementById('autreMsg'), nom = (b.nom||'').trim(), an = parseInt(b.annees,10);
    if(!nom){ msg.textContent = 'Indiquez la compétence.'; return; }
    if(!(an>=1 && an<=60)){ msg.textContent = 'Indiquez depuis combien d’années, avec un nombre.'; return; }
    if(!b.preuve){ msg.textContent = 'Choisissez le type de preuve : sans preuve, la compétence ne peut pas être ajoutée.'; return; }
    etat.autres.push({ nom, annees:an, preuve:b.preuve }); etat.autresBrouillon = { nom:'', annees:'', preuve:'' }; sauver(); render();
  });
  app.querySelectorAll('[data-retirer-autre]').forEach(b=>b.addEventListener('click', ()=>{ etat.autres.splice(+b.dataset.retirerAutre,1); sauver(); render(); }));
  const bad = document.getElementById('btnAjouterDiplomeAutre');
  if(bad) bad.addEventListener('click', ()=>{
    const inp = document.getElementById('diplomeAutreInput');
    const val = inp.value.trim();
    if(!val) return;
    if(!etat.diplomes.some(d=>normaliser(d.libelle)===normaliser(val))) etat.diplomes.push({ libelle:val, coche:true, sources:['ajout manuel'] });
    sauver(); render();
  });
  const s1 = document.getElementById('btnSuivant1'); if(s1) s1.addEventListener('click', ()=>{ etat.etape='aspirations'; sauver(); render(); });
  app.querySelectorAll('[data-toggle-axe]').forEach(b=>b.addEventListener('click', ()=>{
    const [chemin,val] = b.dataset.toggleAxe.split('|');
    const [axe,sousCle] = chemin.split('.');
    const list = sousCle ? etat[axe][sousCle] : etat[axe];
    const i = list.indexOf(val); if(i>=0) list.splice(i,1); else list.push(val);
    sauver(); render();
  }));
  app.querySelectorAll('[data-toggle-cond]').forEach(b=>b.addEventListener('click', ()=>{ const v=b.dataset.toggleCond; const i=etat.axe3.conditions.indexOf(v); if(i>=0) etat.axe3.conditions.splice(i,1); else etat.axe3.conditions.push(v); sauver(); render(); }));
  app.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click', ()=>{ etat.axe3.style=b.dataset.style; sauver(); render(); }));
  app.querySelectorAll('[data-slider]').forEach(el=>el.addEventListener('input', ()=>{ etat.axe3[el.dataset.slider]=+el.value; sauver(); el.previousElementSibling.lastElementChild.textContent=el.value+'%'; }));
  const p2 = document.getElementById('btnPrecedent2'); if(p2) p2.addEventListener('click', ()=>{ etat.etape='experience'; sauver(); render(); });
  const s2 = document.getElementById('btnSuivant2'); if(s2) s2.addEventListener('click', ()=>{ etat.pistes=null; lancerPreparation(); });
  app.querySelectorAll('[data-piste]').forEach(b=>b.addEventListener('click', ()=>{ etat.pisteChoisie = +b.dataset.piste; etat.etape='objectif'; sauver(); render(); }));
  const p3 = document.getElementById('btnPrecedent3'); if(p3) p3.addEventListener('click', ()=>{ etat.etape='aspirations'; sauver(); render(); });
  const rp = document.getElementById('btnReessayerPistes'); if(rp) rp.addEventListener('click', async ()=>{ etat.pistes=null; render(); await calculerPistes(); render(); });
  const po = document.getElementById('btnPrecedentObjectif'); if(po) po.addEventListener('click', ()=>{ etat.etape='pistes'; sauver(); render(); });
  const vp = document.getElementById('btnVoirPassage'); if(vp) vp.addEventListener('click', ()=>{ etat.etape='passage'; sauver(); render(); });
  const p4 = document.getElementById('btnPrecedent4'); if(p4) p4.addEventListener('click', ()=>{ etat.etape='objectif'; sauver(); render(); });
  const br = document.getElementById('btnRecommencer'); if(br) br.addEventListener('click', ()=>{ if(confirm('Recommencer depuis le début ? Vos réponses actuelles seront effacées.')){ localStorage.removeItem(CLE_LOCAL); location.reload(); } });
  app.querySelectorAll('[data-niveau-vertical]').forEach(b=>b.addEventListener('click', ()=>{ etat.niveauChoisi=+b.dataset.niveauVertical; sauver(); render(); }));
  app.querySelectorAll('[data-calque]').forEach(b=>b.addEventListener('click', ()=>{ etat.calqueActif=b.dataset.calque; sauver(); render(); }));
  app.querySelectorAll('[data-quart]').forEach(b=>b.addEventListener('click', ()=>{ etat.quartActif=b.dataset.quart; sauver(); render(); }));
}
render();
</script>
