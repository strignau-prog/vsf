async function deposerPhoto(module,etape){

}
async function demarrerMicro(){
  try{MEDIA.flux=await navigator.mediaDevices.getUserMedia({audio:true});MEDIA.morceaux=[];MEDIA.rec=new MediaRecorder(MEDIA.flux);
    MEDIA.rec.ondataavailable=function(e){if(e.data&&e.data.size)MEDIA.morceaux.push(e.data);};
    MEDIA.rec.onstop=function(){MEDIA.blob=new Blob(MEDIA.morceaux,{type:MEDIA.rec.mimeType||'audio/webm'});if(MEDIA.flux)MEDIA.flux.getTracks().forEach(function(t){t.stop();});};
    MEDIA.rec.start();return true;}
  catch(x){S.msg='Le micro n’est pas disponible : '+((x&&x.message)||x);return false;}
}
async function envoyerVocal(){
  var se=V().seance;if(!se||!MEDIA.blob)return;
  await envelopper(async function(){
    var ext=(MEDIA.blob.type.indexOf('mp4')>=0?'m4a':'webm'),chemin=DB.user+'/'+R.inscription.id+'/debrief/'+Date.now()+'.'+ext;
    var u=await DB.sb.storage.from('vsf-depots').upload(chemin,MEDIA.blob,{contentType:MEDIA.blob.type});if(u.error)throw u.error;
    var d=await DB.sb.from('vsf_form_debriefs').insert({inscription_id:R.inscription.id,module_code:se.code,chemin:chemin,duree_s:Math.max(1,Math.min(600,S.sec)),questions:REG.debriefQuestions.map(function(q){return q[0];})});if(d.error)throw d.error;
    await rpc('vsf_form_enregistrer_seance',{p_module:se.code,p_etape:'ancrer',p_duree_s:S.sec,p_point:null});
    await recharger();S.ancre=false;S.sec=0;MEDIA.blob=null;S.vue='aujourdhui';S.msg='✓ Vocal enregistré. Tes rappels sont prévus.';
  });
}
async function ecouter(){
  var v=V();if(!v.retour)return;
  if(!REEL){S.ecoute=true;render();return;}
  await envelopper(async function(){
    if(v.retour.vocal){var s=await DB.sb.storage.from('vsf-depots').createSignedUrl(v.retour.vocal,900);if(s.error)throw s.error;var a=new Audio(s.data.signedUrl);a.play();}
    await rpc('vsf_form_marquer_ecoute',{p_retour:v.retour.id});await recharger();
  });
}
async function changerMode(m){S.mode=m;render();if(!REEL)return;await envelopper(async function(){var r=await DB.sb.from('vsf_form_rythme').upsert({inscription_id:R.inscription.id,mode:m},{onConflict:'inscription_id'});if(r.error)throw r.error;});}
async function basculerPause(){
  if(!REEL){S.pause=!S.pause;render();return;}
  await envelopper(async function(){await rpc('vsf_form_mettre_en_pause',{p_inscription:R.inscription.id,p_pause:!S.pause});await recharger();});
}
async function activerTest(){await envelopper(async function(){await rpc('vsf_form_activer_pour_test',{p_inscription:R.inscription.id});await recharger();});}

/* ====================== événements ====================== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-a],[data-mode],[data-tq]');if(!t)return;var d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.mode){changerMode(d.mode);return;}
  if(d.tq!==undefined){S.test.rep[d.tq]=+d.k;render();return;}
  switch(d.a){
    case 'ecoute':ecouter();return;
    case 'epreuve':S.epreuve=!S.epreuve;render();return;
    case 'photo':$('fic').click();return;
    case 'pause':basculerPause();return;
    case 'activer':activerTest();return;
    case 'terminer':terminerSeance();return;
    case 'envoyervocal':envoyerVocal();return;
    case 'finseance':go('aujourdhui');return;
    case 'chrono':if(S.run){clearInterval(T);S.run=false;}else{S.run=true;T=setInterval(function(){if(S.left<=0){clearInterval(T);S.run=false;render();return;}S.left--;var el=document.querySelector('.chrono .t');if(el){var m=Math.floor(S.left/60),s=S.left%60;el.textContent=m+':'+(s<10?'0':'')+s;}},1000);}render();return;
    case 'rec':
      if(S.rec){clearInterval(T);S.rec=false;S.ancre=true;if(REEL&&MEDIA.rec&&MEDIA.rec.state!=='inactive')MEDIA.rec.stop();render();return;}
      (async function(){if(REEL&&!(await demarrerMicro())){render();return;}S.sec=0;S.ancre=false;S.rec=true;T=setInterval(function(){S.sec++;if(S.sec>=90){clearInterval(T);S.rec=false;S.ancre=true;if(REEL&&MEDIA.rec&&MEDIA.rec.state!=='inactive')MEDIA.rec.stop();}render();},1000);render();})();return;
    case 'envoyer':var bons=Object.keys(S.test.rep).filter(function(i){return S.test.rep[i]===0;}).length;S.test.resultat=bons>=4?'reussi':'pas_encore';if(S.test.resultat!=='reussi')S.test.echecs=S.test.tentative;S.test.phase='resultat';render();scrollTo(0,0);return;
    case 'retenter':S.test={phase:'quiz',tentative:2,rep:{},resultat:null,echecs:1,depot:false};render();scrollTo(0,0);return;
  }
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='fic'&&t.files&&t.files[0]){if(S.vue==='essai-test')S.test.depot=true;else{S.fichier=t.files[0];S.consent=false;}render();return;}
  if(t.dataset.a==='consent'){S.consent=t.checked;render();}
});

/* ====================== démarrage ====================== */
async function demarrer(){
  if(REEL){
    $('bandeau').textContent='Copie de test · données réelles de ton compte';$('bandeau').style.background='#111';
    DB.sb=window.VSF&&VSF.sb;if(!DB.sb){S.msg='Connexion indisponible.';S.charge=true;render();return;}
    var s=await DB.sb.auth.getSession();if(!s.data.session){location.replace('../connexion.html?suite='+encodeURIComponent(location.href));return;}
    DB.user=s.data.session.user.id;
    try{var a=await DB.sb.rpc('vsf_est_admin');DB.admin=a.data===true;
      await recharger();
      var q=await DB.sb.from('vsf_form_questions_debrief').select('texte,toujours,seulement_vocal_libre,rang').eq('actif',true).order('rang');
      if(!q.error&&q.data&&q.data.length){var libres=q.data.filter(function(x){return !x.seulement_vocal_libre;}),tj=libres.filter(function(x){return x.toujours;}),autres=libres.filter(function(x){return !x.toujours;}),j=Math.floor(Date.now()/86400000);
        var choix=tj.slice(0,3);for(var k=0;choix.length<3&&autres.length;k++){choix.push(autres.splice((j+k)%autres.length,1)[0]);}
        choix.sort(function(a,b){return a.rang-b.rang;});REG.debriefQuestions=choix.map(function(x){return [x.texte,x.toujours];});}
    }catch(x){S.msg='Lecture impossible : '+((x&&x.message)||x)+' (la migration 70 est-elle exécutée ?)';}
    S.charge=true;
  }
  render();
}
window.MP={etat:function(){return {S:S,R:R,DB:DB};},init:function(o){Object.assign(DB,o.DB||{});R=o.R||null;S.charge=true;S.vue='aujourdhui';S.msg='';S.fichier=null;if(o.REEL!==undefined)REEL=o.REEL;render();}};
demarrer();
})();
</script>
