  <style>
    :root{ --bg:#fff; --ink:#1c1a17; --muted:#55504a; --line:#e4e0d9; --soft:#f7f5f2; --accent:#a8461f; --red:#b3261e; --orange:#8a4a00; }

    nav.topnav{background:#1c1a17;color:#fff;display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;font-size:14px}
    nav.topnav a.brand{color:#fff;text-decoration:none;font-weight:600;margin-right:24px;font-size:17px;font-family:Fraunces,Georgia,serif}
    nav.topnav .menuItem{position:relative;height:100%;display:flex;align-items:center}
    nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:0 14px;cursor:pointer;color:#d7dbe4;text-decoration:none}
    nav.topnav .menuItem:hover>span,nav.topnav .menuItem>a.topLink:hover{color:#fff}
    nav.topnav .dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--ink);min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:0 0 10px 10px;overflow:hidden;z-index:50}
    nav.topnav .menuItem:hover .dropdown{display:block}
    nav.topnav .dropdown a{display:block;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:13.5px;border-bottom:1px solid var(--line)}

    nav.topnav .dropdown a:hover{background:var(--soft)}
    nav.topnav .navToggle{display:none;margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
    @media (max-width:820px){
      nav.topnav{flex-wrap:wrap;height:auto;padding:10px 16px}

    .sugBox{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.12)}

    .colTitle{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:0 0 8px}
    .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px}
    .btn:hover{background:var(--soft)}
    .btnPrimary{background:#111;color:#fff;border-color:#111}
    .btnPrimary:hover{background:#111;opacity:.85}
    .btnDanger{color:var(--red)}

    .swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

    @media (max-width:600px){ .ligne .ligneL2{padding-left:23px} }

    .board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto}

    .pill{display:inline-block;color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px}
    .avatar{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#1c1a17;color:#fff;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;margin-left:-4px;border:2px solid #fff}
    .avatars{display:inline-flex;padding-left:4px}
    .chip{display:inline-flex;align-items:center;color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap}

    .badge.proche{background:#f8e2c6;color:var(--orange)}

    /* Fenêtre carte */
    .voile{position:fixed;inset:0;background:rgba(20,18,15,.45);padding:40px 14px;overflow:auto;z-index:100}
    .fenetre{background:#fff;border-radius:14px;width:min(880px,100%);margin:0 auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .field{margin-bottom:12px}
    .field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sousTachesTable{width:100%;border-collapse:collapse;margin-top:4px}
    .sousTachesTable th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:4px 6px;border-bottom:1px solid var(--line)}

    .sousTachesTable .input{padding:6px 8px;font-size:13.5px}

    .sousTachesTable th.groupeSepare, .sousTachesTable td.colSepare{border-left:1px solid var(--line)}
    .feu{width:20px;height:20px;min-width:20px;border-radius:50%;border:1px solid var(--line);background:#efece7;padding:0}
    .feu.rouge{background:var(--red);border-color:var(--red)}
    .feu.orange{background:var(--orange);border-color:var(--orange)}
    .feu.vert{background:#2f855a;border-color:#2f855a}
    .notif{background:#fbeee6;border:1px solid #efc9b1;border-radius:10px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
    .errBox{padding:24px;color:var(--red);white-space:pre-wrap}

<body>
<div class="app"><div style="padding:24px" class="tiny">Chargement…</div></div>
<script>
const SUPABASE_URL = 'https://uuuigousvpijskbdhcal.supabase.co';
const SUPABASE_KEY = 'sb_publishable__YuNj5XCo5YF8lwhwTu5OQ_RDM1Eesp';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });

const STATUTS = [
  { cle:'a_faire', label:'À faire' }, { cle:'en_cours', label:'En cours' },
  { cle:'a_valider', label:'À commenter/valider' }, { cle:'fait', label:'Fait' },
];
const state = { estId:null, user:null, membres:[], categories:[], jalons:[], cartes:[], notifs:[], ouverts:new Set(), carteOuverte:null, erreur:null, objectifsOuvert:true, ongletKanban:'a_faire', ajoutContact:false, suggSocietes:[], ciblesTransformees:[] };
let dragJalonId = null;

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) }
function erreur(msg){ alert(msg); }

/* ------------------------------------------------------------------ chargement */
async function charger(){
  const e = state.estId;
  const [cat, jal, car, mem, not] = await Promise.all([
    sb.from('strategie_categories').select('*').eq('establishment_id', e).order('ordre').order('created_at'),
    sb.from('strategie_jalons').select('*').eq('establishment_id', e).order('ordre').order('created_at'),
    sb.from('strategie_cartes').select('*').eq('establishment_id', e).order('created_at'),
    sb.from('members').select('user_id,email').eq('establishment_id', e),
    sb.from('strategie_notifications').select('*').eq('destinataire', state.user.id).eq('lu', false).order('created_at', { ascending:false }),
  ]);
  for(const r of [cat,jal,car,mem,not]) if(r.error) throw r.error;
  state.categories = cat.data||[]; state.jalons = jal.data||[]; state.notifs = not.data||[];
  // Une carte « Ciblé » transformée en projet est archivée (transforme_le) : elle n'apparaît plus
  // nulle part ici, mais reste comptée dans la conversion Ciblé -> Transformé de son objectif.
  state.cartes = (car.data||[]).filter(c=>!c.transforme_le);
  state.ciblesTransformees = (car.data||[]).filter(c=>c.transforme_le);
  const membres = (mem.data||[]).filter(m=>m.user_id);
  const ids = membres.map(m=>m.user_id);
  let noms = {};
  if(ids.length){
    const { data: fm } = await sb.from('federation_members').select('user_id,nom,prenom').in('user_id', ids);
    for(const f of (fm||[])) noms[f.user_id] = `${f.prenom||''} ${f.nom||''}`.trim();
  }
  state.membres = membres.map(m=>({ user_id:m.user_id, email:m.email, nom: noms[m.user_id] || m.email || m.user_id.slice(0,6) }));
  if(!state.categories.length){
    const { data, error } = await sb.from('strategie_categories').insert([
      { establishment_id:e, nom:'ERP', couleur:'#2b6cb0', ordre:1 }, { establishment_id:e, nom:'Commercial', couleur:'#dd7a1a', ordre:2 }
    ]).select();
    if(!error) state.categories = data||[];
  }
}

/* ------------------------------------------------------------------ helpers */
const carteParId = id => state.cartes.find(c=>c.id===id);
const jalonParId = id => state.jalons.find(j=>j.id===id);
const catParId = id => state.categories.find(c=>c.id===id);
const membreParId = id => state.membres.find(m=>m.user_id===id);
function prenom(m){
  if(!m) return '';
  return (m.nom||'').trim().split(/\s+/)[0] || m.email || '';
}
// Prénom affiché sur une carte : le responsable de l'action tant que la tâche n'est pas à
// commenter/valider, puis celui à qui la main est passée (responsable du contrôle).
function personnePourCarte(c){
  const id = c.statut==='a_valider' ? c.responsable_controle : c.responsable_action;
  return membreParId(id);
}
function initiales(m){
  const nom = (m && m.nom) || '?';
  const mots = nom.split(/[\s@.]+/).filter(Boolean);
  const a = (mots[0]||'?')[0]; const b = (mots[1]||'')[0] || '';
  return (a+b).toUpperCase();
}
function joursAvant(dateStr){
  if(!dateStr) return null;
  const auj = new Date(); auj.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00') - auj) / 86400000);
}
function enRetard(c){ const j = joursAvant(c.echeance); return j!==null && j<0 && c.statut!=='fait'; }
function badgeEcheance(c){
  if(!c.echeance) return '';
  const j = joursAvant(c.echeance);
  const cls = c.statut==='fait' ? '' : (j<0 ? 'retard' : (j<=3 ? 'proche' : ''));
  return `<span class="badge ${cls}">${new Date(c.echeance+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}${cls==='retard'?' · dépassée':''}</span>`;
}
function ordreJalon(c){
  const j = jalonParId(c.jalon_id);
  return j && j.ordre!=null ? j.ordre : Infinity;
}
// à échéance égale, l'ordre des fiches Objectifs (celui de la colonne de gauche) départage
function parEcheance(a,b){
  if(!a.echeance && !b.echeance) return ordreJalon(a)-ordreJalon(b);
  if(!a.echeance) return 1;
  if(!b.echeance) return -1;
  const cmp = a.echeance.localeCompare(b.echeance);
  return cmp!==0 ? cmp : ordreJalon(a)-ordreJalon(b);
}
// Conversion Ciblé -> Transformé d'un objectif : cartes « Ciblé » transformées / toutes les cartes « Ciblé »
// créées sur cet objectif (encore actives + déjà transformées). Calculé, jamais saisi.
function conversionJalon(j){
  const transformes = state.ciblesTransformees.filter(c=>c.jalon_id===j.id).length;
  const cibles = state.cartes.filter(c=>c.jalon_id===j.id && c.type==='cible').length + transformes;
  return { cibles, transformes, pct: cibles ? Math.round(100*transformes/cibles) : 0 };
}
function progressionJalon(j){
  const lignes = state.cartes.filter(c=>c.jalon_id===j.id).sort(parEcheance);
  const faites = lignes.filter(c=>c.statut==='fait').length;
  return { lignes, faites, total:lignes.length, pct: lignes.length ? Math.round(100*faites/lignes.length) : 0 };
}

/* ------------------------------------------------------------------ actions : jalons */
async function ajouterJalon(){
  const t = document.getElementById('nvJalonTitre').value.trim(); if(!t) return;
  const d = document.getElementById('nvJalonDate').value || null;
  const { data, error } = await sb.from('strategie_jalons').insert({ establishment_id:state.estId, titre:t, echeance:d, ordre:state.jalons.length }).select().single();
  if(error) return erreur('Création de l\'objectif impossible : '+error.message);
  state.jalons.push(data); state.ouverts.clear(); state.ouverts.add(data.id); render();
}
async function majJalon(id, patch){
  const j = jalonParId(id); if(!j) return; Object.assign(j, patch); render();
  const { error } = await sb.from('strategie_jalons').update(patch).eq('id', id);
  if(error) erreur('Mise à jour de l\'objectif impossible : '+error.message);
}
async function supprimerJalon(id){
  const n = progressionJalon(jalonParId(id)).total;
  if(!await confirmer(n ? `Supprimer cet objectif ET ses ${n} tâche(s) liée(s) ?` : 'Supprimer cet objectif ?')) return;
  const { error } = await sb.from('strategie_jalons').delete().eq('id', id);
  if(error) return erreur('Suppression impossible : '+error.message);
  state.jalons = state.jalons.filter(j=>j.id!==id); state.cartes = state.cartes.filter(c=>c.jalon_id!==id); render();
}
function basculerJalon(id){ const etaitOuvert = state.ouverts.has(id); state.ouverts.clear(); if(!etaitOuvert) state.ouverts.add(id); render(); }
function toggleObjectifsPanel(){ state.objectifsOuvert = !state.objectifsOuvert; render(); }
function choisirOngletKanban(cle){ state.ongletKanban = cle; render(); }

/* ------------------------------------------------------------------ actions : cartes */
async function creerCarte(titre, jalonId, echeance){
  const { data, error } = await sb.from('strategie_cartes').insert({
    establishment_id:state.estId, titre, jalon_id:jalonId||null, echeance:echeance||null, statut:'a_faire', assignes:[state.user.id]
  }).select().single();
  if(error){ erreur('Création de la tâche liée impossible : '+error.message); return null; }
  state.cartes.push(data); return data;
}
async function ajouterLigneJalon(jalonId){
  const inp = document.getElementById('nvLigne-'+jalonId); const t = inp.value.trim(); if(!t) return;
  const dt = document.getElementById('nvLigneDate-'+jalonId).value || null;
  if(await creerCarte(t, jalonId, dt)) render();
}
async function majCarte(id, patch){
  const c = carteParId(id); if(!c) return;
  Object.assign(c, patch, { updated_at:new Date().toISOString() });
  render();
  const { error } = await sb.from('strategie_cartes').update({ ...patch, updated_at:c.updated_at }).eq('id', id);
  if(error) erreur('Mise à jour de la tâche liée impossible : '+error.message);
}
async function supprimerCarte(id){
  if(!await confirmer('Supprimer cette tâche liée ?')) return;
  const { error } = await sb.from('strategie_cartes').delete().eq('id', id);
  if(error) return erreur('Suppression impossible : '+error.message);
  state.cartes = state.cartes.filter(c=>c.id!==id); state.carteOuverte = null; render();
}
async function changerStatut(id, statut){
  const c = carteParId(id); if(!c || c.statut===statut) return;
  const patch = { statut, fait_le: statut==='fait' ? new Date().toISOString() : null };
  let destinataires = [];
  if(statut==='a_valider'){
    // Le déplacement de la tâche liée EST le signal : on passe la main à l'autre membre, sans message à écrire.
    const autresQueAssignes = state.membres.filter(m=>!c.assignes.includes(m.user_id));
    if(c.assignes.length===1 && autresQueAssignes.length===1){
      patch.assignes = [autresQueAssignes[0].user_id];
      destinataires = [autresQueAssignes[0].user_id];
    } else {
      destinataires = state.membres.map(m=>m.user_id);
    }
    destinataires = destinataires.filter(u=>u!==state.user.id);
  }
  await majCarte(id, patch);
  if(destinataires.length){

// Détail d'une tâche liée : mini-checklist (à faire / feu rouge-orange-vert / commentaire),
// remplace la description libre + le fil de commentaires — quand tout est coché, la tâche
// liée passe automatiquement en "Fait" (et se recoche donc sur son objectif).
const COULEURS_FEU = ['', 'rouge', 'orange', 'vert'];
function cycleCouleur(c){ return COULEURS_FEU[(COULEURS_FEU.indexOf(c||'')+1) % COULEURS_FEU.length]; }
// Statut de la tâche liée déduit de l'état de ses lignes (plus de glisser-déposer manuel) :
// aucune PRÊT -> À faire ; certaines PRÊT -> En cours ; toutes PRÊT mais pas toutes avec une
// couleur FAIT posée -> À commenter/valider ; toutes avec une couleur FAIT (peu importe laquelle) -> Fait.
function statutDepuisSousTaches(sousTaches){
  if(!sousTaches || !sousTaches.length) return null;
  const nbPret = sousTaches.filter(x=>x.coche).length;
  if(nbPret===0) return 'a_faire';
  if(nbPret < sousTaches.length) return 'en_cours';
  return sousTaches.every(x=>!!x.couleur) ? 'fait' : 'a_valider';
}
async function ecrireSousTaches(carteId, sousTaches){
  const c = carteParId(carteId); if(!c) return;
  c.sous_taches = sousTaches; render();
  const { error } = await sb.from('strategie_cartes').update({ sous_taches: sousTaches, updated_at:new Date().toISOString() }).eq('id', carteId);
  if(error){ erreur('Mise à jour impossible : '+error.message); return; }
  const nouveauStatut = statutDepuisSousTaches(sousTaches);
  if(nouveauStatut && nouveauStatut !== c.statut) await changerStatut(carteId, nouveauStatut);
}
async function ajouterSousTache(carteId){
  const c = carteParId(carteId); if(!c) return;
  await ecrireSousTaches(carteId, [...(c.sous_taches||[]), { texte:'', couleur:'', commentaire:'', coche:false }]);

async function majSousTache(carteId, idx, patch){
  const c = carteParId(carteId); if(!c) return;

}

// Le rond FAIT est cyclique (rouge/orange/vert) : on affiche le changement de couleur tout de
// suite, mais on ne persiste / ne recalcule le statut de la tâche qu'une fois l'utilisateur
// arrêté sur une couleur, sinon traverser rouge puis orange pour atteindre vert déclencherait
// ces effets (fermeture de ligne, notification) à chaque étape intermédiaire pour rien.
const timersCouleur = {};
function cyclerCouleurSousTache(carteId, idx){
  const c = carteParId(carteId); const cur = (c.sous_taches||[])[idx]; if(!cur) return;
  c.sous_taches = c.sous_taches.map((x,i)=> i===idx ? { ...x, couleur: cycleCouleur(x.couleur) } : x);
  render();
  const cle = carteId+'#'+idx;
  clearTimeout(timersCouleur[cle]);
  timersCouleur[cle] = setTimeout(()=>{ delete timersCouleur[cle]; const cc = carteParId(carteId); if(cc) ecrireSousTaches(carteId, cc.sous_taches); }, 700);
}

// Transfert complet vers le Kanban Client/Projet : la fiche est créée à « À qualifier »
// avec ce qui a été saisi, puis la carte disparaît d'ici (pas de copie des deux côtés).
// Elle est archivée (transforme_le + projet_id) plutôt que supprimée : invisible ici, mais
// comptée dans la conversion de son objectif ; les événements de proposition qui arrivent
// ensuite (ouverture, téléchargement) vont dans l'historique du projet.
async function transformerCible(id){
  const c = carteParId(id); if(!c || c.type!=='cible') return;
  const k = c.cible || {};
  if(!(k.nom||'').trim()){ alert('Renseigne le nom du prospect avant de le transformer.'); return; }
  if(!await confirmer(`Transformer « ${k.nom} » en projet dans le Kanban (étape « À qualifier ») ?\nLa carte disparaîtra de Stratégie atelier.`)) return;
  const { data: numero, error: eNum } = await sb.rpc('next_numero_projet', { p_establishment_id: state.estId });
  if(eNum){ alert('Erreur de numérotation : '+eNum.message); return; }
  const iso = dateIsoAujourdhui();
  const historique = [
    ...(k.echanges||[]).map(e=>({ date:e.date, iso:e.iso, type:e.type, texte:e.texte })),
    { date:dateAffichage(iso), iso, texte:'Projet créé depuis la prospection (carte « Ciblé »)' }
  ];
  const notes = [k.source ? `Source : ${k.source}` : '', k.prochaine_action ? `Prochaine action prévue : ${k.prochaine_action}` : ''].filter(Boolean).join('\n') || null;
  const { data: projet, error } = await sb.from('projets').insert({
    establishment_id:state.estId, nom:k.nom, nom_projet:k.nom, numero_projet:numero,
    client_nom:k.nom, client_telephone:k.telephone||null, client_email:k.email||null,
    client_type:k.type_client||null, client_siret:k.siret||null,
    etape:'qualification', historique,
    echeance_date:k.rappel_date||null, echeance_label:k.rappel_objet||null,
    notes, autres_contacts:k.autres_contacts||[]
  }).select('id').single();
  if(error){ alert('Création du projet impossible : '+error.message); return; }
  const archive = { transforme_le:new Date().toISOString(), projet_id:projet.id };
  let { error: eArch } = await sb.from('strategie_cartes').update(archive).eq('id', id);
  // Base pas encore migrée (colonnes absentes) : on garde l'ancien comportement (suppression)
  if(eArch && /transforme_le|projet_id/.test(eArch.message||'')) ({ error: eArch } = await sb.from('strategie_cartes').delete().eq('id', id));
  if(eArch){ alert(`Le projet n° ${numero} est bien créé dans le Kanban, mais la carte n'a pas pu être retirée d'ici : ${eArch.message}`); return; }
  state.cartes = state.cartes.filter(x=>x.id!==id);
  state.ciblesTransformees.push({ ...c, ...archive });
  state.carteOuverte = null; render();
  alert(`Transformé : le projet n° ${numero} est créé dans le Kanban, à l'étape « À qualifier ».`);
}

function telechargerFichier(contenu, type, nomFichier){

function datesEtalees(n, dateFin){
  const debut = new Date(); debut.setHours(0,0,0,0);
  const jours = Math.round((new Date(dateFin+'T00:00:00') - debut) / 86400000);
  const res = [];
  for(let i=0;i<n;i++){
    const j = n>1 ? Math.round(i*jours/(n-1)) : jours;
    const d = new Date(debut); d.setDate(d.getDate()+j);
    res.push(d.toISOString().slice(0,10));
  }
  return res;
}
async function genererFichesTestEtProspection(){

  const DATE_FIN = '2026-12-18';
  const stephaneId = idMembreParEmail('strignau@gmail.com');
  const tristanId = idMembreParNom('tristan') || idMembreParNom('gesret');
  if(!stephaneId || !tristanId) erreur("Attention : je n'ai pas retrouvé "+(!stephaneId&&!tristanId?'Stéphane ni Tristan':(!stephaneId?'Stéphane (strignau@gmail.com)':'Tristan'))+" dans les membres de cet atelier — les responsables des nouvelles fiches sont à choisir à la main.");
  const catErp = (state.categories.find(c=>c.nom==='ERP')||{}).id || null;
  const catCommercial = (state.categories.find(c=>c.nom==='Commercial')||{}).id || null;

  const jTest = await trouverOuCreerJalon('TEST MAURICE', DATE_FIN);
  const jProspection = await trouverOuCreerJalon('PROSPECTION', DATE_FIN);
  if(!jTest || !jProspection) return;

  const pages = pagesAControler(state.estId);
  const datesPages = datesEtalees(pages.length, DATE_FIN);
  const dejaTest = new Set(state.cartes.filter(c=>c.jalon_id===jTest.id).map(c=>c.lien||c.titre));
  for(let i=0;i<pages.length;i++){
    const [nom, url] = pages[i];
    if(dejaTest.has(url)) continue;
    await creerCarteAvancee({
      titre:nom, lien:url, jalon_id:jTest.id, categorie_id:catErp, echeance:datesPages[i],
      responsable_action:stephaneId, responsable_controle:tristanId,
      assignes:[stephaneId||state.user.id].filter(Boolean), sous_taches:CHECKS_PAGE(),
    });
  }

  const datesProspection = datesEtalees(ETAPES_PROSPECTION.length, DATE_FIN);
  const dejaProspection = new Set(state.cartes.filter(c=>c.jalon_id===jProspection.id).map(c=>c.titre));
  for(let i=0;i<ETAPES_PROSPECTION.length;i++){

    });
  }
  render();
}

              <div style="display:flex;gap:4px;align-items:center">
                <input class="input" style="flex:1;min-width:90px" placeholder="À faire…" value="${escapeHtml(st.texte||'')}" onchange="majSousTache('${c.id}',${i},{texte:this.value})">
                <button class="btn" style="padding:2px 6px;opacity:${st.lien?1:.35}" title="${st.lien?'Ouvrir le lien':'Ajouter un lien'}" onclick="clicLienSousTache('${c.id}',${i})">🔗</button>
                ${st.lien?`<button class="btn" style="padding:2px 6px" title="Modifier le lien" onclick="definirLienSousTache('${c.id}',${i})">✎</button>`:''}
                ${estResponsableAction
                  ? `<button class="btn" style="padding:2px 6px;opacity:${st.note?1:.35}" title="${st.note?escapeHtml(st.note):'Ajouter une note (lisible par le contrôleur au survol)'}" onclick="definirNoteSousTache('${c.id}',${i})">📝</button>`
                  : `<button class="btn" style="padding:2px 6px;opacity:${st.note?1:.35}" title="${st.note?escapeHtml(st.note):'Aucune note'}" onclick="voirNoteSousTache('${c.id}',${i})">📝</button>`}
                <input type="file" id="fichier-${c.id}-${i}" style="display:none" accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf" onchange="televerserPieceJointe('${c.id}',${i},this.files[0])">
                <button class="btn" style="padding:2px 6px;opacity:${st.piece?1:.35}" title="${st.piece?('Ouvrir : '+escapeHtml(st.piece.nom)):'Joindre un fichier (Word/Excel/PPT/PDF)'}" onclick="${st.piece?`window.open('${escapeHtml(st.piece.url)}','_blank')`:`document.getElementById('fichier-${c.id}-${i}').click()`}">📎</button>
                ${st.piece?`<button class="btn" style="padding:2px 6px" title="Retirer la pièce jointe" onclick="retirerPieceJointe('${c.id}',${i})">✕</button>`:''}
              </div>
            </td>
            <td style="text-align:center"><input type="checkbox" ${st.coche?'checked':''} onchange="majSousTache('${c.id}',${i},{coche:this.checked})" title="Prêt"></td>
            <td class="colSepare"><input class="input" placeholder="Commentaire…" value="${escapeHtml(st.commentaire||'')}" onchange="majSousTache('${c.id}',${i},{commentaire:this.value})"></td>
            <td style="text-align:center"><button class="feu ${st.couleur||''}" title="Cliquer pour poser/faire tourner la couleur Fait" onclick="cyclerCouleurSousTache('${c.id}',${i})"></button></td>
            <td><button class="btn" style="padding:2px 8px" onclick="supprimerSousTache('${c.id}',${i})">✕</button></td>
          </tr>`).join('') || `<tr><td colspan="5" class="tiny muted">Aucune ligne — ajoute ce qu'il y a à faire.</td></tr>`}
          </tbody>
        </table>
        </div>
        <button class="btn" style="margin-top:6px" onclick="ajouterSousTache('${c.id}')">+ Ligne</button>
      </div>
      <button class="btn btnDanger tiny" onclick="supprimerCarte('${c.id}')">Supprimer la tâche liée</button>
    </div>
  </div>`;
}

function render(){
  document.querySelector('.app').innerHTML = `
  <nav class="topnav">${navAtelierHtml(state.estId, { actif:'strategie' })}</nav>
  <div class="main">
    ${state.notifs.map(n=>`<div class="notif"><span>🔔 ${escapeHtml(n.message)}</span><span style="display:flex;gap:6px">${n.carte_id&&carteParId(n.carte_id)?`<button class="btn" onclick="ouvrirCarte('${n.carte_id}')">Voir</button>`:''}<button class="btn" onclick="marquerLu('${n.id}')">OK</button></span></div>`).join('')}
    <div class="layout">
      <div>
        <div class="objectifsHead" onclick="toggleObjectifsPanel()">
          <p class="colTitle" style="margin:0">Objectifs <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">(${state.jalons.length})</span></p>
          <span class="tiny muted">${state.objectifsOuvert?'▾ replier':'▸ déplier'}</span>
        </div>
        ${state.objectifsOuvert ? `
        <div>
          ${state.jalons.map(renderJalon).join('') || '<div class="tiny muted" style="margin-bottom:10px">Aucun objectif pour l\'instant.</div>'}
          <div style="display:grid;grid-template-columns:1fr 122px auto;gap:8px;margin-top:6px">
            <input class="input" id="nvJalonTitre" placeholder="Nouvel objectif…" onkeydown="if(event.key==='Enter')ajouterJalon()">
            <input class="input" id="nvJalonDate" type="date">
            <button class="btn btnPrimary" onclick="ajouterJalon()">+</button>
          </div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
            <p class="colTitle" style="margin-bottom:6px">Export / impression</p>
            <select class="input" id="exportPortee" style="margin-bottom:6px">
              <option value="tous">Toutes les fiches Objectifs</option>
              ${state.jalons.map(j=>`<option value="${j.id}">${escapeHtml(j.titre)}</option>`).join('')}
            </select>
            <label class="tiny" style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
              <input type="checkbox" id="exportDetail" checked> Inclure le détail des tâches liées (checklist)
            </label>
            <div style="display:flex;gap:8px">
              <button class="btn" onclick="exporterWord()">📄 Word</button>
              <button class="btn" onclick="exporterExcel()">📊 Excel</button>
            </div>
          </div>
        </div>` : ''}
      </div>
      <div>
        <p class="colTitle">Tâches liées</p>
        <div class="ongletsKanban">
          ${STATUTS.map(s=>{ const n = state.cartes.filter(c=>c.statut===s.cle).length; return `<button class="ongletBtn ${state.ongletKanban===s.cle?'actif':''}" onclick="choisirOngletKanban('${s.cle}')">${s.label} (${n})</button>`; }).join('')}
        </div>
        <div class="board">
          ${STATUTS.map(s=>{ const cartes = state.cartes.filter(c=>c.statut===s.cle).sort(parEcheance); return `
          <div class="col ${state.ongletKanban===s.cle?'colActif':''}">
            <h3><span>${s.label}</span><span class="muted">${cartes.length}</span></h3>
            ${cartes.map(renderCarte).join('')}
          </div>`; }).join('')}
        </div>
      </div>
    </div>
  </div>
  ${state.carteOuverte ? renderFenetreCarte() : ''}`
}

async function initApp(){
  try{
    const { data:{ session }, error } = await sb.auth.getSession();
    if(error) throw error;
    if(!session){ window.location.href = 'federation-accueil.html'; return; }
    state.user = session.user;
    state.estId = new URLSearchParams(window.location.search).get('est') || localStorage.getItem('ac_current_est_v1') || '';
    if(!state.estId){ window.location.href = 'federation-accueil.html'; return; }
    localStorage.setItem('ac_current_est_v1', state.estId);
    state.objectifsOuvert = window.innerWidth > 760;
    await charger();
    render();
  }catch(e){
    console.error(e);
    document.body.innerHTML = `<div class="errBox">Impossible de charger la stratégie : ${escapeHtml(e.message||String(e))}\n\nSi le message parle d'une table introuvable, la migration SQL « stratégie atelier » n'a pas encore été lancée.</div>`;
  }
  sb.auth.onAuthStateChange((event, session)=>{ if(!session) window.location.href = 'federation-accueil.html'; });
}
initApp();
</script>
</body>
</html>
