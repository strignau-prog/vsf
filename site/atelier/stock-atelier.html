  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* V0 — même système typo/couleurs que tout le projet, voir atelier-compte.html. */
    :root{
      --bg:#fff; --ink:#1c1a17; --muted:#55504a; --line:#e4e0d9; --soft:#f7f5f2;
      --accent:#a8461f;
      --red:var(--ink); --amber:var(--ink); --green:var(--ink);
      --redBg:var(--soft); --amberBg:var(--soft); --greenBg:var(--soft);
      --blue:var(--ink); --blueBg:var(--soft);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    body{font-size:16px;line-height:1.25;font-variant-numeric:tabular-nums}
    h1,h2,.brand,.treeTitle{font-family:Fraunces,Georgia,serif;font-weight:600}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:none;padding:0}
    .app{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
    nav.topnav{background:#1c1a17;color:#fff;display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;font-size:14px}
    nav.topnav a.brand{color:#fff;text-decoration:none;font-weight:600;margin-right:24px;font-size:15px;font-family:Fraunces,Georgia,serif}
    nav.topnav .menuItem{position:relative;height:100%;display:flex;align-items:center}
    nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:0 14px;cursor:pointer;color:#d7dbe4;text-decoration:none}
    nav.topnav .menuItem:hover>span,nav.topnav .menuItem>a.topLink:hover{color:#fff}
    nav.topnav .dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--ink);min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:0 0 10px 10px;overflow:hidden;z-index:50}
    nav.topnav .menuItem:hover .dropdown{display:block}
    nav.topnav .dropdown a{display:block;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:13.5px;border-bottom:1px solid var(--line)}
    nav.topnav .dropdown a:last-child{border-bottom:none}
    nav.topnav .dropdown a:hover{background:var(--soft)}
    nav.topnav .navToggle{display:none;margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
    @media (max-width:820px){
      nav.topnav{flex-wrap:wrap;height:auto;padding:10px 16px}
      nav.topnav .navToggle{display:block}
      nav.topnav .menuItem{display:none;width:100%;height:auto;flex-direction:column;align-items:stretch}
      nav.topnav.navOpen .menuItem{display:flex}
      nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:12px 0 4px;cursor:pointer;display:block}
      nav.topnav .dropdown{position:static;box-shadow:none;border-radius:0;background:transparent;min-width:0}
      nav.topnav .menuItem.open .dropdown{display:block}
      nav.topnav .dropdown a{color:#fff;padding:10px 0 10px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
      nav.topnav .dropdown a:hover{background:rgba(255,255,255,.06)}
    }
    .topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;z-index:20}
    .brand{font-weight:700;font-size:22px;letter-spacing:.02em}
    .brand small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .nav{display:flex;flex-wrap:wrap;gap:8px}
    .nav button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff}
    .nav button.active{background:#111;color:#fff;border-color:#111}
    @media (max-width:700px){ .topbar{grid-template-columns:1fr;row-gap:8px} .toolbar{flex-wrap:wrap} }
    .main{padding:20px 24px 60px 24px;max-width:1100px;margin:0 auto}
    .section{margin:0 0 22px 0}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
    .miniBtn,.ghostBtn,.actionBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px}
    .actionBtn{background:#111;color:#fff;border-color:#111}
    .ghostBtn{color:var(--muted)}
    .dangerBtn{color:var(--red)}
    .miniBtn:hover,.ghostBtn:hover,.actionBtn:hover{opacity:.85}
    .input,.select,.textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%}
    .grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
    .grid3{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
    .grid4{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr 1fr}
    .grid5{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr 1fr auto}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .treeTitle{font-weight:700;font-size:21px;margin:0 0 10px 0}
    .muted{color:var(--muted)}
    .tiny{font-size:12.5px;line-height:1.35}
    .table{width:100%;border-collapse:collapse}
    .table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
    .table td{padding:8px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:top}
    .chip{display:inline-flex;align-items:center;padding:3px 9px;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:999px;white-space:nowrap}
    .chip.red,.chip.amber,.chip.green,.chip.blue{border-color:var(--line);background:var(--soft);color:var(--ink);font-weight:700}
    .card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
    .cardHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
    .errBox{padding:24px;color:var(--red);font-family:monospace;white-space:pre-wrap}
    @media (max-width:760px){.grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr}.table{font-size:13px}}
  </style>

<script>
function arrondir(n, dec=3){ const f=Math.pow(10,dec); return Math.round((n+Number.EPSILON)*f)/f; }
function euros(n){ return (n==null || n==='') ? '—' : arrondir(n,2).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) }
function toggleMenuItem(el){ el.parentElement.classList.toggle('open'); }
function toggleNav(){ document.querySelector('nav.topnav').classList.toggle('navOpen'); }
function uid(p='id'){ return p+'-'+Math.random().toString(16).slice(2,9) }
function todayStr(){ return new Date().toISOString().slice(0,10) }

function parseFrNum(s){ if(!s) return 0; const c = String(s).replace('€','').replace(/\s/g,'').replace(',', '.'); const n = parseFloat(c); return isNaN(n) ? 0 : n; }
function parseFrDate(s){ if(!s) return ''; const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return ''; return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
function parseStatut(s){ return String(s||'').replace(/^[^\wÀ-ÿ]+/,'').trim() || 'Plein'; }

const THEMES_CONNUS = ["BLANC","BLEU","CREME BEIGE","GRIS","JAUNE","MARRON","NOIR","ORANGE","ROSE","ROUGE","VERT","VIOLET"];

function statutDepuisStock(stockRestant, contenanceInitiale){
  if(stockRestant<=0) return 'Vide';
  if(stockRestant<contenanceInitiale) return 'Entamé';
  return 'Plein';
}
/* La "Clé produit" ne se tape plus jamais à la main : elle est reconstruite
   automatiquement à partir des 5 champs séparés (Marque, Désignation article,
   Type, Finition, RAL/Référence couleur), exactement dans l'ordre où ton
   fichier Excel la construisait déjà. */
function normaliserCle(s){ return String(s||'').replace(/\s+/g,' ').trim(); }
/* Clé utilisée UNIQUEMENT pour faire correspondre stock et besoins (pas pour l'affichage) :
   insensible à la casse, car "TOLLENS" et "tollens" doivent désigner le même produit,
   même si ton fichier d'origine mélange les deux selon les colonnes. */
function cleMatching(s){ return normaliserCle(s).toUpperCase(); }
function calculerCleProduit(pot){
  return normaliserCle([pot.marque, pot.designationArticle, pot.type, pot.finition, pot.ralReference]
    .map(s=>(s||'').trim()).join(' | '));
}
function designationCourte(cleProduit){
  const segments = String(cleProduit||'').split('|').map(s=>s.trim()).filter(Boolean);
  return segments.length ? segments[segments.length-1] : '';
}

function parseStockInitial(tsv){
  const pots = [];
  for(const line of tsv.split('\n')){
    if(!line.trim()) continue;
    const c = line.split('\t');
    const idArticle = (c[0]||'').trim();
    if(!idArticle) continue;
    const marque = (c[2]||'').trim();
    const contenanceInitiale = parseFrNum(c[4]) || 1;
    const stockRestant = parseFrNum(c[6]);
    // La clé produit importée était déjà construite comme
    // "Marque | Désignation article | Type | Finition | RAL/Référence" —
    // on la ré-éclate ici une fois pour toutes en champs séparés et modifiables.
    const segments = (c[10]||'').split('|').map(s=>s.trim());
    pots.push({
      idArticle,
      idReservation: (c[1]||'').trim(),
      marque,
      fournisseur: marque,
      themeCouleur: (c[3]||'').trim(),
      designationArticle: segments[1]||'',
      type: segments[2]||'',
      finition: segments[3]||'',
      ralReference: segments[4]||'',
      contenanceInitiale,
      dateReception: parseFrDate(c[5]),
      stockRestant,
      dateOuverture: parseFrDate(c[7]),
      valeurAchat: parseFrNum(c[8]),
      quantiteDisponibleL: parseFrNum(c[9]),
      // Le "Statut pot" importé de ton fichier reflétait parfois une disponibilité déjà
      // réservée (formules non recalculées), pas l'état physique réel du pot. Recalculé
      // ici à partir du stock restant pour être toujours cohérent avec ce qui s'affiche.
      statutPot: statutDepuisStock(stockRestant, contenanceInitiale)
    });
  }
  return pots;
}
function parseBesoinInitial(tsv){
  const besoins = [];
  for(const line of tsv.split('\n')){
    if(!line.trim()) continue;
    const c = line.split('\t');
    if(!(c[0]||'').trim()) continue;
    besoins.push({ id: uid('b'), chantier:(c[0]||'').trim(), cleProduit:(c[1]||'').trim(), quantiteDemandee: parseFrNum(c[2]), statut:'' });
  }
  return besoins;
}

}

/* =========================================================================

   ========================================================================= */
function construireIndexStock(){
  const index = {};
  for(const pot of store.pots){
    const cle = cleMatching(calculerCleProduit(pot));
    if(!cle || pot.quantiteDisponibleL<=0) continue;
    (index[cle] = index[cle] || []).push(pot);
  }
  for(const cle in index){
    index[cle].sort((a,b)=>{
      const ouvertA = a.stockRestant>0 && a.stockRestant<a.contenanceInitiale;
      const ouvertB = b.stockRestant>0 && b.stockRestant<b.contenanceInitiale;
      if(ouvertA!==ouvertB) return ouvertA ? -1 : 1;
      if(ouvertA && ouvertB){
        const c = (a.dateOuverture||'9999-99-99').localeCompare(b.dateOuverture||'9999-99-99');
        if(c!==0) return c;
        return a.quantiteDisponibleL - b.quantiteDisponibleL;
      }
      return (a.dateReception||'9999-99-99').localeCompare(b.dateReception||'9999-99-99');
    });
  }
  return index;
}

function reserverBesoin(cleProduit, quantiteDemandee, indexStock){
  const resultat = { reservations: [], quantiteReservee: 0, manque: quantiteDemandee };
  const pots = indexStock[cleProduit];
  if(!pots || !pots.length) return resultat;
  let reste = quantiteDemandee;
  for(const pot of pots){
    if(reste<=0.000001) break;
    if(pot.quantiteDisponibleL<=0) continue;
    const prise = Math.min(pot.quantiteDisponibleL, reste);
    resultat.reservations.push({ idPot: pot.idArticle, quantiteReservee: prise });
    pot.quantiteDisponibleL = arrondir(pot.quantiteDisponibleL - prise);
    reste -= prise;
    resultat.quantiteReservee += prise;
  }
  resultat.quantiteReservee = arrondir(resultat.quantiteReservee);
  resultat.manque = arrondir(Math.max(0, reste));
  return resultat;
}

function genererIdReservation(){
  store.compteurReservation++;
  return 'RC' + String(store.compteurReservation).padStart(6,'0');
}

async function genererCommande(){
  for(const pot of store.pots) pot.quantiteDisponibleL = arrondir(Math.max(0, pot.stockRestant));
  for(const b of store.besoins) b.statut = '';

  // Un fournisseur déjà renseigné à la main sur une commande existante est préservé
  // (le recalcul ne doit pas écraser une correction manuelle de Tristan).
  const fournisseurManuel = {};
  for(const c of store.commandes){ if(c.fournisseur) fournisseurManuel[cleMatching(c.cleProduit)] = c.fournisseur; }

  const fournisseurParProduit = {};
  for(const pot of store.pots){
    const cle = cleMatching(calculerCleProduit(pot));
    const f = pot.fournisseur || pot.marque;
    if(cle && f && !fournisseurParProduit[cle]) fournisseurParProduit[cle] = f;
  }

  const indexStock = construireIndexStock();
  const commandesParProduit = {};
  let nombreBesoinsTraites = 0;

  for(const b of store.besoins){
    const cleBesoinAffichage = normaliserCle(b.cleProduit);
    const cleBesoin = cleMatching(b.cleProduit);
    if(!cleBesoin || !(b.quantiteDemandee>0)) continue;
    const resultat = reserverBesoin(cleBesoin, b.quantiteDemandee, indexStock);

    resultat.reservations.forEach(r=>{
      const pot = store.pots.find(p=>p.idArticle===r.idPot);
      if(pot) pot.quantiteDisponibleL = arrondir(Math.max(0, pot.quantiteDisponibleL));
    });

    if(!commandesParProduit[cleBesoin]) commandesParProduit[cleBesoin] = {
      cleProduit: cleBesoinAffichage, besoinTotal:0, stockAffecte:0, quantiteACommander:0, chantiers:[], potsReserves:[],
      fournisseur: fournisseurManuel[cleBesoin] || fournisseurParProduit[cleBesoin] || '', idReservation: ''
    };
    const s = commandesParProduit[cleBesoin];
    s.besoinTotal = arrondir(s.besoinTotal + b.quantiteDemandee);
    s.stockAffecte = arrondir(s.stockAffecte + resultat.quantiteReservee);
    s.quantiteACommander = arrondir(s.quantiteACommander + resultat.manque);
    if(b.chantier && !s.chantiers.includes(b.chantier)) s.chantiers.push(b.chantier);
    resultat.reservations.forEach(r=> s.potsReserves.push(r.idPot + ' (' + arrondir(r.quantiteReservee) + ' L)'));

    b.statut = 'Réservé';
    nombreBesoinsTraites++;
  }

  Object.values(commandesParProduit).forEach(s=>{ if(s.quantiteACommander>0) s.idReservation = genererIdReservation(); });

  store.commandes = Object.values(commandesParProduit).sort((a,b)=>{
    const c = (a.fournisseur||'').localeCompare(b.fournisseur||'');
    return c!==0 ? c : a.cleProduit.localeCompare(b.cleProduit);
  });

  await Promise.all([syncPotsQuantiteDisponible(), syncBesoinsStatut(), syncCommandesRemplace(), syncCompteur()]);
  return nombreBesoinsTraites;
}

async function annulerReservations(){
  for(const b of store.besoins) b.statut = '';
  store.commandes = [];
  await Promise.all([syncBesoinsStatut(), syncCommandesRemplace()]);
}

function prochainIdArticle(){
  let plusGrand = 0, largeur = 4;
  for(const p of store.pots){
    const m = String(p.idArticle||'').match(/^P(\d+)$/i);
    if(m){ largeur = Math.max(largeur, m[1].length); plusGrand = Math.max(plusGrand, Number(m[1])); }
  }
  return { suivant: plusGrand+1, largeur };
}

async function receptionnerCommande(cleProduit, contenance, nombrePots, prixTotalHT, dateReception){
  const commande = store.commandes.find(c=>c.cleProduit===cleProduit);
  if(!commande) return;
  let { suivant, largeur } = prochainIdArticle();
  const valeurUnitaire = arrondir(prixTotalHT / nombrePots, 2);
  let quantiteRestante = commande.quantiteACommander;
  const nouveauxPotsReserves = [];
  const nouveauxPots = [];

  const potModele = store.pots.find(p=>cleMatching(calculerCleProduit(p))===cleMatching(cleProduit)) || {};

  for(let i=0;i<nombrePots;i++){
    const idArticle = 'P' + String(suivant).padStart(largeur,'0'); suivant++;
    const quantiteReservee = arrondir(Math.min(contenance, quantiteRestante));
    const quantiteDisponible = arrondir(contenance - quantiteReservee);
    const nouveauPot = {
      idArticle, themeCouleur: potModele.themeCouleur||'', marque: potModele.marque||'',
      designationArticle: potModele.designationArticle||'', type: potModele.type||'',
      finition: potModele.finition||'', ralReference: potModele.ralReference||'',
      fournisseur: potModele.fournisseur || commande.fournisseur || '',
      contenanceInitiale: contenance, stockRestant: contenance, quantiteDisponibleL: quantiteDisponible,
      dateReception, dateOuverture: '', valeurAchat: valeurUnitaire, idReservation: commande.idReservation,
      statutPot: quantiteReservee>0 ? 'Réservé' : 'Plein'
    };
    store.pots.push(nouveauPot);
    nouveauxPots.push(nouveauPot);
    if(quantiteReservee>0){
      nouveauxPotsReserves.push(idArticle + ' (' + quantiteReservee + ' L)');
      quantiteRestante = arrondir(Math.max(0, quantiteRestante - quantiteReservee));
    }
  }

  commande.potsReserves = [...commande.potsReserves, ...nouveauxPotsReserves];
  commande.quantiteACommander = quantiteRestante;
  commande.dateCommande = dateReception;
  render();

  const { error: e1 } = await sb.from('stock_pots').insert(nouveauxPots.map(jsPotToDbInsert));
  if(e1) alert('Erreur enregistrement des pots reçus : '+e1.message);
  await dbUpdateCommande(cleProduit, { pots_reserves: commande.potsReserves, quantite_a_commander: commande.quantiteACommander, date_commande: commande.dateCommande });
}

const POT_CHAMP_TO_COLONNE = { themeCouleur:'theme_couleur', marque:'marque', designationArticle:'designation_article',
  type:'type', finition:'finition', ralReference:'ral_reference', fournisseur:'fournisseur',
  contenanceInitiale:'contenance_initiale', stockRestant:'stock_restant', dateReception:'date_reception',
  dateOuverture:'date_ouverture', valeurAchat:'valeur_achat', statutPot:'statut_pot' };
async function majPot(id, champ, valeur){
  const p = store.pots.find(x=>x.idArticle===id); if(!p) return;
  const patch = {};
  if(['contenanceInitiale','stockRestant','valeurAchat'].includes(champ)){ p[champ] = Number(valeur)||0; patch[POT_CHAMP_TO_COLONNE[champ]] = p[champ]; }
  else { p[champ] = valeur; if(POT_CHAMP_TO_COLONNE[champ]) patch[POT_CHAMP_TO_COLONNE[champ]] = (champ==='dateReception'||champ==='dateOuverture') ? (valeur||null) : valeur; }
  if(champ==='stockRestant' || champ==='contenanceInitiale'){
    p.quantiteDisponibleL = arrondir(Math.max(0, p.stockRestant));
    const nouveauStatut = statutDepuisStock(p.stockRestant, p.contenanceInitiale);
    if(nouveauStatut==='Entamé' && p.statutPot!=='Entamé' && !p.dateOuverture) p.dateOuverture = todayStr();
    p.statutPot = nouveauStatut;
    patch.quantite_disponible_l = p.quantiteDisponibleL;
    patch.statut_pot = p.statutPot;
    patch.date_ouverture = p.dateOuverture||null;
  }
  render();
  await dbUpdatePot(id, patch);
}

async function ouvrirReception(cleProduit){
  const commande = store.commandes.find(c=>c.cleProduit===cleProduit); if(!commande) return;
  const nombrePots = Number(await demander('Nombre de pots reçus pour "' + cleProduit + '" :', '1'));
  if(!nombrePots || nombrePots<=0) return;
  const contenance = Number(await demander('Contenance de chaque pot reçu (L) :', '1'));
  if(!contenance || contenance<=0) return;
  const prixTotalHT = Number(await demander('Prix total HT des ' + nombrePots + ' pot(s) reçus :', '0'));
  if(isNaN(prixTotalHT) || prixTotalHT<0) return;
  const dateReception = await demander('Date de réception (AAAA-MM-JJ) :', todayStr()) || todayStr();
  await receptionnerCommande(cleProduit, contenance, nombrePots, prixTotalHT, dateReception);
  render();
}

      ${store.commandes.length ? `<span class="chip ${nbACommander>0?'red':'green'}">${nbACommander>0 ? nbACommander+' produit(s) à commander' : 'Tout est couvert par le stock'}</span>` : ''}
    </div>
    ${commandes.map(c=>{
      const couvert = c.quantiteACommander<=0;
      return `
      <div class="card" style="border-color:${couvert?'var(--line)':'var(--ink)'};${couvert?'opacity:.7':''}">
        <div class="cardHead">
          <div><b>${escapeHtml(designationCourte(c.cleProduit)||c.cleProduit)}</b><div class="tiny muted">${escapeHtml(c.cleProduit)}</div><div class="tiny muted">Chantiers : ${escapeHtml(c.chantiers.join(' | ')||'—')}</div></div>
          <div style="text-align:right">
            <div class="chip blue">${escapeHtml(c.idReservation||'sans réservation')}</div>
            ${!couvert?`<div style="margin-top:6px"><button class="actionBtn" onclick="ouvrirReception('${c.cleProduit.replace(/'/g,"\\'")}')">Réceptionner</button></div>`:''}
          </div>
        </div>

        ${renderBarreCouverture(c)}
        <div class="toolbar" style="margin:0 0 4px 0">
          <span class="chip green">Pris sur stock : ${c.stockAffecte} L</span>
          ${couvert
            ? `<span class="chip green">✓ Entièrement couvert — rien à commander</span>`
            : `<span class="chip red">⚠ À commander : ${c.quantiteACommander} L</span>`}
          <span class="tiny muted">(besoin total : ${c.besoinTotal} L)</span>
        </div>

        <div class="field" style="max-width:260px;margin-top:10px"><label>Fournisseur</label>
          <input class="input" value="${escapeHtml(c.fournisseur||'')}" onchange="majCommandeFournisseur('${c.cleProduit.replace(/'/g,"\\'")}', this.value)" placeholder="Nom du fournisseur à contacter">
        </div>
        <div class="tiny muted" style="margin-top:6px">Pots réservés : ${escapeHtml(c.potsReserves.join(' | ')||'aucun')}</div>
      </div>`;}).join('') || `<div class="tiny muted">Aucune commande en cours — lance un calcul depuis l'onglet Besoins.</div>`}
  </div>`;
}

async function reinitialiserDonneesOrigine(){
  if(!await confirmer("Réinitialiser avec le stock et les besoins d'origine ?\n\nTout ce que tu as modifié, ajouté ou calculé depuis sera perdu.")) return;
  store = defaultStore();
  potEnEdition = null;
  render();

  const { error: eDelP } = await sb.from('stock_pots').delete().eq('establishment_id', ESTABLISHMENT_ID);
  const { error: eDelB } = await sb.from('chantier_besoins').delete().eq('establishment_id', ESTABLISHMENT_ID);
  const { error: eDelC } = await sb.from('commandes_fournisseur').delete().eq('establishment_id', ESTABLISHMENT_ID);
  if(eDelP||eDelB||eDelC) return alert('Erreur lors de la réinitialisation.');

  const potsRows = store.pots.map(jsPotToDbInsert);
  for(let i=0;i<potsRows.length;i+=200){
    const { error } = await sb.from('stock_pots').insert(potsRows.slice(i,i+200));
    if(error) return alert('Erreur réinitialisation stock : '+error.message);
  }
  const besoinsRows = store.besoins.map(b=>({ establishment_id:ESTABLISHMENT_ID, chantier:b.chantier, cle_produit:b.cleProduit, quantite_demandee: b.quantiteDemandee===''?null:b.quantiteDemandee, statut:'' }));
  if(besoinsRows.length){
    const { data, error } = await sb.from('chantier_besoins').insert(besoinsRows).select();
    if(error) return alert('Erreur réinitialisation besoins : '+error.message);
    store.besoins = data.map(dbBesoinToJs);
  }
  await syncCompteur();
  render();
}

function render(){
  document.querySelector('.app').innerHTML = `
  <nav class="topnav">
    ${navAtelierHtml(ESTABLISHMENT_ID, { actif:'atelier' })}
  </nav>
  <div class="topbar">
    <div class="brand">STOCK<small>Atelier — peinture</small></div>
    <div class="nav">
      <button class="${view==='stock'?'active':''}" onclick="view='stock';render()">Stock</button>
      <button class="${view==='besoins'?'active':''}" onclick="view='besoins';render()">Besoins</button>
      <button class="${view==='commande'?'active':''}" onclick="view='commande';render()">Commande</button>
      <button class="${view==='consommation'?'active':''}" onclick="view='consommation';render()">Consommation annuelle</button>
    </div>
    <div class="toolbar" style="margin:0">
      <button class="ghostBtn" onclick="reinitialiserDonneesOrigine()">Réinitialiser avec le stock d'origine</button>
    </div>
  </div>
  <div class="main">
    ${view==='stock' ? renderStock() : view==='besoins' ? renderBesoins() : view==='commande' ? renderCommande() : renderConsommation()}
  </div>`;
}

/* =========================================================================
   CONSOMMATION ANNUELLE (Partie 2, item 9) — peinture consommée cumulée sur
   l'année, à partir des pots réels (contenance_initiale - stock_restant).
   Volontairement PAS de détail par projet ici : chantier_besoins ne relie
   aujourd'hui les pots à aucun projet de façon fiable (texte libre, pas une
   vraie clé) — un chiffre global mais juste plutôt qu'un détail qui aurait
   de bonnes chances d'être faux silencieusement.
   ========================================================================= */
let anneeConsommation = new Date().getFullYear();
function renderConsommation(){
  const anneesDisponibles = [...new Set(store.pots.filter(p=>p.dateOuverture).map(p=>Number(p.dateOuverture.slice(0,4))))].sort((a,b)=>b-a);
  if(!anneesDisponibles.includes(anneeConsommation) && anneesDisponibles.length) anneeConsommation = anneesDisponibles[0];
  const potsAnnee = store.pots.filter(p=>p.dateOuverture && Number(p.dateOuverture.slice(0,4))===anneeConsommation);
  const parTheme = {};
  let totalL = 0;
  for(const p of potsAnnee){
    const consomme = Math.max(0, Number(p.contenanceInitiale||0) - Number(p.stockRestant||0));
    totalL += consomme;
    const cle = p.themeCouleur || p.marque || 'Non renseigné';
    parTheme[cle] = (parTheme[cle]||0) + consomme;
  }
  const lignes = Object.entries(parTheme).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="treeTitle">Consommation annuelle</div>
  <div class="sectionSub">Peinture consommée (pots ouverts dans l'année), tous chantiers confondus — pas encore de détail par projet, voir la note ci-dessous.</div>
  <div class="toolbar" style="margin-bottom:14px">
    <select class="input" style="max-width:120px" onchange="anneeConsommation=Number(this.value);render()">
      ${anneesDisponibles.length ? anneesDisponibles.map(a=>`<option value="${a}" ${a===anneeConsommation?'selected':''}>${a}</option>`).join('') : `<option>${anneeConsommation}</option>`}
    </select>
  </div>
  <div class="statCard" style="margin-bottom:16px">
    <div class="statNum">${totalL.toFixed(1)} L</div>
    <div class="tiny muted">consommés en ${anneeConsommation}, ${potsAnnee.length} pot${potsAnnee.length>1?'s':''} ouvert${potsAnnee.length>1?'s':''}</div>
  </div>
  ${lignes.length ? `
  <table class="tableau">
    <thead><tr><th>Teinte / thème</th><th>Litres consommés</th></tr></thead>
    <tbody>
      ${lignes.map(([cle,l])=>`<tr><td>${escapeHtml(cle)}</td><td>${l.toFixed(1)} L</td></tr>`).join('')}
    </tbody>
  </table>` : `<p class="tiny muted">Aucun pot ouvert enregistré pour ${anneeConsommation}.</p>`}
  <div class="note" style="margin-top:16px">Le détail par chantier n'est pas encore fiable : le champ "chantier" de l'onglet Besoins est du texte libre, pas relié à un vrai projet. Dis-le-moi si tu veux qu'on corrige ce lien pour débloquer un détail par projet plus tard.</div>
  `;
}

async function initApp(){
  document.querySelector('.app').innerHTML = `<div style="padding:24px" class="tiny muted">Chargement…</div>`;
  try{
    const { data:{ session }, error } = await sb.auth.getSession();
    if(error) throw error;
    if(!session){ location.replace('federation-accueil.html'); return; }
    const estId = getCurrentEstId();
    if(!estId){ location.replace('federation-accueil.html'); return; }
    const { data: membre, error: e1 } = await sb.from('members').select('id').eq('user_id', session.user.id).eq('establishment_id', estId).maybeSingle();
    if(e1) throw e1;
    if(!membre){ location.replace('federation-accueil.html'); return; }
    ESTABLISHMENT_ID = estId;
    store = await chargerStore(estId);
    await creerBesoinDepuisUrl();
    render();
  }catch(e){
    console.error(e);
    document.querySelector('.app').innerHTML = `<div class="errBox">Impossible de charger le stock : ${escapeHtml(e.message||String(e))}\n\nRecharge la page.</div>`;
  }
}

// Arrivée depuis "Réserver la peinture" (fiche projet, étape BAT) : la quantité en litres est
// déjà calculée depuis le m² à peindre — on pré-remplit un nouveau besoin au lieu de la
// redemander à l'aveugle. Le produit/couleur reste à choisir à la main (l'ERP ne le connaît pas).
async function creerBesoinDepuisUrl(){
  const params = new URLSearchParams(window.location.search);
  const chantier = params.get('besoinChantier');
  const quantite = params.get('besoinQuantite');
  if(!chantier || !quantite) return;
  const { data, error } = await sb.from('chantier_besoins').insert({
    establishment_id: ESTABLISHMENT_ID, chantier, cle_produit:'', quantite_demandee: Number(quantite)||null, statut:''
  }).select().single();
  if(error){ alert('Impossible de créer le besoin peinture : '+error.message); return; }
  store.besoins.push(dbBesoinToJs(data));
  alertePeintureAReserver = `Besoin ajouté pour "${chantier}" (${quantite} L calculés depuis le m²). Choisis le produit/couleur ci-dessous, puis clique "Lancer le calcul" pour voir les pots disponibles.`;
  view = 'besoins';
}
initApp();
</script>
