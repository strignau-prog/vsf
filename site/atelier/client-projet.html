  <title>Client / Projet — Atelier</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="atelier-nav.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* V0 — même système typo/couleurs que tout le projet, voir atelier-compte.html. */
    :root{
      --bg:#fff; --ink:#1c1a17; --muted:#55504a; --line:#e4e0d9; --soft:#f7f5f2;
      --accent:#a8461f;
      --red:var(--ink); --amber:var(--ink); --green:var(--ink);
      --redBg:var(--soft); --amberBg:var(--soft); --greenBg:var(--soft);
      --blue:var(--ink); --blueBg:var(--soft);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    body{font-size:16px;line-height:1.25;font-variant-numeric:tabular-nums}
    h1,h2,.treeTitle,.sousTitre{font-family:Fraunces,Georgia,serif;font-weight:600}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:none;padding:0}
    .app{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
    nav.topnav{background:#1c1a17;color:#fff;display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;font-size:14px}
    nav.topnav a.brand{color:#fff;text-decoration:none;font-weight:600;margin-right:24px;font-size:15px;font-family:Fraunces,Georgia,serif}
    nav.topnav .menuItem{position:relative;height:100%;display:flex;align-items:center}
    nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:0 14px;cursor:pointer;color:#d7dbe4;text-decoration:none}
    nav.topnav .menuItem:hover>span,nav.topnav .menuItem>a.topLink:hover{color:#fff}
    nav.topnav .dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--ink);min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:0 0 10px 10px;overflow:hidden;z-index:50}
    nav.topnav .menuItem:hover .dropdown{display:block}
    nav.topnav .dropdown a{display:block;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:13.5px;border-bottom:1px solid var(--line)}
    nav.topnav .dropdown a:last-child{border-bottom:none}
    nav.topnav .dropdown a:hover{background:var(--soft)}
    nav.topnav .navToggle{display:none;margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
    @media (max-width:820px){
      nav.topnav{flex-wrap:wrap;height:auto;padding:10px 16px}
      nav.topnav .navToggle{display:block}
      nav.topnav .menuItem{display:none;width:100%;height:auto;flex-direction:column;align-items:stretch}
      nav.topnav.navOpen .menuItem{display:flex}
      nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:12px 0 4px;cursor:pointer;display:block}
      nav.topnav .dropdown{position:static;box-shadow:none;border-radius:0;background:transparent;min-width:0}
      nav.topnav .menuItem.open .dropdown{display:block}
      nav.topnav .dropdown a{color:#fff;padding:10px 0 10px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
      nav.topnav .dropdown a:hover{background:rgba(255,255,255,.06)}
    }
    .topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;z-index:20}
    .brand{font-weight:700;font-size:22px;letter-spacing:.02em}
    .brand small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .main{padding:20px 24px 60px 24px;max-width:1400px;margin:0 auto;width:100%}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
    @media (max-width:700px){ .topbar{flex-wrap:wrap;row-gap:8px} }
    .ghostBtn,.actionBtn,.miniBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px}
    .actionBtn{background:#111;color:#fff;border-color:#111}
    .ghostBtn{color:var(--muted)}
    .toggleBar{display:flex;gap:8px}
    .toggleBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:14px;color:var(--muted)}
    .toggleBtn.active{background:#111;color:#fff;border-color:#111}
    .agendaMois{font-weight:700;font-size:15px;margin:18px 0 8px 0;text-transform:capitalize}
    .agendaMois:first-child{margin-top:0}
    .agendaLigne{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
    .agendaLigne:hover{background:var(--soft)}
    .agendaDates{font-size:12.5px;color:var(--muted);min-width:110px}
    @media (max-width:640px){ .agendaLigne{flex-wrap:wrap} .agendaDates{min-width:0} }
    .mainPleine{max-width:none}
    .blocSites{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);margin:10px 0 14px 0}
    .siteCarte{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
    .siteEntete{display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .siteLigne{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
    .sf>label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
    .sf .inputLeger{width:100%}
    .chipPeintre{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12.5px;margin:0 4px 4px 0;cursor:pointer;background:#fff}
    .chipPeintre.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .chipPeintre input{display:none}
    .siteGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    @media (max-width:700px){ .siteGrid{grid-template-columns:1fr 1fr} }
    .ficheDrawerVoile{position:fixed;inset:0;background:rgba(20,18,15,.35);z-index:110}
    .ficheDrawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,96vw);background:#fff;overflow:auto;padding:18px 22px;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
    .ficheDrawer .ficheGrid{grid-template-columns:1fr}
    .calWrap{display:grid;grid-template-columns:minmax(220px,25%) minmax(0,1fr);gap:16px;align-items:start}
    .calWrapReduit{grid-template-columns:auto minmax(0,1fr)}
    .calVolet{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);height:calc(100vh - 215px);min-height:380px;overflow:auto}
    .calVoletRabat{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 8px;font-size:13px;font-weight:600;writing-mode:vertical-rl;cursor:pointer}
    .calPret{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
    .calPret:hover{border-color:#bdb6aa}
    @media (max-width:820px){ .calWrap,.calWrapReduit{grid-template-columns:1fr} .calVoletRabat{writing-mode:horizontal-tb} }
    .ganttScroll{overflow:auto;height:calc(100vh - 215px);min-height:380px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px}
    .ganttBarre{box-sizing:border-box;position:absolute;height:26px;line-height:26px;background:var(--ink);color:#fff;border-radius:7px;padding:0 9px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
    .ganttBarre{cursor:grab;touch-action:none;user-select:none}
    .ganttBarre:active{cursor:grabbing}
    .ganttPoignee{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
    .ganttPoignee.g{left:0}
    .ganttPoignee.d{right:0}
    .ganttPoignee:hover{background:rgba(255,255,255,.35)}
    .ganttBarre:hover{background:var(--accent,#a8461f)}
    .ganttConflit{outline:2px solid #e5483b;outline-offset:1px}
    .ganttLabelHors{position:absolute;height:26px;line-height:26px;font-size:12.5px;white-space:nowrap;cursor:pointer}
    .input,.select,.textarea{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;font-size:15px}
    .inputLeger{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:6px 2px;font-size:14.5px;font-family:inherit;color:inherit}
    .inputLeger:focus{outline:none;border-bottom-color:var(--ink)}
    select.inputLeger{padding:6px 0}
    .treeTitle{font-weight:700;font-size:21px;margin:0 0 4px 0}
    .sectionSub{font-size:14px;color:var(--muted);margin:0 0 14px 0}
    .muted{color:var(--muted)}
    .tiny{font-size:12.5px;line-height:1.35}
    .chip{display:inline-flex;align-items:center;padding:4px 11px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;white-space:nowrap}
    .chip.red,.chip.amber,.chip.green{border-color:var(--line);background:var(--soft);color:var(--ink);font-weight:700}

    .board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity;align-items:flex-start}
    .col{flex:0 0 clamp(250px,19vw,300px);height:min(420px,calc(100vh - 300px));min-height:300px;display:flex;flex-direction:column;background:var(--soft);border-radius:8px;padding:10px;scroll-snap-align:start}
    .col h4{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:15px;font-weight:800;line-height:1.25;letter-spacing:-.005em;text-transform:none;text-align:left;color:var(--ink);margin:0 0 8px 0;padding:2px 2px 8px;border-bottom:1px solid var(--line);min-height:40px}
    .col h4 .colNom{flex:1 1 auto;min-width:0}
    .colN{flex:0 0 auto;min-width:26px;text-align:center;font-size:13px;font-weight:800;color:#fff;background:var(--ink);border-radius:999px;padding:2px 9px;line-height:1.35}
    .colN.vide{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
    .colCards{flex:1 1 auto;min-height:0;overflow-y:auto}
    .col.dragOver{background:var(--amberBg);outline:2px dashed var(--amber);outline-offset:-2px}
    .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;margin-bottom:6px;cursor:grab;box-shadow:0 1px 2px rgba(20,15,10,.08),0 1px 1px rgba(20,15,10,.05)}
    .card:hover{border-color:var(--amber)}
    .card.selected{border-color:var(--amber);background:var(--amberBg)}
    .card.dragging{opacity:.4}
    @media (max-width:700px){
      .board{gap:8px}
      .col{flex:0 0 78vw;height:min(420px,calc(100vh - 260px));min-height:300px;padding:8px}
      .col h4{font-size:14px}
      .card{font-size:12.5px;padding:8px 9px}
    }
    .card .cName{font-weight:700;font-size:13.5px;line-height:1.25}
    .card .cMeta{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.3}
    .ficheHeader,.ficheGrid{max-width:1400px;margin-left:auto;margin-right:auto}

    .ficheHeader{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:22px}
    .ficheGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;align-items:start}
    @media (max-width:1100px){ .ficheGrid{grid-template-columns:1fr} }
    .colonneFiche{border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
    .colDroiteFiche{display:flex;flex-direction:column;gap:16px;min-width:0}
    .colDroiteFiche .blocSites{margin:0}   /* « Dates du chantier » au-dessus de « Points de contrôle » */
    .champLecture{margin-bottom:14px}
    .champLecture label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;font-weight:600}
    .champLecture p{margin:0 0 2px 0;font-size:14.5px;line-height:1.45}
    .sousTitre{font-size:15px;font-weight:700;margin:22px 0 10px 0;padding-bottom:6px;border-bottom:2px solid var(--line);color:var(--ink)}
    .checkItem{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
    .checkItem:last-of-type{border-bottom:none}
    .checkItem input{margin-top:3px;flex:0 0 auto}
    .stepsRow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
    .stepChip{flex:0 0 auto;padding:7px 11px;border-radius:7px;font-size:10.5px;font-weight:700;white-space:nowrap}
    .stepChip.fait{background:var(--greenBg);color:var(--green)}
    .stepChip.attente{background:var(--amber);color:#fff}
    .stepChip.avenir{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
    .respLine{font-size:13px;color:var(--muted);margin:8px 0 0 0}
    .respLine b{color:var(--ink)}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;font-weight:600}
    .fieldAuto{position:relative}
    .sugBox{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:220px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.10)}
    .sugItem{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line)}
    .sugItem:last-child{border-bottom:none}
    .sugItem:hover{background:var(--soft)}
    .field input,.field textarea{width:100%}
    .lectureSouple{font-size:14.5px;font-weight:500;line-height:1.45;padding:5px 2px;cursor:text;display:flex;align-items:flex-start;flex-wrap:wrap;gap:4px}
    .lectureSouple:hover{background:var(--soft);border-radius:6px}
    .lectureSouple .ghostBtn{opacity:0;transition:opacity .1s}
    .lectureSouple:hover .ghostBtn{opacity:1}
    .inputSouple{width:100%;border:none;border-bottom:2px solid var(--amber,#b54708);background:var(--soft);border-radius:6px 6px 0 0;padding:7px 8px;font-size:14.5px;font-family:inherit}
    .inputSouple:focus{outline:none}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .manqueRow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--amberBg);color:var(--amber);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:13.5px;font-weight:600}
    .histoLine{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
    .histoLine:last-child{border-bottom:none}
    .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
    .errBox{padding:24px;color:var(--red);font-family:monospace;white-space:pre-wrap}
    .overlay{position:fixed;inset:0;background:rgba(20,15,10,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100}
    .modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px 24px}

<body>
<div class="app"></div>
<script src="module-lecteur.js"></script>
<script>
const SUPABASE_URL = 'https://uuuigousvpijskbdhcal.supabase.co';
const SUPABASE_KEY = 'sb_publishable__YuNj5XCo5YF8lwhwTu5OQ_RDM1Eesp';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
const STORAGE = { currentEst:'ac_current_est_v1' };
function getCurrentEstId(){ const fromUrl=new URLSearchParams(window.location.search).get('est'); if(fromUrl) return fromUrl; return localStorage.getItem(STORAGE.currentEst)||''; }
let ESTABLISHMENT_ID = '';
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) }
function toggleMenuItem(el){ el.parentElement.classList.toggle('open'); }
function toggleNav(){ document.querySelector('nav.topnav').classList.toggle('navOpen'); }
function estUrl(page){ return page+'?est='+encodeURIComponent(ESTABLISHMENT_ID); }

// Les étapes viennent de la table etapes_kanban (chargées au démarrage) — plus codées
// en dur, pour que l'intitulé affiché soit renommable sans toucher au code. La colonne
// "qualification" (label "À qualifier") est la cible de toute carte créée par le
// formulaire client public (voir fonction soumettre_devis_client côté base).
let ETAPES = [];
let INDEX_ETAPE = {};
// Point 1 (bloc Kanban) — signaux client, purement informatifs : jamais de
// déclenchement automatique d'étape, c'est toujours "Valider «étape»" (bouton
// existant) qui fait avancer le suivi. Un signal en_attente depuis plus de
// SEUIL_RELANCE_SIGNAL_JOURS jours est traité comme une relance à faire.
const TYPE_SIGNAL_LABEL = { validation_devis:'Devis validé', validation_croquis:'Croquis validé', paiement_acompte:'Acompte reçu', date_validee:'Date validée' };
const SEUIL_RELANCE_SIGNAL_JOURS = 3;
let SIGNAUX_CLIENT = {};
// Point 6 — labels manuels personnalisables par atelier (nom libre + couleur), distincts
// des labels système (badge des signaux client, non touché ici).
let LABELS_ATELIER = [];
let PROJET_LABELS = {};
async function chargerLabels(){
  const { data: labels, error: e1 } = await sb.from('labels_atelier').select('*').eq('establishment_id', ESTABLISHMENT_ID).order('created_at');
  if(e1) throw e1;
  LABELS_ATELIER = labels || [];
  const { data: liens, error: e2 } = await sb.from('projet_labels').select('projet_id,label_id');
  if(e2) throw e2;
  PROJET_LABELS = {};
  for(const l of (liens||[])) (PROJET_LABELS[l.projet_id] = PROJET_LABELS[l.projet_id] || []).push(l.label_id);
}
async function toggleLabelProjet(projetId, labelId, actif){
  if(actif){
    const { error } = await sb.from('projet_labels').insert({ projet_id:projetId, label_id:labelId });
    if(error){ alert('Erreur : '+error.message); return; }
    (PROJET_LABELS[projetId] = PROJET_LABELS[projetId] || []).push(labelId);
  } else {
    const { error } = await sb.from('projet_labels').delete().eq('projet_id',projetId).eq('label_id',labelId);
    if(error){ alert('Erreur : '+error.message); return; }
    PROJET_LABELS[projetId] = (PROJET_LABELS[projetId]||[]).filter(id=>id!==labelId);
  }
  render();
}
async function ouvrirNouveauLabel(){
  const nom = await demander('Nom du nouveau label :', ''); if(!nom || !nom.trim()) return;
  nouveauLabelNom = nom.trim();
  render();
}
async function choisirCouleurLabel(couleur){
  const nom = nouveauLabelNom; if(!nom) return;
  nouveauLabelNom = null;
  const { data, error } = await sb.from('labels_atelier').insert({ establishment_id:ESTABLISHMENT_ID, nom, couleur }).select().single();
  if(error){ alert('Erreur : '+error.message); render(); return; }
  LABELS_ATELIER.push(data); render();
}
function ouvrirLabelsPicker(projetId){ labelsPickerPour = projetId; nouveauLabelNom = null; render(); }
function ouvrirGestionLabels(){ labelsPickerPour = '__gestion__'; nouveauLabelNom = null; render(); }
function fermerLabelsPicker(){ labelsPickerPour = null; nouveauLabelNom = null; render(); }
function renderLabelsPickerModal(){
  const projetId = labelsPickerPour;
  const gestion = projetId === '__gestion__'; // ouvert depuis "⋯" à côté de Kanban : gérer la palette de l'atelier, pas un projet précis
  return `<div class="overlay" onclick="if(event.target===event.currentTarget) fermerLabelsPicker()">
    <div class="modal" style="max-width:360px">
      <div class="treeTitle" style="font-size:17px;margin-bottom:10px">${gestion ? "Labels de l'atelier" : 'Labels'}</div>
      ${nouveauLabelNom ? `
        <div class="tiny muted" style="margin-bottom:8px">Couleur pour « ${escapeHtml(nouveauLabelNom)} »</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${PALETTE_LABELS.map(c=>`<span style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)" onclick="choisirCouleurLabel('${c}')"></span>`).join('')}
        </div>
        <button class="ghostBtn" style="margin-top:10px" onclick="nouveauLabelNom=null;render()">Annuler</button>
      ` : `
        <div style="display:flex;flex-direction:column;gap:6px">
          ${LABELS_ATELIER.map(l=>{
            const actif = !gestion && (PROJET_LABELS[projetId]||[]).includes(l.id);
            const chip = `<span ${gestion?'':`onclick="toggleLabelProjet('${projetId}','${l.id}',${!actif})"`} style="cursor:${gestion?'default':'pointer'};flex:1;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;${actif?`color:#fff;background:${escapeHtml(l.couleur)}`:`color:${escapeHtml(l.couleur)};border:1px solid ${escapeHtml(l.couleur)}`}">${escapeHtml(l.nom)}${actif?' ✓':''}</span>`;
            return `<div style="display:flex;align-items:center;gap:8px">${chip}<span onclick="supprimerLabelAtelier('${l.id}')" title="Supprimer ce label de l'atelier" style="opacity:.5;cursor:pointer">🗑</span></div>`;

// Chantier 3 — pont Kanban → référentiel-formation : situation_etapes_erp (déjà peuplé, 25
// lignes) relie une étape du Kanban à une situation réelle du référentiel ; module_situations
// donne ensuite les modules rattachés à cette situation. Le lien est au niveau de l'ÉTAPE, pas
// de chaque point de contrôle individuellement (la donnée ne va pas plus fin) — un seul bloc
// "Besoin d'aide ?" par étape, pas un lien par ligne de checklist.
let MODULES_PAR_ETAPE = {};
async function chargerModulesParEtape(){
  const { data: liens, error: e1 } = await sb.from('situation_etapes_erp').select('etape_cle,situation_uid');
  if(e1) throw e1;
  if(!liens || !liens.length){ MODULES_PAR_ETAPE = {}; return; }
  const uids = [...new Set(liens.map(l=>l.situation_uid))];
  const { data: modSit, error: e2 } = await sb.from('module_situations').select('module_id,situation_id').in('situation_id', uids);
  if(e2) throw e2;
  const moduleIds = [...new Set((modSit||[]).map(m=>m.module_id))];
  let moduleParId = {};
  if(moduleIds.length){
    const { data: modules, error: e3 } = await sb.from('modules_apprentissage').select('id,nom,lien_ressource,statut').in('id', moduleIds).eq('statut','publie');
    if(e3) throw e3;
    for(const m of (modules||[])) moduleParId[m.id] = m;
  }
  const modulesParSituUid = {};
  for(const ms of (modSit||[])){
    const mod = moduleParId[ms.module_id]; if(!mod) continue;
    (modulesParSituUid[ms.situation_id] = modulesParSituUid[ms.situation_id] || []).push(mod);
  }
  const parEtape = {};
  for(const l of liens){
    const mods = modulesParSituUid[l.situation_uid] || [];
    if(!mods.length) continue;
    const set = (parEtape[l.etape_cle] = parEtape[l.etape_cle] || new Map());
    for(const m of mods) set.set(m.id, m);
  }
  MODULES_PAR_ETAPE = {};
  for(const cle in parEtape) MODULES_PAR_ETAPE[cle] = [...parEtape[cle].values()];
}

// epreuve_situations → epreuves_transition), objet frère des modules, jamais fondu
// dans la même table. Un seul bloc "Besoin d'aide ?" affiche les deux ensemble.
let EPREUVES_PAR_ETAPE = {};

  if(e2) throw e2;

    const { data: epreuves, error: e3 } = await sb.from('epreuves_transition').select('id,nom,type_epreuve,statut').in('id', epreuveIds).eq('statut','publie');
    if(e3) throw e3;
    for(const e of (epreuves||[])) epreuveParId[e.id] = e;
  }
  const epreuvesParSituUid = {};
  for(const es of (epSit||[])){
    const ep = epreuveParId[es.epreuve_id]; if(!ep) continue;
    (epreuvesParSituUid[es.situation_id] = epreuvesParSituUid[es.situation_id] || []).push(ep);
  }
  const parEtape = {};
  for(const l of liens){

    if(!eps.length) continue;
    const set = (parEtape[l.etape_cle] = parEtape[l.etape_cle] || new Map());
    for(const e of eps) set.set(e.id, e);
  }
  EPREUVES_PAR_ETAPE = {};
  for(const cle in parEtape) EPREUVES_PAR_ETAPE[cle] = [...parEtape[cle].values()];
}

function dateFr(d){ if(!d) return ''; const dt=new Date(d); return isNaN(dt)?'':dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}); }
function aujourdhuiFr(){ return new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}); }
function isoAujourdhui(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Les anciens échanges n'ont qu'un "jj/mm" sans année : on la déduit (jamais dans le futur).
function cleDateEchange(h){
  if(h.iso) return h.iso;
  const m = /^(\d{2})\/(\d{2})(?:\/(\d{4}))?$/.exec(h.date||''); if(!m) return '';
  const auj = new Date();
  let d = new Date(m[3] ? Number(m[3]) : auj.getFullYear(), Number(m[2])-1, Number(m[1]));
  if(!m[3] && d > auj) d = new Date(d.getFullYear()-1, d.getMonth(), d.getDate());
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Du plus récent en haut vers le plus ancien en bas, y compris les échanges importés de la
// prospection ; à date égale, le dernier saisi passe devant.
function echangesTries(p){
  return (p.historique||[]).map((h,i)=>({ h, i })).filter(x=>x.h.type)
    .sort((a,b)=> cleDateEchange(b.h).localeCompare(cleDateEchange(a.h)) || b.i - a.i).map(x=>x.h);
}

/* =========================================================================
   CALENDRIER CHANTIER (Partie 2, item 6) — agenda chronologique croisant les
   dates d'exécution prévues (date_debut/date_fin) avec les projets en cours.
   Une liste groupée par mois plutôt qu'une grille mensuelle : plus simple à
   lire et à toucher sur téléphone (priorité mobile confirmée).
   ========================================================================= */
const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const GANTT_JOUR_PX = 34;
const GANTT_LIGNE_PX = 38;
const JOURS_INITIALES = ['D','L','M','M','J','V','S'];
let ganttScrollMemo = null;
let ganttTopMemo = 0;
const GANTT_ZOOMS = [22, 34, 52, 80];
let ganttZoomIdx = 1;
function zoomGantt(delta){ ganttZoomIdx = Math.max(0, Math.min(GANTT_ZOOMS.length-1, ganttZoomIdx+delta)); ganttScrollMemo = null; render(); }
let calVoletOuvert = true;
function basculerVoletCal(){ calVoletOuvert = !calVoletOuvert; ganttScrollMemo = null; render(); }
function jourDepuis(s){ return new Date(s+'T00:00:00'); }
function numSemaineISO(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay()||7));
  const an = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t-an)/86400000 + 1) / 7);
}
function entreesChantier(p){
  const sites = (sitesParProjet[p.id] || []).filter(s=>s.date_debut);
  if(sites.length) return sites.map(s=>({ cle:s.id, nom:s.nom, adresse:s.adresse, date_debut:s.date_debut, date_fin:s.date_fin, heure_debut:s.heure_debut, heure_fin:s.heure_fin, duree_heures:s.duree_heures, intervenants:s.intervenants||[] }));
  if(p.date_debut && !(sitesParProjet[p.id]||[]).length) return [{ cle:p.id, nom:null, adresse:null, date_debut:p.date_debut, date_fin:p.date_fin, intervenants:[] }];
  return [];
}
function renderCalendrier(){
  const derniereEtape = ETAPES[ETAPES.length-1].cle;
  const planifies = projets.map(p=>({ p, entrees:entreesChantier(p) })).filter(x=>x.entrees.length)
    .sort((a,b)=>a.entrees[0].date_debut.localeCompare(b.entrees[0].date_debut));
  const nonPlanifies = projets.filter(p=>!entreesChantier(p).length && p.etape!==derniereEtape);
  const J = 86400000, W = GANTT_ZOOMS[ganttZoomIdx];
  const auj = new Date(); auj.setHours(0,0,0,0);
  let debut = new Date(auj.getTime()-14*J), fin = new Date(auj.getTime()+120*J);
  for(const { entrees } of planifies) for(const e of entrees){
    const d = jourDepuis(e.date_debut), f = e.date_fin ? jourDepuis(e.date_fin) : d;
    if(d<debut) debut = new Date(d.getTime()-3*J);
    if(f>fin) fin = new Date(f.getTime()+7*J);
  }
  debut = new Date(debut.getFullYear(), debut.getMonth(), debut.getDate() - ((debut.getDay()+6)%7)); // lundi
  const nbJours = Math.round((fin-debut)/J) + 1;
  const idx = d => Math.round((d-debut)/J);
  const jours = Array.from({length:nbJours}, (_,i)=> new Date(debut.getFullYear(), debut.getMonth(), debut.getDate()+i));
  const groupes = (cleFn, labelFn)=>{
    const out = [];
    for(const d of jours){ const c = cleFn(d); const dernier = out[out.length-1]; if(dernier && dernier.cle===c) dernier.n++; else out.push({ cle:c, n:1, label:labelFn(d) }); }
    return out;
  };
  const mois = groupes(d=>d.getFullYear()+'-'+d.getMonth(), d=>MOIS_FR[d.getMonth()]+' '+d.getFullYear());

  // Un peintre ne peut pas être sur deux sites qui se chevauchent : on le signale sur la barre.

  const intervalle = e => {
    const d = jourDepuis(e.date_debut), f = e.date_fin ? jourDepuis(e.date_fin) : d;
    const hd = hhmmEnMin(e.heure_debut), hf = hhmmEnMin(e.heure_fin);

  };
  const occupation = {};
  for(const { entrees } of planifies) for(const e of entrees){

  }

  let top = 6;

      const dedans = largeur >= 190;
      elements.push(`<div class="ganttBarre${conflits.length?' ganttConflit':''}" title="${titre} — glisse pour déplacer, tire un bord pour changer les jours" onpointerdown="ganttPointerDown(event,'${e.cle}','${p.id}')" onpointermove="ganttPointerMove(event)" onpointerup="ganttPointerUp(event)" onpointercancel="ganttPointerUp(event)" style="left:${left}px;top:${top}px;width:${largeur}px"><span class="ganttPoignee g" data-poignee="gauche"></span>${dedans ? texte : ''}<span class="ganttPoignee d" data-poignee="droite"></span></div>`
        + (dedans ? '' : `<div class="ganttLabelHors" onclick="selectionnerProjet('${p.id}')" style="left:${left+largeur+6}px;top:${top}px">${texte}</div>`));
      top += GANTT_LIGNE_PX;
    }
  }
  const hauteur = Math.max(top, 60) + 6;
  const nbSites = planifies.reduce((n,x)=>n+x.entrees.length, 0);
  const cellule = (n,label,extra)=>`<div style="width:${n*W}px;flex:0 0 ${n*W}px;border-right:1px solid var(--line);padding:3px 6px;overflow:hidden;white-space:nowrap;${extra||''}">${label}</div>`;
  const weekends = jours.map((d,i)=> (d.getDay()===0||d.getDay()===6) ? `<div style="position:absolute;top:0;bottom:0;left:${i*W}px;width:${W}px;background:rgba(0,0,0,.035)"></div>` : '').join('');
  // Volet gauche : projets prêts à être planifiés (de « Validation BAT en attente » jusqu'au
  // chantier, tant qu'aucun site n'a de date) — on clique pour ouvrir la fiche et ajouter un site.
  const ordreDe = p => (ETAPES[INDEX_ETAPE[p.etape]] || {}).ordre;
  const ordreBat = (ETAPES.find(e=>e.cle==='bat_attente') || {}).ordre;
  const ordreFacture = (ETAPES.find(e=>e.cle==='factures_a_envoyer') || {}).ordre;
  const prets = nonPlanifies.filter(p=>ordreDe(p)>=ordreBat && ordreDe(p)<ordreFacture).sort((a,b)=>ordreDe(a)-ordreDe(b));
  const etapesPrets = [...new Set(prets.map(p=>p.etape))];
  const voletHtml = !calVoletOuvert

        ${etapesPrets.map(cle=>`

          ${prets.filter(p=>p.etape===cle).map(p=>`<div class="calPret" onclick="selectionnerProjet('${p.id}')"><div style="font-weight:600;font-size:13.5px">${escapeHtml(libelleProjetCourt(p))}</div>${p.client_nom?`<div class="tiny muted">${escapeHtml(p.client_nom)}</div>`:''}</div>`).join('')}`).join('') || '<div class="tiny muted">Aucun projet prêt à planifier.</div>'}
      </div>`;
  return `

  <div id="ganttScroll" class="ganttScroll" data-today="${idxAuj*W}" onscroll="ganttScrollMemo=this.scrollLeft;ganttTopMemo=this.scrollTop">
    <div style="width:${nbJours*W}px">
      <div style="position:sticky;top:0;z-index:5;background:#fff">
      <div style="display:flex;background:var(--soft);font-weight:700;font-size:13px;text-transform:capitalize">${mois.map(m=>cellule(m.n,`<span style="position:sticky;left:8px">${m.label}</span>`,'overflow:visible;')).join('')}</div>

      <div style="display:flex;font-size:11.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">${jours.map((d,i)=>`<div style="width:${W}px;flex:0 0 ${W}px;text-align:center;padding:3px 0;${i===idxAuj?'background:var(--ink);color:#fff;font-weight:700;':(d.getDay()===0||d.getDay()===6?'color:var(--muted);':'')}"><div>${d.getDate()}</div><div style="font-size:10px;opacity:.75">${JOURS_INITIALES[d.getDay()]}</div></div>`).join('')}</div>
      </div>
      <div style="position:relative;height:max(${hauteur}px, calc(100vh - 345px));background-image:linear-gradient(to right,#eee 1px,transparent 1px);background-size:${W}px 100%">

function dureeDepuisCreation(p){
  if(!p.created_at) return '—';
  const ms = Date.now() - new Date(p.created_at).getTime();
  const jours = Math.floor(ms/86400000);
  if(jours < 1) return 'moins d\'un jour';
  if(jours < 30) return jours+' jour'+(jours>1?'s':'');
  const mois = Math.floor(jours/30);
  return mois+' mois'+(jours%30 ? ' et '+(jours%30)+' j' : '');
}

// Champs jugés nécessaires pour avancer (pas Charte graphique/Contraintes, légitimement
// souvent vides ou "Non/Non concerné" — jamais bloquants). Utilisé à deux endroits : les
// bullet points du bloc "Analyse du besoin IA" et, à l'étape "À qualifier" seulement, les
// lignes de Points de contrôle (voir renderColonnePointsControle) — même source, pas deux
// listes à maintenir séparément.
const CHAMPS_REQUIS_BESOIN = [
  ['texteAPeindre','Texte à peindre'], ['objectif','Besoin du client / objectif'],
  ['dateSouhaitee','Date souhaitée'], ['budget','Budget'],
];
// Dimensions du SUPPORT saisies par le client, lues dans les notes de la demande (le devis, lui, garde celles du lettrage calculé).
function dimsSupportDepuisNotes(devis, support){
  const o = String(((devis && devis.notes_client) || {}).objectif || '');
  const m = new RegExp('\\[' + String(support).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\] Dimensions du support indiquées : ([\\d.,]+) × ([\\d.,]+) cm\\.?\\s*(?:Emprise estimée du lettrage : ([^\\n]*?)(?:, à préciser[^\\n]*)?)?(?:\\n|$)').exec(o);
  return m ? { support: m[1] + ' × ' + m[2] + ' cm', emprise: (m[3] || '').replace(/\.\s*$/, '') } : null;
}
// La fonction SQL qui crée la fiche ne remplit pas « Besoin technique » : on le reprend de la demande du formulaire (une fois, champs vides seulement) et on l'enregistre.
async function completerBesoinDepuisDevis(p, devis){
  if(!p || !devis || !devis.notes_client) return;
  const nc = devis.notes_client, bt = { ...(p.besoin_technique || {}) }, ajout = {};
  const paragraphes = String(nc.objectif || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  const motsClient = paragraphes.filter(x => !x.startsWith('[')).join('\n\n');
  const effet = (/\[Effet souhaité\]\s*([^\n]+)/.exec(String(nc.objectif || '')) || [])[1];
  const supports = (devis.devis_lignes || []).filter(l => l.type === 'calculee').map(l => l.support).filter(Boolean);
  const synthese = supports.length ? 'Lettrage peint : ' + supports.join(', ') + (effet ? ' — ' + effet.trim() : '') : '';
  const candidats = { texteAPeindre: nc.texteAPeindre, objectif: motsClient || synthese, charteGraphique: nc.charteGraphique, dateSouhaitee: nc.dateSouhaitee, contraintes: nc.contraintes };
  for(const [champ, valeur] of Object.entries(candidats)) if(!bt[champ] && valeur && String(valeur).trim()) ajout[champ] = String(valeur).trim();
  if(!Object.keys(ajout).length) return;
  const nouveau = { ...bt, ...ajout };
  p.besoin_technique = nouveau;
  const { error } = await sb.from('projets').update({ besoin_technique: nouveau }).eq('id', p.id);
  if(error) console.error('Besoin technique non enregistré :', error.message);
}
function champsManquantsBesoin(p){
  const bt = p.besoin_technique || {};
  return CHAMPS_REQUIS_BESOIN.filter(([champ])=>!bt[champ]).map(([,label])=>label);
}
// Synthèse "IA" V0 — une phrase assemblée à partir des champs déjà remplis, pas un vrai
// appel à un modèle (décision actée : commencer simple, brancher une vraie IA plus tard
// sans changer l'écran). Tronquée pour rester "très court, l'essentiel".
function syntheseBesoinIA(p){
  const bt = p.besoin_technique || {};
  const parts = [];
  if(bt.texteAPeindre) parts.push(`« ${bt.texteAPeindre} »`);
  if(bt.objectif){ const ligne = bt.objectif.split('\n')[0].trim(); parts.push(ligne.length>140 ? ligne.slice(0,140)+'…' : ligne); }
  let phrase = parts.join(' — ');
  if(bt.dateSouhaitee) phrase += (phrase?'. ':'')+`Souhaité : ${bt.dateSouhaitee}.`;
  return phrase || null;
}
function renderColonneBesoinTechnique(p){
  const d = (p.devis_id && devisDetailChargePourId===p.devis_id) ? devisDetailCharge : null;

async function ajouterSignal(projetId, type, etape){
  let montant = null;
  if(type==='paiement_acompte'){
    const saisie = await demander('Montant de l\'acompte reçu (€) :', '');
    if(saisie===null) return;
    montant = Number(saisie.replace(',','.'));
    if(!isFinite(montant) || montant<=0){ alert('Montant invalide.'); return; }
  }
  const { data, error } = await sb.from('signaux_client').insert({ projet_id:projetId, type, montant, etape }).select().single();
  if(error){ alert('Erreur : '+error.message); return; }
  (SIGNAUX_CLIENT[projetId] = SIGNAUX_CLIENT[projetId] || []).unshift(data);
  render();
}
async function marquerSignalTraite(id){
  const { error } = await sb.from('signaux_client').update({ statut:'traite' }).eq('id', id);
  if(error){ alert('Erreur : '+error.message); return; }
  for(const liste of Object.values(SIGNAUX_CLIENT)){
    const s = liste.find(x=>x.id===id); if(s){ s.statut='traite'; break; }
  }
  render();
}

// une carte Trello : lecture simple par défaut, édition seulement au clic sur "Modifier",
// enregistrement automatique en quittant le champ (jamais de bouton "Enregistrer" séparé —
// principe directeur : minimiser le nombre de clics).
let champEnEditionBt = null;
function ouvrirEditionBt(champ){ champEnEditionBt = champ; render(); const el=document.getElementById('editBt_'+champ); if(el) el.focus(); }
function renderChampBt(p, champ, label, multiligne){
  const bt = p.besoin_technique || {};
  const valeur = bt[champ] || '';
  if(champEnEditionBt === champ){
    return `<div class="field" style="margin-top:8px"><label>${escapeHtml(label)}</label>
      ${multiligne
        ? `<textarea class="inputSouple" id="editBt_${champ}" rows="4" onblur="enregistrerChampBt('${p.id}','${champ}',this.value)">${escapeHtml(valeur)}</textarea>`

    </div>`;

  return `<div class="field" style="margin-top:8px"><label>${escapeHtml(label)}</label>

async function enregistrerChampBt(projetId, champ, valeur){
  const p = projets.find(x=>x.id===projetId); if(!p) return;
  const besoin_technique = { ...(p.besoin_technique||{}), [champ]: valeur.trim() || undefined };
  p.besoin_technique = besoin_technique;
  champEnEditionBt = null;
  render();
  const { error } = await sb.from('projets').update({ besoin_technique }).eq('id', projetId);
  if(error) alert('Erreur : '+error.message);
}

// Point 1 (ergonomie fiche projet) — pièces jointes ajoutées directement sur la fiche,
// dans la même liste que les photos historiques du devis (distinguées par un badge, pas
// deux sections séparées).
let uploadPieceJointeEnCours = false;
async function ajouterPieceJointeProjet(projetId, input){
  const file = input.files[0]; if(!file) return;
  uploadPieceJointeEnCours = true; render();
  try{
    const chemin = `${projetId}/${Date.now()}-${file.name}`;
    const { error } = await sb.storage.from('pieces-jointes-projet').upload(chemin, file);
    if(error) throw error;
    const { data } = sb.storage.from('pieces-jointes-projet').getPublicUrl(chemin);
    const p = projets.find(x=>x.id===projetId); if(!p) return;
    const pieces_jointes = [...(p.pieces_jointes||[]), { nom:file.name, url:data.publicUrl, type:file.type }];
    p.pieces_jointes = pieces_jointes;
    const { error: eUp } = await sb.from('projets').update({ pieces_jointes }).eq('id', projetId);
    if(eUp) throw eUp;
  }catch(err){
    alert('Erreur d\'envoi : '+(err.message||err));
  }
  uploadPieceJointeEnCours = false;
  render();
}
async function supprimerPieceJointeProjet(projetId, index){
  const p = projets.find(x=>x.id===projetId); if(!p) return;
  const pieces_jointes = (p.pieces_jointes||[]).filter((_,i)=>i!==index);
  p.pieces_jointes = pieces_jointes; render();
  const { error } = await sb.from('projets').update({ pieces_jointes }).eq('id', projetId);
  if(error) alert('Erreur : '+error.message);
}

/* =========================================================================
   SITES DE CHANTIER — un projet (un seul devis, facturé par l'atelier porteur)
   peut avoir plusieurs sites simultanés : adresse, dates, heures et peintres
   propres à chacun (équipe interne ou partenaires déjà invités sur le projet).
   projets.date_debut / date_fin restent tenus à jour (min / max des sites).
   ========================================================================= */
let sitesParProjet = {};
const HEURES_PAR_JOUR_CHANTIER = 7; // même journée de référence que les devis (2 m² = 7 h)
function hhmmEnMin(s){ if(!s) return null; const [h,m] = String(s).slice(0,5).split(':').map(Number); return h*60 + (m||0); }
function minEnHhmm(min){ return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function ajouterJoursIso(iso, n){
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Saisie d'heure souple : « 9 », « 9h », « 9h30 », « 930 », « 9:30 » → « 09:30 ». null = vide, undefined = illisible.
function parseHeure(v){
  const s = String(v ?? '').trim().toLowerCase().replace(/\s+/g, '');
  if(!s) return null;
  let h, m, r;
  if((r = s.match(/^(\d{1,2})(?:h|:)(\d{1,2})?$/))){ h = +r[1]; m = r[2]==null ? 0 : +r[2]; }
  else if((r = s.match(/^(\d{3,4})$/))){ const p = r[1].padStart(4,'0'); h = +p.slice(0,2); m = +p.slice(2); }
  else if((r = s.match(/^(\d{1,2})$/))){ h = +r[1]; m = 0; }
  else return undefined;
  if(h>23 || m>59) return undefined;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
// Jours ouvrés = lundi à vendredi. Le jour de début compte toujours, même un samedi.
function estJourOuvre(d){ const j = d.getDay(); return j!==0 && j!==6; }
function joursOuvresEntre(debutIso, finIso){
  let n = 1;
  const f = new Date(finIso+'T00:00:00');
  for(const x = new Date(debutIso+'T00:00:00'); ; ){
    x.setDate(x.getDate()+1);
    if(x > f) break;
    if(estJourOuvre(x)) n++;
  }
  return n;
}
function ajouterJoursOuvres(iso, n){
  const d = new Date(iso+'T00:00:00');
  while(n>0){ d.setDate(d.getDate()+1); if(estJourOuvre(d)) n--; }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function heuresParJourSite(s){ const h = Number(s.heures_par_jour); return h>0 ? h : HEURES_PAR_JOUR_CHANTIER; }
// Calculateur début / fin / durée. Le dernier champ modifié pilote le calcul :
//  - durée, début ou heures/jour modifiés (avec une durée) → la fin se déduit (jours ouvrés, journée de N h) ;
//  - fin modifiée (ou début sans durée) → la durée se déduit.
// Ne renvoie que les champs déduits. Journée « forcée » possible (ex : 11 h) via heures_par_jour.
function calculerSite(s, champ){
  const auto = {};
  if(!s.date_debut) return auto;
  const hpj = heuresParJourSite(s);
  const debutMin = hhmmEnMin(s.heure_debut), finMin = hhmmEnMin(s.heure_fin);
  const duree = Number(s.duree_heures);
  const depuisDuree = champ==='duree_heures' || (['heure_debut','date_debut','heures_par_jour'].includes(champ) && duree>0);
  if(depuisDuree && duree>0){
    const jours = Math.max(1, Math.ceil(duree/hpj - 1e-9));
    const dernierJour = duree - hpj*(jours-1);
    const finJourMin = debutMin!=null ? debutMin + Math.round(dernierJour*60) : null;
    auto.date_fin = ajouterJoursOuvres(s.date_debut, jours-1);
    auto.heure_fin = (finJourMin!=null && finJourMin<=24*60-1) ? minEnHhmm(finJourMin) : null;
  } else if(['date_fin','heure_fin','heure_debut','date_debut','heures_par_jour'].includes(champ) && (s.date_fin || finMin!=null)){
    const fin = s.date_fin || s.date_debut;
    if(fin < s.date_debut) return auto;
    const n = joursOuvresEntre(s.date_debut, fin);
    const horairesOk = debutMin!=null && finMin!=null && finMin>debutMin;
    if(n===1) auto.duree_heures = horairesOk ? Math.round((finMin-debutMin)/60*100)/100 : hpj;
    else {
      const dernier = horairesOk ? Math.min(hpj, (finMin-debutMin)/60) : hpj;
      auto.duree_heures = Math.round(((n-1)*hpj + dernier)*100)/100;
    }
  }
  return auto;
}
function resumeSite(s){
  const duree = Number(s.duree_heures);
  if(!s.date_debut || !(duree>0)) return 'Saisis début + fin, ou début + durée : le reste se calcule.';
  const n = joursOuvresEntre(s.date_debut, s.date_fin || s.date_debut);
  const nb = (s.intervenants||[]).length;
  return `⏱ ${duree} h de travail sur ${n} jour${n>1?'s':''} ouvré${n>1?'s':''} (journée de ${heuresParJourSite(s)} h)${nb>1 ? ` · 👥 ${nb} peintres ≈ ${Math.round(duree*nb*100)/100} h-peintre` : ''}`;
}
async function majSiteHeure(siteId, champ, valeur){
  const h = parseHeure(valeur);
  if(h===undefined){ alert('Heure non reconnue — écris par exemple 9, 9h, 9h30 ou 14:00.'); render(); return; }
  await majSite(siteId, { [champ]: h });
}
function libelleHorairesSite(s){
  const h = s.heure_debut ? String(s.heure_debut).slice(0,5) : null;
  const f = s.heure_fin ? String(s.heure_fin).slice(0,5) : null;
  const d = s.duree_heures ? `${Number(s.duree_heures)} h` : null;
  return [h ? (f && (!s.date_fin || s.date_fin===s.date_debut) ? `${h}–${f}` : `dès ${h}`) : null, d].filter(Boolean).join(' · ');
}
async function chargerSites(){
  sitesParProjet = {};
  try{
    const ids = projets.map(p=>p.id); if(!ids.length) return;
    const { data: sites, error: e1 } = await sb.from('projet_sites').select('*').in('projet_id', ids).order('ordre').order('created_at');
    if(e1) throw e1;
    const siteIds = (sites||[]).map(s=>s.id);
    let liens = [];
    if(siteIds.length){
      const { data, error: e2 } = await sb.from('projet_site_intervenants').select('*').in('site_id', siteIds);
      if(e2) throw e2;
      liens = data || [];
    }
    for(const s of (sites||[])){
      s.intervenants = liens.filter(l=>l.site_id===s.id).map(l=>l.personne_id);
      (sitesParProjet[s.projet_id] = sitesParProjet[s.projet_id] || []).push(s);
      // Durée jamais calculée (dates saisies avant le calculateur) : on la calcule et on l'enregistre.
      if(s.date_debut && s.date_fin && (s.duree_heures==null)){
        const auto = calculerSite(s, 'date_fin');
        if(auto.duree_heures!=null){ s.duree_heures = auto.duree_heures; sb.from('projet_sites').update({ duree_heures:auto.duree_heures }).eq('id', s.id).then(()=>{}); }
      }
    }
    const aResoudre = [...new Set(liens.map(l=>l.personne_id))].filter(id=>!nomsPersonnes[id]);
    if(aResoudre.length){
      const { data: fm } = await sb.from('federation_members').select('user_id,nom,prenom').in('user_id', aResoudre);
      for(const f of (fm||[])) nomsPersonnes[f.user_id] = `${f.prenom||''} ${f.nom||''}`.trim() || null;
    }
  }catch(e){ console.warn('Sites de chantier indisponibles :', e.message); }
}

  for(const k in sitesParProjet){ const s = sitesParProjet[k].find(x=>x.id===id); if(s) return s; }
  return null;
}
async function synchroDatesProjet(projetId){
  const p = projets.find(x=>x.id===projetId); if(!p) return;
  const sites = sitesParProjet[projetId] || [];
  const debuts = sites.map(s=>s.date_debut).filter(Boolean).sort();
  const fins = sites.map(s=>s.date_fin || s.date_debut).filter(Boolean).sort();
  const date_debut = debuts[0] || null, date_fin = fins.length ? fins[fins.length-1] : null;
  p.date_debut = date_debut; p.date_fin = date_fin; render();
  const { error } = await sb.from('projets').update({ date_debut, date_fin }).eq('id', projetId);
  if(error) alert('Erreur : '+error.message);
}

  const { data, error } = await sb.from('projet_sites').insert({ projet_id:projetId, ordre:liste.length }).select().single();
  if(error){ alert('Erreur : '+error.message+"\n\n(Si le message parle d'une table ou d'une colonne introuvable, une migration SQL « sites de chantier » n'a pas encore été lancée.)"); return; }
  data.intervenants = []; liste.push(data); render();
}
async function majSite(siteId, patch){
  const s = trouverSite(siteId); if(!s) return;
  const champ = Object.keys(patch)[0];
  const test = { ...s, ...patch };
  if(test.date_debut && test.date_fin && test.date_fin < test.date_debut){ alert('La fin du site ne peut pas être avant son début.'); render(); return; }
  if(test.date_debut && (!test.date_fin || test.date_fin===test.date_debut) && test.heure_debut && test.heure_fin && hhmmEnMin(test.heure_fin) <= hhmmEnMin(test.heure_debut)){
    alert("L'heure de fin doit être après l'heure de début."); render(); return;
  }
  Object.assign(s, patch);
  const auto = calculerSite(s, champ);
  Object.assign(s, auto); render();
  const { error } = await sb.from('projet_sites').update({ ...patch, ...auto }).eq('id', siteId);
  if(error){ alert('Erreur : '+error.message); return; }
  if('date_debut' in patch || 'date_fin' in patch || 'date_fin' in auto) await synchroDatesProjet(s.projet_id);
}
async function supprimerSite(siteId){
  const s = trouverSite(siteId); if(!s) return;
  if(!await confirmer('Supprimer ce site ?')) return;
  const { error } = await sb.from('projet_sites').delete().eq('id', siteId);
  if(error){ alert('Erreur : '+error.message); return; }
  sitesParProjet[s.projet_id] = sitesParProjet[s.projet_id].filter(x=>x.id!==siteId);
  await synchroDatesProjet(s.projet_id);
}
async function basculerPeintreSite(siteId, personneId, coche){
  const s = trouverSite(siteId); if(!s) return;
  if(coche){
    const { error } = await sb.from('projet_site_intervenants').insert({ site_id:siteId, personne_id:personneId });
    if(error){ alert('Erreur : '+error.message); render(); return; }
    if(!s.intervenants.includes(personneId)) s.intervenants.push(personneId);
  } else {
    const { error } = await sb.from('projet_site_intervenants').delete().eq('site_id', siteId).eq('personne_id', personneId);
    if(error){ alert('Erreur : '+error.message); render(); return; }
    s.intervenants = s.intervenants.filter(x=>x!==personneId);
  }
  render();
}
function renderBlocSites(p){
  const sites = sitesParProjet[p.id] || [];
  const multi = sites.length > 1;
  const chargee = equipeChargeePourId === p.id;
  const dispo = equipeIntervenants.filter(i=>i.statut!=='refuse');
  const hh = v => escapeHtml(v ? String(v).slice(0,5) : '');
  const prenomCourt = id => (nomPersonne(id)||'').split(' ')[0];
  const chips = s => !chargee ? '<span class="tiny muted">…</span>' : dispo.length ? dispo.map(iv=>{
    const on = s.intervenants.includes(iv.personne_id);
    return `<label class="chipPeintre ${on?'on':''}" title="${escapeHtml(nomPersonne(iv.personne_id))}${iv.statut==='invite'?' — invitation en attente':''}"><input type="checkbox" ${on?'checked':''} onchange="basculerPeintreSite('${s.id}','${iv.personne_id}',this.checked)">${iv.externe?'🤝 ':''}${escapeHtml(prenomCourt(iv.personne_id))}</label>`;
  }).join('') : '<span class="tiny muted">aucun peintre assigné au projet (« Équipe &amp; heures »)</span>';
  return `
  <div class="blocSites">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <div class="treeTitle" style="font-size:16px;margin:0">📅 Dates du chantier <span class="tiny muted" style="font-weight:400;font-family:Inter,system-ui,sans-serif">— début + fin → durée auto (lun–ven, ${HEURES_PAR_JOUR_CHANTIER} h/jour) · début + durée → fin auto</span></div>
      ${sites.length ? `<button class="ghostBtn" style="padding:3px 10px;font-size:12.5px" onclick="ajouterSite('${p.id}')" title="Plusieurs sites en simultané, chacun avec ses dates et ses peintres. Le devis reste unique.">+ site</button>` : ''}
    </div>
    ${sites.map((s,i)=>`
    <div class="siteCarte">
      ${multi ? `<div class="siteEntete">
        <input class="inputLeger" style="flex:1;min-width:120px" value="${escapeHtml(s.nom||'')}" placeholder="Site ${i+1} — nom (ex : Façade rue)" onchange="majSite('${s.id}',{nom:this.value.trim()||null})">
        <input class="inputLeger" style="flex:1.3;min-width:140px" value="${escapeHtml(s.adresse||'')}" placeholder="Adresse" onchange="majSite('${s.id}',{adresse:this.value.trim()||null})">
        <button class="ghostBtn" style="padding:2px 9px" title="Supprimer ce site" onclick="supprimerSite('${s.id}')">✕</button>
      </div>` : ''}
      <div class="siteLigne">
        <div class="sf" style="width:136px"><label>Début</label><input class="inputLeger" type="date" value="${s.date_debut||''}" onchange="majSite('${s.id}',{date_debut:this.value||null})"></div>
        <div class="sf" style="width:70px"><label>Heure</label><input class="inputLeger" type="text" inputmode="numeric" autocomplete="off" placeholder="9h30" value="${hh(s.heure_debut)}" onchange="majSiteHeure('${s.id}','heure_debut',this.value)"></div>
        <div class="sf" style="width:136px"><label>Fin</label><input class="inputLeger" type="date" value="${s.date_fin||''}" onchange="majSite('${s.id}',{date_fin:this.value||null})"></div>
        <div class="sf" style="width:70px"><label>Heure</label><input class="inputLeger" type="text" inputmode="numeric" autocomplete="off" placeholder="17h" value="${hh(s.heure_fin)}" onchange="majSiteHeure('${s.id}','heure_fin',this.value)"></div>
        <div class="sf" style="width:84px"><label>Durée (h)</label><input class="inputLeger" id="dureeSite-${s.id}" type="number" step="0.25" min="0" placeholder="auto" value="${s.duree_heures??''}" title="${escapeHtml(resumeSite(s))}" onchange="majSite('${s.id}',{duree_heures:this.value===''?null:Number(this.value)})"></div>
        <div class="sf" style="width:72px"><label>h / jour</label><input class="inputLeger" type="number" step="0.5" min="1" max="24" placeholder="${HEURES_PAR_JOUR_CHANTIER}" value="${s.heures_par_jour??''}" onchange="majSite('${s.id}',{heures_par_jour:this.value===''?null:Number(this.value)})" title="Force par ex. 11 h pour réduire le nombre de jours (déplacements, plusieurs peintres)"></div>
        <div class="sf" style="flex:1;min-width:150px"><label>Peintres</label><div>${chips(s)}</div></div>
        ${!multi ? `<button class="ghostBtn" style="padding:2px 9px;align-self:flex-end;margin-bottom:4px" title="Supprimer ce site" onclick="supprimerSite('${s.id}')">✕</button>` : ''}
      </div>
    </div>`).join('')}
    ${sites.length ? '' : `<button class="actionBtn" onclick="ajouterSite('${p.id}')">+ Ajouter les dates du chantier</button>`}
  </div>
  `;
}
/* Déplacer / redimensionner une barre du calendrier à la souris.
   - Glisser la barre : le chantier se décale (mêmes durée et heures).
   - Tirer un bord : le nombre de jours change → la durée se recalcule et la fiche s'ouvre sur le
     champ « Durée » pour un éventuel ajustement des heures.
   - Simple clic : ouvre la fiche du projet. */
let ganttDrag = null;
let siteAFocaliser = null;
function ganttPointerDown(ev, cle, projetId){
  if(ev.button !== undefined && ev.button !== 0) return;
  const bar = ev.currentTarget;
  ganttDrag = { bar, cle, projetId, mode: ev.target.dataset.poignee || 'move', x0: ev.clientX,
    left0: parseFloat(bar.style.left), w0: parseFloat(bar.style.width), W: GANTT_ZOOMS[ganttZoomIdx], dj: 0, moved: false };
  try{ bar.setPointerCapture(ev.pointerId); }catch(e){}
  ev.preventDefault();
}
function ganttPointerMove(ev){
  const g = ganttDrag; if(!g || g.bar !== ev.currentTarget) return;
  const dx = ev.clientX - g.x0;
  if(Math.abs(dx) > 3) g.moved = true;
  g.dj = Math.round(dx / g.W);
  const largeurMin = g.W - 2;
  if(g.mode === 'move') g.bar.style.left = (g.left0 + g.dj*g.W) + 'px';
  else if(g.mode === 'droite') g.bar.style.width = Math.max(largeurMin, g.w0 + g.dj*g.W) + 'px';
  else {
    const gauche = Math.min(g.left0 + g.dj*g.W, g.left0 + g.w0 - largeurMin);
    g.bar.style.left = gauche + 'px'; g.bar.style.width = (g.left0 + g.w0 - gauche) + 'px';
  }
}
async function ganttPointerUp(ev){
  const g = ganttDrag; if(!g || g.bar !== ev.currentTarget) return;
  ganttDrag = null;
  if(!g.moved){ selectionnerProjet(g.projetId); return; }
  if(!g.dj){ render(); return; }
  await deplacerSite(g.cle, g.projetId, g.mode, g.dj);
}
async function deplacerSite(cle, projetId, mode, dj){
  let s = trouverSite(cle);
  if(!s){ // chantier daté sans site (avant les sites) : on crée d'abord son site pour pouvoir le modifier
    const p = projets.find(x=>x.id===projetId); if(!p || !p.date_debut){ render(); return; }
    const { data, error } = await sb.from('projet_sites').insert({ projet_id:projetId, nom:'Site principal', date_debut:p.date_debut, date_fin:p.date_fin, ordre:0 }).select().single();
    if(error){ alert('Erreur : '+error.message); render(); return; }
    data.intervenants = []; (sitesParProjet[projetId] = sitesParProjet[projetId] || []).push(data); s = data;
  }
  const debut = s.date_debut, fin = s.date_fin || s.date_debut;
  let nd = debut, nf = fin;
  if(mode === 'move'){ nd = ajouterJoursIso(debut, dj); nf = ajouterJoursIso(fin, dj); }
  else if(mode === 'gauche'){ nd = ajouterJoursIso(debut, dj); if(nd > fin) nd = fin; }
  else { nf = ajouterJoursIso(fin, dj); if(nf < debut) nf = debut; }
  const patch = { date_debut:nd, date_fin:nf };
  if(mode !== 'move') Object.assign(patch, calculerSite({ ...s, ...patch }, 'date_fin'));
  Object.assign(s, patch);
  const { error } = await sb.from('projet_sites').update(patch).eq('id', s.id);
  if(error){ alert('Erreur : '+error.message); }
  if(mode !== 'move'){ siteAFocaliser = s.id; selectionId = projetId; }
  await synchroDatesProjet(projetId);
  if(mode !== 'move') selectionnerProjet(projetId);
}
async function initApp(){
  document.querySelector('.app').innerHTML = `<div style="padding:24px" class="tiny muted">Chargement…</div>`;
  try{
    const { data:{ session }, error } = await sb.auth.getSession();
    if(error) throw error;
    if(!session){ location.replace('federation-accueil.html'); return; }
    const estId = getCurrentEstId();
    if(!estId){ location.replace('federation-accueil.html'); return; }
    const { data: membre, error:e1 } = await sb.from('members').select('id,role').eq('user_id', session.user.id).eq('establishment_id', estId).maybeSingle();
    if(e1) throw e1;
    if(!membre){ location.replace('federation-accueil.html'); return; }
    ESTABLISHMENT_ID = estId;
    CURRENT_USER_ID = session.user.id;
    MEMBRE_ROLE = membre.role;
    await Promise.all([chargerEtapesKanban(), chargerProjets(), chargerRendement(), chargerChecklists(), chargerEquipeAtelier(), chargerModulesParEtape(), chargerEpreuvesParEtape(), chargerSignauxClient(), chargerLabels()]);
    await chargerSites();
    // Lien "ouvre directement la fiche de ce projet" (depuis l'Accueil atelier par ex.) —
    // ?projet=ID en plus de ?est=, sinon comportement inchangé (tableau seul).
    const projetVoulu = new URLSearchParams(window.location.search).get('projet');
    if(projetVoulu && projets.some(p=>p.id===projetVoulu)) await selectionnerProjet(projetVoulu);
    else render();
  }catch(e){
    console.error(e);
    document.querySelector('.app').innerHTML = `<div class="errBox">Impossible de charger les projets : ${escapeHtml(e.message||String(e))}\n\nRecharge la page.</div>`;
  }
}
initApp();
