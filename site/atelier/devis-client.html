<!doctype html>
<html lang="fr">
<head>
  <script src="boite-message.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Demande de devis — Atelier Tristan Gesret</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="moteur-devis.js"></script>
  <script src="societes-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Charte graphique reprise du site vitrine etsgesret.fr : rouge #A60000, kraft #C4AE8F,
       papier #F6F4F2, noir ; titres Fjalla One en capitales, texte Source Code Pro ; papier
       déchiré entre les sections ; boutons à cadre "enseigne" (SVG du site). */
    :root{
      --t-champ:17px;   /* titre d'un champ à compléter = même taille que « Particulier / Professionnel » */
      --bg:#fff; --ink:#000; --muted:#4a4540; --line:#D9D9D9; --soft:#F6F4F2;
      --accent:#A60000; --kraft:#C4AE8F; --terre:#a8461f;
      --f-titre:'Fjalla One',Impact,sans-serif; --f-texte:'Source Code Pro',ui-monospace,Menlo,Consolas,monospace;
      --red:var(--accent); --amber:var(--ink); --green:var(--ink);
      --redBg:var(--soft); --amberBg:var(--soft); --greenBg:var(--soft);
      --blue:var(--ink); --blueBg:var(--soft);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--f-texte)}
    body{font-size:15px;line-height:1.45;font-weight:500;font-variant-numeric:tabular-nums;overflow-x:hidden}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px 20px}
    /* En-tête : logo centré (version blanche sur la photo d'accueil), réseaux à droite. */
    .siteHeader{position:absolute;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 24px}
    .siteHeader.clair{position:relative;background:#fff;border-bottom:1px solid var(--line)}
    .siteHeader .retour{font-family:var(--f-titre);text-transform:uppercase;letter-spacing:.04em;font-size:14px;color:#fff;text-decoration:none}
    .siteHeader.clair .retour{color:var(--ink)}
    .siteHeader .retour:hover{color:var(--accent)}
    .siteHeader .logo img{height:78px;display:block}
    .siteHeader .reseaux{display:flex;gap:14px;justify-content:flex-end}
    .siteHeader .reseaux img{width:22px;height:22px;display:block}
    @media (max-width:640px){ .siteHeader{padding:10px 14px} .siteHeader .logo img{height:56px} .siteHeader .reseaux{display:none} }
    /* Bandes pleines : photo d'accueil, puis papier blanc / kraft déchiré qui recouvre la bande
       précédente, comme sur le site. */
    /* L'image du papier déchiré n'est opaque qu'à partir de la déchirure : la couleur pleine
       est donc posée juste en dessous (décalée de 5vw), jamais sur toute la bande. */
    #app>.bandeFull{position:relative;width:100%;margin-top:-3.2rem;padding-top:3.2rem;background-repeat:no-repeat}
    /* Alternance blanc / kraft calculée sur l'ordre réel des bandes affichées (la bande
       "Support(s)" n'apparaît qu'après l'estimation : pas deux bandes kraft de suite). */
    #app>.bandeFull:nth-of-type(odd){background-image:url(https://www.etsgesret.fr/Front/img/global/torn_bg_white_home.png),linear-gradient(#fff,#fff);background-position:top center,0 5vw;background-size:100% auto,100% calc(100% - 5vw)}
    #app>.bandeFull:nth-of-type(even){background-image:url(https://www.etsgesret.fr/Front/img/global/torn_bg_secondary_home.png),linear-gradient(var(--kraft),var(--kraft));background-position:top center,0 5vw;background-size:100% auto,100% calc(100% - 5vw)}
    #app>.bandeFull.heroBand:nth-of-type(n){margin-top:0;padding-top:118px;padding-bottom:calc(max(3.2rem,7vw) + 8px);box-sizing:border-box;background-color:#222;background-image:url(https://www.etsgesret.fr/media/cache/slide_1900/Front/img/homepage/hero-bg.jpg);background-size:cover;background-position:center bottom;min-height:clamp(315px,36vw,484px);display:flex;align-items:center;color:#fff;overflow:hidden;isolation:isolate;z-index:0}
    #app>.bandeFull.heroBand::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.52));pointer-events:none;z-index:1}   /* léger voile en haut : le logo reste lisible sur l'image / la vidéo */
    /* Vidéo d'en-tête (voir VIDEO_ENTETE) : en boucle, sans son, sans clic ; l'image du bandeau sert de poster tant qu'elle n'est pas prête */
    .heroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;z-index:0}
    @media (prefers-reduced-motion:reduce){ .heroVideo{display:none} }
    #app>.bandeFull.heroBand .bandeContenu{width:100%;padding:0 20px}   /* le texte est centré entre le bas du logo et la déchirure beige : le bandeau réserve la place du logo (haut) et de la déchirure (bas) */
    @media (max-width:640px){ #app>.bandeFull.heroBand:nth-of-type(n){padding-top:92px} }   /* titre centré à la verticale dans la partie visible du bandeau (hors déchirure beige du bas) */   /* bandeau d'accueil réduit d'environ 20 % : les premiers champs à compléter apparaissent plus haut */
    .bandeContenu{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:34px 20px 70px}
    .hero{margin-bottom:0;text-align:center}
    /* Texte d'accueil : sous le bandeau, sur le fond beige de la charte, avant « Coordonnées » */
    .heroBand .hero h1{color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.55);font-size:clamp(32px,5.2vw,52px);margin-bottom:8px}
    .heroBand .hero p{font-size:16px;line-height:1.5}
    .heroBand .hero p + p{margin-top:6px}
    .heroBand .hero .heroSignature{margin-top:10px}
    .heroBand .hero p{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.6)}
    .heroBand .hero .heroSignature span{text-shadow:0 2px 12px rgba(0,0,0,.6)}
    /* « Coordonnées » suit aussitôt la déchirure */
    #app>.bandeFull.heroBand + .bandeFull .bandeContenu{padding-top:6px}
    /* Le bandeau se prolonge SOUS toute la hauteur de la déchirure beige : plus d'interstice blanc dans ses creux (la bande beige est descendue d'autant, « Coordonnées » avec elle) */
    #app>.bandeFull.heroBand + .bandeFull{margin-top:calc(-1 * max(3.2rem,7vw));padding-top:max(3.2rem,7vw)}
    /* Titre en blanc sur l'image / la vidéo, au-dessus de la déchirure */
    .heroTitre{font-family:var(--f-titre);font-weight:400;text-transform:uppercase;font-size:clamp(34px,6vw,58px);line-height:1.08;margin:0;text-align:center;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.5)}
    .hero h1{font-family:var(--f-titre);font-weight:400;text-transform:uppercase;font-size:clamp(34px,6vw,58px);line-height:1.08;margin:0 0 10px 0;color:var(--ink)}
    .hero p{font-size:17px;line-height:1.55;margin:0 auto;max-width:760px;color:var(--ink)}
    .hero p + p{margin-top:8px}
    .hero .heroSignature{margin-top:14px;font-size:18px}
    .hero .heroSignature span{font-family:var(--f-titre);font-size:30px;letter-spacing:.03em}
    .radioGroup.enLigne{display:flex;flex-wrap:wrap;gap:6px 30px;margin-bottom:14px}
    .section{padding:0}
    /* Boutons à cadre d'enseigne (SVG du site) : noir au repos, rouge au survol. */
    .rubanBtnWrap{text-align:center;margin:26px 0}
    .rubanBtn,.actionBtn.cadre{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:290px;height:58px;padding:0 76px;background:none;border:none;color:var(--ink);font-family:var(--f-titre);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:19px;cursor:pointer;text-decoration:none;transition:color .35s ease}
    .rubanBtn::before,.actionBtn.cadre::before,.rubanBtn::after,.actionBtn.cadre::after{content:'';position:absolute;left:-6%;right:-6%;top:-6px;bottom:-6px;background-repeat:no-repeat;background-position:center;background-size:100% 100%;transition:opacity .45s ease;pointer-events:none}
    .rubanBtn::before,.actionBtn.cadre::before{background-image:url(charte-gesret/btn-frame-black.svg);opacity:1}
    .rubanBtn::after,.actionBtn.cadre::after{background-image:url(charte-gesret/btn-frame-red.svg);opacity:0}
    .rubanBtn:hover:not(:disabled),.actionBtn.cadre:hover:not(:disabled){color:var(--accent);opacity:1;background:none;border-color:transparent}
    .rubanBtn:hover:not(:disabled)::before,.actionBtn.cadre:hover:not(:disabled)::before{opacity:0}
    .rubanBtn:hover:not(:disabled)::after,.actionBtn.cadre:hover:not(:disabled)::after{opacity:1}
    .rubanBtn:disabled,.actionBtn.cadre:disabled{opacity:.5;cursor:not-allowed}
    /* Le bouton à cadre n'a JAMAIS de fond ni de bordure propres, quel que soit l'état (survol, clic, envoi en cours = désactivé) : seul le cadre SVG dessine la forme.
       Sans cela, la règle générale « .actionBtn:hover » (fond rouge) reprenait le dessus dès que le bouton se désactivait au clic. */
    .actionBtn.cadre,.actionBtn.cadre:hover,.actionBtn.cadre:focus,.actionBtn.cadre:active,.actionBtn.cadre:disabled{background:none;border:none;border-radius:0;-webkit-user-select:none;user-select:none}
    .actionBtn.cadre:focus-visible{outline:2px dashed var(--ink);outline-offset:10px}
    .section h2{font-family:var(--f-titre);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.1;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);margin:0 0 22px 0;padding-bottom:10px;position:relative}
    .section h2::after{content:'';position:absolute;left:0;bottom:0;width:64px;height:4px;background:var(--accent)}
    /* Pied de page : kraft, coordonnées réelles de l'atelier. */
    #app{position:relative}
    .siteFooter{position:relative;margin-top:0;padding:3.4rem 20px 28px;background:var(--kraft) url(https://www.etsgesret.fr/media/cache/slide_800/Front/img/global/secondary-bg.jpg) center/cover;color:var(--ink)}
    .siteFooter .cols{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:34px;align-items:start}
    .siteFooter img.logo{width:100%;max-width:230px;display:block;margin:0 auto}
    .siteFooter .titre{font-family:var(--f-titre);text-transform:uppercase;font-size:21px;margin:0 0 10px}
    .siteFooter a{color:var(--ink);text-decoration:none}
    .siteFooter a:hover{color:var(--accent)}
    .siteFooter ul{list-style:none;margin:0;padding:0;line-height:1.9}
    .siteFooter .copy{max-width:1100px;margin:26px auto 0;font-size:12.5px;opacity:.85;text-align:center}
    .siteFooter.min{padding:1.1rem 20px 1.2rem}
    .siteFooter.min .copy{margin:0 auto}
    @media (max-width:760px){ .siteFooter .cols{grid-template-columns:1fr;text-align:center} }
    .grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
    .grid3{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:14px;margin-bottom:5px}
    .field>label{font-size:var(--t-champ);line-height:1.25;margin-bottom:6px}
    .field label .req{color:var(--red)}
    .input,.select,.textarea{width:100%;border:1.5px solid var(--ink);border-radius:4px;padding:11px 13px;background:#fff;font-size:16px;font-weight:500}   /* 16 px minimum : en dessous, iPhone zoome et décale la page */
    .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(166,0,0,.15)}
    .field label{font-weight:600}
    .fieldAuto{position:relative}
    .sugBox{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:220px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.10)}
    .sugItem{padding:10px 13px;cursor:pointer;font-size:14.5px;border-bottom:1px solid var(--line)}
    .sugItem:last-child{border-bottom:none}
    .sugItem:hover{background:var(--soft,#f5f4f2)}
    .textarea{min-height:80px;resize:vertical}
    .checkRow{display:flex;align-items:flex-start;gap:8px;margin:8px 0;font-size:15px}
    .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:6px}
    .tile{border:2px solid var(--ink);border-radius:6px;padding:14px 10px;text-align:center;cursor:pointer;background:#fff;transition:border-color .1s ease}
    .tile:hover{border-color:var(--accent)}
    .tile{transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease,background .12s ease}
    /* Une case choisie doit se voir tout de suite : cadre rouge épais, fond teinté, léger soulèvement et pastille ✓ */
    .tile.selected{border-color:var(--accent);background:#fdeceb;box-shadow:0 0 0 3px var(--accent),0 10px 22px rgba(166,0,0,.22);transform:translateY(-3px)}
    .tileNiveau.selected::after{content:'✓';position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px;line-height:28px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .tileNiveau{position:relative}
    .tile .preview{font-size:20px;margin-bottom:8px;min-height:28px;display:flex;align-items:center;justify-content:center;word-break:break-word}
    .tile .label{font-size:12.5px;color:var(--muted);line-height:1.25}
    .tiles3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
    /* Les 9 pictos de supports occupent toute la largeur du contenu, espacés régulièrement : 9 colonnes sur grand écran, 3 × 3 en dessous (jamais de dernière ligne bancale) */
    .tilesSupports{grid-template-columns:repeat(9,minmax(0,1fr));gap:clamp(12px,1.7vw,24px);margin-top:12px}
    @media (max-width:1099px){ .tilesSupports{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2.4vw,20px)} }
    .tileSupport{position:relative;padding:clamp(14px,1.4vw,22px) 8px clamp(10px,1vw,16px)}
    .tileSupport .preview{font-size:30px;min-height:clamp(64px,6.4vw,96px);margin-bottom:clamp(8px,1vw,14px)}
    .pictoImg{display:block;height:auto;width:auto;max-width:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .tileSupport .pictoImg{height:clamp(60px,5.8vw,90px);max-width:100%;width:auto}
    .tileSupport .label{font-weight:600;color:var(--ink)}
    .tileSupport.selected::after{content:'✓';position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px;line-height:28px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    /* 9e carte « support improbable » : hors estimation, c'est une porte vers le contact humain. */
    .tileImprobable{position:relative}
    .bulleImprobable{display:none;position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);width:max-content;max-width:190px;background:var(--ink);color:#fff;padding:9px 12px;border-radius:6px;font-size:12.5px;line-height:1.35;text-align:center;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.25)}
    .bulleImprobable::after{content:'';position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
    .bulleImprobable .bulleBtn{display:none;margin-top:8px;background:#fff;color:var(--ink);border-radius:4px;padding:6px 12px;font-weight:700;text-decoration:none}
    .tileImprobable.ouvert .bulleImprobable{display:block}
    @media (hover:hover){ .tileImprobable:hover .bulleImprobable,.tileImprobable:focus-visible .bulleImprobable{display:block} }
    @media (hover:none){ .bulleImprobable .bulleBtn{display:inline-block} }
    .tileNiveau{padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
    .badgeNiveau{display:inline-block;color:#fff;font-family:var(--f-texte);font-weight:700;font-size:11px;letter-spacing:.06em;border-radius:999px;padding:3px 11px}
    .nomNiveau{font-family:var(--f-titre);text-transform:uppercase;font-size:19px;line-height:1.15}
    .exemplesNiveau{display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px 10px 10px;color:#1c1a17;overflow:hidden}
    .exempleNiveau{display:flex;align-items:flex-start;justify-content:center;min-height:196px;padding:0 0 6px}   /* sommet de la lettre toujours à la même distance du titre du niveau */
    .exempleImg{display:block;height:auto;max-width:100%;user-select:none;-webkit-user-drag:none}
    .exempleE{font-family:var(--f-titre);font-weight:700;font-size:96px;line-height:1;padding:4px 22px 18px 8px;color:#111;overflow:visible}
    .formuleNiveau{font-family:'Snell Roundhand','Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-style:italic;font-size:22px;line-height:1.2;color:#3a3226;margin-top:-6px}
    .enrichissements{margin-top:12px;padding:12px 14px;border:1.5px dashed var(--ink);border-radius:8px;background:#fff}
    .supportColTitre{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
    .apercuMini{width:100%;font-family:var(--f-titre);font-size:48px;line-height:1.12;white-space:normal;overflow-wrap:anywhere;overflow:hidden;padding:2px 6px 4px 0;color:#111}
    .apercuMini .apTxt{display:inline-block}
    .apercuMini.f-script{font-family:'Snell Roundhand','Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-weight:400}
    .apercuMini.f-min{font-family:Arial,Helvetica,sans-serif;font-weight:700}
    .apercuMini.f-empat{font-family:Georgia,'Times New Roman',Times,serif;font-weight:700;letter-spacing:.01em}
    .choixForme{margin-top:8px}
    .choixForme .libForme{font-size:12px;color:var(--muted);width:100%}
    .mentionRendu{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
    .supportPrix .ecarter{padding:3px 8px;font-size:12px;margin-bottom:6px}
    .prixLigne{font-size:19px;font-weight:700}
    /* QCM compact — remplace les menus déroulants trop longs à ouvrir (matière, état, hauteur
       du chantier, taille des lettres) : un clic choisit l'option directement. */
    .qcm{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .qcmOpt{border:1.5px solid var(--ink);background:#fff;border-radius:4px;padding:6px 11px;font-size:12.5px;color:var(--ink);cursor:pointer}
    .qcmOpt:hover{border-color:var(--accent)}
    .qcmOpt.sel{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}
    /* Support / Aperçu / Estimation en tête (3 colonnes), Variables juste en dessous sur toute
       la largeur — plus de colonne étroite pour les QCM, qui ont besoin de place pour s'étaler
       horizontalement plutôt que de s'empiler en hauteur. */
    .supportBlock{border:1.5px solid var(--ink);border-radius:8px;padding:16px 18px;margin-bottom:14px;background:#fff}
    .supportBlock.principal{border-color:var(--accent);border-width:2px}
    .supportTopRow{display:grid;grid-template-columns:140px 1fr 200px;gap:24px;align-items:start}
    .supportIdentite{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
    .supportIdentite .picto{font-size:30px;line-height:1}
    .supportIdentite .nom{font-size:15px;font-weight:700}
    .supportEstim{text-align:right}
    .supportEstim .checkRow{justify-content:flex-end;margin-top:8px}
    .supportVariablesFull{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
    .varPairGrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:16px}
    .varGroupLabel{font-weight:600;font-size:15px;margin-bottom:8px}
    .supportChecksRow{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
    @media (max-width:900px){ .supportTopRow{grid-template-columns:1fr} .supportApercu,.supportEstim{border-top:1px solid var(--line);padding-top:12px;margin-top:4px} .supportIdentite{flex-direction:row;justify-content:center} .supportEstim{text-align:center} .supportEstim .checkRow{justify-content:center} .varPairGrid{grid-template-columns:1fr} }
    /* Bloc support resserré : titre + texte + variables à gauche, prix centré à droite (aligné sur
       l'estimatif total flottant quand le bloc est au milieu de l'écran). */
    html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;touch-action:manipulation}
    input,select,textarea{font-size:16px}
    #app,.bandeContenu,.section,.supportBlock,.repDetail,.supportGrid,.supportMain,.supportVars,.field,.ligneTexte,.saisieTexte,.rendu{min-width:0;max-width:100%}
    .qcmOpt{max-width:100%;white-space:normal;text-align:left}
    .dims .input{flex:1 1 0;min-width:0;width:auto}
    .supportMain{min-width:0}
    .supportGrid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:22px;align-items:stretch}
    .supportPrix{align-self:center;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px;border-left:1px solid var(--line);padding-left:18px;min-height:120px;justify-content:center}
    .supportPrixLabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
    .supportPrix .prixLigne{font-size:26px;line-height:1.1}
    .prixAttente{font-size:13px;color:var(--ink);font-weight:600}
    .resteListe{list-style:none;margin:2px 0 0;padding:0;font-size:13px;color:var(--accent);font-weight:700}
    .resteListe li::before{content:'→ '}
    .supportEntete{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}

// Emprise estimée du lettrage = le bloc de texte (largeur × hauteur) que le nombre de lettres permet de poser sur le support : lettres de taille « type »
// (enseigne principale : environ 15 cm de large × 25 cm de haut, d'après Tristan), réduites si le support est trop petit, sur 1 à 3 lignes (celle qui garde les plus grandes lettres).
// Marges : 90 % de la longueur, 80 % de la hauteur du support. Estimation à préciser au croquis ou au BAT ; sans texte, on retombe sur une part de la surface du support.
const LETTRES_TYPE = { "Enseigne principale":{ w:15, h:25 }, "Enseigne drapeau":{ w:8, h:12 }, "Vitrines":{ w:8, h:12 }, "Pignon":{ w:40, h:60 }, "Stop-trottoir":{ w:6, h:9 }, "Ardoises":{ w:3, h:5 } };
function empriseEstimee(s){
  const t = LETTRES_TYPE[s.support];
  if(!t || !s.longueurCm || !s.hauteurCm) return null;
  const n = String(textePourCalcul(s) || '').replace(/\s/g, '').length; if(!n) return null;
  const aw = Number(s.longueurCm) * 0.9, ah = Number(s.hauteurCm) * 0.8, pas = t.w * 1.2, inter = 1.15;
  let meilleur = null;
  for(let k = 1; k <= 3; k++){
    const parLigne = Math.ceil(n / k), sc = Math.min(1, aw / (parLigne * pas), ah / (k * t.h * inter));
    if(!meilleur || sc > meilleur.sc + 1e-6) meilleur = { k, parLigne, sc };
  }
  const { k, parLigne, sc } = meilleur;
  return { longueurCm: Math.round(Math.min(aw, parLigne * pas * sc)), hauteurCm: Math.round(Math.min(ah, (k * t.h + (k - 1) * t.h * (inter - 1)) * sc)),
           lettres: n, lignes: k, largeurLettre: Math.round(t.w * sc), hauteurLettre: Math.round(t.h * sc) };
}
const phraseEmprise = e => `${e.longueurCm} × ${e.hauteurCm} cm — ${e.lettres} lettre${e.lettres > 1 ? 's' : ''} d'environ ${e.largeurLettre} × ${e.hauteurLettre} cm sur ${e.lignes} ligne${e.lignes > 1 ? 's' : ''}`;
// Emprise utilisée par le calcul (part de la surface du support), avec en information la hauteur de lettres que le nombre de lettres permet de poser.
function phraseEmpriseCalcul(s){
  const part = empriseLettrage()[s.support];
  if(!part || !s.longueurCm || !s.hauteurCm) return '';
  const d = dimensionsPourCalcul(s), e = empriseEstimee(s), pct = Math.round(Math.sqrt(part) * 100);
  return `${d.longueurCm} × ${d.hauteurCm} cm (${pct} % de chaque dimension du support)` + (e ? ` — ${e.lettres} lettre${e.lettres > 1 ? 's' : ''} : lettres jusqu'à environ ${e.hauteurLettre} cm de haut possibles sur ${e.lignes} ligne${e.lignes > 1 ? 's' : ''}` : '');
}
function texteEmprise(s){
  // Jamais de dimensions interprétées : seules celles saisies par le client sont montrées ; la taille du lettrage se précise à la maquette.
  return `Nous préciserons ensemble la taille du lettrage au moment de la maquette.`;
}
function dimensionsPourCalcul(s){
  if(estVehicule(s)){
    const cm2 = surfaceVehiculeCm2(s);
    if(!cm2) return { longueurCm: '', hauteurCm: '' };
    const c = Math.round(Math.sqrt(cm2));
    return { longueurCm: c, hauteurCm: c };
  }
  const part = empriseLettrage()[s.support];
  if(!part || !s.longueurCm || !s.hauteurCm) return { longueurCm: s.longueurCm, hauteurCm: s.hauteurCm };
  const k = Math.sqrt(part);
  return { longueurCm: Math.round(s.longueurCm * k), hauteurCm: Math.round(s.hauteurCm * k) };
}
// Calage de l'estimation en ligne sur les prix moyens validés par Tristan (28/10/2026) : enseigne principale ≈ 890 € HT, véhicule ≈ 1 500 € HT, pignon ≈ 2 800 € HT
// sur leurs dimensions standard et un nom d'environ 11 lettres. Le coefficient ne s'applique qu'à la part variable (jamais à la fabrication du support) ;
// réglable via parametres_estimation.coefEstimation. Le devis interne n'est pas concerné.
const COEF_ESTIMATION_DEFAUT = { "Enseigne principale":1.305, "Véhicule":1.385, "Pignon":1.677 };   // calculés sur un nom de 11 lettres : 682 → 890 €, 1 083 → 1 500 €, 1 670 → 2 800 € (pro, HT)
function coefEstimation(support){ const v = Number({ ...COEF_ESTIMATION_DEFAUT, ...(reglagesEstimation?.coefEstimation || {}) }[support]); return v > 0 ? v : 1; }
function calculSupport(s){
  const ctx = ctxEstimation(); if(!ctx || !s.support) return null;
  const c = calculerLigne(ligneCalculPour(s), state.coordonnees.typeClient, ctx);
  const k = c ? coefEstimation(s.support) : 1;
  if(!c || k === 1) return c;
  const fab = (Number(c.fabricationHT) || 0) * (c.quantite || 1);
  return { ...c, prixHT: Math.round(((c.prixHT - fab) * k + fab) * 100) / 100 };
}
function prixLigneSupport(s){ const c = calculSupport(s); return c ? c.prixHT : null; }
// Part FIXE d'un support (fabrication du support : prix arrêté, sans marge d'incertitude) : la fourchette ne s'applique qu'au reste.
function fixeLigneSupport(s){ const c = calculSupport(s); return c ? (Number(c.fabricationHT) || 0) * (c.quantite || 1) : 0; }
function estimationFixeHT(){
  return state.supports.filter(s => s.inclus && supportComplet(s) && s._prixAffiche != null).reduce((t, s) => t + fixeLigneSupport(s), 0);
}
// Ce qui est demandé au client pour voir le prix : la matière (si le support en a), l'état (là où il compte), les dimensions du SUPPORT — ou les parties du véhicule.
function supportComplet(s){
  if(s.moyen) return true;
  if((COMPATIBILITES[s.support]||[]).length && !s.matiere) return false;
  if(ETAT_A_CHOISIR.includes(s.support) && etatOptionsPourSupport(s).length > 1 && !s.etat) return false;
  return estVehicule(s) ? partiesVehiculeCompletes(s) : !!(s.longueurCm && s.hauteurCm);
}
// Prix moyen d'un support (variables standard) : fourchette affichée sur la ligne « Ajouter d'autres supports ».
function prixMoyenSupport(s){ return prixLigneSupport({ ...s, moyen:true }); }
function fourchetteTexte(prixHT, fixeHT){
  if(prixHT == null) return '';
  const ttc = state.coordonnees.typeClient === 'particulier', k = ttc ? 1 + (reglagesEstimation?.tvaPct ?? 20)/100 : 1, f = fourchettePct()/100;
  const arr = v => Math.round(v / 10) * 10, fixe = (fixeHT || 0) * k, variable = prixHT * k - fixe;
  return `≈ ${arr(variable * (1 - f) + fixe).toLocaleString('fr-FR')} – ${arr(variable * (1 + f) + fixe).toLocaleString('fr-FR')} € ${ttc ? 'TTC' : 'HT'}`;
}
// « Envie d'un petit plus ? » : cases à cocher. Prix indicatifs seulement quand ils sont arrêtés (null = sur devis, rien n'est ajouté au total) ;
// un prix enregistré dans Réglages tarifs (produits dérivés, même clé) passe avant.
const PETITS_PLUS = [
  { cle:'logo_seul',        label:"Création d'un logo seul",                                                          prixHT:null },
  { cle:'mini_charte',      label:"Création d'une mini charte graphique (couleurs, typo...)",                         prixHT:250 },
  { cle:'charte_complete',  label:"Création d'une charte graphique complète (déclinaison sur supports prints et conseils)", prixHT:null },
  { cle:'carte_visite',     label:"Carte de visite",                                                                  prixHT:80 },
  { cle:'menus',            label:"Création de menus...",                                                             prixHT:null },
  { cle:'flyers',           label:"Flyers",                                                                           prixHT:null },
  { cle:'urbanisme',        label:"Accompagnement pour les démarches d'urbanisme : Architectes des Bâtiments de France", prixHT:null },
  { cle:'photos',           label:"Réalisation de photos par un professionnel, avec Tristan",                         prixHT:300 },
  { cle:'video',            label:"Réalisation d'une vidéo par un professionnel, avec Tristan",                       prixHT:300 },
];
function petitPlusParCle(cle){
  const d = PETITS_PLUS.find(x => x.cle === cle); if(!d) return null;
  const enreg = (reglagesEstimation?.produitsDerives || []).find(x => x.cle === cle);
  const prix = enreg && enreg.prixHT != null ? Number(enreg.prixHT) : d.prixHT;
  return { cle, label: d.label, prixHT: prix };
}
function toggleEnvie(cle, coche){
  if(coche){ if(!state.envieChoisies.includes(cle)) state.envieChoisies.push(cle); }
  else { state.envieChoisies = state.envieChoisies.filter(c=>c!==cle); }
  render();

// Estimation totale HT (avant fourchette) : somme des blocs support cochés "C'est ça que je
// veux" (et dont le prix a été affiché au moins une fois) + produits dérivés cochés.
// Le total reprend les prix AFFICHÉS (mis à jour via le bouton dédié de chaque ligne), pas un
// recalcul direct — pour rester cohérent avec ce que le client voit sur chaque bloc support.
// Forfaits inclus d'office dans tout estimatif, une seule fois par projet (et non par support) : PRIX FIXES — le client voit toujours
// pour la maquette 290 € (particulier) ou 490 € (professionnel), et 250 € pour la préparation des poncifs, sans remise ni majoration ; pour un
// particulier, ces montants sont les montants TTC affichés. Modifiables plus tard par réglage (reglagesEstimation.forfaitsProjet).
const FORFAITS_PROJET_DEFAUT = [
  { cle:'maquette', label:'Création de la maquette', prixAffiche:{ particulier:290, professionnel:390 } },   // valeurs de repli ; les prix réels se règlent dans Réglages tarifs
  { cle:'poncifs',  label:'Préparation des poncifs', prixAffiche:250 },
];
// Montant HT équivalent d'un prix fixe affiché (le total est calculé en HT puis converti en TTC pour un particulier).
// Prix affiché d'un forfait pour le type de client en cours (un nombre, ou { particulier, professionnel }).
function prixForfaitAffiche(f){
  const v = f.prixAffiche ?? f.prixHT;
  return Number(v && typeof v === 'object' ? v[state.coordonnees.typeClient] : v) || 0;
}
function forfaitHT(f){
  const affiche = prixForfaitAffiche(f);
  return state.coordonnees.typeClient === 'particulier' ? affiche / (1 + (reglagesEstimation?.tvaPct ?? 20) / 100) : affiche;
}
function forfaitsProjet(){
  const l = reglagesEstimation?.forfaitsProjet;
  return (Array.isArray(l) && l.length) ? l : FORFAITS_PROJET_DEFAUT;
}
function estimationTotaleHT(){
  const ctx = ctxEstimation(); if(!ctx) return null;
  let total = 0;
  for(const s of state.supports){
    if(s.inclus && supportComplet(s) && s._prixAffiche!=null) total += s._prixAffiche;
  }
  if(!total) return 0;   // le trajet et les petits plus ne s'affichent jamais seuls
  for(const f of forfaitsProjet()) total += forfaitHT(f);
  for(const cle of state.envieChoisies){
    const p = petitPlusParCle(cle);
    if(p) total += Number(p.prixHT)||0;
  }
  if(state.deplacement) total += state.deplacement.prixHT;
  return arrondir(total, 0);
}

/* =========================================================================
   DÉPLACEMENT — distance routière atelier <-> chantier (API Adresse pour situer les deux
   adresses, OSRM pour l'itinéraire : deux services publics gratuits, sans clé), aller-retour
   x prix au km des réglages tarifs. Même calcul que le devis interne. Best-effort : si un
   service ne répond pas, l'estimatif s'affiche sans trajet.
   ========================================================================= */
const ATELIER_ADRESSE_DEFAUT = "16 rue de l'Industrie, 56390 Grand-Champ";
let atelierAdresse = null, deplacementTimer = null, deplacementJeton = 0;
async function geocoderAdresse(adresse){
  try{
    const r = await fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(adresse)+'&limit=1');
    const data = await r.json();
    const f = data.features && data.features[0];
    return f ? { lon:f.geometry.coordinates[0], lat:f.geometry.coordinates[1] } : null;
  }catch(e){ return null; }
}
async function adresseAtelier(){
  if(atelierAdresse) return atelierAdresse;
  try{
    const { data } = await sb.from('establishments').select('adresse').eq('id', ESTABLISHMENT_ID).maybeSingle();
    if(data && data.adresse) atelierAdresse = data.adresse;
  }catch(e){ /* repli sur l'adresse de l'atelier ci-dessus */ }
  return atelierAdresse || ATELIER_ADRESSE_DEFAUT;
}
function planifierDeplacement(){ clearTimeout(deplacementTimer); deplacementTimer = setTimeout(calculerDeplacement, 600); }
async function calculerDeplacement(){
  const jeton = ++deplacementJeton;
  const c = state.coordonnees;
  if(c.adresse.trim().length < 4){ state.deplacement = null; majPanneau(); return; }
  try{
    const [origine, destination] = await Promise.all([adresseAtelier().then(geocoderAdresse), geocoderAdresse([c.adresse, c.ville].filter(Boolean).join(' '))]);
    if(jeton !== deplacementJeton) return;
    if(!origine || !destination){ state.deplacement = null; }
    else {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${origine.lon},${origine.lat};${destination.lon},${destination.lat}?overview=false`);
      const data = await r.json();
      if(jeton !== deplacementJeton) return;
      if(data.code === 'Ok' && data.routes && data.routes.length){
        const km = arrondir(data.routes[0].distance/1000*2, 1);
        state.deplacement = { km, prixHT: arrondir(km * (reglagesEstimation?.prixParKm ?? 0.60), 2) };
      } else state.deplacement = null;
    }
  }catch(e){ if(jeton === deplacementJeton) state.deplacement = null; }
  majPanneau();
}

let adresseSuggestions = [];

function choisirForme(id, cle){

// Aperçu du lettrage : le texte occupe toute la largeur du bloc (jusqu'au bord droit de la colonne « État »),
// et sa taille diminue quand le texte s'allonge (mesure à 100 px, puis réduction proportionnelle).
function ajusterApercus(){
  // Une ligne tant que la taille reste lisible (>= 44 px) ; sinon le texte passe sur 2, 3... jusqu'à 8 lignes, chacune
  // à la plus grande taille qui tient. La taille ne tombe donc jamais à l'illisible.
  const mobile = innerWidth < 640, MAX_PX = mobile ? 40 : 110, SEUIL_LISIBLE = mobile ? 26 : 44, INTERLIGNE = 1.12;
  document.querySelectorAll('.apercuMini').forEach(el=>{
    if(!el.clientWidth) return;
    el.style.minHeight = '0'; el.style.lineHeight = String(INTERLIGNE);
    const tient = (f, n) => { el.style.fontSize = f + 'px'; return el.scrollHeight <= Math.ceil(f * INTERLIGNE * n) + 8 && el.scrollWidth <= el.clientWidth + 1; };
    const meilleur = n => { let lo = 12, hi = MAX_PX, ok = 12; while(lo <= hi){ const m = (lo + hi) >> 1; if(tient(m, n)){ ok = m; lo = m + 1; } else hi = m - 1; } return ok; };
    let f = 12;
    for(let n = 1; n <= 8; n++){ f = meilleur(n); if(f >= SEUIL_LISIBLE || n === 8) break; }
    el.style.fontSize = f + 'px';
  });
}
function majApercu(id, valeur){
  const s = state.supports.find(x=>x.id===id); if(!s) return;
  s.texteAPeindre = valeur;
  const el = document.getElementById('ap-'+id);
  if(el){ el.querySelector('.apTxt').textContent = texteApercu(s, valeur); ajusterApercus(); }
}
function majSupport(id, champ, valeur){
  const s = state.supports.find(x=>x.id===id);
  if(!s) return;
  if(champ==='matiere'){
    s.matiere = valeur;
    const opts = etatOptionsPourSupport(s);
    if(!opts.includes(s.etat)) s.etat = (ETAT_A_CHOISIR.includes(s.support) && opts.length > 1) ? '' : opts[0];
  }
  else if(champ==='longueurCm' || champ==='hauteurCm'){ s[champ] = valeur===''?'':Number(valeur); }
  else if(champ==='deposePose'){ s.deposePose = !!valeur; }
  else { s[champ] = valeur; }
  // L'estimation affichée ne se recalcule jamais toute seule à la frappe — seul le bouton
  // "Afficher l'estimation" / "Actualiser" de la ligne (voir actualiserPrixSupport) la calcule,
  // qu'elle soit cochée ou non. On marque juste ici qu'un prix déjà affiché est devenu périmé.
  if(s._prixAffiche!=null) s._dirty = true;
  // Dimensions : le « change » part au moment où le curseur quitte la case (Tab) — on redessine juste après, quand le focus est arrivé dans la case suivante, pour qu'il y reste.
  if(champ === 'longueurCm' || champ === 'hauteurCm') setTimeout(render, 0); else render();
}

// Tous les supports du catalogue sont toujours en base (voir state.supports) — cocher
// "C'est ça que je veux" décide juste de l'inclusion dans le total et l'envoi ; le calcul du
// prix de la ligne est une action séparée et explicite (voir actualiserPrixSupport).
const URL_CONTACT = 'https://www.etsgesret.fr/contact';
// 9e carte : jamais un support à chiffrer. Avec une souris, un clic ouvre la page de contact ; au
// toucher (pas de survol), un premier tap affiche l'info-bulle et son bouton, un second ouvre le contact.
function tuileImprobable(){

    <div class="bulleImprobable">Ça aussi, on adore. Contactez-nous !<br><a class="bulleBtn" href="${URL_CONTACT}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Contactez-nous</a></div>

function clicImprobable(){

// Fait descendre l'écran jusqu'au bloc du support qui vient de s'ouvrir, CENTRÉ dans la partie visible de l'écran.
// La page change encore de hauteur juste après un clic (rendu, calcul du trajet, polices, aperçu) : on revise donc la cible
// plusieurs fois pendant ~3 s, tant que le visiteur n'a pas repris la main (molette, toucher, clavier, clic).
let derniereInteraction = 0;
['wheel','touchstart','keydown','mousedown'].forEach(ev => window.addEventListener(ev, () => { derniereInteraction = Date.now(); }, { passive:true }));
function allerAuSupport(id, debut){
  debut = debut || Date.now();
  const viser = (doux, seuil) => {
    if(derniereInteraction > debut) return;
    const el = document.getElementById('sb-'+id); if(!el) return;
    const r = el.getBoundingClientRect();
    const barreBas = (innerWidth < 1100 && document.body.classList.contains('avecEstimatif')) ? 92 : 0;   // panneau fixé en bas sur petit écran
    const visible = innerHeight - barreBas;
    const cible = r.height > visible * 0.92 ? r.top + scrollY - 16 : r.top + scrollY - (visible - r.height) / 2;
    if(seuil === undefined || Math.abs(cible - scrollY) > seuil) window.scrollTo({ top: Math.max(0, cible), behavior: 'smooth' });
  };
  // Un seul mouvement fluide, lancé quand la page a fini de se mettre en place ; ensuite on ne corrige que si la page a vraiment bougé.
  setTimeout(() => viser(true), 280);
  setTimeout(() => viser(true, 90), 1400);
  return debut;
}
function toggleSupportInclus(id, coche){

  s.inclus = coche;

// Un seul support principal à la fois : le choisir ouvre ses variables plus bas (après « Voir l'estimation ») et retire l'ancien principal.
// S'il avait été ajouté comme support « moyen », il devient le principal (variables détaillées).
function choisirSupportPrincipal(id){
  const s = state.supports.find(x=>x.id===id); if(!s) return;
  for(const x of state.supports){ if(x.id === state.principalId && x.id !== id){ x.inclus = false; x.moyen = false; } }
  state.principalId = id; s.inclus = true; s.moyen = false; s.explore = true;
  render();
  if(state.estimationVisible) allerAuSupport(id); else tenterEstimationSiPret();
}

function ajouterSupportMoyen(id, coche){

// Répertoire "Voir les autres supports" (point 3) : un seul détail ouvert à la fois — en

function toggleSupportOuvert(id){

// Duplication (un même support peut revenir plusieurs fois, avec un texte différent ou pas —
// ex : deux Vitrines). Seules les copies (base:false) peuvent être retirées, pas les 8 lignes
// de départ du catalogue.
function dupliquerSupport(id){
  const i = state.supports.findIndex(x=>x.id===id); if(i<0) return;
  const copie = { ...nouveauSupportVide(state.supports[i].support), base:false };

function retirerSupport(id){

function actualiserPrixSupport(id){

function actualiserToutesLesEstimations(){

/* =========================================================================
   PHOTOS / FICHIERS — importés directement dans le formulaire (au lieu de
   demander un envoi par email à part). Stockés en base64 avec la demande ;
   plafonnés en taille pour rester raisonnable en attendant un vrai stockage
   de fichiers (Supabase Storage, une fois le module Compte débloqué).
   ========================================================================= */
const MAX_FICHIERS = 5;
const MAX_TAILLE_OCTETS = 3 * 1024 * 1024; // 3 Mo par fichier

function lireFichier(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ nom: file.name, type: file.type, tailleKo: Math.round(file.size/1024), dataUrl: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ajouterFichiers(inputEl){
  const fichiers = Array.from(inputEl.files);
  inputEl.value = '';
  for(const f of fichiers){
    if(state.projet.photos.length >= MAX_FICHIERS){ alert(`Vous avez déjà ${MAX_FICHIERS} fichiers joints, c'est le maximum.`); break; }
    if(f.size > MAX_TAILLE_OCTETS){ alert(`"${f.name}" dépasse 3 Mo — réduisez sa taille avant de l'ajouter, ou envoyez-le à peinture@etsgesret.fr.`); continue; }
    try{ const lu = await lireFichier(f); state.projet.photos.push(lu); render(); }
    catch(e){ alert(`Impossible de lire "${f.name}".`); }
  }
}
function retirerFichier(index){ state.projet.photos.splice(index,1); render(); }

/* =========================================================================
   RENDU IA — accélérateur de signature, pas un rendu réaliste. Génère un
   croquis d'intention (jamais photoréaliste, même avec une vraie photo du
   lieu) via l'edge function devis-rendu-ia. Ajouté automatiquement aux
   fichiers envoyés avec la demande, comme n'importe quelle photo jointe.
   ========================================================================= */
async function choisirPhotoLieu(inputEl){
  const f = inputEl.files[0]; inputEl.value='';
  if(!f) return;
  if(f.size > MAX_TAILLE_OCTETS){ alert(`"${f.name}" dépasse 3 Mo — réduisez sa taille avant de l'ajouter.`); return; }
  try{ state.rendu.photoLieu = await lireFichier(f); render(); }
  catch(e){ alert(`Impossible de lire "${f.name}".`); }
}
function retirerPhotoLieu(){ state.rendu.photoLieu = null; render(); }

async function genererRendu(){
  if(!state.principalId){ alert("Choisissez d'abord votre support à peindre (section « Votre projet »)."); return; }
  if(!state.projet.nomProjet.trim()){ alert("Indiquez d'abord le lettrage à peindre, dans la section « Votre projet »."); return; }
  if(!ESTABLISHMENT_ID) return;
  // Le chiffrage s'affiche tout de suite (indépendant du rendu visuel, plus lent / pas
  // toujours disponible) — jamais avant ce clic explicite (point 1, revu après test réel).
  state.estimationVisible = true;
  actualiserToutesLesEstimations();
  calculerDeplacement();
  state.rendu.enCours = true; state.rendu.erreur=''; render();
  // L'écran descend tout seul jusqu'au bloc du support choisi, centré (au lieu de rester sur les effets).
  const premierSupport = state.supports.find(x=>x.id===state.principalId);
  const debutDefilement = premierSupport ? allerAuSupport(premierSupport.id) : 0;
  try{
    const { data, error } = await sb.functions.invoke('devis-rendu-ia', { body: {
      nomEnseigne: state.projet.nomProjet,
      texteAPeindre: state.projet.nomProjet,
      forme: state.rendu.forme, effet: descriptionEffet() || state.rendu.effet,
      photoLieuDataUrl: state.rendu.photoLieu ? state.rendu.photoLieu.dataUrl : null,
      establishmentId: ESTABLISHMENT_ID,
    }});
    if(error) throw error;
    if(data && data.erreur) throw new Error(data.erreur);
    state.rendu.imageUrl = data.imageUrl;
    state.projet.photos = state.projet.photos.filter(p=>p.nom !== 'Aperçu généré (croquis IA)');
    state.projet.photos.push({ nom:'Aperçu généré (croquis IA)', type:'image/png', tailleKo: Math.round(data.imageUrl.length*0.75/1024), dataUrl: data.imageUrl });
  }catch(err){
    console.warn('Aperçu dessiné indisponible :', err);
    state.rendu.erreur = '';   // aucun message au visiteur : l'aperçu dessiné est un plus, l'estimation s'affiche de toute façon
  }
  state.rendu.enCours = false;
  render();
  if(premierSupport) allerAuSupport(premierSupport.id, debutDefilement);   // recadre si le rendu a de nouveau changé la page
}

/* =========================================================================
   ENVOI — crée un devis en statut "brouillon" via une fonction Supabase dédiée
   (soumettre_devis_client), en passant chaque support choisi par le calcul
   BASE×COEF, exactement comme côté atelier. Le client ne voit jamais le prix.
   ========================================================================= */
function validerFormulaire(){
  const manquants = [];
  if(state.coordonnees.typeClient==='professionnel' && !state.coordonnees.raisonSociale.trim()) manquants.push("Dénomination de l'entreprise");
  if(!state.coordonnees.nom.trim()) manquants.push("Nom - Prénom du contact");
  if(!state.coordonnees.adresse.trim()) manquants.push("Adresse du chantier");
  if(!state.coordonnees.ville.trim()) manquants.push("Ville du chantier");
  if(!state.coordonnees.telephone.trim()) manquants.push("Téléphone");
  if(!state.coordonnees.email.trim()) manquants.push("Email");
  if(!state.projet.nomProjet.trim()) manquants.push("Nom de l'enseigne ou du lettrage à peindre");
  if(!state.principalId) manquants.push("Votre support à peindre (à choisir dans « Support à peindre »)");
  return manquants;
}

// Refus explicite : jamais déduit d'un abandon silencieux. Le bouton « Pas pour moi cette fois-ci »
// ouvre une boîte à trois issues — garder ce qui a été renseigné (carte « Rejeté client », même
// incomplet), tout supprimer (rien n'est envoyé), ou annuler.
// Remet à zéro les supports, les effets et les options, mais garde les coordonnées (nom, téléphone, email, adresse, ville,
// type de client) ET le projet (nom de l'enseigne, objectif, fichiers joints).
async function recommencerEstimatif(){
  if(!await confirmer("Recommencer l'estimatif ?\n\nVos coordonnées, le nom de l'enseigne et votre objectif sont conservés. Les supports, les effets et les options sont remis à zéro.")) return;
  state.supports = supportsDeDepart();
  state.supportOuvert = null; state.principalId = null; state.optionsChoisies = []; state.envieChoisies = [];
  state.organisation = { dateSouhaitee:'', contraintes:'' };
  state.deplacement = null; state.estimationVisible = false; state.estimatifOuvert = false; state.improbableOuvert = false;
  state.rendu = { photoLieu:null, forme:'', effet:'', niveau:'', enrichissements:[], imageUrl:'', enCours:false, erreur:'' };
  render();
  setTimeout(()=>{ const h = document.getElementById('sectionSupports'); if(h) h.scrollIntoView({ behavior:'smooth', block:'center' }); }, 80);
}
function declinerDemande(){ state.refusOuvert = true; render(); }
function fermerRefus(){ state.refusOuvert = false; render(); }
async function refusGarder(){
  state.refusOuvert = false; render();
  await envoyerDemande('rejete_client', true);
}
function refusSupprimer(){
  state.refusOuvert = false;
  state.coordonnees = { nom:'', adresse:'', ville:'', telephone:'', email:'', typeClient:'particulier', raisonSociale:'', siret:'' };
  state.projet = { objectif:'', nomProjet:'', photos:[] };
  state.rendu.photoLieu = null; state.deplacement = null;
  state.envoye = true; state.etapeEnvoyee = 'supprime';
  render(); window.scrollTo(0, 0);
}
// Prévient l'atelier par mail qu'une fiche projet vient d'être créée (edge function notifier-nouvelle-demande).
// Silencieux côté visiteur : si l'envoi du mail échoue, la demande n'en est pas moins enregistrée.
function notifierNouvelleDemande(devisId){
  if(!devisId) return;
  // Silencieux pour le visiteur ; deux nouvelles tentatives si l'appel échoue (réseau coupé, serveur occupé). Le filet de sécurité de Supabase
  // (rattrapage toutes les 10 minutes) renvoie de toute façon l'alerte d'une demande restée sans mail.
  const essayer = (n) => {
    try{
      sb.functions.invoke('notifier-nouvelle-demande', { body:{ devisId } }).then(({ error })=>{
        if(error){ console.warn('Mail de notification non envoyé :', error.message); if(n < 3) setTimeout(() => essayer(n + 1), 4000 * n); }
      }).catch(()=>{ if(n < 3) setTimeout(() => essayer(n + 1), 4000 * n); });
    }catch(e){ /* sans effet pour le visiteur */ }
  };
  essayer(1);
}
// Estimation telle que le client l'a vue (supports retenus, petits plus, trajet) : jointe à la demande, car le serveur ne chiffre pas
// les lignes « calculées » ; elle sert au mail d'alerte et reste consultable dans les notes du devis.
function estimationPourEnvoi(){
  const totalHT = estimationTotaleHT();
  if(!totalHT) return null;
  const lignes = [];
  for(const s of state.supports){
    if(s.inclus && supportComplet(s) && s._prixAffiche != null){
      const texte = s.texteAPeindre || state.projet.nomProjet;
      lignes.push({ libelle: s.support + (texte ? ' « ' + String(texte).slice(0, 40) + ' »' : '') + (s.dorure && (s.doreePct ?? 100) < 100 ? ' — dorure sur ' + (s.doreePct ?? 100) + ' % du lettrage' : '') + (fabricationPour(s) ? ' — fabrication du support incluse' : '') + (s.moyen ? ' — estimation moyenne' : ''), prixHT: Math.round(s._prixAffiche * 100) / 100,
                    kind: 'support', support: s.support, fixeHT: Math.round(fixeLigneSupport(s) * 100) / 100 });
    }
  }
  // Les forfaits (maquette, poncifs), les petits plus et le trajet restent des lignes à part : le client peut décocher un support dans le mail sans les perdre.
  if(lignes.length) for(const f of forfaitsProjet()) lignes.push({ libelle: `${f.label} (prix fixe ${prixForfaitAffiche(f)} €)`, prixHT: Math.round(forfaitHT(f) * 100) / 100, kind: 'forfait', nom: f.label });
  for(const cle of state.envieChoisies){
    const pd = petitPlusParCle(cle);
    if(pd) lignes.push({ libelle: pd.label + (pd.prixHT == null ? ' (sur devis)' : ''), prixHT: Number(pd.prixHT) || 0, kind: 'plus', nom: pd.label, surDevis: pd.prixHT == null });
  }
  if(state.deplacement) lignes.push({ libelle: `Déplacement (${state.deplacement.km} km aller-retour)`, prixHT: state.deplacement.prixHT, kind: 'trajet', nom: 'Déplacement' });
  return { totalHT: Math.round(totalHT * 100) / 100, fixeHT: Math.round(estimationFixeHT() * 100) / 100, tvaPct: reglagesEstimation?.tvaPct ?? 20, particulier: state.coordonnees.typeClient === 'particulier',
           fourchettePct: fourchettePct(), effet: descriptionEffet() || '', lignes };
}
// Jeton secret propre à la demande : il figure dans les boutons du mail envoyé au client et prouve que le clic vient bien de lui.
function nouveauJeton(){ return Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b => b.toString(16).padStart(2, '0')).join(''); }
// Bouton unique : tout est obligatoire (coordonnées, projet, support complet) ; la demande est enregistrée (fiche « Estimation envoyée — en attente du client »),
// l'atelier est alerté tout de suite, et le client reçoit son estimation par mail avec les 3 boutons de réponse.
async function recevoirEstimation(){
  const manquants = validerFormulaire();
  const p = state.supports.find(x => x.id === state.principalId);
  if(p && !supportComplet(p)) manquants.push("Les informations de votre support (section « Votre support »)");
  if(state.coordonnees.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.coordonnees.email.trim())) manquants.push("Une adresse e-mail valide (l'estimation vous y est envoyée)");
  if(manquants.length){ alert("Merci de compléter avant de recevoir l'estimation :\n\n— " + manquants.join("\n— ")); return; }
  state.jeton = state.jeton || nouveauJeton();
  await envoyerDemande('estimation_envoyee', true);
}
async function envoyerDemande(etape, sansValidation){
  etape = etape || 'qualification';
  if(!sansValidation){
    const manquants = validerFormulaire();
    if(manquants.length){ alert("Merci de compléter avant d'envoyer :\n\n— " + manquants.join("\n— ")); return; }
  }
  if(!ESTABLISHMENT_ID){ alert("Ce formulaire n'est relié à aucun atelier — contactez la personne qui vous l'a envoyé."); return; }

  const lignes = [];
  for(const s of state.supports.filter(s=>s.inclus)){
    // Forme/effet ne sont demandés qu'une fois (section Effet de relief) — appliqués à tous les supports.
    const l = ligneCalculPour(s);
    lignes.push({ type:'calculee', moyen: !!s.moyen, support:s.support, matiere:l.matiere, etat:l.etat, hauteurChantier:l.hauteurChantier, forme:l.forme, effet:l.effet, doreePct:l.doreePct,
      fabricationSupport:l.fabricationSupport, longueurCm:l.longueurCm, hauteurCm:l.hauteurCm, texteAPeindre:l.texteAPeindre, deposePose:!!s.deposePose,
      tailleLettres:l.tailleLettres, empattements:false, relief:l.relief, couleursMultiples:l.couleursMultiples, ombreSupplementaire:false, prixRetenuMode:'sheet' });
  }
  // Options cochées par le client : envoyées en ligne libre (le client ne voit ni prix ni
  // catalogue MEG réel) — l'atelier leur rattache ensuite le bon article et le bon prix.
  for(const code of state.optionsChoisies){
    lignes.push({ type:'manuelle', libelle: OPTIONS_CLIENT_LABELS[code] || code, prixHT: 0 });
  }
  // Maquette et poncifs : forfaits du projet, inclus dans l'estimatif vu par le client — ils partent donc aussi avec la demande.
  if(estimationTotaleHT() > 0) for(const f of forfaitsProjet()) lignes.push({ type:'manuelle', libelle: `${f.label} (prix fixe ${prixForfaitAffiche(f)} €)`, prixHT: Math.round(forfaitHT(f) * 100) / 100 });
  // Petits plus cochés (prix forfaitaires des réglages) et trajet estimé : ils figurent dans
  // l'estimatif vu par le client, ils partent donc aussi avec la demande.
  for(const cle of state.envieChoisies){
    const p = petitPlusParCle(cle);
    if(p) lignes.push({ type:'manuelle', libelle: p.label + (p.prixHT == null ? ' (sur devis)' : ''), prixHT: Number(p.prixHT)||0 });
  }
  if(state.deplacement) lignes.push({ type:'manuelle', libelle:`Déplacement estimé (${state.deplacement.km} km aller-retour)`, prixHT: state.deplacement.prixHT });

  const boutons = document.querySelectorAll('.actionBtn'); boutons.forEach(b=>b.disabled=true);
  try{
    const params = {
      p_establishment_id: ESTABLISHMENT_ID,
      p_client_nom: state.coordonnees.nom, p_client_telephone: state.coordonnees.telephone,
      p_client_email: state.coordonnees.email, p_client_adresse: state.coordonnees.adresse,
      p_client_ville: state.coordonnees.ville,
      p_client_type: state.coordonnees.typeClient,
      p_raison_sociale: state.coordonnees.raisonSociale || null,
      p_siret: state.coordonnees.siret || null,
      p_nom_projet: state.projet.nomProjet,
      p_notes_client: { ...(etape==='rejete_client' ? { abandon: true, motifAbandon: 'refus' } : {}), ...(etape==='estimation_envoyee' ? { jeton: state.jeton, envoiEstimationClient: true } : {}), lignesCalculees: lignes.filter(l=>l.type==='calculee'), raisonSociale: state.coordonnees.raisonSociale || '', siret: state.coordonnees.siret || '', objectif: state.projet.objectif + (descriptionEffet() ? `${state.projet.objectif?'\n\n':''}[Effet souhaité] ${descriptionEffet()}` : '') + (state.supports.filter(x=>x.inclus&&empriseLettrage()[x.support]&&x.longueurCm&&x.hauteurCm).map(x=>`\n\n[${x.support}] Dimensions du support indiquées : ${x.longueurCm} × ${x.hauteurCm} cm.${FORMATS_FIXES[x.support] ? ' Format standard imposé (non modifiable par le client).' : ''}`).join('')) + (state.supports.filter(x=>x.inclus&&x.moyen).map(x=>`\n\n[Support complémentaire] ${x.support} — estimation moyenne ${(x.longueurCm&&x.hauteurCm&&!FORMATS_FIXES[x.support]) || x.texteAPeindre ? '(le client a précisé le texte et/ou les dimensions)' : 'sur des dimensions standard (cochée sans détail)'}, à préciser avec le client.`).join('')) + (state.supports.filter(x=>x.inclus&&estVehicule(x)&&!x.moyen&&partiesVehiculeCompletes(x)).map(x=>`\n\n[Véhicule] Parties à peindre cochées (dimensions standard d'une berline moyenne, à préciser au croquis), avec leur texte : ${resumeVehicule(x)}. Surface totale de lettrage estimée : ${(surfaceVehiculeCm2(x)/10000).toFixed(2)} m².`).join('')) + (state.supports.some(x=>x.inclus&&x.dorure) ? `\n\n[Dorure souhaitée] ${state.supports.filter(x=>x.inclus&&x.dorure).map(x=>x.support + (x.texteAPeindre?' ('+x.texteAPeindre+')':'')).join(', ')}` : ''), texteAPeindre: state.projet.nomProjet,
        dateSouhaitee: state.organisation.dateSouhaitee, contraintes: state.organisation.contraintes, estimationAffichee: estimationPourEnvoi() },
      // La photo du lieu, demandée en fin de formulaire, part aussi avec la demande.
      p_photos: state.rendu.photoLieu ? [...state.projet.photos, { ...state.rendu.photoLieu, nom: 'Photo du lieu — ' + state.rendu.photoLieu.nom }] : state.projet.photos,
      p_lignes: lignes,
      p_etape: etape
    };
    let { data, error } = await sb.rpc('soumettre_devis_client', params);
    // L'étape « Estimation envoyée — en attente du client » doit exister dans le Kanban (migration_estimation_envoyee.sql) ; sinon on retombe sur « À qualifier » pour ne jamais perdre une demande.
    if(error && etape === 'estimation_envoyee'){ params.p_etape = 'qualification'; ({ data, error } = await sb.rpc('soumettre_devis_client', params)); }
    if(error) throw error;
    if(etape==='qualification' || etape==='estimation_envoyee' || (etape==='rejete_client' && coordonneesExploitables())) notifierNouvelleDemande(data.devis_id);   // mail à l'atelier (refus : seulement s'il a laissé un téléphone ou un e-mail)
    state.envoye = true;
    state.numeroEnvoye = data.numero;
    state.numeroProjetEnvoye = data.numero_projet;
    state.etapeEnvoyee = etape; state.emailEnvoye = state.coordonnees.email;
    state.devisIdEnvoye = data.devis_id || null;
    // Bloc "Informations internes" — jamais envoyé par le formulaire public, écrit ici en
    // mise à jour directe (droits normaux de la session atelier connectée) une fois le devis
    // créé, plutôt que d'ajouter ces champs à la fonction publique elle-même.
    if(state.interne.actif && data.devis_id && (state.interne.note || state.interne.origineContact || state.interne.priorite!=='normale')){
      const { error: eInt } = await sb.from('devis').update({
        note_interne: state.interne.note.trim() || null,
        priorite: state.interne.priorite,
        origine_contact: state.interne.origineContact.trim() || null,
      }).eq('id', data.devis_id);
      if(eInt) console.error('Enregistrement des informations internes échoué :', eInt.message);
    }
    render();
  }catch(err){
    alert("L'envoi a échoué : "+(err.message||err));
    boutons.forEach(b=>b.disabled=false);
  }
}

/* =========================================================================

function optionsSelectHtml(list, selected, placeholder){
  let h = `<option value="">${placeholder||'—'}</option>`;
  for(const k of list) h += `<option value="${escapeHtml(k)}" ${k===selected?'selected':''}>${escapeHtml(k)}</option>`;
  return h;
}
// QCM compact (boutons à cocher) à la place d'un menu déroulant trop long à ouvrir — un clic
// choisit directement l'option, sans avoir à dérouler une longue liste.
// Libellés affichés pour la taille des lettres ; la valeur envoyée et utilisée par le tarif reste
// la clé d'origine (réglages de l'atelier).
function libelleQcm(champ, opt){
  if(champ === 'etat') return LIBELLE_ETAT[opt] || opt;
  if(champ === 'tailleLettres'){
    if(/^Petites/i.test(opt)) return 'Petites (inf. 3 cm)';
    if(/^Moyennes/i.test(opt)) return 'Moyennes (entre 3 et 8 cm)';
    if(/^Grandes/i.test(opt)) return 'Grandes (sup. 8 cm)';
  }
  return opt;
}
function qcmHtml(supportId, champ, list, selected){
  // Tab parcourt les cases une à une, dans l'ordre où elles s'affichent ; ← → ↑ ↓ déplacent aussi le choix, comme un groupe de boutons radio.
  const tabIndex = i => 0;   // chaque case est atteinte par Tab dans l'ordre de lecture (gauche → droite, puis ligne suivante)
  return `<div class="qcm" role="radiogroup">${list.map((opt, i) => `<button type="button" role="radio" aria-checked="${opt===selected}" tabindex="${tabIndex(i)}" class="qcmOpt ${opt===selected?'sel':''}" onclick="majSupport('${supportId}','${champ}','${opt.replace(/'/g,"\\'")}')">${escapeHtml(libelleQcm(champ, opt))}</button>`).join('')}</div>`;
}

function nomSupportAffiche(s, occurrence, totalMemeType){
  return escapeHtml(s.support) + (totalMemeType>1 ? ` n°${occurrence}` : '');
}
// Bande Support / Aperçu / Estimation + Variables — contenu compact, pleine largeur, partagée
// entre les blocs des supports retenus et le détail ouvert d'une ligne du répertoire (voir
// renderRepertoireRow). La case "C'est ça que je veux !" est toujours visible, y compris sur
// le premier support : décocher le retire de la demande.
function renderSupportRow(s, occurrence, totalMemeType){
  const styleEff = niveauEffet() ? niveauEffet().css : '';
  // Texte propre à CETTE ligne — par défaut celui du projet, mais chaque support peut avoir le sien.
  const texte = s.texteAPeindre || state.projet.nomProjet || '…';
  // Particulier : prix TTC ; Pro : HT. Même taux que Réglages tarifs (20 % par défaut).
  const estTTC = state.coordonnees.typeClient === 'particulier';
  const tauxTva = reglagesEstimation?.tvaPct ?? 20;
  const complet = supportComplet(s);
  // Ce qu'il reste à renseigner pour voir le prix : dit clairement, champ par champ (voir .field.manque).
  const manques = [];
  const fmtFixe = FORMATS_FIXES[s.support];
  const optsMatiere = fmtFixe ? [] : (COMPATIBILITES[s.support] || []), optsEtat = etatOptionsPourSupport(s);
  const demandeEtat = ETAT_A_CHOISIR.includes(s.support) && optsEtat.length > 1;
  if(optsMatiere.length && !s.matiere) manques.push('Matière du support');
  if(demandeEtat && !s.etat) manques.push('État du support');
  const dim = estVehicule(s) ? partiesVehiculeCompletes(s) : !!(s.longueurCm && s.hauteurCm);
  if(!dim) manques.push(estVehicule(s) ? 'Parties du véhicule à peindre (cochez au moins une)' : 'Dimensions du support');
  const boutonEstimHtml = (complet && (s._prixAffiche==null || s._dirty))
    ? `<button type="button" class="ghostBtn" onclick="actualiserPrixSupport('${s.id}')" style="margin-top:6px;border-color:var(--accent);color:var(--accent)">${s._prixAffiche==null?'Afficher l\'estimation':'↻ Actualiser'}</button>`
    : '';
  const prixHtml = complet
    ? (s._prixAffiche!=null ? `<div class="prixLigne">≈ ${Math.round(estTTC ? prixAfficheAvecForfaits(s)*(1+tauxTva/100) : prixAfficheAvecForfaits(s)).toLocaleString('fr-FR')} € ${estTTC?'TTC':'HT'}</div>` : '') + boutonEstimHtml
    : `<div class="prixAttente">Pour voir le prix, il reste à renseigner :</div><ul class="resteListe">${manques.map(m=>`<li>${m}</li>`).join('')}</ul>`;
  return `
  <div class="supportGrid" ${manques.length ? '' : 'style="grid-template-columns:minmax(0,1fr)"'}>
    <div class="supportMain">
      <div class="ligneTexte">
        <div class="saisieTexte">
        <div class="supportEntete">
          <span class="picto">${ICONE_SUPPORT[s.support]||'🎨'}</span>
          <span class="nom">${nomSupportAffiche(s, occurrence, totalMemeType)}</span>
        </div>
          <!-- Le texte à peindre est déjà saisi plus haut (nom de l'enseigne ou du lettrage) : pas de second champ ici. -->
          <div class="qcm choixForme"><span class="libForme">Style des lettres</span>${FORMES_APERCU.map(f=>`<button type="button" class="qcmOpt ${s.forme===f.cle?'sel':''}" ${f.style ? `style="${f.style}"` : ''} onclick="choisirForme('${s.id}','${f.cle}')">${f.label}</button>`).join('')}</div>
        </div>
        <div class="rendu">
          <div class="apercuMini ${classeForme(s)} ${s.dorure?'dore':''}" id="ap-${s.id}" style="${styleEff}"><span class="apTxt">${escapeHtml(texteApercu(s, s.texteAPeindre))}</span></div>
          <div class="mentionRendu">Rendu non contractuel, typographie à valider ensemble plus tard sur maquette</div>
        </div>
      </div>
      <div class="supportVars">
        ${estVehicule(s) ? `<div class="field oblig${dim?'':' manque'} pleineLargeur"><label>Parties du véhicule à peindre <span class="aideFab">— cochez simplement les endroits à peindre</span></label>${partiesVehiculeHtml(s)}<div class="tiny" style="color:var(--muted);margin-top:4px">Estimation sur la base d'une berline moyenne — les dimensions exactes se précisent ensemble au croquis.</div></div>` : `${fmtFixe ? `<div class="field"><label>Format</label><div class="formatFixe"><b>Format standard : ${fmtFixe.description}</b><span>Taille fixe : nous la précisons ensemble si besoin, au croquis.</span></div></div>` : `<div class="field oblig${dim?'':' manque'}"><label>Dimensions du support <span class="aideFab">— longueur × hauteur, en cm</span></label>
          <div class="dims"><input class="input" type="number" min="0" placeholder="Longueur (cm)" value="${s.longueurCm??''}" onchange="majSupport('${s.id}','longueurCm', this.value)"><span>×</span><input class="input" type="number" min="0" placeholder="Hauteur (cm)" value="${s.hauteurCm??''}" onchange="majSupport('${s.id}','hauteurCm', this.value)"></div>
          <div class="tiny" style="color:var(--muted);margin-top:4px">${texteEmprise(s)}</div></div>`}`}
        ${optsMatiere.length ? `<div class="field oblig${s.matiere?'':' manque'}"><label>Matière du support</label>${qcmHtml(s.id, 'matiere', optsMatiere, s.matiere)}${s.matiere==='Enduit chaux' ? `<div class="tiny" style="color:var(--muted);margin-top:4px">Une sous-couche adaptée à l'enduit à la chaux est comptée dans l'estimatif.</div>` : ''}</div>` : ''}
        ${demandeEtat ? `<div class="field oblig${s.etat?'':' manque'}"><label>État du support</label>${qcmHtml(s.id, 'etat', optsEtat, s.etat)}</div>` : ''}
        ${s.support==='Jambages' ? `<div class="field"><label>Taille des lettres</label>${qcmHtml(s.id, 'tailleLettres', Object.keys(TAILLE_LETTRES), s.tailleLettres)}</div>` : ''}
        ${(estDrapeau(s) || s.support === 'Stop-trottoir') ? '' : `<div class="field"><label>Hauteur du chantier</label>${qcmHtml(s.id, 'hauteurChantier', Object.keys(COEF_HAUTEUR), s.hauteurChantier)}</div>`}
        <div class="field supportChecks">
          <div class="checkRow"><input type="checkbox" id="dor-${s.id}" ${s.dorure?'checked':''} onchange="majSupport('${s.id}','dorure', this.checked)"><label for="dor-${s.id}">Dorure des lettres</label></div>
          ${s.support==='Enseigne principale' ? `<div class="checkRow"><input type="checkbox" id="fab-${s.id}" ${s.fabrication?'checked':''} onchange="majSupport('${s.id}','fabrication', this.checked)"><label for="fab-${s.id}">Fabrication du support ? <span class="aideFab">(panneau neuf à découper, poncer et apprêter par l'atelier)</span></label></div>` : ''}
          ${estDrapeau(s) ? `<div class="checkRow"><input type="checkbox" id="sex-${s.id}" ${s.supportExistant?'checked':''} onchange="majSupport('${s.id}','supportExistant', this.checked)"><label for="sex-${s.id}">J'ai déjà le support en bon état et propre</label></div>` : ''}
          <div class="checkRow"><input type="checkbox" id="dp-${s.id}" ${s.deposePose?'checked':''} onchange="majSupport('${s.id}','deposePose', this.checked)"><label for="dp-${s.id}">Dépose / pose d'un élément à prévoir</label></div>
        </div>
      </div>
    </div>
    ${manques.length ? `<div class="supportPrix">
      <div class="supportPrixLabel">À renseigner</div>
      <ul class="resteListe">${manques.map(m=>`<li>${m}</li>`).join('')}</ul>
    </div>` : ''}
  </div>`;
}
// Une ligne du répertoire "Voir les autres supports" — compacte, avec indicateur d'état ;
// un clic ouvre son détail (même bande à 4 colonnes que le support principal), un seul ouvert
// à la fois (toggleSupportOuvert).
// Une ligne « Ajouter d'autres supports » : picto, nom, définition, et tout à droite la fourchette moyenne ; toute la ligne se coche. Aucune variable à renseigner.
function renderLigneAjout(s){
  const info = SUPPORTS_INFOS[s.support] || { def:'' };
  // Une fois coché, le support peut être précisé : son texte, et ses dimensions (sauf format fixe et véhicule). Laissé vide = estimation moyenne.
  const fmt = FORMATS_FIXES[s.support];
  const detail = s.moyen ? `<div class="ajDetail">
    <div class="field"><label>Texte à peindre <span class="aideFab">— vide : « ${escapeHtml(state.projet.nomProjet || 'votre lettrage')} »</span></label><input class="input" value="${escapeHtml(s.texteAPeindre || '')}" onchange="majSupport('${s.id}','texteAPeindre', this.value)"></div>
    ${estVehicule(s) ? '' : (fmt ? `<div class="tiny" style="color:var(--muted)">Format standard : ${escapeHtml(fmt.description)}</div>` : `<div class="field"><label>Dimensions du support <span class="aideFab">— longueur × hauteur, en cm (facultatif)</span></label>
      <div class="dims"><input class="input" type="number" min="0" placeholder="Longueur (cm)" value="${s.longueurCm ?? ''}" onchange="majSupport('${s.id}','longueurCm', this.value)"><span>×</span><input class="input" type="number" min="0" placeholder="Hauteur (cm)" value="${s.hauteurCm ?? ''}" onchange="majSupport('${s.id}','hauteurCm', this.value)"></div></div>`)}
  </div>` : '';
  return `
  <div class="ajBloc">
  <label class="ligneAjout ${s.moyen?'on':''}">
    <span class="ajPicto">${ICONE_SUPPORT[s.support]||''}</span>
    <span class="ajTexte"><b>${escapeHtml(s.support)}</b><span>${escapeHtml(info.def)}</span></span>
    <input type="checkbox" class="ajCase" ${s.moyen?'checked':''} aria-label="Ajouter ${escapeHtml(s.support)}" onchange="ajouterSupportMoyen('${s.id}', this.checked)">
  </label>${detail}
  </div>`;
}
function renderRepertoireRow(s, occurrence, totalMemeType){
  const ouvert = state.supportOuvert === s.id;
  const statut = s.inclus ? {label:'Sélectionné', cls:'sel'} : (s.explore ? {label:'Écarté', cls:'ecarte'} : {label:'Non exploré', cls:'non'});
  return `
  <div class="repRow ${ouvert?'ouvert':''}" id="sb-${s.id}">
    <div class="repRowHead" onclick="toggleSupportOuvert('${s.id}')">
      <span class="repPicto">${ICONE_SUPPORT[s.support]||'🎨'}</span>
      <span class="repNom">${nomSupportAffiche(s, occurrence, totalMemeType)}</span>
      <span class="repStatut ${statut.cls}">${statut.label}</span>
      <span class="repRond ${s.inclus?'checked':''}">${s.inclus?'✓':''}</span>

    ${ouvert ? `<div class="repDetail">${renderSupportRow(s, occurrence, totalMemeType)}</div>` : ''}

}

/* Habillage aux couleurs et éléments du site vitrine etsgesret.fr (logo, réseaux, coordonnées
   réelles de l'atelier). Les coordonnées et le logo sont ceux de l'atelier Gesret : si d'autres
   ateliers utilisent ce formulaire, il faudra les rendre propres à chaque atelier. */
// Vidéo de l'en-tête : chemin du fichier dans le dossier du site (ex. 'video-entete.mp4'), vide tant qu'il n'y en a pas. Lecture automatique, en boucle, sans son.
// Uniquement sur estimation.etsgesret.fr (?video dans l'adresse pour la prévisualiser ailleurs). Fichier converti en MP4 H.264 sans son (voir video-entete.mp4).
const VIDEO_ENTETE = (location.hostname === 'estimation.etsgesret.fr' || new URLSearchParams(location.search).has('video')) ? 'video-entete.mp4' : '';
function enTeteSite(clair){
  const c = clair ? 'black' : 'white';
  const rs = [['instagram','https://www.instagram.com/etsgesret/?hl=fr'],['facebook','https://www.facebook.com/etsgesret/?locale=fr_FR'],['linkedin','https://fr.linkedin.com/company/ets-gesret-peinture-en-lettres'],['youtube','https://www.youtube.com/@etsgesret']];
  return `<header class="siteHeader ${clair?'clair':''}">
    <a class="retour" href="https://www.etsgesret.fr/">← etsgesret.fr</a>
    <a class="logo" href="https://www.etsgesret.fr/"><img src="charte-gesret/logo-dentele${clair?'':'-light'}.svg" alt="Gesret"></a>
    <div class="reseaux">${rs.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener" aria-label="${n}"><img src="charte-gesret/${n}-${c}.svg" alt="${n}"></a>`).join('')}</div>
  </header>`;
}
// Pied de page : au début, seulement la ligne de copyright ; le grand pied (logo, contact, prestations) n'apparaît qu'après
// « Voir l'estimation » (ou une fois la demande envoyée). Le téléphone n'y figure plus.
function piedSite(){
  const complet = !!(state.estimationVisible || state.envoye);
  const copy = `<p class="copy">© 2026 Ets. Gesret — Peintres et fiers de lettres&nbsp;! — <a href="https://www.etsgesret.fr/contenu/mentions-legales">Mentions légales</a></p>`;
  return `<footer class="siteFooter min">${copy}</footer>`;   // plus de grand pied (contact, prestations) sous le bouton : seulement la ligne de copyright
  if(!complet) return `<footer class="siteFooter min">${copy}</footer>`;
  return `<footer class="siteFooter">
    <div class="cols">
      <div><img class="logo" src="charte-gesret/logo-gesret-full.svg" alt="Gesret"></div>
      <div>
        <p class="titre">Nous contacter</p>
        <a href="mailto:peinture@etsgesret.fr">peinture@etsgesret.fr</a>
        <p style="margin:10px 0 0">16 rue de l'Industrie<br>56390 Grand-Champ</p>
      </div>
      <div>
        <p class="titre">Nos prestations</p>
        <ul>
          <li><a href="https://www.etsgesret.fr/prestations/enseignes-peintes">Enseignes peintes</a></li>
          <li><a href="https://www.etsgesret.fr/prestations/vitrines-peintes">Vitrines peintes</a></li>

          <li><a href="https://www.etsgesret.fr/prestations/murs-grand-format">Murs grand format</a></li>

function render(){

    document.getElementById('app').innerHTML = `${enTeteSite(true)}<div class="wrap">${renderConfirmation()}</div>${piedSite()}`;

// libres, sans prix), puis la date souhaitée et les contraintes. Une option qui ferait doublon
// avec un produit dérivé (ex. la mini-charte graphique) n'est pas reproposée.

  <div class="blocUniforme">
