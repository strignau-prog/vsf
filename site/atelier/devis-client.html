/* Estimatif flottant — montant (fourchette), synthèse grisée de ce qu'il comprend, puis les trois
   issues. Mis à jour sans tout redessiner quand seul le trajet change (majPanneau). */
const OPTIONS_COURTES = { flyers:"Flyers", urbanisme:"Démarches urbanisme / ABF", mini_charte:"Mini-charte graphique" };
// Lignes grisées de l'estimatif : { lib (HTML), prix (HT, ou null) }. Chaque ligne tient en deux
// lignes d'écran : le texte à peindre est abrégé à 10 caractères.
function abregerTexte(t){ t = String(t||'').trim(); return t.length > 10 ? t.slice(0,10).trimEnd() + '...' : t; }
// Maquette + poncifs : montant HT cumulé, affiché UNIQUEMENT à l'intérieur du prix du support principal (jamais en ligne séparée,
// pour qu'on ne puisse pas comparer les tarifs particulier / professionnel en jouant avec le formulaire).
function forfaitsCumulesHT(){ return forfaitsProjet().reduce((s, f) => s + forfaitHT(f), 0); }
// Support principal = le premier support retenu dont le prix est affiché ; à défaut, le premier dont le prix est affiché.
function supportPrincipal(){
  const pret = s => supportComplet(s) && s._prixAffiche != null;
  return state.supports.find(s => s.id === state.principalId && pret(s)) || state.supports.find(s => s.inclus && pret(s)) || null;
}
function prixAfficheAvecForfaits(s){
  const sp = supportPrincipal();
  return s._prixAffiche + (sp && sp.id === s.id ? forfaitsCumulesHT() : 0);
}
function syntheseEstimatif(){
  const tot = {}, cpt = {};
  for(const s of state.supports) tot[s.support] = (tot[s.support]||0) + 1;
  const lignes = [];
  for(const s of state.supports){
    const occ = (cpt[s.support] = (cpt[s.support]||0) + 1);
    if(!s.inclus) continue;
    const texte = abregerTexte(s.texteAPeindre || state.projet.nomProjet);
    const dim = s.moyen ? ' · estimation moyenne' : (estVehicule(s) ? (surfaceVehiculeCm2(s) ? ` · ${partiesVehiculeChoisies(s).length} partie(s), ${(surfaceVehiculeCm2(s)/10000).toFixed(2).replace('.', ',')} m²` : '') : ((s.longueurCm && s.hauteurCm) ? ` · ${s.longueurCm}×${s.hauteurCm} cm` : ''));
    lignes.push({ lib: nomSupportAffiche(s, occ, tot[s.support]) + (texte ? ` « ${escapeHtml(texte)} »` : '') + dim, prix: supportComplet(s) && s._prixAffiche != null ? prixAfficheAvecForfaits(s) : null });
  }
  if(descriptionEffet()) lignes.push({ lib: escapeHtml(descriptionEffet()), prix: null });
  for(const cle of state.envieChoisies){
    const p = petitPlusParCle(cle);
    if(p) lignes.push({ lib: escapeHtml(p.label), prix: p.prixHT == null ? null : Number(p.prixHT) });
  }
  for(const code of state.optionsChoisies) lignes.push({ lib: escapeHtml(OPTIONS_COURTES[code] || OPTIONS_CLIENT_LABELS[code] || code), prix: null });
  if(state.deplacement) lignes.push({ lib: `Déplacement · ${state.deplacement.km.toLocaleString('fr-FR')} km A/R`, prix: state.deplacement.prixHT });
  return lignes;
}
function renderEstimatifFlottant(){
  const totalHT = estimationTotaleHT();
  let montant = '—', note = "Complétez les informations de votre support pour voir l'estimatif.";
  if(totalHT){
    const estTTC = state.coordonnees.typeClient === 'particulier';
    const total = estTTC ? totalHT * (1 + (reglagesEstimation?.tvaPct ?? 20)/100) : totalHT;
    // La fabrication du support est un prix fixe : la fourchette ne s'applique qu'au reste.
    const fixe = estimationFixeHT() * (estTTC ? 1 + (reglagesEstimation?.tvaPct ?? 20)/100 : 1), f = fourchettePct()/100;
    const basse = Math.round((total - fixe) * (1 - f) + fixe), haute = Math.round((total - fixe) * (1 + f) + fixe);
    montant = `${basse.toLocaleString('fr-FR')} – ${haute.toLocaleString('fr-FR')} €`;
    const sansFab = state.supports.some(s => s.inclus && supportComplet(s) && s._prixAffiche != null && !fabricationPour(s));
    note = `${estTTC ? 'TTC' : 'HT'} · estimation indicative (± ${fourchettePct()} %)${sansFab ? ', hors fabrication du support' : ''}`;
  }
  const synth = syntheseEstimatif();
  const facteur = state.coordonnees.typeClient === 'particulier' ? 1 + (reglagesEstimation?.tvaPct ?? 20)/100 : 1;
  const prixTxt = p => p == null ? '' : '≈ ' + Math.round(p * facteur).toLocaleString('fr-FR') + ' €';
  return `<aside class="estimatif ${state.estimatifOuvert?'ouvert':''}" id="estimatif" aria-live="polite">
    <div class="estEntete">
      <div><img class="estPalette" src="pictos-estimation/palette.png" alt="" draggable="false"><div class="estTitre">Estimatif total</div><div class="estMontant">${montant}</div><div class="estNote">${note}</div></div>
      <button type="button" class="estToggle" onclick="basculerEstimatif()">${state.estimatifOuvert?'Masquer le détail ▼':'Voir ce qui compose mon estimatif ▲'}</button>
    </div>
    <div class="estCorps">
      <p class="estAvert">Estimation indicative. La fabrication du support (découpe, ponçage, apprêt d'un panneau à créer) n'est comprise que si vous avez coché « Fabrication du support » sur le support concerné. Elle ne vaut pas devis : l'atelier vous confirme un prix ferme après étude de votre projet.</p>
      ${synth.length ? `<ul class="estListe">${synth.map(l=>`<li><span class="estLib">${l.lib}</span><span class="estPrix">${prixTxt(l.prix)}</span></li>`).join('')}</ul>` : ''}
      <div class="estBoutons">
        <button type="button" class="estBtn principal actionBtn" onclick="envoyerDemande('qualification')">L'estimatif me convient, contactez-moi pour la suite</button>
        <a class="estBtn secondaire" href="https://www.etsgesret.fr/contact" target="_blank" rel="noopener" onclick="enregistrerAbandon('rappel')">Je préfère être rappelé·e ou mon projet est plus complexe</a>
        <button type="button" class="estBtn discret" onclick="recommencerEstimatif()">↺ Recommencer l'estimatif</button>
        <button type="button" class="estBtn discret" onclick="declinerDemande()">Pas pour moi cette fois-ci</button>
      </div>
    </div>
  </aside>`;
}
function majPanneau(){
  if(!state.estimationVisible || state.envoye) return;
  const el = document.getElementById('estimatif'); if(!el) return;
  const y = window.scrollY;
  el.outerHTML = renderEstimatifFlottant();
  window.scrollTo(0, y);
}
function ouvrirEstimatif(){ if(!state.estimatifOuvert) basculerEstimatif(); }
// Le panneau est ouvert/fermé sur place (sans le recréer) : la page ne bouge pas, et le détail s'affiche en haut du panneau.
function basculerEstimatif(){
  state.estimatifOuvert = !state.estimatifOuvert;
  const el = document.getElementById('estimatif'); if(!el) return;
  el.classList.toggle('ouvert', state.estimatifOuvert);
  const btn = el.querySelector('.estToggle'); if(btn) btn.textContent = state.estimatifOuvert ? 'Masquer le détail ▼' : 'Voir ce qui compose mon estimatif ▲';
  el.scrollTop = 0;
}
function renderRefusModal(){
  return `<div class="modalFond" onclick="if(event.target===this)fermerRefus()">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="refusTitre">
      <h3 id="refusTitre">Dommage !</h3>
      <p>On garde ce que vous avez renseigné pour progresser, sans donner suite. Confirmer ?</p>
      <div class="modalBtns">
        <button type="button" class="actionBtn" onclick="refusGarder()">Oui, vous pouvez garder</button>
        <button type="button" class="actionBtn secondary" onclick="refusSupprimer()">Non, supprimez mes données</button>
        <button type="button" class="ghostBtn" onclick="fermerRefus()">Annuler</button>
      </div>
    </div>
  </div>`;
}

async function detecterModeInterne(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session && ESTABLISHMENT_ID){
      const { data: membre } = await sb.from('members').select('id').eq('user_id', session.user.id).eq('establishment_id', ESTABLISHMENT_ID).maybeSingle();
      state.interne.actif = !!membre;
    }
  }catch(err){ /* silencieux : un visiteur public sans session ne doit jamais voir d'erreur ici */ }
  state.interne.verifie = true;
  render();
}
function onChampInterne(champ, v){ state.interne[champ] = v; }

// Barre d'outils du navigateur (iPhone) : si elle recouvre le bas de l'écran, le panneau est relevé d'autant.
/* =========================================================================
   COORDONNÉES RÉCUPÉRÉES EN CAS D'ABANDON — si le visiteur a renseigné un téléphone et/ou un e-mail puis quitte le formulaire sans l'envoyer,
   on enregistre quand même sa demande telle qu'elle est (marquée « abandon » : l'alerte à l'atelier le précise). Une seule fois par visite.
   Envoi par fetch « keepalive » (part même quand la page se ferme). AUCUN mail immédiat : l'abandon est rangé côté serveur (signaler-abandon) et l'atelier reçoit
   un seul récapitulatif en fin de journée (recap-abandons), car un visiteur peut refuser au dernier moment de partager ses données.
   ========================================================================= */
function coordonneesExploitables(){
  const c = state.coordonnees;
  return c.telephone.replace(/\D/g, '').length >= 8 || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email.trim());
}
// motif : 'abandon' (page quittée), 'rappel' (a cliqué « Je préfère être rappelé·e » → renvoyé vers le formulaire de contact du site, qu'il peut ne pas remplir).
function enregistrerAbandon(){
  if(state.envoye || state._abandonEnvoye || !ESTABLISHMENT_ID || state.acces === 'ferme' || !coordonneesExploitables()) return;
  state._abandonEnvoye = true;
  try{
    const c = state.coordonnees, sp = state.supports.find(x => x.id === state.principalId);
    const corps = { establishmentId: ESTABLISHMENT_ID,
      coordonnees: { nom:c.nom, telephone:c.telephone, email:c.email, adresse:c.adresse, ville:c.ville, typeClient:c.typeClient, raisonSociale:c.raisonSociale, siret:c.siret },
      projet: { nom: state.projet.nomProjet, objectif: state.projet.objectif, support: sp ? sp.support : '' } };
    // Rangé pour le récapitulatif du soir (fonction signaler-abandon) : aucune fiche n'est créée au Kanban pour quelqu'un qui n'est pas allé au bout.
    fetch(SUPABASE_URL + '/functions/v1/signaler-abandon', { method:'POST', keepalive:true,
      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY }, body: JSON.stringify(corps) }).catch(() => {});
  }catch(e){ /* sans effet pour le visiteur */ }
}
let minuteurAbandon = null;
document.addEventListener('visibilitychange', () => {
  clearTimeout(minuteurAbandon);
  // Page masquée (onglet fermé, changement d'application) : on laisse 20 s avant de considérer que le visiteur est parti (il peut juste consulter un numéro).
  if(document.visibilityState === 'hidden') minuteurAbandon = setTimeout(() => enregistrerAbandon('abandon'), 20000);
});
window.addEventListener('pagehide', () => enregistrerAbandon('abandon'));
function ajusterBarreBas(){
  const vv = window.visualViewport; let cache = 0;
  if(vv && vv.scale <= 1.01) cache = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--barre-bas', cache + 'px');
}
// Saisie en cours : sur téléphone, le bandeau du bas disparaît tant qu'un champ de texte, un nombre ou une liste a le focus (le clavier est ouvert).
const CHAMPS_SAISIE = 'input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=file]),textarea,select';
document.addEventListener('focusin', e => { if(e.target.matches && e.target.matches(CHAMPS_SAISIE)) document.body.classList.add('saisieEnCours'); });
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if(!(a && a.matches && a.matches(CHAMPS_SAISIE))) document.body.classList.remove('saisieEnCours');
}, 150));
if(window.visualViewport){ visualViewport.addEventListener('resize', ajusterBarreBas); visualViewport.addEventListener('scroll', ajusterBarreBas); }
window.addEventListener('scroll', ajusterBarreBas, { passive:true }); window.addEventListener('resize', ajusterBarreBas); ajusterBarreBas();
// Chaque rendu est suivi d'un réajustement de la taille des aperçus (et à chaque changement de taille de fenêtre).
document.addEventListener('keydown', e => {
  const b = e.target;
  if(!b || !b.classList || !b.classList.contains('qcmOpt')) return;
  const sens = { ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1 }[e.key];
  if(!sens) return;
  const groupe = [...b.closest('.qcm').querySelectorAll('.qcmOpt')];
  const suivant = groupe[(groupe.indexOf(b) + sens + groupe.length) % groupe.length];
  if(suivant){ e.preventDefault(); suivant.focus(); suivant.click(); }
});
// Le formulaire se redessine après chaque champ validé : on garde le curseur dans le champ en cours, pour que la touche Tab
// continue vers la case suivante (Longueur → Hauteur, etc.) au lieu de renvoyer ailleurs.
const CHAMPS_FOCUS = 'input,textarea,select,button.qcmOpt';
function cleFocus(el){
  if(!el || !el.matches || !el.matches(CHAMPS_FOCUS)) return null;
  const bloc = el.closest('[id^="sb-"]'), racine = bloc || document.getElementById('app');
  return { bloc: bloc ? bloc.id : '', i: [...racine.querySelectorAll(CHAMPS_FOCUS)].indexOf(el) };
}
function restaurerFocus(c){
  if(!c || c.i < 0) return;
  const racine = c.bloc ? document.getElementById(c.bloc) : document.getElementById('app'); if(!racine) return;
  const n = [...racine.querySelectorAll(CHAMPS_FOCUS)][c.i];
  if(n && n !== document.activeElement && n.type !== 'file') n.focus({ preventScroll:true });
}
{ const renderBase = render; render = function(){ const c = cleFocus(document.activeElement); renderBase(); restaurerFocus(c); ajusterApercus(); }; }
window.addEventListener('resize', ajusterApercus);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(ajusterApercus);
// À l'actualisation, le navigateur ne doit pas rouvrir la page au milieu : on repart toujours du haut.
try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
render();
window.scrollTo(0, 0);
detecterModeInterne();
if(ESTABLISHMENT_ID) chargerReglagesEstimation(ESTABLISHMENT_ID).then(render);
// Filet de sécurité : si les réglages tardent (réseau), le formulaire s'affiche quand même au bout de 6 s.
setTimeout(()=>{ if(state.acces === 'verif'){ state.acces = 'ouvert'; render(); } }, 6000);
</script>
