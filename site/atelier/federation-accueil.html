    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:none;padding:0}

    /* ---------- Nav horizontale — jamais latérale, sous-menu au survol ---------- */
    nav.topnav{background:var(--sidebar);color:var(--sidebarInk);display:flex;align-items:center;gap:4px;padding:0 20px;height:56px;font-size:14.5px;position:sticky;top:0;z-index:40}

    nav.topnav .menuItem{position:relative;height:100%;display:flex;align-items:center}
    nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink,nav.topnav .menuItem>button.topLink{padding:0 14px;cursor:pointer;color:var(--sidebarMuted);text-decoration:none;background:none;border:none;font:inherit}
    nav.topnav .menuItem:hover>span,nav.topnav .menuItem>a.topLink:hover,nav.topnav .menuItem>button.topLink:hover{color:#fff}
    nav.topnav .dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--ink);min-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:0 0 10px 10px;overflow:hidden;z-index:50}
    nav.topnav .menuItem:hover .dropdown{display:block}
    nav.topnav .dropdown a,nav.topnav .dropdown button.ddItem{display:block;width:100%;text-align:left;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:13.5px;border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;font-family:inherit}
    nav.topnav .dropdown a:last-child,nav.topnav .dropdown button.ddItem:last-child{border-bottom:none}
    nav.topnav .dropdown a:hover,nav.topnav .dropdown button.ddItem:hover{background:var(--soft)}
    nav.topnav .dropdown .ddFuture{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
    nav.topnav .dropdown .ddFuture:last-child{border-bottom:none}
    nav.topnav .dropdown .ddTag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
    nav.topnav .navRight{margin-left:auto;display:flex;align-items:center;gap:12px}
    nav.topnav .navRight span{color:var(--sidebarMuted);font-size:12.5px}
    nav.topnav .navRight button{color:var(--sidebarMuted);background:none;border:none;font:inherit;cursor:pointer}
    nav.topnav .navRight button:hover{color:#fff}
    nav.topnav .navRight .actionBtn{background:var(--amber);color:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px}
    .navToggle{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 10px}
    @media (max-width:720px){
      nav.topnav{flex-wrap:wrap;height:auto;padding:10px 16px}

      nav.topnav .menuItem{display:none;width:100%;height:auto;flex-direction:column;align-items:stretch}

      nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink,nav.topnav .menuItem>button.topLink{padding:12px 0 4px;cursor:pointer;text-align:left;width:100%}
      nav.topnav .dropdown{position:static;box-shadow:none;border-radius:0;background:transparent;min-width:0}
      nav.topnav .menuItem.open .dropdown{display:block}
      nav.topnav .dropdown a,nav.topnav .dropdown button.ddItem{color:#fff;padding:10px 0 10px 14px;border-bottom:1px solid rgba(255,255,255,.12)}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) }

let inPasswordRecovery = false;
const state = { tab:'accueil', federation:null, numeroMembre:'', maFiche:{nom:'',prenom:'',telephone:'',adresse:'',thereseActif:false,consentementAgregation:false}, kpis:{ateliers:0,personnes:0}, myMemberships:[], myInvitations:[], guides:[], mesValidations:[],
  ficheAnnuaire:{nomAtelier:'',rolePublic:'',photoUrl:'',presentation:'',anneesExperience:'',tagsSpecialites:[],villeIntervention:'',latitude:null,longitude:null,rayonInterventionKm:100,accueilAtelier:false,accueilleStagiaires:false,ouvertReconversion:false,collaborations:'',contactPublic:'',membreDepuis:''},

/* =========================================================================
   AUTHENTIFICATION — email + mot de passe, avec confirmation à l'inscription
   et récupération de mot de passe. C'est ici, au niveau Fédération, que tout
   compte se crée : jamais directement depuis un atelier.
   ========================================================================= */
let loginIntent = 'connexion';
function startLogin(intent){ loginIntent = intent; renderLogin(); }
function renderLogin(msg){
  const creer = loginIntent==='creer';
  document.querySelector('.app').innerHTML = `
  <div style="max-width:420px;margin:12vh auto;padding:0 20px">
    <button class="ghostBtn" style="margin-bottom:14px" onclick="renderPublicHome()">← Retour à Ma Fédération</button>
    <div style="font-weight:700;font-size:22px;margin-bottom:24px">FÉDÉRATION DE PEINTRES EN LETTRES</div>
    <div style="font-weight:700;font-size:21px;margin-bottom:8px">${creer?'Créer mon compte':'Connexion'}</div>
    <div class="sectionSub">${creer?"Choisis un email et un mot de passe pour créer ton compte Fédération. C'est le même compte que pour MAMAIN.":"Entre ton email et ton mot de passe."}</div>
    <input id="loginEmail" class="input" type="email" placeholder="ton@email.fr" style="margin-bottom:10px">
    <input id="loginPassword" class="input" type="password" placeholder="Mot de passe" style="margin-bottom:10px">
    ${creer?'<input id="loginPassword2" class="input" type="password" placeholder="Confirme le mot de passe" style="margin-bottom:10px">':''}
    <button class="actionBtn" onclick="${creer?'handleSignUp()':'handleSignIn()'}">${creer?'Créer mon compte':'Se connecter'}</button>
    <div id="loginMsg" class="tiny" style="margin-top:14px">${msg?escapeHtml(msg):''}</div>
    <div class="tiny" style="margin-top:16px">
      ${creer
        ? `Déjà un compte ? <button class="ghostBtn" onclick="startLogin('connexion')">Se connecter</button>`
        : `Pas encore de compte ? <button class="ghostBtn" onclick="startLogin('creer')">Créer mon compte</button><br><button class="ghostBtn" style="margin-top:6px" onclick="renderForgotPassword()">Mot de passe oublié ?</button>`}
    </div>
  </div>`;
}
async function handleSignIn(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password) return;
  const msgEl=document.getElementById('loginMsg'); msgEl.textContent='Connexion…';
  try{
    const {error}=await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
  }catch(err){
    msgEl.textContent = err.message==='Invalid login credentials'
      ? "Email ou mot de passe incorrect."
      : err.message==='Email not confirmed'
        ? "Confirme d'abord ton adresse email (regarde ta boîte mail), puis reviens te connecter."
        : "Erreur : "+(err.message||err);
  }
}
async function handleSignUp(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const password2=document.getElementById('loginPassword2').value;
  const msgEl=document.getElementById('loginMsg');
  if(!email||!password) return;
  if(password.length<6) return msgEl.textContent='Le mot de passe doit faire au moins 6 caractères.';
  if(password!==password2) return msgEl.textContent='Les deux mots de passe ne correspondent pas.';
  msgEl.textContent='Création du compte…';
  try{
    const {data, error}=await sb.auth.signUp({ email, password, options:{ emailRedirectTo: window.location.origin + '/federation-accueil.html'} });
    if(error) throw error;
    if(!data.session){
      msgEl.textContent="Compte créé ! Vérifie ta boîte mail (et les spams) pour confirmer ton adresse, puis reviens te connecter avec ton mot de passe.";
      loginIntent='connexion';
    }
  }catch(err){
    msgEl.textContent = err.message==='User already registered'
      ? "Un compte existe déjà avec cet email — connecte-toi plutôt."
      : "Erreur : "+(err.message||err);
  }
}
function renderForgotPassword(){
  document.querySelector('.app').innerHTML = `
  <div style="max-width:420px;margin:15vh auto;padding:0 20px">
    <button class="ghostBtn" style="margin-bottom:14px" onclick="startLogin('connexion')">← Retour</button>
    <div style="font-weight:700;font-size:22px;margin-bottom:24px">FÉDÉRATION DE PEINTRES EN LETTRES</div>
    <div style="font-weight:700;font-size:21px;margin-bottom:8px">Mot de passe oublié</div>
    <div class="sectionSub">Entre ton email, tu vas recevoir un lien pour choisir un nouveau mot de passe.</div>
    <input id="forgotEmail" class="input" type="email" placeholder="ton@email.fr" style="margin-bottom:10px">
    <button class="actionBtn" onclick="handleForgotPassword()">Envoyer le lien</button>
    <div id="forgotMsg" class="tiny" style="margin-top:14px"></div>
  </div>`;
}
async function handleForgotPassword(){
  const email=document.getElementById('forgotEmail').value.trim(); if(!email) return;
  const msgEl=document.getElementById('forgotMsg'); msgEl.textContent='Envoi…';
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/federation-accueil.html' });
    if(error) throw error;
    msgEl.textContent="Lien envoyé si ce compte existe. Vérifie ta boîte mail.";
  }catch(err){
    msgEl.textContent="Erreur : "+(err.message||err);
  }
}
function renderResetPassword(){
  document.querySelector('.app').innerHTML = `
  <div style="max-width:420px;margin:15vh auto;padding:0 20px">
    <div style="font-weight:700;font-size:22px;margin-bottom:24px">FÉDÉRATION DE PEINTRES EN LETTRES</div>
    <div style="font-weight:700;font-size:21px;margin-bottom:8px">Nouveau mot de passe</div>
    <div class="sectionSub">Choisis un nouveau mot de passe pour ton compte.</div>
    <input id="newPassword" class="input" type="password" placeholder="Nouveau mot de passe" style="margin-bottom:10px">
    <input id="newPassword2" class="input" type="password" placeholder="Confirme le mot de passe" style="margin-bottom:10px">
    <button class="actionBtn" onclick="handleResetPassword()">Enregistrer</button>
    <div id="resetMsg" class="tiny" style="margin-top:14px"></div>
  </div>`;
}
async function handleResetPassword(){
  const p1=document.getElementById('newPassword').value;
  const p2=document.getElementById('newPassword2').value;
  const msgEl=document.getElementById('resetMsg');
  if(p1.length<6) return msgEl.textContent='Le mot de passe doit faire au moins 6 caractères.';
  if(p1!==p2) return msgEl.textContent='Les deux mots de passe ne correspondent pas.';
  msgEl.textContent='Enregistrement…';
  try{
    const {error}=await sb.auth.updateUser({ password: p1 });
    if(error) throw error;
    inPasswordRecovery=false;
    history.replaceState(null, '', window.location.pathname + window.location.search);
    const {data:{session}} = await sb.auth.getSession();
    currentUser = session ? session.user : null;
    await afterLogin();
  }catch(err){
    msgEl.textContent="Erreur : "+(err.message||err);
  }
}
async function logout(){ try{ await sb.auth.signOut(); }catch(e){ console.error(e); } currentUser=null; await renderPublicHome(); }

async function loadFederationPublic(){
  if(state.federation) return;
  try{
    const { data } = await sb.from('federations').select('id,name').order('created_at').limit(1);
    state.federation = (data && data[0]) || null;
  }catch(e){ console.error(e); }
}
async function renderPublicHome(){
  document.querySelector('.app').innerHTML = `<div style="padding:24px" class="tiny">Chargement…</div>`;
  try{
    await loadFederationPublic();
    await loadPagesPubliques();
  }catch(e){ console.error(e); }
  // Lien direct vers une fiche peintre (partagé, ou depuis la carte des réalisations) —
  // ?peintre=<numero_membre> ouvre directement l'annuaire sur cette fiche.
  const params = new URLSearchParams(window.location.search);
  const peintreDemande = params.get('peintre');
  if(peintreDemande){ state.tab='pub-peintres'; state.peintreOuvert = peintreDemande; }
  else if(params.get('tab')==='peintres') state.tab='pub-peintres';
  else if(params.get('tab')==='devenir') state.tab='pub-devenir';
  else state.tab='pub-accueil';
  renderTab();
}

  const { data, error } = await sb.from('federation_members').select('numero_membre,federation_id,nom,prenom,telephone,adresse,therese_actif,consentement_agregation,nom_atelier,role_public,photo_url,presentation,annees_experience,tags_specialites,ville_intervention,latitude,longitude,rayon_intervention_km,accueil_atelier,accueille_stagiaires,ouvert_reconversion,collaborations,contact_public,membre_depuis').eq('user_id', currentUser.id).maybeSingle();
  if(error) throw error;
  state.numeroMembre = data ? data.numero_membre : '';
  state.maFiche = data ? { nom:data.nom||'', prenom:data.prenom||'', telephone:data.telephone||'', adresse:data.adresse||'', thereseActif:!!data.therese_actif, consentementAgregation:!!data.consentement_agregation } : { nom:'', prenom:'', telephone:'', adresse:'', thereseActif:false, consentementAgregation:false };
  state.ficheAnnuaire = data ? {
    nomAtelier:data.nom_atelier||'', rolePublic:data.role_public||'', photoUrl:data.photo_url||'',
    presentation:data.presentation||'', anneesExperience:data.annees_experience??'', tagsSpecialites:data.tags_specialites||[],
    villeIntervention:data.ville_intervention||'', latitude:data.latitude, longitude:data.longitude,
    rayonInterventionKm:data.rayon_intervention_km??100, accueilAtelier:!!data.accueil_atelier,
    accueilleStagiaires:!!data.accueille_stagiaires, ouvertReconversion:!!data.ouvert_reconversion,
    collaborations:data.collaborations||'', contactPublic:data.contact_public||'', membreDepuis:data.membre_depuis||''
  } : state.ficheAnnuaire;
}
let cadransCharges = false;
async function chargerCadrans(){
  const [
    { data: consolide }, { data: evenements },
    { data: sudOuest }, { data: contribMoi }, { data: contribEquipe },
    { data: consentement }, { data: syntheseMoisData }
  ] = await Promise.all([
    sb.from('niveau_consolide').select('situation_id,niveau,statut').eq('personne_id', currentUser.id),
    sb.from('situation_events').select('id,date').eq('personne_id', currentUser.id).gte('date', new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString()),
    sb.from('boussole_sud_ouest').select('*').eq('personne_id', currentUser.id).order('date',{ascending:false}),
    sb.from('contributions_collectives').select('*').eq('personne_id', currentUser.id).order('date',{ascending:false}),
    sb.from('contributions_collectives').select('*').order('date',{ascending:false}).limit(10),
    sb.from('consentements_donnees_sensibles').select('consenti').eq('personne_id', currentUser.id).eq('categorie','sud_ouest').maybeSingle(),
    sb.from('syntheses_mensuelles').select('*').eq('personne_id', currentUser.id).eq('mois', premierJourMoisCourant()).maybeSingle(),
  ]);
  state.cadrans = {
    consolide: consolide || [], nbEvenementsMois: (evenements||[]).length,
    sudOuest: sudOuest || [], contribMoi: contribMoi || [], contribEquipe: contribEquipe || [],
    consentementSudOuest: consentement ? !!consentement.consenti : false,
    syntheseMois: syntheseMoisData ? syntheseMoisData.texte : '',
  };
}
function premierJourMoisCourant(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
let mesDonneesChargees = false;
async function chargerMesDonnees(){
  const { data, error } = await sb.from('validations_competence').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false });
  state.mesValidations = error ? [] : (data||[]);
}
async function loadKpis(){
  try{
    const { data, error } = await sb.rpc('federation_kpis');
    if(error) throw error;
    state.kpis = data || {ateliers:0,personnes:0};
  }catch(e){ console.error(e); state.kpis = {ateliers:0,personnes:0}; }
}
async function loadMyData(){
  const { data: memberRows, error: e1 } = await sb.from('members').select('id,establishment_id,role').eq('user_id', currentUser.id);
  if(e1) throw e1;
  const estIds = [...new Set(memberRows.map(m=>m.establishment_id))];
  let establishments = [];
  if(estIds.length){
    const { data, error: e2 } = await sb.from('establishments').select('id,name,mode').in('id', estIds);
    if(e2) throw e2;
    establishments = data || [];
  }
  state.myMemberships = memberRows.map(m=>({ ...m, establishment: establishments.find(e=>e.id===m.establishment_id) }));

  const { data: invRows, error: e3 } = await sb.from('invitations').select('id,establishment_id,role,status').or(`email.eq.${currentUser.email.toLowerCase()},invitee_user_id.eq.${currentUser.id}`).eq('status','pending');
  if(e3) throw e3;
  let invEstablishments = [];
  const invEstIds = [...new Set((invRows||[]).map(i=>i.establishment_id))];
  if(invEstIds.length){
    const { data, error: e4 } = await sb.from('establishments').select('id,name').in('id', invEstIds);
    if(e4) throw e4;
    invEstablishments = data || [];
  }
  state.myInvitations = (invRows||[]).map(i=>({ ...i, establishment: invEstablishments.find(e=>e.id===i.establishment_id) }));
}
async function loadGuides(){
  const { data, error } = await sb.from('federation_guides').select('slug,titre,description,sections').order('slug');
  if(error) throw error;
  state.guides = data || [];
}

// Générique par métier (roles_metier) — plus de rôles codés en dur, voir guide-production-mindmap.html.
let ROLES = [];
async function chargerRoles(){
  const { data: metiers } = await sb.from('metiers').select('id').order('ordre').limit(1);
  const metierId = metiers && metiers[0] ? metiers[0].id : null;
  if(!metierId){ ROLES = []; return; }
  const { data } = await sb.from('roles_metier').select('code,label').eq('metier_id', metierId).order('ordre');
  ROLES = (data||[]).map(r=>({ value:r.code, label:r.label }));
}
function roleLabel(v){ return (ROLES.find(r=>r.value===v)||{}).label || v || '—' }

async function setTab(tab){
  state.tab=tab; renderTab();
  if(tab==='mesDonnees' && !mesDonneesChargees){
    await chargerMesDonnees();
    mesDonneesChargees = true;
    renderTab();
  }
  if(tab==='cadrans' && !cadransCharges){
    await chargerCadrans();
    cadransCharges = true;
    renderTab();
  }
}
function renderTab(){
  if(state.tab==='accueil') return shell(renderAccueilAdmin());
  if(state.tab==='guides') return shell(renderGuides());
  if(state.tab==='maFiche') return shell(currentUser ? renderMaFiche() : renderConnexionRequise());
  if(state.tab==='mesDonnees') return shell(currentUser ? renderMesDonnees() : renderConnexionRequise());
  if(state.tab==='cadrans') return shell(currentUser ? renderCadrans() : renderConnexionRequise());
  if(state.tab==='mesAteliers') return shell(currentUser ? renderCreerAtelier() : renderConnexionRequise());
  if(state.tab.startsWith('pub-')) return shell(renderPagePublique(state.tab));
}

async function handleUploadPhotoProfil(event){
  const file = event.target.files && event.target.files[0];
  if(!file || !currentUser) return;
  const msgEl = document.getElementById('ficheAnnuaireMsg');
  msgEl.textContent = 'Envoi de la photo…';
  const chemin = `${currentUser.id}/${Date.now()}-${file.name}`;
  const { error: eUp } = await sb.storage.from('photos-profil').upload(chemin, file);
  if(eUp){ msgEl.textContent = 'Erreur photo : '+eUp.message; return; }
  const { data } = sb.storage.from('photos-profil').getPublicUrl(chemin);
  state.ficheAnnuaire.photoUrl = data.publicUrl;
  msgEl.textContent = 'Photo envoyée — pense à Enregistrer pour la fixer sur ta fiche.';
  renderTab();
}
async function handleSaveFicheAnnuaire(){
  const msgEl = document.getElementById('ficheAnnuaireMsg'); msgEl.textContent = 'Enregistrement…';
  try{
    const villeIntervention = document.getElementById('ficheAnnuaireVille').value.trim();
    let latitude = state.ficheAnnuaire.latitude, longitude = state.ficheAnnuaire.longitude;
    if(villeIntervention && villeIntervention !== state.ficheAnnuaire.villeIntervention){
      msgEl.textContent = 'Localisation de la ville…';
      const { data: geo, error: eGeo } = await sb.functions.invoke('geocoder', { body: { query: villeIntervention } });
      if(eGeo || !geo || geo.error){
        msgEl.textContent = "Ville introuvable ou trop imprécise — vérifie l'orthographe (ex : \"Lyon, France\") avant d'enregistrer.";
        return;
      }
      latitude = geo.lat; longitude = geo.lng;
    }
    const tags = document.getElementById('ficheAnnuaireTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const payload = {
      p_nom_atelier: document.getElementById('ficheAnnuaireNomAtelier').value.trim() || null,
      p_role_public: document.getElementById('ficheAnnuaireRole').value || null,
      p_photo_url: state.ficheAnnuaire.photoUrl || null,
      p_presentation: document.getElementById('ficheAnnuairePresentation').value.trim() || null,
      p_annees_experience: document.getElementById('ficheAnnuaireAnnees').value ? Number(document.getElementById('ficheAnnuaireAnnees').value) : null,
      p_tags_specialites: tags,
      p_ville_intervention: villeIntervention || null,
      p_latitude: latitude, p_longitude: longitude,
      p_rayon_intervention_km: Number(document.getElementById('ficheAnnuaireRayon').value)||100,
      p_accueil_atelier: document.getElementById('ficheAnnuaireAccueilAtelier').checked,
      p_accueille_stagiaires: document.getElementById('ficheAnnuaireStagiaires').checked,
      p_ouvert_reconversion: document.getElementById('ficheAnnuaireReconversion').checked,
      p_collaborations: document.getElementById('ficheAnnuaireCollaborations').value.trim() || null,
      p_contact_public: document.getElementById('ficheAnnuaireContact').value.trim() || null,
      p_membre_depuis: document.getElementById('ficheAnnuaireMembreDepuis').value || null,
    };
    const { error } = await sb.rpc('update_fiche_annuaire', payload);
    if(error) throw error;
    state.ficheAnnuaire = {
      nomAtelier:payload.p_nom_atelier||'', rolePublic:payload.p_role_public||'', photoUrl:payload.p_photo_url||'',
      presentation:payload.p_presentation||'', anneesExperience:payload.p_annees_experience??'', tagsSpecialites:tags,
      villeIntervention:payload.p_ville_intervention||'', latitude, longitude, rayonInterventionKm:payload.p_rayon_intervention_km,
      accueilAtelier:payload.p_accueil_atelier, accueilleStagiaires:payload.p_accueille_stagiaires,
      ouvertReconversion:payload.p_ouvert_reconversion, collaborations:payload.p_collaborations||'',
      contactPublic:payload.p_contact_public||'', membreDepuis:payload.p_membre_depuis||''
    };
    msgEl.textContent = 'Enregistré.';
    renderTab();
  }catch(err){
    msgEl.textContent = 'Erreur : '+(err.message||err);
  }
}
async function handleToggleTherese(actif){
  const msgEl=document.getElementById('thereseMsg'); msgEl.textContent='Enregistrement…';

    msgEl.textContent = "Erreur : "+(err.message||err);
  }
}

async function handleExporterMesDonnees(){
  const el = document.getElementById('rgpdMsg'); if(el) el.textContent = 'Préparation de l\'export…';
  try{
    const { data, error } = await sb.rpc('exporter_mes_donnees');
    if(error) throw error;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'mes-donnees-federation.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

// Distance à vol d'oiseau entre deux points (km) — suffisant pour un rayon d'intervention
// déclaré par le membre, pas besoin de routage réel.
function distanceKm(lat1,lng1,lat2,lng2){
  const R = 6371, toRad = d=>d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

  state.annuaire.rechercheEnCours = true; state.annuaire.rechercheErreur = ''; renderTab();
  const { data: geo, error } = await sb.functions.invoke('geocoder', { body: { query: ville } });
  state.annuaire.rechercheEnCours = false;

    state.annuaire.rechercheErreur = "Ville introuvable — vérifie l'orthographe (ex : \"Lyon, France\").";

  state.annuaire.resultats = state.annuaire.membres.filter(m =>
    m.latitude!=null && m.longitude!=null &&

  );
  renderTab();

// Réalisations signées (peintres) et contributions (collaborateur d'une réalisation d'un autre membre) —
// les contributions viennent directement du champ « Collaborateurs » de chaque réalisation, sans double saisie.
function renderRealisationsMembre(m){
  const toutes = state.annuaire.realisations || [];
  const siennes = toutes.filter(r => r.peintre_user_id === m.user_id);
  const contribs = toutes.filter(r => (r.collaborateurs||[]).includes(m.user_id));
  const ligne = (r, avecPeintre) => {
    const p = state.annuaire.membres.find(x => x.user_id === r.peintre_user_id);
    return `<a class="card" style="display:block;text-decoration:none;color:inherit" href="carte-realisations.html?r=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">
      <div class="t">${escapeHtml(r.enseigne)}</div>
      <div class="s">${escapeHtml(r.ville||'')}${avecPeintre && p ? ` — avec ${escapeHtml(p.prenom||'')} ${escapeHtml(p.nom||'')}` : ''}</div></a>`;
  };
  const estPeintre = m.role_public === 'peintre_dirigeant';
  return `
  ${estPeintre || siennes.length ? `<div class="section">
    <div class="treeTitle" style="font-size:18px">Réalisations</div>
    ${siennes.length ? `<div class="cardGrid">${siennes.map(r => ligne(r,false)).join('')}</div>` : '<div class="sectionSub">Aucune réalisation publiée pour l\'instant.</div>'}
  </div>` : ''}
  ${!estPeintre || contribs.length ? `<div class="section">
    <div class="treeTitle" style="font-size:18px">Contributions</div>
    ${contribs.length ? `<div class="cardGrid">${contribs.map(r => ligne(r,true)).join('')}</div>` : '<div class="sectionSub">Aucune contribution référencée pour l\'instant.</div>'}
  </div>` : ''}`;
}
async function handleDemanderDevis(userId){
  const msgEl = document.getElementById('devisMsg');
  if(msgEl) msgEl.textContent = 'Recherche de l\'atelier…';
  const { data, error } = await sb.from('members').select('establishment_id').eq('user_id', userId).in('role',['gerant','admin']).limit(1).maybeSingle();
  if(error || !data){ if(msgEl) msgEl.textContent = "Cet atelier n'a pas encore de formulaire de devis en ligne."; return; }
  window.location.href = `devis-client.html?est=${encodeURIComponent(data.establishment_id)}`;
}

async function handleCreateAtelier(){
  const name=document.getElementById('obName').value.trim();
  if(!name) return alert('Merci de donner un nom à ton atelier.');
  if(!state.federation) return alert("La Fédération n'a pas pu être chargée, recharge la page.");
  const mode=document.querySelector('input[name="obMode"]:checked').value;
  const msgEl=document.getElementById('obMsg'); msgEl.textContent='Création en cours…';
  try{
    const { data, error } = await sb.rpc('create_atelier', { p_name: name, p_mode: mode, p_federation_id: state.federation.id });
    if(error) throw error;
    setCurrentEstId(data.id);
    window.location.href = 'atelier-compte.html?est='+data.id;
  }catch(err){
    msgEl.textContent="La création de l'atelier a échoué : "+(err.message||err);
  }
}

/* =========================================================================
   INVITATIONS EN ATTENTE — affichées avant la coquille si besoin
   ========================================================================= */
function renderInvitations(){
  document.querySelector('.app').innerHTML = `
  <div class="content" style="max-width:600px;margin:0 auto">
    <div class="treeTitle">Invitations en attente</div>
    <div class="sectionSub">On t'a invité·e à rejoindre ${state.myInvitations.length>1?'ces ateliers':'cet atelier'}. Accepte pour y avoir accès, ou refuse si ce n'est pas pour toi.</div>
    <div>
      ${state.myInvitations.map(inv=>`
        <div class="portalItem">
          <div class="portalTitle">${escapeHtml(inv.establishment?inv.establishment.name:'Atelier')}</div>
          <div class="portalMeta">Rôle proposé : ${escapeHtml(roleLabel(inv.role))}</div>
          <div class="toolbar" style="margin-top:8px">
            <button class="actionBtn" onclick="handleAcceptInvitation('${inv.id}')">Accepter</button>
            <button class="ghostBtn" onclick="handleDeclineInvitation('${inv.id}')">Refuser</button>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}
async function handleAcceptInvitation(id){
  const inv = state.myInvitations.find(i=>i.id===id); if(!inv) return;
  try{
    // La personne peut déjà être membre de cet atelier (ajoutée autrement, ou une invitation en
    // double) — pas de policy UPDATE sur members (le rôle n'est pas modifiable par la personne
    // elle-même), donc pas d'upsert possible : on vérifie d'abord, on n'insère que si nécessaire.
    const { data: dejaMembre, error: eCheck } = await sb.from('members').select('id')
      .eq('user_id', currentUser.id).eq('establishment_id', inv.establishment_id).maybeSingle();
    if(eCheck) throw eCheck;
    if(!dejaMembre){
      const { error: e1 } = await sb.from('members').insert({ user_id: currentUser.id, establishment_id: inv.establishment_id, role: inv.role, email: currentUser.email });
      if(e1) throw e1;
    }
    const { error: e2 } = await sb.from('invitations').update({ status:'accepted' }).eq('id', inv.id);
    if(e2) console.error(e2);
    await afterLogin();
  }catch(err){ alert("Impossible d'accepter l'invitation : "+(err.message||err)); }
}
async function handleDeclineInvitation(id){
  const inv = state.myInvitations.find(i=>i.id===id); if(!inv) return;
  if(!await confirmer('Refuser cette invitation ?')) return;
  try{
    const { error } = await sb.from('invitations').update({ status:'declined' }).eq('id', inv.id);
    if(error) throw error;
    await afterLogin();
  }catch(err){ alert('Erreur : '+(err.message||err)); }
}

/* =========================================================================
   ROUTAGE
   ========================================================================= */
async function afterLogin(){
  document.querySelector('.app').innerHTML = `<div style="padding:24px" class="tiny">Chargement…</div>`;
  try{
    await loadFederationPublic();
    await chargerRoles();
    await loadMyFederationIdentity();
    await loadKpis();
    await loadMyData();
    if(state.myInvitations.length){ renderInvitations(); return; }
    await loadGuides();
    const paramsTab = new URLSearchParams(window.location.search);
    if(paramsTab.get('tab')==='devenir'){ state.tab='pub-devenir'; renderTab(); return; }
    // Un membre qui n'a qu'un seul atelier n'a rien à choisir à la toute première
    // connexion : on l'amène directement sur l'accueil de cet atelier plutôt que sur la
    // vue d'ensemble Fédération (réservée en pratique au comité, qui gère plusieurs
    // ateliers). Marqué en sessionStorage pour ne le faire qu'une fois par session — sinon
    // cliquer "Ma Fédération" depuis l'Atelier renvoyait systématiquement vers l'Atelier,
    // rendant la page Fédération inatteignable.
    if(currentUser.email!==COMITE_EMAIL_FEDERATION && state.myMemberships.length===1 && !sessionStorage.getItem('redirigeVersAtelierFait')){
      sessionStorage.setItem('redirigeVersAtelierFait','1');
      window.location.href = 'atelier-compte.html?est='+state.myMemberships[0].establishment_id;
      return;
    }
    state.tab='accueil';
    renderTab();
  }catch(e){
    console.error(e);
    document.body.innerHTML = `<div class="errBox">Impossible de charger tes données : ${escapeHtml(e.message||String(e))}\n\nRecharge la page.</div>`;
  }
}
async function initApp(){
  let authErrorMsg=null;
  const isRecovery = window.location.hash.includes('type=recovery');
  if(window.location.hash.includes('error=')){
    const params=new URLSearchParams(window.location.hash.slice(1));
    const desc=params.get('error_description');
    authErrorMsg = desc ? decodeURIComponent(desc.replace(/\+/g,' ')) : "Ce lien de connexion est invalide ou a déjà été utilisé.";
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  try{
    const {data:{session}, error} = await sb.auth.getSession();
    if(error) throw error;
    if(isRecovery){ inPasswordRecovery=true; renderResetPassword(); }
    else if(session){ currentUser=session.user; await afterLogin(); }
    else if(authErrorMsg){ renderLogin(authErrorMsg); }
    else { await renderPublicHome(); }
  }catch(e){
    console.error(e);
    renderLogin('Erreur de connexion : '+(e.message||e));
  }
  sb.auth.onAuthStateChange(async (event, session)=>{
    if(inPasswordRecovery){ return; }
    if(session && (!currentUser || currentUser.id!==session.user.id)){ currentUser=session.user; await afterLogin(); }
    if(!session && currentUser){ currentUser=null; await renderPublicHome(); }
  });
}
initApp();
