  <title>Cartographie métier — base solide</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* V0 — même système typo/couleurs que tout le projet, voir atelier-compte.html. */
    :root{
      --bg:#fff;
      --ink:#1c1a17;
      --muted:#55504a;
      --line:#e4e0d9;
      --soft:#f7f5f2;
      --accent:#a8461f;
      --red:var(--ink);
      --amber:var(--ink);
      --green:var(--ink);
      --redBg:var(--soft);
      --amberBg:var(--soft);
      --greenBg:var(--soft);
      --blue:var(--ink);
      --blueBg:var(--soft);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    body{font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums}
    h1,h2,.brand,.treeTitle{font-family:Fraunces,Georgia,serif;font-weight:600}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:none;padding:0}
    .app{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
    .topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;z-index:20}
    .brand{font-weight:700;font-size:22px;letter-spacing:.02em}
    .brand small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .nav button,.miniBtn,.ghostBtn,.chip,.actionBtn{border:1px solid transparent;border-radius:999px;padding:8px 12px;min-height:38px}
    .nav button.active,.nav button:hover,.miniBtn:hover,.ghostBtn:hover,.actionBtn:hover{background:var(--soft)}
    .crumb{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{display:grid;grid-template-columns:minmax(760px,1fr) minmax(320px,420px);gap:18px;padding:18px 20px 40px 20px;align-items:start}
    .leftPane{min-width:0}
    .rightPane{position:sticky;top:72px;border-left:1px solid var(--line);padding-left:18px;min-height:calc(100vh - 90px)}
    .section{margin:0 0 18px 0}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
    .miniBtn,.ghostBtn,.actionBtn{border:1px solid var(--line);background:#fff}
    .miniBtn.active{background:#111;color:#fff;border-color:#111}
    .ghostBtn{color:var(--muted)}
    .input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff}
    .textarea{min-height:88px;resize:vertical}
    .grid2,.grid3,.grid4{display:grid;gap:10px}
    .grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}.grid4{grid-template-columns:1fr 1fr 1fr 1fr}
    .portalList{display:grid;gap:10px}
    .portalItem{padding:12px 0;border-bottom:1px solid var(--line)}
    .portalItem:last-child{border-bottom:none}
    .portalTitle{font-weight:700;font-size:21px}
    .portalMeta{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.35}
    .metaRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .chip{display:inline-flex;align-items:center;padding:4px 8px;font-size:13px;border:1px solid var(--line);background:#fff;white-space:nowrap}
    .chip.red,.chip.amber,.chip.green,.chip.blue{border-color:var(--line);background:var(--soft);color:var(--ink);font-weight:700}
    .tree{padding:4px 0 80px 0}
    .treeSection{margin:0 0 18px 0}
    .treeTitle{font-weight:700;font-size:23px;letter-spacing:.01em;margin:0 0 8px 0;text-transform:uppercase}
    .node{position:relative;padding-left:26px;margin:2px 0}
    .node:before{content:"";position:absolute;left:9px;top:0;bottom:0;width:1px;background:var(--line)}
    .node:last-child:before{bottom:16px}
    .nodeHead{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:1px 0}
    .nodeHead:before{content:"";position:absolute;left:-17px;top:13px;width:14px;height:1px;background:var(--line)}
    .toggle{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
    .toggle:hover{background:var(--soft)}
    .nodeLabel{min-width:0}
    .nodeMain{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
    .nodeName{font-weight:700}
    .processName{font-size:19px}
    .subprocessName{font-size:18px}
    .activityName{font-size:17px;font-weight:600}
    .muted{color:var(--muted)}
    .tiny{font-size:13px;line-height:1.3}
    .kpiRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
    .iconRow{opacity:0;display:flex;gap:4px;align-items:center;transition:opacity .12s ease}
    .nodeHead:hover .iconRow{opacity:1}
    .iconBtn{font-size:13px;padding:3px 7px;border-radius:999px;color:var(--muted)}
    .iconBtn:hover{background:var(--soft);color:var(--ink)}
    .children{margin-top:2px}
    .sideTitle{font-size:21px;font-weight:700;margin:0 0 8px 0}
    .sideText{font-size:15px;color:var(--muted);line-height:1.35}
    .levelPills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .pill{min-width:42px;border:1px solid var(--line);border-radius:999px;padding:8px 10px;text-align:center;font-weight:700}
    .pill.cur{background:var(--soft);border-color:var(--line);color:var(--ink);font-weight:600}
    .pill.tar{background:var(--soft);border-color:var(--line);color:var(--ink);font-style:italic}
    .skillBox{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
    .skillItem{margin:8px 0}
    .skillItem b{display:block;margin-bottom:2px}
    .expList{display:grid;gap:10px;margin-top:14px}
    .expItem{border-top:1px solid var(--line);padding-top:10px}
    .stars{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
    .star{padding:4px 7px;border:1px solid var(--line);border-radius:999px}
    .star.on{background:#111;color:#fff;border-color:#111}
    .dashTable{display:grid;gap:10px}
    .dashRow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
    .errBox{padding:24px;color:var(--red);font-family:monospace;white-space:pre-wrap}
    @media (max-width:1200px){.main{grid-template-columns:1fr}.rightPane{position:static;border-left:none;padding-left:0;min-height:auto}}
    @media (max-width:860px){.topbar{grid-template-columns:1fr}.crumb{text-align:left}.grid2,.grid3,.grid4,.dashRow{grid-template-columns:1fr}.main{padding:14px}.treeTitle{font-size:20px}}
    .syncStatus{font-size:12px;color:var(--muted);white-space:nowrap}
    .syncStatus.err{color:var(--red)}
  </style>

function uid(p='id'){return p+'-'+Math.random().toString(16).slice(2,9)}
function newUUID(){
  if(typeof crypto!=='undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16); });
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function jget(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):clone(f)}catch(e){return clone(f)}}
function jset(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); return true }
  catch(e){ alert('Sauvegarde impossible (stockage plein ou navigation privée). Pense à exporter en JSON pour ne rien perdre.'); return false }
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

let orgsCache = [];
let orgsLoaded = false;
function getOrgs(){return orgsCache}
function saveOrgs(v){ orgsCache=v; return persistOrgs(v).catch(err=>{ console.error('Supabase sync error', err); setSyncStatus('Erreur de synchronisation — '+(err.message||err), true); throw err; }); }
async function persistOrgs(orgs){
  setSyncStatus('Enregistrement…');
  const orgRows = orgs.map(o=>({id:o.id, name:o.name, siret:o.siret||null, naf:o.naf||null}));
  if(orgRows.length) { const {error} = await sb.from('organizations').upsert(orgRows); if(error) throw error; }
  const {data: existingOrgs, error:selErr} = await sb.from('organizations').select('id'); if(selErr) throw selErr;
  const keepOrgIds = new Set(orgs.map(o=>o.id));
  const toDeleteOrgs = (existingOrgs||[]).map(r=>r.id).filter(id=>!keepOrgIds.has(id));
  if(toDeleteOrgs.length){ const {error} = await sb.from('organizations').delete().in('id', toDeleteOrgs); if(error) throw error; }

  const estRows = [];
  for(const o of orgs){ for(const e of (o.establishments||[])){ estRows.push({id:e.id, organization_id:o.id, name:e.name, mode:e.mode, tree:e.tree, people:e.people, evals:e.evals, experiences:e.experiences, links:e.links}); } }
  if(estRows.length){ const {error} = await sb.from('establishments').upsert(estRows); if(error) throw error; }
  const {data: existingEsts, error:selErr2} = await sb.from('establishments').select('id'); if(selErr2) throw selErr2;
  const keepEstIds = new Set(estRows.map(e=>e.id));
  const toDeleteEsts = (existingEsts||[]).map(r=>r.id).filter(id=>!keepEstIds.has(id));
  if(toDeleteEsts.length){ const {error} = await sb.from('establishments').delete().in('id', toDeleteEsts); if(error) throw error; }
  setSyncStatus('Synchronisé ✓');
}
async function loadOrgsFromSupabase(){
  const {data: orgRows, error: e1} = await sb.from('organizations').select('*'); if(e1) throw e1;
  const {data: estRows, error: e2} = await sb.from('establishments').select('*'); if(e2) throw e2;
  orgsCache = (orgRows||[]).map(o=>({
    id:o.id, name:o.name, siret:o.siret||'', naf:o.naf||'',
    establishments:(estRows||[]).filter(e=>e.organization_id===o.id).map(e=>({
      id:e.id, name:e.name, mode:e.mode||'diag',
      tree:e.tree||clone(DEFAULT_TREE), people:e.people||[], evals:e.evals||{}, experiences:e.experiences||[], links:e.links||[]
    }))
  }));
  orgsLoaded = true;
}

function allActivities(){const out=[]; const data=getData(); for(const c of data.categories){ for(const p of c.processes){ for(const s of p.subprocesses){ for(const a of s.activities){ out.push({category:c,process:p,subprocess:s,activity:a}); }}}} return out}
function findNode(id){const data=getData(); for(const c of data.categories){ if(c.id===id)return {type:'category',node:c}; for(const p of c.processes){ if(p.id===id)return {type:'process',node:p,parent:c}; for(const s of p.subprocesses){ if(s.id===id)return {type:'subprocess',node:s,parent:p,category:c}; for(const a of s.activities){ if(a.id===id)return {type:'activity',node:a,parent:s,process:p,category:c}; }}}} return null}

async function createAtelierOnboarding(){
  const name=document.getElementById('onbName').value.trim(); if(!name) return alert('Merci de donner un nom à ton atelier.');
  const mode=document.querySelector('input[name="onbMode"]:checked').value;
  const est={id:newUUID(), name, mode, tree:clone(DEFAULT_TREE), people:[], evals:{}, experiences:[], links:[]};
  const org={id:newUUID(), name, siret:'', naf:'', establishments:[est]};
  try{
    await saveOrgs([...getOrgs(), org]);
  }catch(err){
    alert("La création de l'atelier a échoué : "+(err.message||err));
    return;
  }
  setCurrentOrg(org.id); setCurrentEst(est.id);
  try{ const {error}=await sb.from('members').insert({user_id:currentUser.id, establishment_id:est.id, role:'admin'}); if(error) throw error; }
  catch(err){ console.error(err); alert("L'atelier est bien créé, mais le rattachement de ton compte a échoué : "+(err.message||err)+". Recharge la page pour réessayer."); }

  state.view='arbo'; render();
}

function decideLanding(){
  const orgs=getOrgs();
  if(!orgs.length){ state.view='onboarding'; return; }
  const org=orgs.find(o=>o.id===currentOrgId());
  const est=org?.establishments?.find(e=>e.id===currentEstId());
  if(org && est){ state.view='arbo'; return; }
  if(orgs.length===1 && (orgs[0].establishments||[]).length===1){
    setCurrentOrg(orgs[0].id); setCurrentEst(orgs[0].establishments[0].id); state.view='arbo'; return;
  }
  state.view='portal';
}

// --- Cache des scores : évite de re-scanner tous les évals à chaque nœud rendu ---
let _scoreCache = null;
function invalidateScoreCache(){ _scoreCache = null; }
function scoresByActivity(){
  if(_scoreCache) return _scoreCache;
  const evals = getEvals();
  const map = {};
  for(const [key, val] of Object.entries(evals)){
    if(!val) continue;
    const activityId = key.slice(0, key.lastIndexOf('__'));
    (map[activityId] = map[activityId] || []).push(val);
  }
  _scoreCache = map;
  return map;
}
function aggregateActivityScore(activityId){
  const entries = scoresByActivity()[activityId] || [];
  if(!entries.length) return {currentAvg:null,targetAvg:null};
  const cur=entries.map(x=>x.current).filter(v=>v!=null), tar=entries.map(x=>x.target).filter(v=>v!=null);
  return {currentAvg:cur.length?cur.reduce((a,b)=>a+b,0)/cur.length:null,targetAvg:tar.length?tar.reduce((a,b)=>a+b,0)/tar.length:null};
}

  if(state.arboEvalMode==='diag') return 'solo';

function renderResults(){
  const acts=allActivities();
  // Tri par écart (cible - actuel) décroissant : les compétences les plus en retard remontent en premier
  const rows=acts.map(r=>({title:r.activity.title,process:r.process.title,sub:r.subprocess.title,...aggregateActivityScore(r.activity.id)}))
    .sort((a,b)=>((b.targetAvg??0)-(b.currentAvg??0))-((a.targetAvg??0)-(a.currentAvg??0)));
  document.getElementById('leftPane').innerHTML=`<div class="section"><div class="treeTitle">Résultats</div><div class="sideText">Moyennes globales issues des évaluations, triées par écart actuel/cible décroissant : les compétences les plus urgentes à travailler apparaissent en premier.</div></div><div class="dashTable">${rows.map(r=>`<div class="dashRow"><div><b>${escapeHtml(r.title)}</b><div class="tiny muted">${escapeHtml(r.process)} · ${escapeHtml(r.sub)}</div></div><div><span class="chip ${scoreColor(r.currentAvg)}">Actuel ${r.currentAvg!=null?r.currentAvg.toFixed(1):'—'}</span></div><div><span class="chip ${scoreColor(r.targetAvg)}">Cible ${r.targetAvg!=null?r.targetAvg.toFixed(1):'—'}</span></div></div>`).join('')}</div>`;
  document.getElementById('rightPane').innerHTML=`<div class="sideTitle">Ce qui manque encore</div><div class="sideText">Cette base calcule déjà les moyennes actuel / cible. L’étape suivante, pour une vraie version produit, sera d’ajouter la consolidation fine par personne, les filtres établissement, et des règles de calcul KPI plus précises par sous-processus.</div>`;
}
function renderEditor(){
  document.getElementById('leftPane').innerHTML=`<div class="section"><div class="treeTitle">Éditeur JSON</div><textarea id="jsonEditor" class="textarea" style="min-height:72vh">${escapeHtml(JSON.stringify(getData(),null,2))}</textarea><div class="toolbar" style="margin-top:10px"><button class="actionBtn" onclick="saveEditorJson()">Enregistrer</button></div></div>`;
  document.getElementById('rightPane').innerHTML=`<div class="sideTitle">Usage</div><div class="sideText">Ici tu peux corriger massivement la structure. Dans l’Arbo, tu édites finement. Dans l’Éditeur, tu refonds vite. Les deux doivent coexister.</div>`;
}
function saveEditorJson(){ try{ const parsed=JSON.parse(document.getElementById('jsonEditor').value); if(!parsed.categories) throw new Error('Structure invalide'); setData(parsed); alert('Enregistré.'); }catch(e){ alert('JSON invalide : '+e.message) } }
function renderLinks(){
  const acts=allActivities();
  document.getElementById('leftPane').innerHTML=`<div class="section"><div class="treeTitle">Liens compétences → KPI</div><div class="sideText">Page dédiée demandée : montrer ce qui a une incidence sur quoi. Ici, c’est une base de lecture. L’étape produit suivante consistera à gérer de vrais poids et vraies causalités par activité.</div></div><div class="portalList">${acts.map(r=>`<div class="portalItem"><div class="portalTitle" style="font-size:18px">${escapeHtml(r.activity.title)}</div><div class="portalMeta">${escapeHtml(r.process.title)} → ${escapeHtml(r.subprocess.title)}</div><div class="metaRow">${(r.subprocess.kpis||[]).map(k=>chip(k,getSubprocessScore(r.subprocess))).join('')} ${(r.process.kpis||[]).map(k=>chip(k,getProcessScore(r.process))).join('')}</div></div>`).join('')}</div>`;
  document.getElementById('rightPane').innerHTML=`<div class="sideTitle">Principe</div><div class="sideText">Une activité fait bouger un sous-processus. Les sous-processus agrègent un processus. C’est cette cascade qui rend la lecture enfin utile.</div>`;
}
async function importCsvPrompt(){
  const csv=await demander('Colle ici un CSV simple avec colonnes : category,process,subprocess,activity'); if(!csv) return;
  const lines=csv.split(/\r?\n/).filter(Boolean); if(lines.length<2) return;
  const headers=lines.shift().split(',').map(x=>x.trim().toLowerCase());
  const idx={ category:headers.indexOf('category'), process:headers.indexOf('process'), subprocess:headers.indexOf('subprocess'), activity:headers.indexOf('activity') };
  if(Object.values(idx).some(v=>v<0)) return alert('Colonnes minimales requises : category, process, subprocess, activity');
  const map={};
  for(const line of lines){ const cols=line.split(',').map(x=>x.trim()); const c=cols[idx.category], p=cols[idx.process], s=cols[idx.subprocess], a=cols[idx.activity]; if(!c||!p||!s||!a) continue; map[c]=map[c]||{}; map[c][p]=map[c][p]||{}; map[c][p][s]=map[c][p][s]||[]; map[c][p][s].push(a); }
  const categories=Object.entries(map).map(([ct,procMap])=>({id:uid('cat'),title:ct,processes:Object.entries(procMap).map(([pt,subMap])=>({id:uid('proc'),title:pt,kpis:['KPI'],subprocesses:Object.entries(subMap).map(([st,acts])=>({id:uid('sub'),title:st,kpis:['KPI'],activities:acts.map(t=>({id:uid('act'),title:t,skills:{n1:'',n2:'',n3:'',n4:''}}))}))}))}));
  setData({categories}); render();
}
function exportJson(){ const blob=new Blob([JSON.stringify({organization:getOrg(),establishment:getEst()},null,2)],{type:'application/json'}); downloadBlob(blob,'cartographie_base_solide.json') }
function exportCsv(){ const rows=['category,process,subprocess,activity,current_avg,target_avg']; for(const r of allActivities()){ const agg=aggregateActivityScore(r.activity.id); rows.push([r.category.title,r.process.title,r.subprocess.title,r.activity.title,agg.currentAvg?.toFixed(2)||'',agg.targetAvg?.toFixed(2)||''].map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')) } downloadBlob(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}),'cartographie_base_solide.csv') }
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500) }

function renderLogin(msg){
  document.querySelector('.app').innerHTML = `
  <div style="max-width:420px;margin:15vh auto;padding:0 20px">
    <div class="brand" style="margin-bottom:24px">CARTOGRAPHIE MÉTIER</div>
    <div class="sideTitle">Connexion</div>
    <div class="sideText" style="margin-bottom:16px">Entre ton email : tu vas recevoir un lien de connexion par mail, pas de mot de passe à retenir.</div>
    <input id="loginEmail" class="input" type="email" placeholder="ton@email.fr" style="margin-bottom:10px">
    <button class="actionBtn" onclick="requestMagicLink()">Recevoir le lien de connexion</button>
    <div id="loginMsg" class="sideText" style="margin-top:14px">${msg?escapeHtml(msg):''}</div>
  </div>`;
}
async function requestMagicLink(){
  const email=document.getElementById('loginEmail').value.trim(); if(!email) return;
  const msgEl=document.getElementById('loginMsg'); msgEl.textContent='Envoi en cours…';
  try{
    const {error}=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href.split('#')[0].split('?')[0] } });
    if(error) throw error;
    msgEl.textContent="Lien envoyé ! Vérifie ta boîte mail (et les spams), puis clique sur le lien pour te connecter.";
  }catch(err){
    msgEl.textContent="Erreur : "+(err.message||err);
  }
}
async function logout(){ try{ await sb.auth.signOut(); }catch(e){ console.error(e); } currentUser=null; orgsCache=[]; renderLogin(); }
function restoreAppShell(){
  document.querySelector('.app').innerHTML = `
  <div class="topbar">
    <div class="brand"><a href="federation-accueil.html" style="display:block;font-size:12px;font-weight:400;color:var(--muted);text-decoration:none;margin-bottom:2px">&larr; Maurice</a>CARTOGRAPHIE MÉTIER<small id="brandSub">Aucune organisation</small></div>
    <div class="nav" id="nav"></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <div class="crumb" id="crumb"></div>
      <div class="syncStatus" id="syncStatus">Connexion…</div>
    </div>
  </div>
  <div class="main">
    <div class="leftPane" id="leftPane"></div>
    <aside class="rightPane" id="rightPane"></aside>
  </div>`;
}
async function afterLogin(){
  restoreAppShell();
  try{
    setSyncStatus('Connexion…');
    await loadOrgsFromSupabase();
    setSyncStatus('Synchronisé ✓');
    decideLanding();
    render();
  }catch(e){
    console.error(e);
    setSyncStatus('Erreur de chargement', true);
    document.body.innerHTML = `<div class="errBox">Impossible de charger les données : ${escapeHtml(e.message||String(e))}\n\nRecharge la page. Si le problème persiste, vérifie que le projet Supabase est bien actif.</div>`;
  }
}
async function initApp(){
  let authErrorMsg=null;
  if(window.location.hash.includes('error=')){
    const params=new URLSearchParams(window.location.hash.slice(1));
    const desc=params.get('error_description');
    authErrorMsg = desc ? decodeURIComponent(desc.replace(/\+/g,' ')) : "Ce lien de connexion est invalide ou a déjà été utilisé.";
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  try{
    setSyncStatus('Connexion…');
    const {data:{session}, error} = await sb.auth.getSession();
    if(error) throw error;
    if(session){ currentUser=session.user; await afterLogin(); }
    else { renderLogin(authErrorMsg || undefined); setSyncStatus('Non connecté'); }
  }catch(e){
    console.error(e);
    renderLogin('Erreur de connexion : '+(e.message||e));
  }
  sb.auth.onAuthStateChange(async (event, session)=>{
    if(session && (!currentUser || currentUser.id!==session.user.id)){ currentUser=session.user; await afterLogin(); }
    if(!session && currentUser){ currentUser=null; orgsCache=[]; renderLogin(); }
  });
}
initApp();
