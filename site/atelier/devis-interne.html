<!doctype html>
<html lang="fr">
<head>
  <script src="boite-message.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Devis — Atelier (interne)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="atelier-nav.js"></script>
  <script src="moteur-devis.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* V0 — même système typo/couleurs que tout le projet, voir atelier-compte.html. */
    :root{
      --bg:#fff; --ink:#1c1a17; --muted:#55504a; --line:#e4e0d9; --soft:#f7f5f2;
      --accent:#a8461f;
      --red:var(--ink); --amber:var(--ink); --green:var(--ink);
      --redBg:var(--soft); --amberBg:var(--soft); --greenBg:var(--soft);
      --blue:var(--ink); --blueBg:var(--soft);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    body{font-size:16px;line-height:1.25}
    h1,h2,.brand,.treeTitle{font-family:Fraunces,Georgia,serif;font-weight:600}
    body{font-variant-numeric:tabular-nums}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:none;padding:0}
    .app{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
    nav.topnav{background:#1c1a17;color:#fff;display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;font-size:14px}
    nav.topnav a.brand{color:#fff;text-decoration:none;font-weight:600;margin-right:24px;font-size:15px;font-family:Fraunces,Georgia,serif}
    nav.topnav .menuItem{position:relative;height:100%;display:flex;align-items:center}
    nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:0 14px;cursor:pointer;color:#d7dbe4;text-decoration:none}
    nav.topnav .menuItem:hover>span,nav.topnav .menuItem>a.topLink:hover{color:#fff}
    nav.topnav .dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--ink);min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:0 0 10px 10px;overflow:hidden;z-index:50}
    nav.topnav .menuItem:hover .dropdown{display:block}
    nav.topnav .dropdown a{display:block;padding:10px 16px;color:var(--ink);text-decoration:none;font-size:13.5px;border-bottom:1px solid var(--line)}
    nav.topnav .dropdown a:last-child{border-bottom:none}
    nav.topnav .dropdown a:hover{background:var(--soft)}
    nav.topnav .navToggle{display:none;margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
    @media (max-width:820px){
      nav.topnav{flex-wrap:wrap;height:auto;padding:10px 16px}
      nav.topnav .navToggle{display:block}
      nav.topnav .menuItem{display:none;width:100%;height:auto;flex-direction:column;align-items:stretch}
      nav.topnav.navOpen .menuItem{display:flex}
      nav.topnav .menuItem>span,nav.topnav .menuItem>a.topLink{padding:12px 0 4px;cursor:pointer;display:block}
      nav.topnav .dropdown{position:static;box-shadow:none;border-radius:0;background:transparent;min-width:0}
      nav.topnav .menuItem.open .dropdown{display:block}
      nav.topnav .dropdown a{color:#fff;padding:10px 0 10px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
      nav.topnav .dropdown a:hover{background:rgba(255,255,255,.06)}
    }
    .topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;z-index:20}
    .brand{font-weight:700;font-size:22px;letter-spacing:.02em}
    .brand small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    @media (max-width:700px){ .topbar{grid-template-columns:1fr;row-gap:8px} .toolbar{flex-wrap:wrap} }
    .main{display:grid;grid-template-columns:280px 1fr;gap:0;align-items:start;min-height:0}
    .listPane{border-right:1px solid var(--line);padding:16px;min-height:calc(100vh - 62px)}
    .editorPane{padding:18px 24px 60px 24px;min-width:0;max-width:1300px}
    .section{margin:0 0 20px 0}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
    .miniBtn,.ghostBtn,.actionBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;min-height:36px;font-size:14px}
    .actionBtn{background:#111;color:#fff;border-color:#111}
    .actionBtn.secondary{background:#fff;color:#111}
    .ghostBtn{color:var(--muted)}
    .dangerBtn{color:var(--red)}
    .miniBtn:hover,.ghostBtn:hover,.actionBtn:hover{opacity:.85}
    .input,.select,.textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%;font-size:14px}
    .textarea{min-height:60px;resize:vertical}
    .grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
    .grid3{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
    .grid4{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr 1fr}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .fieldAuto{position:relative}
    .sugBox{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:220px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.10)}
    .sugItem{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line)}
    .sugItem:last-child{border-bottom:none}
    .sugItem:hover{background:var(--soft)}
    .listItem{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
    .listItem:hover{background:var(--soft)}
    .listItem.active{background:var(--soft);font-weight:700}
    .listItem .num{font-size:13px;color:var(--muted)}
    .treeTitle{font-weight:700;font-size:21px;margin:0 0 10px 0}
    .muted{color:var(--muted)}
    .tiny{font-size:12.5px;line-height:1.35}
    .chip{display:inline-flex;align-items:center;padding:3px 9px;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:999px;white-space:nowrap}
    .chip.red,.chip.amber,.chip.green,.chip.blue{border-color:var(--line);background:var(--soft);color:var(--ink);font-weight:700}
    .ligneCard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
    .ligneHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
    .ligneKind{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
    .ligneTitle{font-weight:700;font-size:17px}
    .price{font-weight:700;font-size:19px}
    .breakdown{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
    /* Chiffrage privé à droite des articles du catalogue : détail du calcul, petit et gris, jamais imprimé */
    .devisGrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
    .devisCorps{min-width:0}
    .colPrivee{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow-y:auto}
    .chiffragePrive{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.45;color:var(--muted)}
    .chiffragePrive .cpTitre{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px}
    .chiffragePrive .cpTotal{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
    .chiffragePrive .cpTotal b{color:var(--ink);font-weight:600}
    .chiffragePrive .cpLigne{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
    .chiffragePrive .cpLigne .cpSupport{font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
    .chiffragePrive .cpRows{margin-top:4px}
    .chiffragePrive .cpRow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;border-top:1px dotted #d9d9d9}
    .chiffragePrive .cpRow:first-child{border-top:0}
    .chiffragePrive .cpK{color:var(--muted)}
    .chiffragePrive .cpK small{display:block;font-size:10.5px;opacity:.85;margin-top:1px}
    .chiffragePrive .cpV{color:var(--ink);font-weight:600;text-align:right;white-space:nowrap}
    .chiffragePrive .cpDuree{border-top:1.5px solid var(--ink);margin-top:14px;padding-top:10px}
    .chiffragePrive .cpDureeLib{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
    .chiffragePrive .cpDureeVal{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.15;margin:2px 0}
    .chiffragePrive .cpDureeNote{font-size:11px;color:var(--muted)}
    .chiffragePrive .cpMarge{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
    .chiffragePrive .cpMargeLigne{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0}
    .chiffragePrive .cpMargeLigne b{font-size:17px;font-weight:800;color:var(--ink)}
    .chiffragePrive .cpMargeLigne span{font-size:12px;font-weight:700;color:var(--ink)}
    @media (max-width:1150px){ .devisGrid{grid-template-columns:minmax(0,1fr)} .colPrivee{position:static;order:-1;max-height:none;overflow:visible} }
    @media print{ .devisGrid{display:block} .colPrivee{display:none} }
    /* Calculateur de marge : même grammaire que le chiffrage, mais le résultat (la marge) est mis en avant */
    .margePrive{border:1.5px solid var(--ink);padding:12px 14px;font-size:12px;line-height:1.45;color:var(--muted);background:#fff}
    .margePrive .cpTitre{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--ink);margin-bottom:8px}
    .margePrive .mpChamp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0}
    .margePrive .mpChamp span{flex:1}
    .margePrive .mpChamp small{display:block;font-size:10.5px}
    .margePrive .mpChamp input{width:82px;text-align:right;font-size:14px;padding:3px 0;font-weight:600;color:var(--ink)}
    .margePrive .mpLigne{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px dotted #d9d9d9}
    .margePrive .mpLigne b{color:var(--ink);font-weight:600;white-space:nowrap}
    .margePrive .mpResultat{border-top:1.5px solid var(--ink);margin-top:10px;padding-top:10px}
    .margePrive .mpLib{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
    .margePrive .mpVal{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
    .margePrive .mpTaux{font-size:13px;font-weight:700;color:var(--ink)}
    .margePrive .mpObjectif{margin-top:8px;padding:7px 9px;background:var(--soft);color:var(--ink);font-size:11.5px}
    .arbitrageBox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
    .totalBar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:2px solid var(--ink);margin-top:6px;font-size:20px;font-weight:700}
    .totalLigne{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:14px;color:var(--muted)}
    .addRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .errBox{padding:24px;color:var(--red);font-family:monospace;white-space:pre-wrap}
    @media (max-width:900px){.main{grid-template-columns:1fr}.listPane{border-right:none;border-bottom:1px solid var(--line);min-height:auto}.grid2,.grid3,.grid4{grid-template-columns:1fr}}
    /* Champs pré-remplis par l'IA : à compléter (vide, pointillé orange) / à confirmer (valeur donnée par la source avec un « ± », bordure ambre). Aucun ne bloque l'enregistrement. */
    .aCompleter .input,.aCompleter .select,.aCompleter .textarea{border:2px dashed #d9822b;background:#fff7ee}
    .aConfirmer .input,.aConfirmer .select,.aConfirmer .textarea{border:2px solid #e0a800;background:#fffbe6}
    .noteFlag{font-size:11.5px;margin-top:3px;color:#9a5a12;line-height:1.3}
    .aConfirmer .noteFlag{color:#7a5d00}
    .lienFlag{margin-left:6px;text-decoration:underline;color:inherit;font-size:11.5px}
    .blocIA{border:1px solid var(--line);border-left:4px solid #e0a800;background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 14px}
    .modalFond{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
    .modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .modal h2{font-size:24px;margin:0 0 6px}
    .dropBesoin{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;font-size:14px}
    .dropBesoin.survol{border-color:var(--accent);background:var(--soft)}
    .fichierBesoin{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;background:#fff}
    .printEntete,.printPied{display:none}
    .print-only{display:none}
    .prixCol{width:100px;text-align:right;justify-content:flex-end}
    .kmCol{width:115px;text-align:right;justify-content:flex-end}
    @media print{
      nav.topnav, .topbar, .listPane, .no-print, .catalogueLigneVide, .catalogueRubriqueVide{display:none !important}
      .print-only{display:inline}
      .main{display:block}
      .editorPane{max-width:none;padding:0}
      .ligneCard{border:none;padding:8px 0;margin-bottom:6px;page-break-inside:avoid}
      .section{margin-bottom:16px}
      .input,.select,.textarea{border:none;padding:0;background:transparent}
      body{margin-top:70px;margin-bottom:50px}
      .printEntete{display:block;position:fixed;top:0;left:0;right:0;text-align:center;padding:6px 0}
      .printEntete img{max-height:60px}
      .printPied{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:#555;padding:6px 14px;border-top:1px solid #ccc;white-space:pre-line}
    }
  </style>
  <link rel="stylesheet" href="charte-vsf.css">
<script src="acces-entreprise.js" defer></script>
</head>
<body>
<div class="app"></div>
<script>
/* =========================================================================
   DONNÉES DE RÉFÉRENCE — reprises telles quelles des fichiers de Tristan
   (onglets BASE / COEF / COMPATIBILITES / AIDE MEG du questionnaire projet)
   ========================================================================= */
/* Refonte du moteur de calcul : plancher journalier (plus de tarif horaire
   déconnecté), modificateurs configurables (% ou prix fixe), hauteur en coût
   externe fixe (nacelle/échafaudage réels), état du support nettoyé des cas
   dangereux/impossibles (ceux-là sont exclus du devis standard, pas tarifés).
   "Support autre" / "Matière autre" retirés (la ligne libre couvre déjà les
   cas hors catalogue). */
// Repère unique donné par Tristan, valable pour tous les supports (style bâton) :
// LOI DU TEMPS : règle de Tristan conservée — 1 m² = 3,5 h (proportionnel : exposant 1), soit 50 % d'une journée à 795 € — plus un petit temps fixe de mise en route (0,9 h). Surface = EMPRISE du lettrage en m² (BAT).
// tempsFixeH 0,9 h + kH 3,5 h/m² : 0,04 m² ≈ 1,0 h, 0,57 m² ≈ 2,9 h, 1,7 m² ≈ 6,9 h, 6 m² ≈ 21,9 h. Taux journalier : 795 € pour tous les supports.
// Minimum HT : 250 € pour tous les supports (un petit besoin ne doit jamais être facturé comme une journée) ; le taux journalier (> 800 €/j visé) ne joue que sur le temps estimé.
// Un COMPLÉMENT (petit ajout à un devis) a son propre minimum (180 €), réglable.
// (Ancienne référence : 2 m² = 7 h, proportionnel à la surface.) Les anciens chiffres par support (16h Pignon, 8h Vitrines...) étaient
// des placeholders inventés en tout début de projet, jamais des vraies données.
const BASE_DEFAUT = {
  "Enseigne principale": { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Enseigne drapeau":    { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Vitrines":            { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Jambages":            { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Pignon":              { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Véhicule":            { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Stop-trottoir":       { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 },
  "Ardoises":            { surfaceMiniM2: 0.05, tempsFixeH: 0.9, kH: 3.5, minimumHT: 250 }
};
// Plancher de revenu journalier visé (700-900 € HT/jour selon le besoin), réglable par support.
const TARIF_JOURNALIER_DEFAUT = {
  "Enseigne principale": 795, "Enseigne drapeau": 795, "Vitrines": 795, "Jambages": 795,
  "Pignon": 795, "Véhicule": 795, "Stop-trottoir": 795, "Ardoises": 795
};
const COEF_MATIERE_DEFAUT = { "Bois peint":1, "Enduit lisse":1.05, "Bois brut":1.1, "Verre":1.15, "Enduit texturé":1.2, "Carrosserie":1.25 };

// État du support : cas dangereux/impossibles retirés (ce n'est pas une variable de prix,
// c'est un cas à exclure du devis standard). Les textures restantes déclenchent une primaire
// à la chaux — coût réel, pas une simple mention — via le modificateur qui leur est associé.
const ETAT_SUPPORT_DEFAUT = {
  "Lisse et propre": { modificateur: null },
  "Légèrement granuleux": { modificateur: 'primaire_leger' },
  "Très rugueux / crépi / pierre": { modificateur: 'primaire_rugueux' },
  "Texturé (enduit sablé type granite, crépi)": { modificateur: 'primaire_texture' },
  "Blocage des fonds avant lettrage": { modificateur: 'blocage_fonds' },
  "Je ne sais pas — voir photos": { modificateur: null },
};
// Hauteur = coût externe fixe (nacelle/échafaudage réels, catalogue MEG), plus proportionnel au reste.
const HAUTEUR_OPTIONS_DEFAUT = {
  "En rez-de-chaussée": { prixFixeHT: 0 },
  "Hauteur moyenne — échafaudage mobile": { prixFixeHT: 90 },
  "Grande hauteur — nacelle": { prixFixeHT: 300 },
};
const TAILLE_LETTRES_DEFAUT = {
  "Petites (plus long à réaliser)": { modificateur: 'forme_petites_lettres' },
  "Moyennes": { modificateur: null },
  "Grandes": { modificateur: null },
};
const COEF_FORME_DEFAUT = { "Lettres capitales / majuscules":1, "Lettres minuscules":1.05, "Lettres bâton / sans empattement":1, "Lettres script / manuscrites":1.25, "Lettres anciennes / traditionnelles":1.25, "Lettres très décoratives":1.4, "Reproduction d'une typographie existante":1.25, "Reproduction d'un logo existant":1.3, "Je souhaite être conseillé.e":1.1 };
const COEF_EFFET_DEFAUT = { "Aucun effet particulier / lettrage simple":1, "Filet / contour autour des lettres":1.2, "Dorure":1.8, "Dégradé":1.35, "Patine / effet vieilli":1.3, "Effet ancien / enseigne d'époque":1.35, "Décor ou illustration autour du texte":1.5, "Je souhaite être conseillé.e":1.1 };

// Réglages de l'estimation client et du forfait au mot, réglables sans repasser par le code. Stockés ensemble dans devis_reglages.parametres_estimation
// (colonne JSON ; voir migration_calculateur_reglages.sql). Valeurs de départ = celles qui étaient auparavant codées en dur.
const PARAMETRES_ESTIMATION_DEFAUT = {
  prixParMot: { "Jambages": 95 },                                   // forfait HT par mot peint
  forfaitsProjet: [                                                 // prix fixes AFFICHÉS au client, une fois par projet
    { cle:'maquette', label:'Création de la maquette', prixAffiche:{ particulier:290, professionnel:390 } },
    { cle:'poncifs',  label:'Préparation des poncifs', prixAffiche:250 },
  ],
  empriseLettrage: { "Jambages": 0.20 },                            // part de la surface du support couverte par le lettrage
  fourchettePct: 30,                                                // ± autour du prix calculé affiché au client (mode indicatif)
  minimumComplementHT: 180,                                         // minimum HT d'un « complément » (petit ajout à un devis)
  fabricationSupport: clone(FABRICATION_SUPPORT_DEFAUT),            // fabrication du support en atelier, prix fixes HT
  fabricationDrapeau: { baseHT:700, parM2HT:1500, coefMetal:1.15 },   // enseigne drapeau complète : (base + €/m² de support) × coefficient métal — voir FABRICATION_DRAPEAU_DEFAUT (moteur)
  coutEquipeJour: 250,                                                // coût journalier chargé d'une personne de l'atelier (€) — 0 = pas encore renseigné ; sert au calculateur de marge
  objectifMargePct: 30,                                             // marge visée sur le prix de vente HT (%)
};
function parametresEstimation(brut){
  const p = clone(PARAMETRES_ESTIMATION_DEFAUT);
  if(brut && typeof brut === 'object'){
    for(const k of Object.keys(p)) if(brut[k] !== undefined && brut[k] !== null) p[k] = brut[k];
  }
  return p;
}

// Ordre d'affichage fixe des menus — indépendant de l'ordre des clés dans les objets
// (le JSONB de Supabase ne garantit pas de préserver l'ordre d'insertion une fois
// enregistré). clesTriees() ne garde que les clés qui existent réellement dans la map,
// dans cet ordre, puis ajoute à la fin toute clé imprévue (nouveau réglage ajouté à la main).
function clesTriees(map, ordre){
  const presentes = ordre.filter(k => Object.prototype.hasOwnProperty.call(map, k));
  const restantes = Object.keys(map).filter(k => !ordre.includes(k));
  return [...presentes, ...restantes];
}

function completerModificateurs(liste){
  const l = Array.isArray(liste) && liste.length ? liste : clone(MODIFICATEURS_DEFAUT);
  for(const d of MODIFICATEURS_DEFAUT) if(!l.find(x=>x.cle===d.cle)) l.push(clone(d));

function calculerArbitrage(l, calc){
  if(!calc) return null;
  const meg = l.megCode ? megById(l.megCode) : null;
  if(!meg || meg.prixHT==null) return { decision:"Choisir l'article MEG", ecartHT:null, ecartPct:null, meg };
  const ecartHT = arrondir(meg.prixHT - calc.prixHT, 2);
  const ecartPct = calc.prixHT ? arrondir(ecartHT/calc.prixHT, 4) : null;
  let decision;
  if(ecartPct!=null && Math.abs(ecartPct) <= 0.10) decision = "Prix MEG cohérent";
  else if(ecartHT>0) decision = "Arbitrage requis : prix MEG supérieur";
  else decision = "Arbitrage requis : prix MEG inférieur";
  return { meg, ecartHT, ecartPct, decision };
}

function noteFlag(d, cle){
  const f = iaFlags(d)[cle]; if(!f) return '';
  return `<div class="noteFlag">${f.niveau==='a_completer'?'À compléter':'À confirmer avant chiffrage final'}${f.raison?' — '+escapeHtml(f.raison):''}${f.niveau==='a_confirmer'?` <button type="button" class="lienFlag" onclick="confirmerChamp('${d.id}','${cle}')">C'est bon ✓</button>`:''}</div>`;
}
function leverFlag(d, cle){
  if(!iaFlags(d)[cle]) return;
  delete d.notesClient.ia.champs[cle];
  sb.from('devis').update({ notes_client: d.notesClient }).eq('id', d.id).then(({error})=>{ if(error) console.error('Mise à jour des champs à revoir échouée :', error.message); });
}
function confirmerChamp(devisId, cle){ const d = getDevis(devisId); if(!d) return; leverFlag(d, cle); render(); }
function libelleFlag(d, cle){
  const noms = { 'client.nom':'Nom du client', 'client.telephone':'Téléphone', 'client.email':'Email', 'client.adresse':'Adresse chantier', 'client.type':'Type de client', 'notes.adresseFacturation':'Adresse de facturation' };
  if(noms[cle]) return noms[cle];
  const m = /^ligne\.([^.]+)\.(\w+)$/.exec(cle); if(!m) return cle;
  const l = d.lignes.find(x=>x.id===m[1]);
  return `Ligne « ${(l && (l.support || String(l.precision||'').split(' — ')[0])) || 'support à choisir'} » : ${({support:'support',longueurCm:'longueur',hauteurCm:'hauteur',texteAPeindre:'texte à peindre'})[m[2]]||m[2]}`;
}
function champsARevoir(d){ return Object.keys(iaFlags(d)).filter(cle=>!cle.startsWith('ligne.') || d.lignes.some(l=>cle.startsWith('ligne.'+l.id+'.'))).map(cle=>libelleFlag(d, cle)); }
async function updateNotesClient(devisId, champ, valeur){
  const d = getDevis(devisId); if(!d) return;
  d.notesClient = Object.assign({}, d.notesClient || {}, { [champ]: valeur });
  leverFlag(d, 'notes.'+champ);
  render();
  const { error } = await sb.from('devis').update({ notes_client: d.notesClient }).eq('id', devisId);
  if(error) alert("Enregistrement échoué côté serveur : "+error.message);
}
async function imprimerDevis(devisId){
  const d = getDevis(devisId); const a = d ? champsARevoir(d) : [];
  if(a.length && !await confirmer("Des champs pré-remplis par l'IA n'ont pas encore été revus :\n\n— "+a.join("\n— ")+"\n\nImprimer quand même ?")) return;
  window.print();
}

// Le suivi de chantier se fait désormais uniquement dans le Kanban Client/Projet
// (client-projet.html) — chaque devis y a sa carte, créée et tenue à jour automatiquement ici.
async function creerProjetDepuisDevis(devis, extra){
  extra = extra || {};
  const { data: numeroProjet, error: eNum } = await sb.rpc('next_numero_projet', { p_establishment_id: ESTABLISHMENT_ID });
  if(eNum) console.error('Numérotation du projet échouée :', eNum.message);
  // Le formulaire client (devis-client.html) envoie déjà objectif/texteAPeindre/charteGraphique/
  // dateSouhaitee/contraintes dans devis.notes_client — sans cette reprise, la fiche projet
  // affichait "Aucune information renseignée" alors que le client avait bien tout rempli.
  const nc = devis.notesClient || {};
  const besoin_technique = {
    objectif: nc.objectif || null, texteAPeindre: nc.texteAPeindre || null, charteGraphique: nc.charteGraphique || null,
    dateSouhaitee: nc.dateSouhaitee || null, contraintes: nc.contraintes || null,
  };
  const ligne = {
    establishment_id: ESTABLISHMENT_ID, nom: devis.numero, numero_projet: numeroProjet ?? null, nom_projet: extra.nomProjet || devis.numero, devis_id: devis.id,
    etape: 'devis_a_envoyer', besoin_technique,
    historique: [{ date: new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), type:'note', texte: `Projet créé automatiquement depuis le devis ${devis.numero}${extra.source?' ('+extra.source+')':''}` }]
  };
  if(extra.client){ Object.assign(ligne, { client_nom: extra.client.nom || null, client_telephone: extra.client.tel || null, client_email: extra.client.mail || null, client_adresse: extra.client.adresse || null }); }
  if(extra.client_id) ligne.client_id = extra.client_id;
  const { error } = await sb.from('projets').insert(ligne);
  if(error) console.error('Création du projet liée au devis échouée :', error.message);
}
// Les étapes du Kanban collent aux vraies colonnes Trello (voir client-projet.html, table
// etapes_kanban). Un devis créé depuis ce fichier saute directement à "devis_a_envoyer" (le
// croquis ne concerne que les projets démarrés depuis le formulaire client). L'envoi/la
// signature du devis fait avancer le projet tout seul vers le palier d'attente, ou vers
// "Maquette/création" une fois signé — pas d'étape "devis signé, acompte reçu" séparée dans
// le vrai Trello, le travail de création démarre directement.
async function avancerProjetDepuisDevis(devisId, numero, nouveauStatut){
  const { data: proj, error: eSel } = await sb.from('projets').select('id,etape,historique').eq('devis_id', devisId).maybeSingle();
  if(eSel || !proj) return;
  const historique = [...(proj.historique||[]), { date: new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), texte: `Devis ${numero} passé en "${STATUT_DEVIS_LABEL[nouveauStatut]||nouveauStatut}"` }];
  const patch = { historique };
  if(nouveauStatut==='envoye' && proj.etape==='devis_a_envoyer'){
    patch.etape = 'devis_croquis_attente';
  } else if(nouveauStatut==='signe' && (proj.etape==='devis_a_envoyer' || proj.etape==='devis_croquis_attente' || proj.etape==='relance_devis')){
    patch.etape = 'maquette_a_creer';
  }
  const { error } = await sb.from('projets').update(patch).eq('id', proj.id);
  if(error) console.error('Mise à jour du projet lié au devis échouée :', error.message);
}

/* =========================================================================
   « Ajoute les infos du besoin en vrac ! » — au clic sur + Nouveau devis, on peut coller un mail et
   déposer des maquettes / plans (PDF, PNG, JPEG) : l'IA (edge function devis-extraire-besoin) pré-remplit
   la fiche client + le devis. Rien n'est validé à l'aveugle : un champ absent reste vide et pointillé
   orange, un champ donné avec un « ± » reste amber ; ils ne bloquent jamais l'enregistrement du brouillon,
   seulement le « Marquer envoyé » tant qu'ils n'ont pas été revus.
   ========================================================================= */
const intake = { ouvert:false, texte:'', fichiers:[], enCours:false, erreur:'', propositions:null, besoin:null };
const TYPES_BESOIN = ['application/pdf','image/png','image/jpeg'];
const MAX_FICHIERS_BESOIN = 6, MAX_PDF_OCTETS = 4*1024*1024, MAX_IMAGE_OCTETS = 12*1024*1024;

function nouveauDevis(){ Object.assign(intake, { ouvert:true, texte:'', fichiers:[], enCours:false, erreur:'', propositions:null, besoin:null }); render(); }
function fermerAccueilBesoin(){ if(intake.enCours) return; intake.ouvert = false; render(); }
async function nouveauDevisManuel(){ intake.ouvert = false; await creerDevisVide(); }

function lireDataUrl(file){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>ko(new Error('lecture impossible')); r.readAsDataURL(file); }); }
function chargerImage(file){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); ok(i); }; i.onerror=()=>ko(new Error('image illisible')); i.src=u; }); }
// Les images sont réduites (1600 px max, JPEG) avant envoi : plus léger, et largement lisible pour l'IA.
async function preparerFichierBesoin(file){
  if(!TYPES_BESOIN.includes(file.type)) throw new Error(`« ${file.name} » : seuls les PDF, PNG et JPEG sont acceptés.`);
  if(file.type === 'application/pdf'){
    if(file.size > MAX_PDF_OCTETS) throw new Error(`« ${file.name} » dépasse 4 Mo — exporte seulement les pages utiles.`);
    return { nom:file.name, type:file.type, tailleKo:Math.round(file.size/1024), dataUrl: await lireDataUrl(file) };
  }
  if(file.size > MAX_IMAGE_OCTETS) throw new Error(`« ${file.name} » dépasse 12 Mo.`);
  const img = await chargerImage(file);
  const k = Math.min(1, 1600/Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.85);
  return { nom:file.name.replace(/\.\w+$/,'')+'.jpg', type:'image/jpeg', tailleKo:Math.round(dataUrl.length*0.75/1024), dataUrl };
}
async function ajouterFichiersBesoin(liste){
  const erreurs = [];
  for(const f of Array.from(liste||[])){
    if(intake.fichiers.length >= MAX_FICHIERS_BESOIN){ erreurs.push(`${MAX_FICHIERS_BESOIN} fichiers maximum.`); break; }
    try{ intake.fichiers.push(await preparerFichierBesoin(f)); }catch(e){ erreurs.push(e.message); }
  }
  intake.erreur = erreurs.join(' ');
  render();
}
function retirerFichierBesoin(i){ intake.fichiers.splice(i,1); render(); }

// Un champ renvoyé par l'IA : { valeur, statut: ferme | approximatif | incertain | absent, remarque }.
// « incertain » et « absent » => aucune valeur appliquée (jamais de devinette).
function lireChampIA(c, validateur){
  let v = c && c.valeur!=null && String(c.valeur).trim()!=='' ? c.valeur : null;
  let statut = (c && c.statut) || 'absent';
  if(v!==null && validateur && !validateur(v)){ v = null; statut = 'incertain'; }
  if(v===null && statut!=='incertain') statut = 'absent';
  const brut = v;
  return { valeur: statut==='incertain' ? null : v, brut: c && c.valeur!=null ? c.valeur : brut, statut, remarque:(c && c.remarque) || '' };
}
function drapeauIA(ch, libelleProposition){
  if(ch.valeur!==null && ch.statut==='approximatif') return { niveau:'a_confirmer', raison: ch.remarque || 'Valeur approximative dans la source' };
  if(ch.valeur===null){
    const base = ch.statut==='incertain' ? 'Incertain' : 'Non mentionné';
    return { niveau:'a_completer', raison: base + (ch.statut==='incertain' && ch.brut ? ` (proposition de l'IA : ${ch.brut})` : '') + (ch.remarque ? ' — '+ch.remarque : '') };
  }
  return null;
}
const validMail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v));
const validTel = v => String(v).replace(/\D/g,'').length >= 9;
function normaliserBesoin(b){
  const cl = b.client || {}, pr = b.projet || {};
  const out = {
    client: { nom:lireChampIA(cl.nom), entreprise:lireChampIA(cl.entreprise), email:lireChampIA(cl.email, validMail), telephone:lireChampIA(cl.telephone, validTel),
      type:lireChampIA(cl.type, v=>['professionnel','particulier'].includes(String(v).toLowerCase())), adresse:lireChampIA(cl.adresse_chantier), facturation:lireChampIA(cl.adresse_facturation) },
    projet: { nom:lireChampIA(pr.nom_projet), objectif:lireChampIA(pr.objectif), texte:lireChampIA(pr.texte_a_peindre), date:lireChampIA(pr.date_souhaitee), contraintes:lireChampIA(pr.contraintes) },
    lignes: (b.lignes||[]).map(l=>({ libelle:l.libelle||'', support: SUPPORTS_ENGINE.includes(l.support_explicite) ? l.support_explicite : '', improbable: l.support_explicite==='Support improbable',
      longueur:lireChampIA(l.longueur_cm, v=>!isNaN(Number(v)) && Number(v)>0), hauteur:lireChampIA(l.hauteur_cm, v=>!isNaN(Number(v)) && Number(v)>0), texte:lireChampIA(l.texte_a_peindre),
      style:l.style_visible||'', remarque:l.remarque||'' })),
    alternatives: b.alternatives||[], resume: b.resume||''
  };
  if(out.client.type.valeur) out.client.type.valeur = String(out.client.type.valeur).toLowerCase();
  return out;
}
const SUPPORTS_ENGINE = ["Enseigne principale","Enseigne drapeau","Vitrines","Jambages","Pignon","Véhicule","Stop-trottoir","Ardoises"];

async function lancerExtraction(){
  if(!intake.texte.trim() && !intake.fichiers.length){ intake.erreur = "Colle un mail ou ajoute au moins un fichier."; render(); return; }
  intake.enCours = true; intake.erreur = ''; render();
  try{
    const { data, error } = await sb.functions.invoke('devis-extraire-besoin', { body:{ establishmentId:ESTABLISHMENT_ID, texte:intake.texte,
      fichiers: intake.fichiers.map(f=>({ nom:f.nom, type:f.type, data:f.dataUrl.split(',')[1] })) } });
    if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.erreur) m = j.erreur + (j.detail ? ' — ' + String(j.detail).slice(0, 220) : ''); }catch(e){} throw new Error(m); }
    if(data && data.erreur) throw new Error(data.erreur);
    if(!data || !data.besoin) throw new Error('réponse vide');
    const besoin = normaliserBesoin(data.besoin);
    const props = await trouverCorrespondancesClient(besoin);
    if(props.length){ intake.besoin = besoin; intake.propositions = props; intake.enCours = false; render(); return; }
    await creerDevisDepuisBesoin(besoin, null);
  }catch(e){
    intake.erreur = "L'extraction a échoué : "+(e.message||e)+" — ton texte et tes fichiers sont conservés : réessaie, ou remplis le formulaire à la main.";
    intake.enCours = false; render();
  }
}

// Rattachement : avant de créer une nouvelle fiche, on cherche un client déjà connu (email ou téléphone identique, ou nom proche).
const normNom = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const neufChiffres = s => String(s||'').replace(/\D/g,'').slice(-9);
async function trouverCorrespondancesClient(b){
  const c = b.client, mail = String(c.email.valeur||'').toLowerCase(), tel = neufChiffres(c.telephone.valeur);
  const noms = [c.nom.valeur, c.entreprise.valeur].map(normNom).filter(n=>n.length>=4);
  const sources = store.devis.map(d=>({ origine:'devis', id:d.id, nom:d.client.nom, email:d.client.email, tel:d.client.telephone, type:d.client.type, ref:d.numero }));
  try{
    const { data } = await sb.from('clients').select('id,nom,telephone,email').eq('establishment_id', ESTABLISHMENT_ID);
    for(const x of (data||[])) sources.push({ origine:'client', id:x.id, nom:x.nom, email:x.email, tel:x.telephone, type:null, ref:'fiche client' });
  }catch(e){ /* table clients indisponible : on se rabat sur les devis */ }
  const trouves = new Map();
  for(const s of sources){
    const raisons = [];
    if(mail && String(s.email||'').toLowerCase()===mail) raisons.push('même e-mail');
    if(tel.length===9 && neufChiffres(s.tel)===tel) raisons.push('même téléphone');
    const n = normNom(s.nom);
    if(n.length>=4 && noms.some(m=>m===n || (m.length>=5 && n.includes(m)) || (n.length>=5 && m.includes(n)))) raisons.push('nom proche');
    if(!raisons.length) continue;
    const cle = (neufChiffres(s.tel)||'') + '|' + String(s.email||'').toLowerCase() + '|' + n;
    const ancien = trouves.get(cle);
    if(!ancien || (s.origine==='client' && ancien.s.origine!=='client')) trouves.set(cle, { s, raisons });
  }
  return [...trouves.values()].sort((a,b)=>b.raisons.length-a.raisons.length).slice(0,3);
}
async function choisirRattachement(i){
  const besoin = intake.besoin; const prop = i==null ? null : intake.propositions[i];
  intake.enCours = true; intake.propositions = null; render();
  try{ await creerDevisDepuisBesoin(besoin, prop ? prop.s : null); }
  catch(e){ intake.erreur = 'Création du devis impossible : '+(e.message||e); intake.enCours = false; render(); }
}

async function creerDevisDepuisBesoin(b, existant){
  const c = b.client, champs = {};
  const poser = (cle, ch)=>{ const f = drapeauIA(ch); if(f) champs[cle] = f; };
  let nom = c.nom.valeur || '', tel = c.telephone.valeur || '', mail = c.email.valeur || '', type = c.type.valeur || '';
  if(c.nom.valeur) poser('client.nom', c.nom);
  else if(existant && existant.nom) nom = existant.nom;
  else if(c.entreprise.valeur){ nom = c.entreprise.valeur; champs['client.nom'] = { niveau:'a_confirmer', raison:"Nom de la structure — personne à contacter à préciser" }; }
  else poser('client.nom', c.nom);
  if(c.telephone.valeur) poser('client.telephone', c.telephone);
  else if(existant && existant.tel) tel = existant.tel;
  else poser('client.telephone', c.telephone);
  if(c.email.valeur) poser('client.email', c.email);
  else if(existant && existant.email) mail = existant.email;
  else poser('client.email', c.email);
  if(!type && existant && existant.type) type = existant.type;
  poser('client.adresse', c.adresse);
  if(!type){ type = 'particulier'; champs['client.type'] = { niveau:'a_confirmer', raison:"Type non précisé : « particulier » par défaut — le tarif particulier est réduit, à vérifier avant chiffrage" }; }
  poser('notes.adresseFacturation', c.facturation);

  const nc = { objectif:b.projet.objectif.valeur||'', texteAPeindre:b.projet.texte.valeur||'', dateSouhaitee:b.projet.date.valeur||'', contraintes:b.projet.contraintes.valeur||'',
    adresseFacturation:c.facturation.valeur||'', ia:{ source:'extraction', date:new Date().toISOString(), champs, alternatives:b.alternatives, resume:b.resume } };
  const maintenant = new Date().toISOString();
  const numero = 'DEV-' + String(store.devis.length+1).padStart(4,'0');
  const { data, error } = await sb.from('devis').insert({
    establishment_id: ESTABLISHMENT_ID, numero, statut:'brouillon', historique:[{ statut:'brouillon', date:maintenant }], source:'interne',
    client_nom:nom, client_telephone:tel, client_email:mail, client_adresse:c.adresse.valeur||'', client_type:type, notes_client:nc,
    photos: intake.fichiers.map(f=>({ nom:f.nom, type:f.type, tailleKo:f.tailleKo, dataUrl:f.dataUrl }))
  }).select().single();
  if(error) throw error;
  const lignes = [];
  for(const [i,l] of b.lignes.entries()){
    const note = [l.libelle, l.style, l.remarque].filter(Boolean).join(' — ');
    const { data:lr, error:le } = await sb.from('devis_lignes').insert({
      devis_id:data.id, type:'calculee', support:l.support||null, hauteur_chantier:'En rez-de-chaussée', depose_pose:false, prix_retenu_mode:'sheet', position:i,
      longueur_cm:l.longueur.valeur!=null?Number(l.longueur.valeur):null, hauteur_cm:l.hauteur.valeur!=null?Number(l.hauteur.valeur):null,
      texte_a_peindre:l.texte.valeur||null, precision:note||null
    }).select().single();
    if(le){ alert("Ligne « "+(l.libelle||i+1)+" » non créée : "+le.message); continue; }
    lignes.push(lr);
    if(!l.support) champs['ligne.'+lr.id+'.support'] = { niveau:'a_completer', raison: l.improbable ? 'Support improbable — hors calcul automatique, voir le contact humain' : "Support non précisé dans les documents — à choisir" };
    const fl = drapeauIA(l.longueur); if(fl) champs['ligne.'+lr.id+'.longueurCm'] = fl;
    const fh = drapeauIA(l.hauteur);  if(fh) champs['ligne.'+lr.id+'.hauteurCm'] = fh;
    const ft = drapeauIA(l.texte);    if(ft) champs['ligne.'+lr.id+'.texteAPeindre'] = ft;
  }
  await sb.from('devis').update({ notes_client:nc }).eq('id', data.id);
  const devis = dbDevisToJs(data, lignes);
  store.devis.unshift(devis);
  currentDevisId = data.id;
  intake.ouvert = false; intake.enCours = false; render();
  await creerProjetDepuisDevis(devis, { nomProjet:b.projet.nom.valeur, client_id: existant && existant.origine==='client' ? existant.id : null,
    client:{ nom, tel, mail, adresse:c.adresse.valeur||'' }, source:'extraction IA' });
}

async function creerDevisVide(){
  const maintenant = new Date().toISOString();
  const numero = 'DEV-' + String(store.devis.length+1).padStart(4,'0');

  }).select().single();

async function supprimerDevis(id){
  if(!await confirmer('Supprimer ce devis ?')) return;
  store.devis = store.devis.filter(d=>d.id!==id);
  if(currentDevisId===id) currentDevisId = store.devis[0]?.id || null;
  render();
  await sb.from('projets').update({ devis_id: null }).eq('devis_id', id);
  const { error } = await sb.from('devis').delete().eq('id', id);
  if(error) alert("Suppression échouée côté serveur : "+error.message);
}

/* Suivi de statut — alimente le Kanban Client/Projet (client-projet.html) */
async function changerStatutDevis(devisId, nouveauStatut){
  const d = getDevis(devisId); if(!d) return;
  if(nouveauStatut==='envoye'){
    const a = champsARevoir(d);
    if(a.length){ alert("Ce devis ne peut pas encore être marqué envoyé : des champs pré-remplis par l'IA restent à revoir.\n\n— "+a.join("\n— ")+"\n\nComplète-les (ou clique « C'est bon ✓ » sur ceux à confirmer). Le brouillon, lui, reste enregistré tel quel."); return; }
  }
  d.statut = nouveauStatut;
  if(!d.historique) d.historique = [];
  d.historique.push({ statut: nouveauStatut, date: new Date().toISOString() });
  render();
  const { error } = await sb.from('devis').update({ statut:d.statut, historique:d.historique }).eq('id', devisId);
  if(error) alert("Mise à jour du statut échouée côté serveur : "+error.message);
  await avancerProjetDepuisDevis(devisId, d.numero, nouveauStatut);
}

async function ajouterLigneCalculee(devisId){
  const d = getDevis(devisId); if(!d) return;

// Forfaits que le client voit dans son estimatif (maquette, poncifs, déplacement) et article MEG qui leur correspond.
const FORFAITS_ESTIMATIF = [
  { re:/maquette/i,        code:'ART00113' },   // Création d'une maquette originale
  { re:/poncif/i,          code:'ART00002' },   // Préparation des lettrages
  { re:/d[ée]placement/i,  code:'ART00105' },   // Déplacement
];
const CODE_PEINTURE_PAR_DEFAUT = 'ART00003';   // article « peinture » générique quand aucun article précis ne correspond au support
const ventilationEnCours = new Set();
const codeMegDeLigne = l => (megById(l.megCode)||{}).code || '';
const estLigneForfait = l => l.type==='manuelle' && FORFAITS_ESTIMATIF.some(f=>f.re.test(l.libelle||''));
const estMegForfait = l => l.type==='option_meg' && FORFAITS_ESTIMATIF.some(f=>f.code===codeMegDeLigne(l));
const estimationClient = d => (d && d.notesClient && d.notesClient.estimationAffichee) || null;
function ventilationPossible(d){
  return !!d && d.source!=='interne' && d.statut==='brouillon' && !(d.notesClient && d.notesClient.ventile)
    && !d.lignes.some(l=>l.type==='option_meg') && d.lignes.some(l=>l.type==='calculee' && l.support) && MEG_CATALOGUE.length>0;
}
function hydratationPossible(d){
  return !!d && d.source!=='interne' && d.statut==='brouillon' && !(d.notesClient && d.notesClient.lignesCompletees) && d.lignes.some(l=>l.type==='calculee' && l.support);
}
// Variables de la demande que la création du devis n'a pas recopiées sur les lignes calculées (texte, taille des lettres, effet, fabrication, dorure…) :
// on les reprend de ce que le client a envoyé (notes_client.lignesCalculees, ou à défaut le texte, le niveau d'effet et l'estimatif affiché). Une seule fois par devis.
async function completerLignesDepuisDemande(devisId){
  const d = getDevis(devisId); if(!hydratationPossible(d)) return;
  const nc = d.notesClient || {}, e = estimationClient(d), envoyees = Array.isArray(nc.lignesCalculees) ? nc.lignesCalculees : [];
  const niveau = (/Niveau\s*([123])/i.exec(nc.objectif||'')||[])[1];
  const cle = Object.keys(reglages.fabricationSupport||{}).includes('Panneau bois seul') ? 'Panneau bois seul' : (Object.keys(reglages.fabricationSupport||{})[0]||'');
  const calcs = d.lignes.filter(l=>l.type==='calculee' && l.support);
  for(let i=0;i<calcs.length;i++){
    const l = calcs[i], src = envoyees[i] || {}, lib = (e && e.lignes && e.lignes[i] && e.lignes[i].libelle) || '', patch = {};
    const mettre = (champ, colonne, valeur) => { l[champ] = valeur; patch[colonne] = valeur; };
    if(!l.texteAPeindre){ const tx = src.texteAPeindre || nc.texteAPeindre; if(tx) mettre('texteAPeindre','texte_a_peindre',tx); }
    if(!l.fabricationSupport && (src.fabricationSupport || /fabrication du support incluse/i.test(lib)) && cle) mettre('fabricationSupport','fabrication_support', src.fabricationSupport || cle);
    if(!l.relief && !l.couleursMultiples){
      const rel = src.relief !== undefined ? !!src.relief : (niveau==='2' || niveau==='3'), coul = src.couleursMultiples !== undefined ? !!src.couleursMultiples : niveau==='3';
      if(rel) mettre('relief','relief',true); if(coul) mettre('couleursMultiples','couleurs_multiples',true);
    }
    if(!l.tailleLettres && src.tailleLettres) mettre('tailleLettres','taille_lettres',src.tailleLettres);
    if(!l.empattements && src.empattements) mettre('empattements','empattements',true);
    if(src.effet==='Dorure' && l.effet!=='Dorure'){ mettre('effet','effet','Dorure'); if(l.doreePct==null && src.doreePct!=null) mettre('doreePct','dorure_pct',Number(src.doreePct)); }
    if(Object.keys(patch).length){ const { error } = await sb.from('devis_lignes').update(patch).eq('id', l.id); if(error) console.error('Reprise des variables de la demande impossible :', error.message); }
  }
  d.notesClient = Object.assign({}, d.notesClient||{}, { lignesCompletees:true });
  await sb.from('devis').update({ notes_client: d.notesClient }).eq('id', d.id);
}
// L'estimatif livré au client fait foi : chaque forfait (maquette, poncifs, déplacement) devient son article du catalogue avec le prix que le client a vu,
// et chaque support devient l'article « peinture » avec le prix affiché au client (fabrication du support comprise). Les lignes libres de forfait sont retirées
// pour ne pas compter deux fois. Tout reste modifiable ensuite (libellé, prix, retrait). « refaire » remplace d'abord les articles déjà posés.
async function ventilerEstimatif(devisId, refaire){
  const d = getDevis(devisId); if(!d || ventilationEnCours.has(devisId)) return;
  if(!refaire && !ventilationPossible(d)) return;
  ventilationEnCours.add(devisId);
  try{
    const e = estimationClient(d), calcs = d.lignes.filter(x=>x.type==='calculee' && x.support);
    const lignes = [], aRetirer = d.lignes.filter(estLigneForfait).map(l=>l.id);
    const forfaits = e && Array.isArray(e.lignes) ? e.lignes.slice(calcs.length).filter(x=>FORFAITS_ESTIMATIF.some(f=>f.re.test(x.libelle||''))).map(x=>({ libelle:x.libelle, prixHT:x.prixHT }))
                                                   : d.lignes.filter(estLigneForfait).map(l=>({ libelle:l.libelle, prixHT:l.prixHT }));
    for(const x of forfaits){
      const f = FORFAITS_ESTIMATIF.find(y=>y.re.test(x.libelle||'')), art = MEG_CATALOGUE.find(m=>m.code===f.code); if(!art) continue;
      const km = f.code==='ART00105' ? parseFloat(((/([\d.,]+)\s*km/i.exec(x.libelle)||[])[1]||'').replace(',','.')) : NaN;
      lignes.push({ meg_code:art.id, prix_ht:arrondir(Number(x.prixHT)||0,2), libelle:art.article||x.libelle, distance_km: isNaN(km) ? null : km });
    }
    const parArticle = new Map();
    calcs.forEach((l,i)=>{
      const calc = calculerLigne(l, d.client.type); if(!calc) return;
      const vu = e && e.lignes && e.lignes[i] && e.lignes[i].prixHT != null ? Number(e.lignes[i].prixHT) : null;   // prix affiché au client
      const megId = suggererMegId(l.support, l.matiere) || (MEG_CATALOGUE.find(m=>m.code===CODE_PEINTURE_PAR_DEFAUT)||{}).id; if(!megId) return;
      const dim = l.longueurCm && l.hauteurCm ? ` — ${l.longueurCm} × ${l.hauteurCm} cm` : '';
      const lib = (e && e.lignes && e.lignes[i] && e.lignes[i].libelle) ? `${e.lignes[i].libelle}${dim}` : `${l.support}${l.texteAPeindre ? ' « ' + String(l.texteAPeindre).slice(0, 40) + ' »' : ''}${dim}`;
      const en = parArticle.get(megId) || { prix:0, precisions:[] };
      en.prix += vu != null ? vu : (Number(calc.prixHT)||0); en.precisions.push(lib); parArticle.set(megId, en);
    });
    for(const [megId, en] of parArticle){ const art = megById(megId); lignes.push({ meg_code:megId, prix_ht:arrondir(en.prix,2), libelle:art.article||'', precision:en.precisions.join(' ; ') }); }
    if(!lignes.length) return;
    const anciens = refaire ? d.lignes.filter(l=>l.type==='option_meg').map(l=>l.id) : [];
    const nouvelles = lignes.map((x,i)=>({ devis_id:d.id, type:'option_meg', position:d.lignes.length + i, ...x }));
    const { data, error } = await sb.from('devis_lignes').insert(nouvelles).select();
    if(error){ console.error('Ventilation automatique impossible :', error.message); return; }
    const aSupprimer = [...new Set([...aRetirer, ...anciens])];
    if(aSupprimer.length) await sb.from('devis_lignes').delete().in('id', aSupprimer);
    d.lignes = d.lignes.filter(l=>!aSupprimer.includes(l.id)).concat((data||[]).map(dbLigneToJs));
    d.notesClient = Object.assign({}, d.notesClient||{}, { ventile:true });
    await sb.from('devis').update({ notes_client: d.notesClient }).eq('id', d.id);
    render();
  }catch(err){ console.error('Ventilation automatique impossible :', err); }
  finally{ ventilationEnCours.delete(devisId); }
}
async function refaireVentilation(devisId){
  if(!await confirmer("Remplacer les articles posés par une répartition refaite d'après l'estimatif livré au client ? Les articles actuels (et leurs prix modifiés) seront remplacés.")) return;
  await ventilerEstimatif(devisId, true);
}
async function preparerDevisDuSite(devisId){
  if(ventilationEnCours.has('prep-'+devisId)) return;
  ventilationEnCours.add('prep-'+devisId);
  try{ await completerLignesDepuisDemande(devisId); } finally { ventilationEnCours.delete('prep-'+devisId); }
  await ventilerEstimatif(devisId);
  render();
}
// Proposition automatique d'articles MEG à partir de ce qui est déjà qualifié (support/matière
// de la première ligne calculée) — un point de départ modifiable, jamais un devis final : la
// graphiste/l'atelier affine ensuite à la main (retire, change d'article, ajuste le prix).
async function proposerArticlesMeg(devisId){
  const d = getDevis(devisId); if(!d) return;
  if(!await confirmer("Proposer un jeu d'articles MEG de départ (poncifs, maquette, peinture, déplacement) ? Tu pourras tout modifier ou retirer ensuite.")) return;

  const ligneCalculee = d.lignes.find(l=>l.type==='calculee' && l.support);
  const codesAProposer = ['ART00002', 'ART00113'];
  const articlesAProposer = codesAProposer.map(code => MEG_CATALOGUE.find(m=>m.code===code)).filter(Boolean);

  if(ligneCalculee){
    const megId = suggererMegId(ligneCalculee.support, ligneCalculee.matiere);
    const art = megId ? megById(megId) : null;
    if(art) articlesAProposer.push(art);
  }
  const deplacement = MEG_CATALOGUE.find(m=>m.code==='ART00105');
  if(deplacement) articlesAProposer.push(deplacement);

  if(!articlesAProposer.length){ alert("Rien à proposer — le catalogue MEG semble vide."); return; }

  for(const art of articlesAProposer){
    const { data, error } = await sb.from('devis_lignes').insert({
      devis_id:devisId, type:'option_meg', meg_code:art.id, prix_ht:art.prixHT||0, libelle:art.article||'', position:d.lignes.length
    }).select().single();
    if(error){ alert('Erreur : '+error.message); continue; }
    d.lignes.push(dbLigneToJs(data));
  }
  render();
}
// Distance routière atelier <-> chantier (API Adresse pour géocoder, OSRM pour l'itinéraire —
// deux services publics gratuits, sans clé). Calcule un aller-retour et propose de l'appliquer
// à la ligne catalogue "Déplacement", sans jamais toucher aux autres lignes.
async function geocoderAdresse(adresse){
  try{
    const r = await fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(adresse)+'&limit=1');
    const data = await r.json();
    const f = data.features && data.features[0];
    if(!f) return null;
    return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] };
  }catch(e){ return null; }
}
async function calculerDeplacement(devisId){
  const d = getDevis(devisId); if(!d) return;
  if(!d.client.adresse){ alert("Renseigne d'abord l'adresse du chantier."); return; }
  if(!ETABLISSEMENT || !ETABLISSEMENT.adresse){ alert("L'adresse de l'atelier n'est pas renseignée (Mon Atelier > Fiche entreprise) — impossible de calculer une distance sans point de départ."); return; }
  const btn = document.getElementById('btnCalculerDeplacement');
  if(btn){ btn.disabled = true; btn.textContent = 'Calcul en cours…'; }
  try{
    const [origine, destination] = await Promise.all([geocoderAdresse(ETABLISSEMENT.adresse), geocoderAdresse(d.client.adresse)]);
    if(!origine || !destination){ alert("Adresse introuvable — vérifie l'adresse de l'atelier et celle du chantier."); return; }
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${origine.lon},${origine.lat};${destination.lon},${destination.lat}?overview=false`);
    const data = await r.json();
    if(data.code!=='Ok' || !data.routes || !data.routes.length){ alert("Calcul d'itinéraire impossible pour l'instant (service de routage public indisponible) — réessaie plus tard, ou renseigne le prix à la main."); return; }
    const distanceKm = arrondir(data.routes[0].distance/1000, 1);
    // distanceKm stockée sur la ligne = l'aller-retour directement (pas l'aller simple),
    // pour que le prix se lise simplement comme distance × prix/km, sans facteur caché.
    const distanceAllerRetourKm = arrondir(distanceKm*2, 1);
    const prix = arrondir(distanceAllerRetourKm * (reglages.prixParKm||0), 2);
    const artDeplacement = MEG_CATALOGUE.find(m=>m.code==='ART00105');
    if(!artDeplacement){ alert('Article "Déplacement" introuvable dans le catalogue.'); return; }
    const ligneExistante = d.lignes.find(l=>l.type==='option_meg' && l.megCode===artDeplacement.id);
    if(ligneExistante){
      ligneExistante.prixHT = prix; ligneExistante.distanceKm = distanceAllerRetourKm;
      await sb.from('devis_lignes').update({ prix_ht: prix, distance_km: distanceAllerRetourKm }).eq('id', ligneExistante.id);
    } else {
      const { data: ligneData, error } = await sb.from('devis_lignes').insert({
        devis_id:d.id, type:'option_meg', meg_code:artDeplacement.id, prix_ht:prix, distance_km:distanceAllerRetourKm, libelle:artDeplacement.article||'', position:d.lignes.length
      }).select().single();
      if(error){ alert('Erreur : '+error.message); return; }
      d.lignes.push(dbLigneToJs(ligneData));
    }
    render();
  }catch(e){
    alert("Calcul de distance impossible (service indisponible) : "+e.message);
  }finally{
    const btnFin = document.getElementById('btnCalculerDeplacement');
    if(btnFin){ btnFin.disabled = false; btnFin.textContent = '📍 Calculer'; }
  }
}
// Un article du catalogue coché = une ligne option_meg. Décoché = la ligne est retirée.
// Le libellé démarre sur la phrase du catalogue, modifiable ensuite (renommer plutôt
// qu'ajouter une précision à côté) ; le prix reste modifiable aussi.
async function toggleArticleMeg(devisId, megId, checked){
  const d = getDevis(devisId); if(!d) return;
  if(checked){
    const art = megById(megId);
    const { data, error } = await sb.from('devis_lignes').insert({
      devis_id:devisId, type:'option_meg', meg_code:megId, prix_ht:art?.prixHT||0, libelle:art?.article||'', position:d.lignes.length
    }).select().single();
    if(error){ alert('Erreur : '+error.message); return; }
    d.lignes.push(dbLigneToJs(data));
  } else {
    const ligne = d.lignes.find(l=>l.type==='option_meg' && l.megCode===megId);
    if(ligne){ d.lignes = d.lignes.filter(l=>l.id!==ligne.id); await sb.from('devis_lignes').delete().eq('id', ligne.id); }
  }
  render();
}

  for(const l of d.lignes) if(l.type==='option_meg' && l.megCode) lignesParMegId[l.megCode] = l;
  return megGroupesParRubrique().map(g=>{
    const aArticleCoche = g.articles.some(m=>lignesParMegId[m.id]);
    return `
    <div style="margin-bottom:10px" class="${aArticleCoche?'':'catalogueRubriqueVide'}">
      <div class="tiny muted" style="font-weight:700;margin-bottom:3px">${escapeHtml(g.rubrique)}</div>
      ${g.articles.map(m=>{
        const ligne = lignesParMegId[m.id];
        const precisionHtml = ligne ? `<div class="${ligne.precision?'':'no-print'}" style="padding-left:26px;margin-bottom:4px"><input class="input" style="font-size:12px;padding:4px 8px" placeholder="Précision (facultatif) — s'affiche sous la désignation" value="${escapeHtml(ligne.precision||'')}" onchange="updateLigne('${d.id}','${ligne.id}','precision', this.value)"></div>` : '';
        if(m.code==='ART00105'){
          return `
          <div>
            <div class="catalogueLigne ${ligne?'':'catalogueLigneVide'}" style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px;flex-wrap:wrap">
              <input class="no-print" type="checkbox" ${ligne?'checked':''} onchange="toggleArticleMeg('${d.id}','${m.id}', this.checked)">
              ${ligne
                ? `<input class="input" style="flex:1;min-width:160px" value="${escapeHtml(ligne.libelle||m.article)}" onchange="updateLigne('${d.id}','${ligne.id}','libelle', this.value)">
                   <span class="kmCol" style="display:inline-flex;align-items:center;gap:4px"><span class="tiny muted">km A/R</span><input class="input" style="width:60px;text-align:right" type="number" step="0.1" title="Distance aller-retour (km)" value="${ligne.distanceKm??''}" onchange="updateLigne('${d.id}','${ligne.id}','distanceKm', this.value)"></span>
                   <span class="prixCol" style="display:inline-flex;align-items:center;gap:4px"><input class="input no-print" style="width:80px;text-align:right" type="number" step="0.01" value="${ligne.prixHT}" onchange="updateLigne('${d.id}','${ligne.id}','prixHT', this.value)"><span class="tiny muted no-print">€</span><span class="print-only">${euros(ligne.prixHT)}</span></span>`
                : `<span style="flex:1">${escapeHtml(m.article)}</span>
                   <span class="tiny muted kmCol" style="text-align:right">—</span>
                   <span class="tiny muted prixCol" style="text-align:right">${m.prixHT!=null?euros(m.prixHT):'—'}</span>`}
              <button class="ghostBtn no-print" style="padding:4px 8px;font-size:11.5px" id="btnCalculerDeplacement" onclick="calculerDeplacement('${d.id}')">📍 Calculer</button>
            </div>
            ${precisionHtml}
          </div>`;
        }
        return `
        <div>
          <div class="catalogueLigne ${ligne?'':'catalogueLigneVide'}" style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px">
            <input class="no-print" type="checkbox" ${ligne?'checked':''} onchange="toggleArticleMeg('${d.id}','${m.id}', this.checked)">
            ${ligne
              ? `<input class="input" style="flex:1" value="${escapeHtml(ligne.libelle||m.article)}" onchange="updateLigne('${d.id}','${ligne.id}','libelle', this.value)">
                 <span class="prixCol" style="display:inline-flex;align-items:center;gap:4px"><input class="input no-print" style="width:80px;text-align:right" type="number" step="0.01" value="${ligne.prixHT}" onchange="updateLigne('${d.id}','${ligne.id}','prixHT', this.value)"><span class="tiny muted no-print">€</span><span class="print-only">${euros(ligne.prixHT)}</span></span>
                 ${/peinture/i.test(g.rubrique) && estimationAutoTotale(d) ? `<button type="button" class="ghostBtn no-print" style="padding:4px 8px;font-size:11.5px;white-space:nowrap" title="Remplace le prix de cet article par le total des lignes calculées" onclick="reprendreEstimationAuto('${d.id}','${ligne.id}')">↩ Reprendre l'estimation auto (${euros(estimationAutoTotale(d))})</button>` : ''}`
              : `<span style="flex:1">${escapeHtml(m.article)}</span>
                 <span class="tiny muted prixCol" style="text-align:right">${m.prixHT!=null?euros(m.prixHT):'—'}</span>`}
          </div>
          ${precisionHtml}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}
async function supprimerLigne(devisId, ligneId){
  const d = getDevis(devisId); if(!d) return;
  d.lignes = d.lignes.filter(l=>l.id!==ligneId);
  render();
  const { error } = await sb.from('devis_lignes').delete().eq('id', ligneId);
  if(error) alert("Suppression de la ligne échouée côté serveur : "+error.message);
}

// Niveau d'effet comme dans le questionnaire : 1 = aplat (0 %), 2 = + relief (+30 %), 3 = + relief et plusieurs couleurs (+45 %).
function niveauEffetLigne(l){ return l.couleursMultiples ? '3' : (l.relief ? '2' : '1'); }
function majCompteurCaracteres(ligneId, valeur){
  const n = valeur.replace(/\s/g,'').length;
  const el = document.getElementById('compteurCar-'+ligneId);
  if(el) el.textContent = `(${n} caractère${n>1?'s':''} — entre dans le calcul du temps)`;
}
async function updateLigne(devisId, ligneId, champ, valeur){
  const d = getDevis(devisId); if(!d) return;
  const l = d.lignes.find(x=>x.id===ligneId); if(!l) return;
  leverFlag(d, 'ligne.'+ligneId+'.'+champ);
  const patch = {};
  if(champ==='support'){ l.support=valeur; patch.support=valeur; if(!COMPATIBILITES[valeur]?.includes(l.matiere)){ l.matiere=''; patch.matiere=''; l.etat=''; patch.etat=''; } }
  else if(champ==='matiere'){ l.matiere=valeur; patch.matiere=valeur; if(!l.megCode){ l.megCode = suggererMegId(l.support, l.matiere) || ''; patch.meg_code=l.megCode; }
    if(!etatOptionsPourMatiere(l.matiere).includes(l.etat)){ l.etat=''; patch.etat=''; } }
  else if(champ==='longueurCm' || champ==='hauteurCm'){ l[champ] = valeur===''? '' : Number(valeur); patch[LIGNE_CHAMP_TO_COLONNE[champ]] = l[champ]===''?null:l[champ]; }
  else if(champ==='doreePct'){ l.doreePct = valeur===''? null : Math.min(100, Math.max(0, Number(valeur)||0)); patch.dorure_pct = l.doreePct; }
  else if(champ==='quantite'){ l.quantite = Math.max(1, Number(valeur)||1); patch.quantite = l.quantite; }
  else if(champ==='distanceKm'){ l.distanceKm = valeur===''? null : Number(valeur); patch.distance_km = l.distanceKm; }
  else if(champ==='deposePose'){ l.deposePose = !!valeur; patch.depose_pose = l.deposePose; }
  else if(champ==='niveauEffet'){ const n = String(valeur); l.relief = n==='2' || n==='3'; l.couleursMultiples = n==='3'; l.ombreSupplementaire = false; patch.relief = l.relief; patch.couleurs_multiples = l.couleursMultiples; patch.ombre_supplementaire = false; }
  else if(champ==='dorure'){ l.effet = valeur ? 'Dorure' : 'Aucun effet particulier / lettrage simple'; patch.effet = l.effet; if(valeur && l.doreePct==null){ l.doreePct = 100; patch.dorure_pct = 100; } }
  else if(champ==='fabrication'){ const cles = Object.keys(reglages.fabricationSupport||{}); l.fabricationSupport = valeur ? (cles.includes('Panneau bois seul') ? 'Panneau bois seul' : (cles[0]||'')) : ''; patch.fabrication_support = l.fabricationSupport; }
  else if(champ==='prixHT'){ l.prixHT = Number(valeur)||0; patch.prix_ht = l.prixHT; }
  else if(champ==='megCode'){ l.megCode = valeur; patch.meg_code=valeur; const m=megById(valeur); if(l.type==='option_meg' && m){ l.prixHT = m.prixHT||0; patch.prix_ht=l.prixHT; } }
  else { l[champ] = valeur; if(LIGNE_CHAMP_TO_COLONNE[champ]) patch[LIGNE_CHAMP_TO_COLONNE[champ]] = valeur; }
  // Persiste la décision d'arbitrage (recalculée ici) pour que le tableau de bord de l'atelier
  // puisse la lire directement, sans dupliquer le moteur de calcul BASE×COEF ailleurs.
  if(l.type==='calculee'){
    const arb = calculerArbitrage(l, calculerLigne(l, d.client.type));
    patch.arbitrage_decision = arb ? arb.decision : null;
  }
  render();
  const { error } = await sb.from('devis_lignes').update(patch).eq('id', ligneId);
  if(error) alert("Mise à jour de la ligne échouée côté serveur : "+error.message);
}

// Une ligne calculée sert à estimer le besoin ; les articles du catalogue cochés
// servent à s'en rapprocher avec de vrais articles facturables. Les deux ne
// doivent jamais s'additionner dans le total : dès qu'au moins un article du
// catalogue est coché, les lignes calculées deviennent une estimation affichée
// mais non comptée (voir aussi renderLigneCalculee).
// Sous-total = somme des lignes, sans l'ajustement global (voir totalDevis).
function sousTotalDevis(d){
  const aDesArticlesCatalogue = d.lignes.some(l=>l.type==='option_meg');
  let total = 0;
  for(const l of d.lignes){
    if(l.type==='calculee'){
      if(aDesArticlesCatalogue) continue;
      const calc = calculerLigne(l, d.client.type);
      if(calc){ total += (l.prixRetenuMode==='meg' && l.megCode && megById(l.megCode)?.prixHT!=null) ? megById(l.megCode).prixHT : calc.prixHT; }
    } else {
      total += Number(l.prixHT)||0;
    }
  }
  return arrondir(total,2);
}
// Total des estimations automatiques des lignes calculées (affiché même quand il n'est plus compté).
function estimationAutoTotale(d){
  return arrondir(d.lignes.filter(l=>l.type==='calculee').reduce((t,l)=>{ const c = calculerLigne(l, d.client.type); return t + (c ? ((l.prixRetenuMode==='meg' && l.megCode && megById(l.megCode)?.prixHT!=null) ? megById(l.megCode).prixHT : c.prixHT) : 0); }, 0), 2);
}
async function reprendreEstimationAuto(devisId, ligneId){
  const d = getDevis(devisId); if(!d) return;
  const v = estimationAutoTotale(d); if(!v) return;
  await updateLigne(devisId, ligneId, 'prixHT', v);
}
// Ajustement global : un curseur en % sur le devis entier (voir updateAjustementGlobal),
// indépendant du calcul de chaque ligne — c'est ce total-ci qui est le total réel du devis.
function totalDevis(d){
  return arrondir(sousTotalDevis(d) * (1 + (d.ajustementGlobalPct||0)/100), 2);
}
function montantTva(d){ return arrondir(totalDevis(d) * (reglages.tvaPct||0)/100, 2); }
function totalTTC(d){ return arrondir(totalDevis(d) + montantTva(d), 2); }
async function updateAjustementGlobal(devisId, valeur){
  const d = getDevis(devisId); if(!d) return;
  d.ajustementGlobalPct = Number(valeur)||0;
  render();
  const { error } = await sb.from('devis').update({ ajustement_global_pct: d.ajustementGlobalPct }).eq('id', devisId);
  if(error) alert("Mise à jour de l'ajustement global échouée côté serveur : "+error.message);
}

function optionsHtml(map, selected, placeholder){

}
function optionsListeHtml(list, selected, placeholder){

// Détail PRIVÉ du calcul d'une ligne (jamais montré au client) : sert à qualifier le chiffrage, à répartir le montant sur les articles
// du catalogue, et à apprendre la durée de chantier (planning Kanban). Textes courts, rendus en petit et en gris.
function detailCalculPrive(l, calc){
  const q = calc.quantite, e = escapeHtml, h = n => String(arrondir(n,2)).replace('.',',') + ' h';
  const out = [];   // { k: libellé, v: valeur, n: précision en petit (facultatif) }
  if(calc.forfaitMot) out.push({ k:'Forfait au mot', v:`${calc.nbMots} mot${calc.nbMots>1?'s':''} × ${euros(calc.prixParMot)}` });
  else if(calc.surfaceRetenueM2 != null) out.push({ k:'Surface retenue', v:`${String(calc.surfaceRetenueM2).replace('.',',')} m²`, n: q>1 ? `×${q} exemplaires — mini ${String(calc.surfaceMiniM2).replace('.',',')} m² pour l'ensemble` : `mini ${String(calc.surfaceMiniM2).replace('.',',')} m²` });
  else out.push({ k:'Surface', v:'non renseignée', n:`minimum ${String(calc.surfaceMiniM2).replace('.',',')} m² retenu` });
  if(calc.nombreCaracteres > 0) out.push({ k:'Texte', v:`${calc.nombreCaracteres} caractère${calc.nombreCaracteres>1?'s':''}`, n:`× forme (${calc.coefForme.toFixed(2).replace('.',',')}) = +${h(calc.tempsCaracteresH)}` });
  out.push({ k:'Temps estimé', v:h(calc.tempsEstimeH), n: calc.loiFixeVariable ? `fixe ${h(calc.tempsFixeH)} + surface ${h(calc.tempsSurfaceH)}${calc.tempsCaracteresH>0?' + texte '+h(calc.tempsCaracteresH):''}` : (calc.facteurSurface!==1 ? `base ${h(calc.tempsBaseH)} × ${calc.facteurSurface.toFixed(2).replace('.',',')}` : '') });
  out.push({ k:'Temps converti en prix', v:`${String(calc.joursEstimes).replace('.',',')} j × ${euros(calc.tarifJournalier)}` });
  out.push({ k:'Coefficient matière / effet / dépose', v:calc.coefTotal.toFixed(3).replace('.',','), n: (l.effet==='Dorure' && calc.partDoree<1) ? `dorure sur ${Math.round(calc.partDoree*100)} %` : '' });
  out.push({ k:'Modificateurs', v: calc.modifsAppliques.length ? calc.modifsAppliques.map(m=>`${e(m.label)} (${m.type==='pourcentage'?'+'+m.valeur+' %':'+'+euros(m.valeur)})`).join(', ') : 'aucun' });
  out.push({ k:'Hauteur du chantier (coût fixe)', v:euros(calc.coutHauteurHT) });
  out.push({ k:calc.forfaitMot ? 'Minimum HT' : (calc.complement ? 'Minimum HT (complément)' : 'Minimum HT du support'), v: calc.forfaitMot ? 'non appliqué (forfait au mot)' : euros(calc.minimumHT) });
  if(calc.fabricationHT > 0) out.push({ k:'Fabrication du support', v:'+ ' + euros(calc.fabricationHT) });
  if(calc.remiseParticulierPct > 0) out.push({ k:'Tarif particulier', v:`− ${calc.remiseParticulierPct} %`, n:`${euros(calc.prixAvantRemise)} avant remise` });
  return out;
}
// Calculateur de marge : prix de vente HT du devis contre le coût de l'équipe atelier (jours-personnes × coût journalier chargé + autres coûts).

  const m = (d.notesClient && d.notesClient.marge) || {};
  const jours = m.jours != null ? m.jours : joursAuto, autres = m.autres || 0, coutJour = reglages.coutEquipeJour || 0, objectif = reglages.objectifMargePct ?? 30;
  const prix = totalDevis(d), coutEquipe = arrondir(jours * coutJour, 2), cout = arrondir(coutEquipe + autres, 2), marge = arrondir(prix - cout, 2);
  const taux = prix > 0 ? marge / prix * 100 : 0;

    <div class="mpLigne"><span>Coût total</span><b>${euros(cout)}</b></div>

// Coût moyen d'une journée de travail d'un membre de l'équipe (salaire chargé + part des frais de l'atelier) : ESTIMATION de départ, à affiner dans Réglages tarifs.
const COUT_EQUIPE_JOUR_DEFAUT = 250;
const coutEquipeJour = () => Number(reglages.coutEquipeJour) > 0 ? Number(reglages.coutEquipeJour) : COUT_EQUIPE_JOUR_DEFAUT;
function renderChiffragePrive(d){
  const lignes = d.lignes.filter(l=>l.type==='calculee' && l.support).map(l=>({ l, calc: calculerLigne(l, d.client.type) })).filter(x=>x.calc);
  if(!lignes.length) return '';
  const calcul = arrondir(lignes.reduce((s,x)=>s+x.calc.prixHT, 0), 2);
  const ec = estimationClient(d), vuClient = ec && ec.totalHT != null ? arrondir(Number(ec.totalHT)||0, 2) : null;
  // Forfaits de l'estimatif (maquette, poncifs, déplacement) : encore en lignes libres, ou déjà posés comme articles.
  const forfaits = arrondir(d.lignes.filter(l=>estLigneForfait(l)||estMegForfait(l)).reduce((s,l)=>s+(Number(l.prixHT)||0), 0), 2);
  const total = sousTotalDevis(d);
  // Avec l'estimatif livré au client : on compare le total du devis à ce que le client a vu. Sans lui (devis interne) : on compare le calcul aux articles posés.
  const reference = vuClient != null ? vuClient : arrondir(calcul + forfaits, 2);
  const compare = vuClient != null ? total : arrondir(d.lignes.filter(l=>l.type==='option_meg'||estLigneForfait(l)).reduce((s,l)=>s+(Number(l.prixHT)||0), 0), 2);
  const reste = arrondir(reference - compare, 2);
  const heures = arrondir(lignes.reduce((s,x)=>s+x.calc.tempsEstimeHTotal, 0), 2), jours = arrondir(lignes.reduce((s,x)=>s+x.calc.joursEstimesTotal, 0), 2);
  return `<aside class="chiffragePrive no-print" aria-label="Chiffrage privé">

    <div class="cpTotal"><span>Total du devis (HT)</span><b>${euros(total)}</b></div>
    <div class="cpTotal" style="border-top:1px solid var(--line);margin-top:4px;padding-top:5px"><span>${Math.abs(reste)<0.5?'Devis = estimatif livré':(reste>0?'Devis inférieur à l\'estimatif livré de':'Devis supérieur à l\'estimatif livré de')}</span><b>${Math.abs(reste)<0.5?'✓':euros(Math.abs(reste))}</b></div>
    <div class="cpTotal" style="margin-top:6px"><span>Contrôle : lettrage recalculé ici</span><b>${euros(calcul)}</b></div>` : `
    <div class="cpTotal"><span>Lettrage calculé</span><b>${euros(calcul)}</b></div>
    ${forfaits ? `<div class="cpTotal"><span>Forfaits (maquette, poncifs, déplacement)</span><b>${euros(forfaits)}</b></div>` : ''}
    <div class="cpTotal" style="border-top:1px solid var(--line);margin-top:4px;padding-top:5px"><span>Estimatif global</span><b>${euros(reference)}</b></div>
    <div class="cpTotal"><span>Articles du catalogue posés</span><b>${euros(compare)}</b></div>
    <div class="cpTotal"><span>${Math.abs(reste)<0.005?'Tout est réparti':(reste>0?'Reste à répartir':'Dépassement par rapport à l\'estimatif')}</span><b>${Math.abs(reste)<0.005?'✓':euros(Math.abs(reste))}</b></div>`}
    ${d.notesClient && d.notesClient.ventile ? `<div class="tiny" style="margin-top:6px">Articles posés automatiquement d'après l'estimatif livré au client — modifiables ci-contre.</div>` : ''}
    ${ventilationPossible(d) ? `<button type="button" class="ghostBtn no-print" style="margin-top:6px" onclick="ventilerEstimatif('${d.id}')">Répartir l'estimatif dans les articles</button>` : (vuClient != null && d.statut==='brouillon' ? `<button type="button" class="ghostBtn no-print" style="margin-top:6px" onclick="refaireVentilation('${d.id}')">Refaire la répartition d'après l'estimatif livré</button>` : '')}
    ${lignes.map(({l,calc})=>`<div class="cpLigne">
      <div class="cpSupport"><span>${escapeHtml(l.support)}${calc.quantite>1?' ×'+calc.quantite:''}${l.matiere?' · '+escapeHtml(l.matiere):''}</span><span>${euros(calc.prixHT)}</span></div>

    <div class="cpDuree"><div class="cpDureeLib">Durée de chantier estimée</div><div class="cpDureeVal">${String(jours).replace('.',',')} j</div><div class="cpDureeNote">${String(heures).replace('.',',')} h de travail, hors pose et déplacement — base du planning Kanban.</div></div>
    ${(()=>{ const prix = totalDevis(d), cout = arrondir(jours * coutEquipeJour(), 2), marge = arrondir(prix - cout, 2), taux = prix > 0 ? marge / prix * 100 : 0;
      return `<div class="cpMarge"><div class="cpDureeLib">Marge estimée</div>
        <div class="cpMargeLigne"><b>${euros(marge)}</b><span>${String(arrondir(taux,1)).replace('.',',')} % du prix HT</span></div>
        <div class="cpDureeNote">Coût équipe ≈ ${euros(cout)} (${String(jours).replace('.',',')} j × ${euros(coutEquipeJour())} / j, coût moyen estimé — à affiner dans Réglages tarifs).</div></div>`; })()}
  </aside>`;

const CLIENT_CHAMP_TO_COLONNE = { nom:'client_nom', telephone:'client_telephone', email:'client_email', adresse:'client_adresse', type:'client_type' };
/* Autocomplétion adresse — API Adresse (gouv.fr), gratuite, sans clé. Best-effort :
   une erreur réseau laisse simplement la saisie manuelle intacte. */
let adresseSuggestionsInterne = [];
let adresseTimerInterne = null;
function chercherAdresseInterne(valeur){
  clearTimeout(adresseTimerInterne);
  if(valeur.trim().length < 4){ adresseSuggestionsInterne = []; renderSuggestionsAdresseInterne(); return; }
  adresseTimerInterne = setTimeout(async ()=>{
    try{
      const r = await fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(valeur)+'&limit=5');
      const data = await r.json();
      adresseSuggestionsInterne = (data.features||[]).map(f=>f.properties.label);
    }catch(e){ adresseSuggestionsInterne = []; }
    renderSuggestionsAdresseInterne();
  }, 300);
}
function choisirAdresseInterne(i){
  const label = adresseSuggestionsInterne[i]; if(!label) return;
  adresseSuggestionsInterne = [];
  updateClient(currentDevisId, 'adresse', label);
}
function renderSuggestionsAdresseInterne(){
  const el = document.getElementById('sugAdresseInterne'); if(!el) return;
  el.innerHTML = adresseSuggestionsInterne.map((label,i)=>`<div class="sugItem" onclick="choisirAdresseInterne(${i})">${escapeHtml(label)}</div>`).join('');
}
async function updateClient(devisId, champ, valeur){
  const d = getDevis(devisId); if(!d) return;
  d.client[champ] = valeur;
  leverFlag(d, 'client.'+champ);
  render();
  const { error } = await sb.from('devis').update({ [CLIENT_CHAMP_TO_COLONNE[champ]]: valeur }).eq('id', devisId);
  if(error) alert("Mise à jour du client échouée côté serveur : "+error.message);
  // Le Kanban Client/Projet garde sa propre fiche client synchronisée (pas de champ "type" là-bas)
  if(champ!=='type'){
    await sb.from('projets').update({ [CLIENT_CHAMP_TO_COLONNE[champ]]: valeur }).eq('devis_id', devisId);
  }
}
