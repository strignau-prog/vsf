function majReglageExposantSurface(valeur){
  reglages.exposantSurface = Number.isFinite(Number(valeur)) && valeur !== '' ? Number(valeur) : 1;
  sauvegarderReglages(); render();
}
function majReglageAppliquerMinimum(coche){
  reglages.appliquerMinimumHT = !!coche;
  sauvegarderReglages(); render();
}
function majReglageTempsParCaractere(valeur){
  reglages.tempsParCaractereH = Number(valeur)||0;
  sauvegarderReglages(); render();
}
function majReglagePrixParKm(valeur){
  reglages.prixParKm = Number(valeur)||0;
  sauvegarderReglages(); render();
}
function majReglageTva(valeur){
  reglages.tvaPct = Number(valeur)||0;
  sauvegarderReglages(); render();
}
function majProduitDerive(index, champ, valeur){
  const p = reglages.produitsDerives[index]; if(!p) return;
  p[champ] = champ==='prixHT' ? (Number(valeur)||0) : valeur;
  sauvegarderReglages(); render();
}
function ajouterProduitDerive(){
  reglages.produitsDerives.push({ cle:'produit_'+Date.now(), label:'Nouveau produit', prixHT:0 });
  sauvegarderReglages(); render();
}
function supprimerProduitDerive(index){
  reglages.produitsDerives.splice(index,1);
  sauvegarderReglages(); render();
}
function majReglageCoef(categorie, cle, valeur){
  reglages[categorie][cle] = Number(valeur)||0;
  if(categorie==='coefMatiere') COEF_MATIERE = reglages.coefMatiere;
  if(categorie==='coefForme') COEF_FORME = reglages.coefForme;
  if(categorie==='coefEffet') COEF_EFFET = reglages.coefEffet;
  sauvegarderReglages(); render();
}
// Modificateurs génériques : chaque réglage ajustable en % OU en prix fixe, au choix du comité.
function majModificateur(cle, champ, valeur){
  const m = reglages.modificateurs.find(x=>x.cle===cle); if(!m) return;
  m[champ] = champ==='valeur' ? (Number(valeur)||0) : valeur;
  MODIFICATEURS = reglages.modificateurs;
  sauvegarderReglages(); render();
}
function majParamEstimation(groupe, cle, valeur){
  if(!reglages[groupe]) reglages[groupe] = {};
  reglages[groupe][cle] = Number(valeur) || 0;
  sauvegarderReglages(); render();
}
function majForfaitProjet(index, qui, valeur){
  const f = reglages.forfaitsProjet[index]; if(!f) return;
  const v = Number(valeur) || 0;
  if(f.prixAffiche && typeof f.prixAffiche === 'object') f.prixAffiche[qui] = v; else f.prixAffiche = v;
  sauvegarderReglages(); render();
}
function majMinimumComplement(valeur){
  reglages.minimumComplementHT = Math.max(0, Number(valeur) || 0);
  sauvegarderReglages(); render();
}
function majFabDrapeau(champ, valeur){
  reglages.fabricationDrapeau = { ...(reglages.fabricationDrapeau || {}), [champ]: Math.max(0, Number(valeur) || 0) };
  sauvegarderReglages(); render();
}
function majCoutEquipe(valeur){
  reglages.coutEquipeJour = Math.max(0, Number(valeur) || 0);
  sauvegarderReglages(); render();
}
function majObjectifMarge(valeur){
  reglages.objectifMargePct = Math.min(95, Math.max(0, Number(valeur) || 0));
  sauvegarderReglages(); render();
}
// Valeurs propres à un devis (jours-personnes retenus, autres coûts), gardées dans ses notes ; vide = on reprend l'estimation automatique.
function majMargeDevis(devisId, champ, valeur){
  const d = getDevis(devisId); if(!d) return;
  const m = Object.assign({}, (d.notesClient && d.notesClient.marge) || {});
  if(valeur === '' || valeur == null) delete m[champ]; else m[champ] = Math.max(0, Number(valeur) || 0);
  updateNotesClient(devisId, 'marge', m);
}
function majFourchette(valeur){
  reglages.fourchettePct = Math.max(0, Number(valeur) || 0);
  sauvegarderReglages(); render();
}
function majReglageHauteurPrix(cle, valeur){
  reglages.hauteurOptions[cle].prixFixeHT = Number(valeur)||0;
  HAUTEUR_OPTIONS = reglages.hauteurOptions;
  sauvegarderReglages(); render();
}
async function reinitialiserReglages(){
  if(!await confirmer("Revenir aux tarifs et modificateurs d'origine ? Tes modifications seront perdues.")) return;
  reglages = {
    base: clone(BASE_DEFAUT), tarifJournalier: clone(TARIF_JOURNALIER_DEFAUT), coefMatiere: clone(COEF_MATIERE_DEFAUT),
    etatSupport: clone(ETAT_SUPPORT_DEFAUT), hauteurOptions: clone(HAUTEUR_OPTIONS_DEFAUT), tailleLettres: clone(TAILLE_LETTRES_DEFAUT),
    coefForme: clone(COEF_FORME_DEFAUT), coefEffet: clone(COEF_EFFET_DEFAUT), modificateurs: clone(MODIFICATEURS_DEFAUT),
    heuresParJour: 7, rendementM2ParLitre: 10, remiseParticulierPct: 15, exposantSurface: 1, appliquerMinimumHT: true,
    tempsParCaractereH: 0.05, prixParKm: 0.60, tvaPct: 20, produitsDerives: [ { cle:'carte_visite', label:'Carte de visite assortie au style', prixHT:80 }, { cle:'mini_charte', label:'Mini-charte graphique (couleurs, typo)', prixHT:250 }, { cle:'goodies', label:'Petits goodies (autocollants, etc.)', prixHT:150 } ],
    ...parametresEstimation(null),
  };
  BASE = reglages.base; TARIF_JOURNALIER = reglages.tarifJournalier; COEF_MATIERE = reglages.coefMatiere;
  ETAT_SUPPORT = reglages.etatSupport; HAUTEUR_OPTIONS = reglages.hauteurOptions; TAILLE_LETTRES = reglages.tailleLettres;
  COEF_FORME = reglages.coefForme; COEF_EFFET = reglages.coefEffet; MODIFICATEURS = reglages.modificateurs;
  sauvegarderReglages(); render();
}

function renderTableauCoef(titre, categorie, map){
  return `
  <div class="section">
    <div class="treeTitle" style="font-size:17px">${escapeHtml(titre)}</div>
    <table class="table" style="width:100%;border-collapse:collapse">
      ${Object.keys(map).map(cle=>`
      <tr>
        <td style="padding:5px 8px 5px 0;font-size:14.5px">${escapeHtml(cle)}</td>
        <td style="padding:5px 0;width:110px"><input class="input" type="number" step="0.01" value="${map[cle]}" onchange="majReglageCoef('${categorie}','${cle.replace(/'/g,"\\'")}', this.value)"></td>
      </tr>`).join('')}
    </table>
  </div>`;
}

      ${renderTableauCoef('Coef. matière', 'coefMatiere', COEF_MATIERE)}
      ${renderTableauCoef('Coef. forme (style)', 'coefForme', COEF_FORME)}
      ${renderTableauCoef('Coef. effet', 'coefEffet', COEF_EFFET)}
    </div>

    ${renderCatalogueMeg()}
  </div>`;
}

function megGroupesParRubrique(){
  // Préserve l'ordre transmis (colonne ordre), pas l'ordre alphabétique — groupe par
  // rubrique en gardant l'ordre de première apparition.
  const rubriques = [];
  const parRubrique = {};
  for(const m of MEG_CATALOGUE){
    if(!parRubrique[m.rubrique]){ parRubrique[m.rubrique] = []; rubriques.push(m.rubrique); }
    parRubrique[m.rubrique].push(m);
  }
  return rubriques.map(rub=>({ rubrique:rub, articles:parRubrique[rub] }));
}
function renderCatalogueMeg(){
  return `
  <div class="section" style="margin-top:10px">
    <div class="treeTitle" style="font-size:18px">Catalogue MEG — modifiable</div>
    <div class="tiny muted" style="margin-bottom:10px">Le vrai catalogue tarifaire du fournisseur, dans l'ordre transmis — modifiable ici, et proposé automatiquement dans le sélecteur "Option (catalogue)" de chaque devis.</div>
    ${megGroupesParRubrique().map(g=>`
      <div style="margin-bottom:14px">
        <div style="font-weight:700;font-size:14px;margin-bottom:4px">${escapeHtml(g.rubrique)}</div>
        <table class="table" style="width:100%;border-collapse:collapse">
          ${g.articles.map(m=>`
          <tr>
            <td style="padding:3px 6px 3px 0;width:100px"><input class="input" value="${escapeHtml(m.code)}" onchange="majMegArticle('${m.id}','code', this.value)"></td>
            <td style="padding:3px 6px 3px 0"><input class="input" value="${escapeHtml(m.article)}" onchange="majMegArticle('${m.id}','article', this.value)"></td>
            <td style="padding:3px 6px 3px 0;width:110px"><input class="input" type="number" step="0.01" value="${m.prixHT??''}" onchange="majMegArticle('${m.id}','prixHT', this.value)"></td>
            <td style="padding:3px 6px 3px 0;width:90px"><input class="input" value="${escapeHtml(m.unite)}" onchange="majMegArticle('${m.id}','unite', this.value)"></td>
            <td style="padding:3px 0;width:30px"><button class="ghostBtn tiny" onclick="supprimerMegArticle('${m.id}')">✕</button></td>
          </tr>`).join('')}
        </table>
        <button class="ghostBtn tiny" style="margin-top:4px" onclick="ajouterMegArticle('${g.rubrique.replace(/'/g,"\\'")}')">+ Article dans « ${escapeHtml(g.rubrique)} »</button>
      </div>`).join('')}
  </div>`;
}

function render(){
  { const dc = getDevis(currentDevisId); if(!vueReglages && (hydratationPossible(dc) || ventilationPossible(dc))) setTimeout(()=>preparerDevisDuSite(currentDevisId), 0); }
  document.querySelector('.app').innerHTML = `
  <nav class="topnav">
    ${navAtelierHtml(ESTABLISHMENT_ID, { actif:'atelier' })}
  </nav>
  ${ETABLISSEMENT && ETABLISSEMENT.logo_data_url ? `<div class="printEntete"><img src="${ETABLISSEMENT.logo_data_url}"></div>` : ''}
  ${ETABLISSEMENT && ETABLISSEMENT.pied_de_page_devis ? `<div class="printPied">${escapeHtml(ETABLISSEMENT.pied_de_page_devis)}</div>` : ''}
  <div class="topbar">
    <div class="brand">DEVIS<small>Atelier — usage interne</small></div>
    <div></div>
    <div class="toolbar" style="margin:0">
      <button class="${vueReglages?'actionBtn':'ghostBtn'}" onclick="vueReglages=!vueReglages;render()">${vueReglages?'← Retour aux devis':'Réglages tarifs'}</button>
    </div>
  </div>
  ${vueReglages ? `<div class="main" style="grid-template-columns:1fr"><div class="editorPane">${renderReglages()}</div></div>` : `
  <div class="main">
    <div class="listPane">
      <button class="actionBtn" style="width:100%;margin-bottom:14px" onclick="nouveauDevis()">+ Nouveau devis</button>
      <div>
        ${store.devis.map(d => `<div class="listItem ${d.id===currentDevisId?'active':''}" onclick="currentDevisId='${d.id}';render()">
          ${d.numero}<br><span class="num">${d.nomProjet?escapeHtml(d.nomProjet)+' — ':''}${escapeHtml(d.client.nom||'Sans nom')} · ${euros(totalDevis(d))}</span>
        </div>`).join('') || '<div class="tiny muted">Aucun devis pour l’instant.</div>'}
      </div>
    </div>
    <div class="editorPane">${renderEditor(getDevis(currentDevisId))}</div>
  </div>`}
  ${intake.ouvert ? renderAccueilBesoin() : ''}`;
}

async function initApp(){
  document.querySelector('.app').innerHTML = `<div style="padding:24px" class="tiny muted">Chargement…</div>`;
  try{
    const { data:{ session }, error } = await sb.auth.getSession();
    if(error) throw error;
    if(!session){ location.replace('federation-accueil.html'); return; }
    const estId = getCurrentEstId();
    if(!estId){ location.replace('federation-accueil.html'); return; }
    const { data: membre, error: e1 } = await sb.from('members').select('id').eq('user_id', session.user.id).eq('establishment_id', estId).maybeSingle();
    if(e1) throw e1;
    if(!membre){ location.replace('federation-accueil.html'); return; }
    ESTABLISHMENT_ID = estId;
    const { data: est } = await sb.from('establishments').select('logo_data_url,pied_de_page_devis,adresse,coordonnees_bancaires').eq('id', estId).maybeSingle();
    ETABLISSEMENT = est || null;
    await chargerMegCatalogue();
    reglages = await chargerReglages(estId);
    BASE = reglages.base; TARIF_JOURNALIER = reglages.tarifJournalier; COEF_MATIERE = reglages.coefMatiere;
    ETAT_SUPPORT = reglages.etatSupport; HAUTEUR_OPTIONS = reglages.hauteurOptions; TAILLE_LETTRES = reglages.tailleLettres;
    COEF_FORME = reglages.coefForme; COEF_EFFET = reglages.coefEffet; MODIFICATEURS = reglages.modificateurs;
    store = await chargerStore(estId);
    const devisDemande = new URLSearchParams(window.location.search).get('devis');
    currentDevisId = (devisDemande && store.devis.some(d=>d.id===devisDemande)) ? devisDemande : (store.devis[0]?.id || null);
    render();
  }catch(e){
    console.error(e);
    document.querySelector('.app').innerHTML = `<div class="errBox">Impossible de charger le devis : ${escapeHtml(e.message||String(e))}\n\nRecharge la page.</div>`;
  }
}
initApp();
</script>
<script src="therese-widget.js"></script>
