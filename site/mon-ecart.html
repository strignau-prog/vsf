<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Mon écart — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<link rel="stylesheet" href="vsf-nav.css">
<style>
  .wrap.large{max-width:760px}
  .chiffres{display:flex;flex-wrap:wrap;gap:6px 26px;margin:14px 0 6px}
  .chiffres b{display:block;font-size:34px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
  .chiffres span{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--cap)}
  .situation{padding:22px 0 14px;border-top:1px solid var(--line)}
  .situation h3{font-size:20px;font-weight:900;letter-spacing:-.01em;margin:0 0 4px}
  .palier{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
  .origine{font-size:13px;color:var(--cap);margin-left:8px}
  .grace{margin:8px 0 0;padding-left:18px;font-size:15px}
  .grace li{margin:3px 0}
  .rien{font-size:15px;color:var(--cap);margin:8px 0 0}
  .choix{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
  .choix button{min-height:44px;border:1.5px solid #111;background:#fff;color:#111;font:inherit;font-size:13px;font-weight:500;padding:8px 12px;cursor:pointer}
  .choix button[aria-pressed="true"]{background:#111;color:#fff;font-weight:800}
  .choix button:focus-visible{outline:2px solid #111;outline-offset:3px}
  details.detail{margin-top:12px}
  details.detail summary{min-height:44px;display:flex;align-items:center;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:var(--cap)}
  details.detail p{font-size:15px;margin:6px 0}
  .legende-paliers{margin:18px 0 6px;padding:14px 16px;background:var(--panel)}
  .legende-paliers p{margin:6px 0;font-size:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
</head>
<body>
<main class="wrap large" id="app"><p class="legende">Chargement…</p></main>
<footer class="wrap"><p class="legende">Une question : <a href="mailto:contact@vraisavoirfaire.fr">contact@vraisavoirfaire.fr</a></p></footer>
<script src="vsf-nav.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var NOM = new URLSearchParams(location.search).get('metier') || 'Peintre en lettres';
var CLE_CARTE = '12mars_mon_passage_v1';     // la carte de départ saisie dans « Mon point de départ »
var CLE_ECART = 'vsf_ecart_v1';              // ce que la personne a confirmé ici
var PALIERS = [
  ['p', 'Déjà pratiqué', 'Vous l’avez déjà fait, en situation.'],
  ['t', 'Transférable', 'Vous avez pratiqué quelque chose de proche : le geste se transpose.'],
  ['k', 'Connu (diplôme)', 'Vous le connaissez par un diplôme ou un savoir, pas encore par la pratique.'],
  ['d', 'À découvrir', 'Rien dans votre parcours ne s’en approche pour l’instant. C’est le cœur de votre formation.']
];
var NOMS = { p: 'Déjà pratiqué', t: 'Transférable', k: 'Connu (diplôme)', d: 'À découvrir' };

function lire(cle) { try { return JSON.parse(localStorage.getItem(cle) || 'null'); } catch (e) { return null; } }
function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) { /* page rendue sans mémoire */ } }

/* ───── texte : mots significatifs (racine de 6 lettres, sans accents) ───── */
var VIDES = ('client clients clientele relation relations produit produits activite activites travail travaux matiere matieres espace besoin besoins service services gestion suivi mettre mise place organiser organisation assurer realiser permettre definir situation situations avant ensuite dans pour avec sans sous entre cette ainsi leur leurs elle elles ils nous vous mais donc plus tres tout tous toute toutes afin lors comme chez fait faire etre avoir soit selon vers apres avant depuis autre autres aussi encore peut peuvent doit doivent sont ses son sur par une des les aux est qui que quoi dont ceux celui celle quand').split(' ');
function mots(t) {
  var s = String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/);
  var out = {};
  s.forEach(function (m) { if (m.length >= 6 && VIDES.indexOf(m) < 0) out[m.slice(0, 6)] = m; });
  return out;
}
function communs(a, b) { var n = []; for (var k in a) if (b[k]) n.push(a[k]); return n; }

/* ───── la fiche : les cinq situations (tableau de la rubrique « Le métier au quotidien ») ───── */
function lireSituations(md) {
  var lignes = String(md || '').split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.charAt(0) === '|'; });
  if (lignes.length < 3) return [];
  var cell = function (x) { return x.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.replace(/\*\*|\*/g, '').trim(); }); };
  return lignes.slice(2).map(cell).filter(function (c) { return c.length >= 4 && /^\d+\./.test(c[0]); }).map(function (c) {
    return { nom: c[0].replace(/^\d+\.\s*/, ''), etapes: c[1], decisions: c[2], critere: c[3] };
  });
}

/* ───── la carte de départ : ce que la personne a déclaré ───── */
function lireCarte(e) {
  if (!e || !e.experiences || !e.experiences.length) return null;
  var pratique = [], savoirs = [], diplomes = [];
  e.experiences.forEach(function (x) {
    ((x.comp || {})['savoir-faire'] || []).forEach(function (c) { if (c.coche) pratique.push({ t: c.libelle, o: x.choix.libelleMetier }); });
    ((x.comp || {})['savoir'] || []).forEach(function (c) { if (c.coche) savoirs.push({ t: c.libelle, o: x.choix.libelleMetier }); });
  });
  (e.autres || []).forEach(function (a) { pratique.push({ t: a.nom, o: 'avec preuve : ' + a.preuve }); });
  (e.diplomes || []).forEach(function (d) { if (d.coche) diplomes.push({ t: d.libelle, o: 'diplôme' }); });
  return { pratique: pratique, savoirs: savoirs, diplomes: diplomes };
}

/* ───── suggestion du palier, avec ce qui la justifie (toujours corrigeable par la personne) ─────
   Prudence : un mot courant (client, produit, demande…) ne prouve rien. Seuls comptent les mots propres à UNE situation
   (qui n'apparaissent dans aucune des quatre autres). « Déjà pratiqué » demande deux mots propres, « Transférable » un seul.
   Les mots qui ont déclenché la suggestion sont montrés : la personne voit pourquoi, et peut la corriger. */
function preparerSituations(sits) {
  sits.forEach(function (s) { s.cible = mots([s.nom, s.etapes, s.decisions, s.critere].join(' ')); });
  sits.forEach(function (s) {
    s.propres = {};
    for (var k in s.cible) {
      var ailleurs = sits.some(function (o) { return o !== s && o.cible[k]; });
      if (!ailleurs) s.propres[k] = s.cible[k];
    }
  });
}
function suggerer(sit, carte) {
  var forts = [], faibles = [], connus = [];
  carte.pratique.forEach(function (p) {
    var c = communs(mots(p.t), sit.propres);
    var x = { t: p.t, o: p.o, m: c };
    if (c.length >= 2) forts.push(x); else if (c.length === 1) faibles.push(x);
  });
  carte.savoirs.concat(carte.diplomes).forEach(function (p) {
    var c = communs(mots(p.t), sit.propres);
    if (c.length >= 1) connus.push({ t: p.t, o: p.o, m: c });
  });
  if (forts.length) return { palier: 'p', preuves: forts.slice(0, 3) };
  if (faibles.length) return { palier: 't', preuves: faibles.slice(0, 3) };
  if (connus.length) return { palier: 'k', preuves: connus.slice(0, 3) };
  return { palier: 'd', preuves: [] };
}
var ETAT = { situations: [], carte: null, choix: lire(CLE_ECART) || {} };

function dessiner() {
  var sits = ETAT.situations;
  var cnt = { p: 0, t: 0, k: 0, d: 0 };
  var lignes = sits.map(function (s, i) {
    var sug = s.sug, confirme = ETAT.choix[s.nom], p = confirme || sug.palier;
    cnt[p]++;
    return '<div class="situation"><h3>' + E((i + 1) + '. ' + s.nom) + '</h3>' +
      '<span class="palier">' + NOMS[p] + '</span><span class="origine">' + (confirme ? 'confirmé par vous' : 'suggéré d’après votre carte') + '</span>' +
      (sug.preuves.length && p === sug.palier ? '<ul class="grace">' + sug.preuves.map(function (x) { return '<li>' + E(x.t) + ' <span class="origine">(' + E(x.o) + (x.m && x.m.length ? ' · mots communs : ' + E(x.m.join(', ')) : '') + ')</span></li>'; }).join('') + '</ul>'
        : (p === 'd' ? '<p class="rien">Rien dans votre carte de départ ne s’en approche pour l’instant.</p>' : '')) +
      '<div class="choix" role="group" aria-label="Votre palier pour cette situation">' + PALIERS.map(function (q) {
        return '<button type="button" data-s="' + E(s.nom) + '" data-p="' + q[0] + '" aria-pressed="' + (q[0] === p) + '">' + q[1] + '</button>';
      }).join('') + '</div>' +
      '<details class="detail"><summary>Ce que demande cette situation</summary>' +
      '<p><b>Les étapes.</b> ' + E(s.etapes) + '</p><p><b>Les décisions.</b> ' + E(s.decisions) + '</p><p><b>Quand c’est réussi.</b> ' + E(s.critere) + '</p></details></div>';
  });
  $('app').innerHTML =
    '<p class="etiquette">Mon écart</p>' +
    '<h1>Où j’en suis, situation par situation.</h1>' +
    '<p class="legende">Pour le métier de ' + E(NOM) + '. Quatre paliers, jamais une note : un palier dit seulement ce que vous avez déjà fait et ce qu’il reste à apprendre. Les paliers sont suggérés à partir de votre carte de départ : c’est vous qui décidez, un clic pour les changer.</p>' +
    '<div class="chiffres">' + PALIERS.map(function (q) { return '<div><b>' + cnt[q[0]] + '</b><span>' + q[1] + '</span></div>'; }).join('') + '</div>' +
    '<details class="detail"><summary>Ce que veulent dire les quatre paliers</summary><div class="legende-paliers">' +
    PALIERS.map(function (q) { return '<p><b>' + q[1] + '.</b> ' + q[2] + '</p>'; }).join('') + '</div></details>' +
    lignes.join('') +
    '<p class="legende" style="margin-top:28px">Votre écart est gardé : vous pouvez le modifier à tout moment.</p>';
  document.querySelectorAll('.choix button').forEach(function (b) {
    b.addEventListener('click', function () { ETAT.choix[b.getAttribute('data-s')] = b.getAttribute('data-p'); ecrire(CLE_ECART, ETAT.choix); VSF.parcours.ecrire('ecart', ETAT.choix); dessiner(); });
  });
}

async function demarrer() {
  var pers = await VSF.exigerPersonneVerifiee();
  if (!pers) return;
  var base = await VSF.parcours.lire();
  var local = lire(CLE_CARTE), e = local;
  if (base && base.carte && base.carte.experiences && base.carte.experiences.length && (base.carte._maj || 0) > ((local && local._maj) || 0)) e = base.carte;
  if (base && base.ecart) ETAT.choix = Object.assign({}, ETAT.choix, base.ecart);
  var carte = lireCarte(e);
  if (!carte) {
    return $('app').innerHTML = '<p class="etiquette">Mon écart</p><h1>D’abord, votre point de départ.</h1>' +
      '<p class="message">Pour mesurer votre écart, il faut savoir d’où vous partez. Cela prend quelques minutes.</p>' +
      '<a class="bouton" href="mon-passage.html">Commencer mon point de départ</a>';
  }
  var f = await VSF.sb.from('postes_apprenance').select('id,nom').eq('nom', NOM).is('proprietaire_id', null).maybeSingle();
  var r = (f.data && !f.error) ? await VSF.sb.from('fiche_vsf_rubriques').select('code,contenu_md').eq('poste_id', f.data.id).eq('code', 'quotidien').maybeSingle() : null;
  var sits = r && r.data ? lireSituations(r.data.contenu_md) : [];
  if (!sits.length) {
    return $('app').innerHTML = '<p class="etiquette">Mon écart</p><h1>Pas encore de fiche.</h1>' +
      '<p class="message">La fiche « ' + E(NOM) + ' » n’est pas encore publiée : l’écart ne peut pas être calculé.</p><a class="bouton" href="constellation-des-gestes.html">Choisir un autre métier</a>';
  }
  preparerSituations(sits); sits.forEach(function (s) { s.sug = suggerer(s, carte); });
  ETAT.situations = sits; ETAT.carte = carte;
  dessiner();
}
demarrer();
</script>
<script src="vsf-suite.js"></script><script src="vsf-pop.js"></script></body>
</html>
