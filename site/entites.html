<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Entités — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<link rel="stylesheet" href="vsf-largeur.css">
<style>
  .onglets{display:flex;flex-wrap:wrap;gap:0 22px;border-bottom:1px solid var(--line);margin:18px 0 6px}
  .onglets button{min-height:44px;background:none;border:0;border-bottom:3px solid transparent;padding:8px 0;font:inherit;font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--cap);cursor:pointer}
  .onglets button[aria-selected="true"]{color:#111;font-weight:900;border-bottom-color:#111}
  .onglets button:focus-visible{outline:2px solid #111;outline-offset:3px}
  .collectif{margin-top:30px;border-top:1.5px solid #111;padding-top:8px}
  .collectif h2{margin:14px 0 2px}
  .chiffres{display:flex;flex-wrap:wrap;gap:6px 26px;margin:12px 0 4px}
  .chiffres b{display:block;font-size:30px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
  .chiffres span{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--cap)}
  .metier{padding:16px 0;border-top:1px solid var(--line)}
  .metier h3{font-size:20px;font-weight:900;margin:0 0 4px}
  .metier .etat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid #111;padding:2px 7px;margin-right:8px}
  .metier .niveaux{font-size:14px;color:var(--cap)}
  .actions-ligne{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:6px}
  .socle{margin-top:34px;padding:18px;background:var(--panel)}
  .socle p{margin:8px 0}
  .bientot{padding:24px 0;color:var(--cap)}
  .ligne-suivi{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .ligne-suivi .qui b{display:block;font-weight:800;overflow-wrap:anywhere}
  .ligne-suivi .qui span{font-size:14px;color:var(--cap)}
  .etat-mini{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--cap);white-space:nowrap}
  .ajout{margin-top:24px;padding:16px 18px;background:var(--panel)}
  .ajout select.champ{width:100%;max-width:640px;min-height:44px;border:0;border-bottom:1.5px solid #111;background:transparent;font:inherit;font-size:17px;padding:10px 0}
  .ajout input{max-width:640px}
  .arbre{margin:18px 0}
  details.ent{border-top:1px solid var(--line);padding:6px 0}
  details.ent summary{cursor:pointer;min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  details.ent ul{margin:4px 0 10px 18px;padding:0}
  .resume{font-size:14px;color:var(--cap)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip-col{border:1.5px solid #111;padding:2px 8px;font-size:13px}
  .lien-mini{background:none;border:0;padding:0 2px;font:inherit;font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;color:var(--cap)}
  .entreprise select{min-height:44px;border:0;border-bottom:1.5px solid #111;background:transparent;font:inherit;font-size:15px;max-width:220px}
  @media (max-width:640px){.ligne-suivi.entreprise{flex-direction:column;align-items:flex-start}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
</head>
<body>
<header class="haut">
  <a class="marque" href="./">VRAI-SAVOIRFAIRE</a>
  <a class="bouton discret" href="admin.html">Tableau de bord</a>
</header>
<main class="wrap" id="app"><p class="legende">Chargement…</p></main>
<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb;
var GUIDE = 'https://fastidious-kringle-8ac4c1.netlify.app/guide-production-mindmap.html';
var jour = function (d) { try { return new Date(d).toLocaleDateString('fr-FR'); } catch (e) { return ''; } };
var STATUTS = { public_referential: 'Référentiel public', federated_domain: 'Domaine fédéré', validated_by_practitioners: 'Validé par des praticiens', pilot: 'Pilote', documented: 'Documenté', candidate: 'Candidat', archived: 'Archivé' };
var S = { plateforme: false, referentiels: false, super: false, moi: null, onglet: 'collectifs' };

async function compter(table, filtre) {
  var q = sb.from(table).select('*', { count: 'exact', head: true });
  Object.keys(filtre).forEach(function (k) { q = filtre[k] && filtre[k].like ? q.like(k, filtre[k].like) : q.eq(k, filtre[k]); });
  var r = await q;
  return r.error ? null : (r.count || 0);
}

function ongletsHtml() {
  var liste = [['collectifs', 'Collectifs'], ['entreprises', 'Entreprises'], ['ambassadeurs', 'Ambassadeurs métier'], ['personnes', 'Personnes'], ['suivi', 'Suivi']];
  return '<div class="onglets" role="tablist">' + liste.map(function (o) {
    return '<button type="button" role="tab" data-o="' + o[0] + '" aria-selected="' + (S.onglet === o[0]) + '">' + o[1] + '</button>';
  }).join('') + '</div>';
}

async function vueCollectifs() {
  await chargerArbre();
  var f =await sb.from('federations').select('id,name,created_at').order('created_at');
  if (f.error) return '<p class="message">Impossible de lire les collectifs pour le moment.</p>';
  var html = '';
  for (var i = 0; i < (f.data || []).length; i++) {
    var c = f.data[i];
    var m = await sb.from('metiers').select('id,nom,statut,libelles_niveaux,proprietaire_id').eq('federation_id', c.id).is('proprietaire_id', null).order('ordre');
    var metiers = '';
    for (var j = 0; j < (m.data || []).length; j++) {
      var x = m.data[j];
      var pr = await sb.from('referentiel_processus').select('nom').eq('metier_id', x.id);
      var noms = (pr.data || []).map(function (p) { return p.nom; });
      var sous = noms.length ? await sb.from('referentiel_sous_processus').select('*', { count: 'exact', head: true }).in('processus_nom', noms) : { count: 0 };
      var nMod = await compter('modules_apprentissage', { metier_id: x.id });
      var niv = Array.isArray(x.libelles_niveaux) ? x.libelles_niveaux.join(' · ') : '';
      metiers += '<div class="metier"><h3>' + E(x.nom) + '</h3><p><span class="etat">' + E(STATUTS[x.statut] || x.statut) + '</span><span class="niveaux">' + E(niv) + '</span></p>' +
        '<div class="chiffres"><div><b>' + noms.length + '</b><span>Processus</span></div><div><b>' + (sous.count == null ? '—' : sous.count) + '</b><span>Sous-processus</span></div>' +
        '<div><b>' + (nMod == null ? '—' : nMod) + '</b><span>Modules</span></div></div>' +
        (S.referentiels ? '<div class="actions-ligne"><a class="bouton" href="' + E(GUIDE) + '?guide=travailler" target="_blank" rel="noopener">Éditer « comment on travaille »</a>' +
          '<a class="bouton" href="' + E(GUIDE) + '?guide=peindre" target="_blank" rel="noopener">Éditer « comment on peint »</a></div>' : '') + '</div>';
    }
    var nSit = await compter('referentiel_situations', { federation_id: c.id, niveau: { like: 'Niveau 1%' } });
    html += '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Collectif</p><h2>' + E(c.name) + '</h2>' + (S.super ? '<p><button class="bouton petit discret" data-renommer="' + E(c.id) + '" data-nom="' + E(c.name) + '">Renommer ce collectif</button></p><p class="message" data-msg-renommer="' + E(c.id) + '" role="alert"></p>' : '') +
      '<p class="legende">Créé le ' + E(jour(c.created_at)) + '. Son référentiel métier collectif (le métier global, et non un poste de travail) :</p>' +
      '<div class="chiffres"><div><b>' + (nSit == null ? '—' : nSit) + '</b><span>Situations du collectif</span></div></div>' +
      '<p class="legende">Les situations appartiennent au collectif ; leur rattachement à un métier précis est à compléter.</p>' +
      (S.plateforme ? arbreHtml(c.id) : '') +
      (metiers || '<p class="legende">Aucun référentiel métier collectif pour le moment.</p>') + '</section>';
  }
  html += '<section class="socle"><p class="etiquette" style="margin-top:0">Le socle Skolantreuz « comment on travaille »</p>' +
    '<p>Un seul exemplaire de référence, partagé par tous les collectifs et toutes les entreprises, mis à jour automatiquement. Il est rangé selon les 4 repères du manifeste : <b>ce qu’on fait</b>, <b>le plaisir à le faire</b>, <b>le but</b>, <b>grandir avec le collectif</b>.</p>' +
    '<p class="legende">En préparation. Le « Guide 1 » actuel (Pilotage, Production, Support) doit d’abord être rangé selon ces 4 repères avant d’être migré en socle.</p></section>';
  return html || '<p class="legende">Aucun collectif.</p>';
}

/* ───── Suivi : l'équipe Skolantreuz (comptes d'administration) et le journal des actions ───── */
var ROLES = { super: 'Super administrateur', admin: 'Administrateur de la plateforme', referentiels: 'Administrateur de référentiels' };
var AIDE_ROLES = { super: 'tout : plateforme et référentiels', admin: 'comptes, offres, reversements, CGV (pas les référentiels)', referentiels: 'référentiels des collectifs (ni les comptes ni les commandes)' };
function messageErreurRpc(e) {
  var m = String((e && e.message) || e || '');
  if (/VSF07/.test(m + (e && e.code))) return 'Cette action est réservée au super administrateur.';
  if (/VSF08/.test(m + (e && e.code))) return m.replace(/^.*?:\s*/, '');
  return 'Impossible d’enregistrer pour le moment. Réessayez dans un instant.';
}
function dire(id, texte) { var m = $(id); if (m) { m.textContent = texte || ''; if (texte && m.scrollIntoView) m.scrollIntoView({ block: 'center' }); } }

async function vueSuivi() {
  if (!S.super) return '<div class="bientot"><p class="etiquette" style="margin-top:0">Suivi</p><p>Le suivi des comptes d’administration et le journal des actions sont réservés au super administrateur.</p></div>';
  var eq = await sb.rpc('vsf_equipe');
  var jr = await sb.from('vsf_journal').select('cree_le,auteur_email,action,cible,detail').order('cree_le', { ascending: false }).limit(30);
  var QUI = { equipe_definir: 'a donné un rôle à', equipe_retirer: 'a retiré l’accès de', collectif_renommer: 'a renommé le collectif' };
  var lignes = (eq.data || []).map(function (x) {
    return '<div class="ligne-suivi"><div class="qui"><b>' + E(x.email) + '</b><span>' + E(ROLES[x.role] || x.role) + ' · ' + E(AIDE_ROLES[x.role] || '') + '</span></div>' +
      '<div class="act">' + (x.user_id === S.moi ? '<span class="etat-mini">C’est vous</span>' : '<button class="bouton petit discret" data-retirer="' + E(x.user_id) + '">Retirer</button>') + '</div></div>';
  }).join('');
  var journal = (jr.data || []).map(function (x) {
    var d = x.detail || {};
    var texte = (QUI[x.action] || x.action) + ' ' + E(x.cible || '') + (d.apres ? ' → ' + E(d.apres) : '') + (d.role ? ' (' + E(ROLES[d.role] || d.role) + ')' : '');
    return '<div class="ligne-suivi"><div class="qui"><b>' + E(x.auteur_email || '—') + '</b><span>' + texte + '</span></div><div class="act"><span class="etat-mini">' + E(jour(x.cree_le)) + '</span></div></div>';
  }).join('');
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Équipe Skolantreuz</p><h2>Qui a accès à l’administration</h2>' +
    '<p class="legende">Chaque personne doit déjà avoir un compte (s’être connectée une fois sur le site). Les rôles sont séparés : un administrateur de référentiels ne voit ni les comptes ni les commandes.</p>' +
    (eq.error ? '<p class="message">' + E(messageErreurRpc(eq.error)) + '</p>' : lignes) +
    '<div class="ajout"><label class="champ" for="eEmail">Ajouter ou changer un rôle (adresse e-mail)</label><input id="eEmail" type="email" placeholder="prenom@exemple.fr" autocomplete="off">' +
    '<label class="champ" for="eRole">Rôle</label><select id="eRole" class="champ"><option value="referentiels">Administrateur de référentiels</option><option value="admin">Administrateur de la plateforme</option><option value="super">Super administrateur</option></select>' +
    '<p class="message" id="msgEquipe" role="alert"></p><button class="bouton" id="eAjouter">Enregistrer ce rôle</button></div></section>' +
    '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Journal</p><h2>Qui a fait quoi</h2>' +
    (journal || '<p class="legende">Aucune action enregistrée pour le moment.</p>') + '</section>';
}
function brancherSuivi() {
  document.querySelectorAll('[data-renommer]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.getAttribute('data-renommer'), zone = b.parentNode, memoire = zone.innerHTML;
      zone.innerHTML = '<input type="text" id="nomCollectif" value="' + E(b.getAttribute('data-nom')) + '" aria-label="Nouveau nom du collectif" style="max-width:640px"> ';
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'bouton petit'; ok.textContent = 'Enregistrer';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Annuler';
      ok.onclick = async function () {
        var r = await sb.rpc('vsf_collectif_renommer', { p_id: id, p_nom: $('nomCollectif').value });
        if (r.error) { var m = document.querySelector('[data-msg-renommer="' + id + '"]'); if (m) m.textContent = messageErreurRpc(r.error); return; }
        dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherSuivi(); };
      zone.appendChild(ok); zone.appendChild(non); $('nomCollectif').focus();
    });
  });
  var a = $('eAjouter');
  if (a) a.addEventListener('click', async function () {
    var r = await sb.rpc('vsf_equipe_definir', { p_email: $('eEmail').value, p_role: $('eRole').value });
    if (r.error) return dire('msgEquipe', messageErreurRpc(r.error));
    dessiner();
  });
  document.querySelectorAll('[data-retirer]').forEach(function (b) {
    b.addEventListener('click', function () {
      var zone = b.parentNode, memoire = zone.innerHTML;
      zone.innerHTML = '<span class="etat-mini">Retirer ?</span> ';
      var oui = document.createElement('button'); oui.type = 'button'; oui.className = 'bouton petit'; oui.textContent = 'Oui';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Non';
      oui.onclick = async function () {
        var r = await sb.rpc('vsf_equipe_retirer', { p_user: b.getAttribute('data-retirer') });
        if (r.error) { zone.innerHTML = memoire; return dire('msgEquipe', messageErreurRpc(r.error)); }
        dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherSuivi(); };
      zone.appendChild(oui); zone.appendChild(non);
    });
  });
}

/* ───── Entreprises : les poupées russes (collectif → entreprises → établissements → nombre de membres) ───── */
S.arbre = null; S.collectifs = [];
async function chargerArbre() {
  if (!S.plateforme) return;
  if (!S.arbre) { var a = await sb.rpc('vsf_entites_arbre'); S.arbre = a.error ? [] : (a.data || []); }
}
function arbreHtml(idCollectif) {
  var c = (S.arbre || []).filter(function (x) { return x.id === idCollectif; })[0];
  if (!c) return '';
  if (!c.entreprises.length) return '<p class="legende">Aucune entreprise adhérente pour le moment.</p>';
  return '<div class="arbre"><p class="etiquette">Entreprises adhérentes (' + c.entreprises.length + ')</p>' + c.entreprises.map(function (o) {
    var nm = o.etablissements.reduce(function (a, e) { return a + e.membres; }, 0);
    return '<details class="ent"><summary><b>' + E(o.nom) + '</b> <span class="etat-mini">' + (o.origine ? 'collectif d’origine' : 'adhésion ' + E(o.adhesion)) + '</span>' +
      '<span class="resume">' + o.etablissements.length + ' établissement' + (o.etablissements.length > 1 ? 's' : '') + ' · ' + nm + ' membre' + (nm > 1 ? 's' : '') + '</span></summary>' +
      (o.etablissements.length ? '<ul>' + o.etablissements.map(function (e) { return '<li>' + E(e.nom) + ' <span class="resume">' + e.membres + ' membre' + (e.membres > 1 ? 's' : '') + '</span></li>'; }).join('') + '</ul>' : '<p class="legende">Aucun établissement.</p>') +
      '</details>';
  }).join('') + '</div>';
}
async function vueEntreprises() {
  if (!S.plateforme) return '<div class="bientot"><p class="etiquette" style="margin-top:0">Entreprises</p><p>La liste des entreprises est réservée à l’administrateur de la plateforme. Un administrateur de référentiels n’y a pas accès.</p></div>';
  var r = await sb.rpc('vsf_entreprises_liste');
  if (r.error) return '<p class="message">Impossible de lire les entreprises : la mise à jour de la base (migration 16) n’est peut-être pas faite.</p>';
  var f = await sb.from('federations').select('id,name').order('created_at'); S.collectifs = f.data || [];
  var liste = r.data || [];
  var corps = liste.map(function (o) {
    var dejaIds = o.collectifs.map(function (c) { return c.id; });
    var dispo = S.collectifs.filter(function (c) { return dejaIds.indexOf(c.id) < 0; });
    return '<div class="ligne-suivi entreprise"><div class="qui"><b>' + E(o.nom) + '</b>' +
      '<span>' + o.etablissements + ' établissement' + (o.etablissements > 1 ? 's' : '') + ' · ' + o.membres + ' membre' + (o.membres > 1 ? 's' : '') + ' · créée le ' + E(jour(o.cree_le)) + '</span>' +
      '<div class="chips">' + o.collectifs.map(function (c) {
        return '<span class="chip-col">' + E(c.nom) + ' · ' + E(c.statut) + (c.id === o.origine ? ' · origine' : ' <button type="button" class="lien-mini" data-retirer-adh="' + E(o.id) + '|' + E(c.id) + '">Retirer</button>') + '</span>';
      }).join('') + '</div></div>' +
      '<div class="act">' + (dispo.length ? '<select id="sel-' + E(o.id) + '" aria-label="Rattacher à un collectif">' + dispo.map(function (c) { return '<option value="' + E(c.id) + '">' + E(c.name) + '</option>'; }).join('') + '</select> <button type="button" class="bouton petit" data-ajouter-adh="' + E(o.id) + '">Rattacher</button>' : '') + '</div></div>';
  }).join('');
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Entreprises</p><h2>' + liste.length + ' entreprise' + (liste.length > 1 ? 's' : '') + '</h2>' +
    '<p class="legende">Pour chaque entreprise : son nom, ses collectifs, le nombre de ses établissements et de ses membres. Jamais le contenu de l’entreprise. Une entreprise peut adhérer à plusieurs collectifs.</p>' +
    '<p class="message" id="msgAdh" role="alert"></p>' + (corps || '<p class="legende">Aucune entreprise.</p>') + '</section>';
}
function brancherEntreprises() {
  document.querySelectorAll('[data-ajouter-adh]').forEach(function (b) {
    b.addEventListener('click', async function () {
      var org = b.getAttribute('data-ajouter-adh'), col = $('sel-' + org).value;
      var r = await sb.rpc('vsf_adhesion_definir', { p_organisation: org, p_collectif: col, p_statut: 'active' });
      if (r.error) return dire('msgAdh', messageErreurRpc(r.error));
      S.arbre = null; dessiner();
    });
  });
  document.querySelectorAll('[data-retirer-adh]').forEach(function (b) {
    b.addEventListener('click', function () {
      var zone = b.parentNode, memoire = zone.innerHTML, ids = b.getAttribute('data-retirer-adh').split('|');
      zone.innerHTML = ' <span class="etat-mini">Retirer ?</span> ';
      var oui = document.createElement('button'); oui.type = 'button'; oui.className = 'lien-mini'; oui.textContent = 'Oui';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'lien-mini'; non.textContent = 'Non';
      oui.onclick = async function () {
        var r = await sb.rpc('vsf_adhesion_definir', { p_organisation: ids[0], p_collectif: ids[1], p_statut: 'retiree' });
        if (r.error) { zone.innerHTML = memoire; brancherEntreprises(); return dire('msgAdh', messageErreurRpc(r.error)); }
        S.arbre = null; dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherEntreprises(); };
      zone.appendChild(oui); zone.appendChild(non);
    });
  });
}

function vueBientot(nom, texte) { return '<div class="bientot"><p class="etiquette" style="margin-top:0">' + E(nom) + '</p><p>' + E(texte) + '</p></div>'; }

async function dessiner() {
  var jeton = S.jeton = (S.jeton || 0) + 1;   // un clic plus récent annule le dessin en cours
  var corps;
  if (S.onglet === 'collectifs') corps = await vueCollectifs();
  else if (S.onglet === 'entreprises') corps = await vueEntreprises();
  else if (S.onglet === 'ambassadeurs') corps = vueBientot('Ambassadeurs métier', 'Ils se gèrent aujourd’hui dans le tableau de bord (validation, offres, reversements). Leur fiche complète arrive ici.');
  else if (S.onglet === 'personnes') corps = vueBientot('Personnes', 'Chiffres seulement : nombre de comptes, vérifiés, suspendus. La liste se trouve dans le tableau de bord de la plateforme. Aucun accès aux parcours.');
  else corps = await vueSuivi();
  if (jeton !== S.jeton) return;
  $('app').innerHTML =
    '<p class="etiquette">' + (S.plateforme ? 'Administrateur de la plateforme' : 'Administrateur de référentiels') + '</p>' +
    '<h1>Entités</h1>' +
    '<p class="legende">Les collectifs, les entreprises et les personnes que Skolantreuz gère. Vous voyez le référentiel et la gestion, jamais les données personnelles des entités.</p>' +
    ongletsHtml() + '<div>' + corps + '</div>';
  brancherSuivi();
  brancherEntreprises();
  document.querySelectorAll('.onglets button').forEach(function (b) {
    b.addEventListener('click', function () { S.onglet = b.getAttribute('data-o'); dessiner(); });
  });
}

async function demarrer() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.replace('connexion.html?suite=' + encodeURIComponent(location.href)); return; }
  var r = await Promise.all([sb.rpc('vsf_est_admin'), sb.rpc('vsf_est_admin_referentiels'), sb.rpc('vsf_est_super')]);
  S.moi = s.data.session.user.id; S.super = r[2].data === true;
  S.plateforme = r[0].data === true; S.referentiels = r[1].data === true;
  if (!S.plateforme && !S.referentiels) {
    return $('app').innerHTML = '<p class="etiquette">Entités</p><h1>Accès réservé.</h1><p class="message">Cette page est réservée à l’équipe de VRAI-SAVOIRFAIRE.</p><a class="bouton" href="./">Retour à l’accueil</a>';
  }
  dessiner();
}
demarrer();
</script>
