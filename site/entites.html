<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Entités — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<link rel="stylesheet" href="vsf-largeur.css">
<style>
  .onglets{display:flex;flex-wrap:wrap;gap:0 22px;border-bottom:1px solid var(--line);margin:18px 0 6px}
  .onglets button{min-height:44px;background:none;border:0;border-bottom:3px solid transparent;padding:8px 0;font:inherit;font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--cap);cursor:pointer}
  .onglets button[aria-selected="true"]{color:#111;font-weight:900;border-bottom-color:#111}
  .onglets button:focus-visible{outline:2px solid #111;outline-offset:3px}
  .collectif{margin-top:30px;border-top:1.5px solid #111;padding-top:8px}
  .collectif h2{margin:14px 0 2px}
  .chiffres{display:flex;flex-wrap:wrap;gap:6px 26px;margin:12px 0 4px}
  .chiffres b{display:block;font-size:30px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
  .chiffres span{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--cap)}
  .metier{padding:16px 0;border-top:1px solid var(--line)}
  .metier h3{font-size:20px;font-weight:900;margin:0 0 4px}
  .metier .etat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid #111;padding:2px 7px;margin-right:8px}
  .metier .niveaux{font-size:14px;color:var(--cap)}
  .actions-ligne{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:6px}
  .socle{margin-top:34px;padding:18px;background:var(--panel)}
  .socle p{margin:8px 0}
  .bientot{padding:24px 0;color:var(--cap)}
  .ligne-suivi{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .ligne-suivi .qui b{display:block;font-weight:800;overflow-wrap:anywhere}
  .ligne-suivi .qui span{font-size:14px;color:var(--cap)}
  .ligne-suivi .qui > span{display:block}
  .etat-mini{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--cap);white-space:nowrap}
  .ajout{margin-top:24px;padding:16px 18px;background:var(--panel)}
  .ajout select.champ{width:100%;max-width:640px;min-height:44px;border:0;border-bottom:1.5px solid #111;background:transparent;font:inherit;font-size:17px;padding:10px 0}
  .ajout input{max-width:640px}
  .arbre-col{list-style:none;margin:10px 0;padding:0}
  .arbre-col ul{list-style:none;margin:0 0 0 22px;padding:0 0 0 14px;border-left:1.5px solid var(--line)}
  .arbre-col li{padding:2px 0}
  .lien-col{background:none;border:0;padding:10px 0;min-height:44px;font:inherit;font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;cursor:pointer;color:#111;text-align:left}
  .fil{font-size:14px;color:var(--cap);margin:8px 0}
  .fil .lien-col{font-size:14px;font-weight:500;padding:4px 0;min-height:0}
  .resume{font-size:14px;color:var(--cap)}
  .gerer{margin-top:6px}
  .ligne-suivi.bloquee .qui b{text-decoration:line-through;text-decoration-thickness:2px}
  .ligne-suivi.bloquee .qui b .etat-mini{text-decoration:none;display:inline-block}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip-col{border:1.5px solid #111;padding:2px 8px;font-size:13px}
  .lien-mini{background:none;border:0;padding:0 2px;font:inherit;font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;color:var(--cap)}
  .entreprise select{min-height:44px;border:0;border-bottom:1.5px solid #111;background:transparent;font:inherit;font-size:15px;max-width:220px}
  @media (max-width:640px){.ligne-suivi.entreprise{flex-direction:column;align-items:flex-start}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
</head>
<body>
<header class="haut">
  <a class="marque" href="./">VRAI-SAVOIRFAIRE</a>
  <a class="bouton discret" href="admin.html">Tableau de bord</a>
</header>
<main class="wrap" id="app"><p class="legende">Chargement…</p></main>
<script>
var $ = function (id) { return document.getElementById(id); };
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var sb = VSF.sb;
var GUIDE = 'https://fastidious-kringle-8ac4c1.netlify.app/guide-production-mindmap.html';
var jour = function (d) { try { return new Date(d).toLocaleDateString('fr-FR'); } catch (e) { return ''; } };
var STATUTS = { public_referential: 'Référentiel public', federated_domain: 'Domaine fédéré', validated_by_practitioners: 'Validé par des praticiens', pilot: 'Pilote', documented: 'Documenté', candidate: 'Candidat', archived: 'Archivé' };
var S = { plateforme: false, referentiels: false, super: false, moi: null, onglet: 'collectifs' };

async function compter(table, filtre) {
  var q = sb.from(table).select('*', { count: 'exact', head: true });
  Object.keys(filtre).forEach(function (k) { q = filtre[k] && filtre[k].like ? q.like(k, filtre[k].like) : q.eq(k, filtre[k]); });
  var r = await q;
  return r.error ? null : (r.count || 0);
}

function ongletsHtml() {
  var liste = [['collectifs', 'Collectifs'], ['entreprises', 'Entreprises'], ['ambassadeurs', 'Ambassadeurs métier'], ['personnes', 'Personnes'], ['suivi', 'Suivi']];
  return '<div class="onglets" role="tablist">' + liste.map(function (o) {
    return '<button type="button" role="tab" data-o="' + o[0] + '" aria-selected="' + (S.onglet === o[0]) + '">' + o[1] + '</button>';
  }).join('') + '</div>';
}

/* ───── Collectifs : l'arbre (fédération nationale → régionales → groupes), la fiche, la création et la modification ───── */
var GENRES = { federation: 'Fédération', groupe: 'Groupe' };
var STATUTS_COL = { actif: 'Actif', en_attente: 'En attente', suspendu: 'Suspendu', archive: 'Archivé' };
S.collectifId = null; S.liste = null;

function pluriel(n, mot) { return n + ' ' + mot + (n > 1 ? 's' : ''); }
function descendants(id) {
  var res = {}; res[id] = true;
  var change = true;
  while (change) {
    change = false;
    (S.liste || []).forEach(function (c) { if (c.parent_id && res[c.parent_id] && !res[c.id]) { res[c.id] = true; change = true; } });
  }
  return res;
}
function arbreCollectifsHtml(liste) {
  var par = {}, ids = {};
  liste.forEach(function (c) { ids[c.id] = true; });
  liste.forEach(function (c) { if (c.parent_id && ids[c.parent_id]) (par[c.parent_id] = par[c.parent_id] || []).push(c); });
  var racines = liste.filter(function (c) { return !c.parent_id || !ids[c.parent_id]; });
  function noeud(c, niveau) {
    var enfants = par[c.id] || [];
    return '<li><button type="button" class="lien-col" data-ouvrir="' + E(c.id) + '">' + E(c.nom) + '</button> ' +
      '<span class="etat-mini">' + E(GENRES[c.genre] || c.genre) + (c.statut !== 'actif' ? ' · ' + E(STATUTS_COL[c.statut] || c.statut) : '') + '</span>' +
      (c.entreprises == null ? '' : ' <span class="resume">' + pluriel(Number(c.entreprises), 'entreprise') + '</span>') +
      (enfants.length && niveau < 10 ? '<ul>' + enfants.map(function (e) { return noeud(e, niveau + 1); }).join('') + '</ul>' : '') + '</li>';
  }
  return '<ul class="arbre-col">' + racines.map(function (c) { return noeud(c, 0); }).join('') + '</ul>';
}
function socleHtml() {
  return '<section class="socle"><p class="etiquette" style="margin-top:0">Le socle Skolantreuz « comment on travaille »</p>' +
    '<p>Un seul exemplaire de référence, partagé par tous les collectifs et toutes les entreprises, mis à jour automatiquement. Il est rangé selon les 4 repères du manifeste : <b>ce qu’on fait</b>, <b>le plaisir à le faire</b>, <b>le but</b>, <b>grandir avec le collectif</b>.</p>' +
    '<p class="legende">En préparation. Le « Guide 1 » actuel (Pilotage, Production, Support) doit d’abord être rangé selon ces 4 repères avant d’être migré en socle.</p></section>';
}
// Le formulaire de création et de modification d'un collectif (pf = préfixe des champs).
function formCollectifHtml(pf, c, parentId) {
  var exclus = c ? descendants(c.id) : {};
  var parents = (S.liste || []).filter(function (x) { return !exclus[x.id]; });
  var parentCourant = c ? c.parent_id : parentId;
  var nomFige = c && !S.super;
  return '<div class="ajout">' +
    '<label class="champ" for="' + pf + 'Nom">Nom</label><input id="' + pf + 'Nom" type="text" maxlength="120" value="' + E(c ? c.nom : '') + '"' + (nomFige ? ' disabled' : '') + ' autocomplete="off">' +
    (nomFige ? '<p class="legende">Seul le super administrateur peut changer le nom.</p>' : '') +
    '<label class="champ" for="' + pf + 'Genre">Genre</label><select id="' + pf + 'Genre" class="champ"><option value="federation"' + (c && c.genre === 'groupe' ? '' : ' selected') + '>Fédération (nationale, régionale…)</option><option value="groupe"' + (c && c.genre === 'groupe' ? ' selected' : '') + '>Groupe (d’entreprises)</option></select>' +
    '<label class="champ" for="' + pf + 'Parent">Rattaché à</label><select id="' + pf + 'Parent" class="champ"><option value="">— aucun (collectif de premier niveau) —</option>' +
      parents.map(function (x) { return '<option value="' + E(x.id) + '"' + (x.id === parentCourant ? ' selected' : '') + '>' + E(x.nom) + '</option>'; }).join('') + '</select>' +
    (c ? '<label class="champ" for="' + pf + 'Statut">Statut</label><select id="' + pf + 'Statut" class="champ">' + Object.keys(STATUTS_COL).map(function (k) { return '<option value="' + k + '"' + (c.statut === k ? ' selected' : '') + '>' + STATUTS_COL[k] + '</option>'; }).join('') + '</select>' : '') +
    '<label class="champ" for="' + pf + 'Zone">Zone (région, ville…)</label><input id="' + pf + 'Zone" type="text" maxlength="120" value="' + E(c ? c.zone : '') + '" autocomplete="off">' +
    '<label class="champ" for="' + pf + 'Site">Site web</label><input id="' + pf + 'Site" type="text" inputmode="url" maxlength="300" placeholder="https://" value="' + E(c ? c.site_web : '') + '" autocomplete="off">' +
    '<label class="champ" for="' + pf + 'Desc">Description</label><textarea id="' + pf + 'Desc" class="champ" rows="4" maxlength="2000" style="width:100%;max-width:640px;font:inherit;font-size:16px;border:1.5px solid #111;padding:8px">' + E(c ? c.description : '') + '</textarea>' +
    '<p class="message" id="' + pf + 'Msg" role="alert"></p>' +
    '<button type="button" class="bouton" id="' + pf + 'Ok">' + (c ? 'Enregistrer la fiche' : 'Créer ce collectif') + '</button> <button type="button" class="bouton discret" id="' + pf + 'Non">Annuler</button></div>';
}
function lireFormCollectif(pf) {
  return { nom: $(pf + 'Nom').value, genre: $(pf + 'Genre').value, parent: $(pf + 'Parent').value || null, statut: $(pf + 'Statut') ? $(pf + 'Statut').value : null,
    zone: $(pf + 'Zone').value, site: $(pf + 'Site').value, description: $(pf + 'Desc').value };
}

async function vueListeCollectifs() {
  var r = await sb.rpc('vsf_collectifs_liste');
  if (r.error) return '<p class="message">Impossible de lire les collectifs : la mise à jour de la base (migration 17) n’est peut-être pas faite.</p>';
  S.liste = r.data || [];
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Collectifs</p><h2>' + pluriel(S.liste.length, 'collectif') + '</h2>' +
    '<p class="legende">Un collectif peut en contenir d’autres (fédération nationale, fédérations régionales, groupes). Les entreprises se rattachent à n’importe quel niveau. Cliquez sur un nom pour ouvrir sa fiche.</p>' +
    arbreCollectifsHtml(S.liste) +
    (S.plateforme ? '<p><button type="button" class="bouton" id="nouveauCollectif">Créer un collectif</button></p><div id="zoneCreation"></div>' : '') + '</section>' + socleHtml();
}

async function vueFiche(id) {
  var r = await sb.rpc('vsf_collectif_fiche', { p_id: id });
  if (r.error || !r.data) { S.collectifId = null; return '<p class="message">Impossible d’ouvrir cette fiche.</p><p><button type="button" class="bouton" data-ouvrir="">Retour aux collectifs</button></p>'; }
  var c = r.data;
  var l = await sb.rpc('vsf_collectifs_liste'); S.liste = l.data || [];
  var autres = [];
  if (S.plateforme) {
    var eo = await sb.rpc('vsf_entreprises_liste');
    var dedans = {}; (c.adherentes || []).forEach(function (a) { dedans[a.id] = true; });
    autres = (eo.data || []).filter(function (o) { return !dedans[o.id]; });
  }
  var chemin = '<p class="fil"><button type="button" class="lien-col" data-ouvrir="">Collectifs</button>' +
    (c.chemin || []).map(function (a) { return ' › <button type="button" class="lien-col" data-ouvrir="' + E(a.id) + '">' + E(a.nom) + '</button>'; }).join('') + ' › <b>' + E(c.nom) + '</b></p>';
  var site = c.site_web && /^https?:\/\//i.test(c.site_web) ? ' · <a href="' + E(c.site_web) + '" target="_blank" rel="noopener">' + E(c.site_web) + '</a>' : '';
  var chiffres = S.plateforme ? '<div class="chiffres"><div><b>' + c.enfants.length + '</b><span>Sous-collectifs</span></div>' +
    '<div><b>' + c.entreprises_directes + '</b><span>Entreprises rattachées ici</span></div><div><b>' + c.entreprises_ensemble + '</b><span>Entreprises dans l’ensemble</span></div>' +
    '<div><b>' + c.etablissements_ensemble + '</b><span>Établissements</span></div><div><b>' + c.membres_ensemble + '</b><span>Membres</span></div></div>' +
    '<p class="legende">« Dans l’ensemble » = ce collectif et tous ses sous-collectifs. Des nombres seulement, jamais les personnes.</p>' : '';
  var enfants = '<p class="etiquette">Sous-collectifs</p>' + (c.enfants.length ? '<ul class="arbre-col">' + c.enfants.map(function (e) {
    return '<li><button type="button" class="lien-col" data-ouvrir="' + E(e.id) + '">' + E(e.nom) + '</button> <span class="etat-mini">' + E(GENRES[e.genre] || e.genre) + (e.statut !== 'actif' ? ' · ' + E(STATUTS_COL[e.statut] || e.statut) : '') + '</span></li>';
  }).join('') + '</ul>' : '<p class="legende">Aucun sous-collectif.</p>') +
    (S.plateforme ? '<p><button type="button" class="bouton petit" id="creerSous" data-parent="' + E(c.id) + '">Créer un sous-collectif ici</button></p><div id="zoneCreation"></div>' : '');
  var adherentes = '';
  if (S.plateforme) {
    adherentes = '<p class="etiquette">Entreprises rattachées directement à ce collectif</p><p class="message" id="msgAdh" role="alert"></p>' +
      ((c.adherentes || []).map(function (o) {
        return '<div class="ligne-suivi entreprise"><div class="qui"><b>' + E(o.nom) + '</b><span>' + pluriel(o.etablissements, 'établissement') + ' · ' + pluriel(o.membres, 'membre') + ' · adhésion ' + E(o.adhesion) + (o.origine ? ' · collectif d’origine' : '') + '</span></div>' +
          '<div class="act">' + (o.origine ? '' : '<span class="chip-col"><button type="button" class="lien-mini" data-retirer-adh="' + E(o.id) + '|' + E(c.id) + '">Retirer</button></span>') + '</div></div>';
      }).join('') || '<p class="legende">Aucune entreprise rattachée ici.</p>') +
      (autres.length ? '<div class="ajout"><label class="champ" for="selIci">Rattacher une entreprise à ce collectif</label><select id="selIci" class="champ">' + autres.map(function (o) { return '<option value="' + E(o.id) + '">' + E(o.nom) + '</option>'; }).join('') + '</select><button type="button" class="bouton petit" id="rattacherIci" data-col="' + E(c.id) + '">Rattacher</button></div>' : '');
  }
  return '<section class="collectif">' + chemin + '<p class="etiquette" style="margin:10px 0 0">' + E(GENRES[c.genre] || c.genre) + ' · ' + E(STATUTS_COL[c.statut] || c.statut) + '</p><h2>' + E(c.nom) + '</h2>' +
    '<p class="legende">Créé le ' + E(jour(c.cree_le)) + (c.zone ? ' · ' + E(c.zone) : '') + site + '</p>' +
    (c.description ? '<p>' + E(c.description) + '</p>' : '') +
    (S.plateforme ? '<p><button type="button" class="bouton petit discret" id="modifierCollectif">Modifier la fiche</button></p><div id="zoneEdition"></div>' : '') +
    chiffres + enfants + adherentes +
    '<p class="etiquette">Référentiel métier de ce collectif</p>' + await metiersCollectif({ id: c.id }) + '</section>';
}

async function vueCollectifs() {
  return S.collectifId ? await vueFiche(S.collectifId) : await vueListeCollectifs();
}

function brancherCollectifs() {
  document.querySelectorAll('[data-ouvrir]').forEach(function (b) {
    b.addEventListener('click', function () { S.collectifId = b.getAttribute('data-ouvrir') || null; dessiner(); });
  });
  var ouvrirCreation = function (parentId) {
    var z = $('zoneCreation'); if (!z) return;
    z.innerHTML = formCollectifHtml('cr', null, parentId);
    $('crNon').onclick = function () { z.innerHTML = ''; };
    $('crOk').onclick = async function () {
      var v = lireFormCollectif('cr');
      var r = await sb.rpc('vsf_collectif_creer', { p_nom: v.nom, p_genre: v.genre, p_parent: v.parent, p_description: v.description, p_zone: v.zone, p_site: v.site });
      if (r.error) return dire('crMsg', messageErreurRpc(r.error));
      S.collectifId = r.data; S.liste = null; dessiner();
    };
    $('crNom').focus();
  };
  if ($('nouveauCollectif')) $('nouveauCollectif').onclick = function () { ouvrirCreation(null); };
  if ($('creerSous')) $('creerSous').onclick = function () { ouvrirCreation($('creerSous').getAttribute('data-parent')); };
  if ($('modifierCollectif')) $('modifierCollectif').onclick = async function () {
    var r = await sb.rpc('vsf_collectif_fiche', { p_id: S.collectifId });
    if (r.error || !r.data) return;
    var c = r.data, z = $('zoneEdition');
    z.innerHTML = formCollectifHtml('ed', c, c.parent_id);
    $('edNon').onclick = function () { z.innerHTML = ''; };
    $('edOk').onclick = async function () {
      var v = lireFormCollectif('ed');
      var rr = await sb.rpc('vsf_collectif_modifier', { p_id: c.id, p_nom: v.nom, p_genre: v.genre, p_parent: v.parent, p_statut: v.statut, p_description: v.description, p_zone: v.zone, p_site: v.site });
      if (rr.error) return dire('edMsg', messageErreurRpc(rr.error));
      S.liste = null; dessiner();
    };
  };
  if ($('rattacherIci')) $('rattacherIci').onclick = async function () {
    var r = await sb.rpc('vsf_adhesion_definir', { p_organisation: $('selIci').value, p_collectif: $('rattacherIci').getAttribute('data-col'), p_statut: 'active' });
    if (r.error) return dire('msgAdh', messageErreurRpc(r.error));
    dessiner();
  };
}

// Le référentiel métier d'un collectif : ses métiers (processus, sous-processus, modules) et le nombre de situations.
async function metiersCollectif(c) {
  {
    var m = await sb.from('metiers').select('id,nom,statut,libelles_niveaux,proprietaire_id').eq('federation_id', c.id).or('proprietaire_id.is.null,proprietaire_id.eq.' + S.moi).order('ordre');   // les métiers du collectif, et vos propres référentiels personnels (jamais ceux des autres)
    var metiers = '';
    for (var j = 0; j < (m.data || []).length; j++) {
      var x = m.data[j];
      var pr = await sb.from('referentiel_processus').select('nom').eq('metier_id', x.id);
      var noms = (pr.data || []).map(function (p) { return p.nom; });
      var sous = noms.length ? await sb.from('referentiel_sous_processus').select('*', { count: 'exact', head: true }).in('processus_nom', noms) : { count: 0 };
      var nMod = await compter('modules_apprentissage', { metier_id: x.id });
      var niv = Array.isArray(x.libelles_niveaux) ? x.libelles_niveaux.join(' · ') : '';
      metiers += '<div class="metier"><h3>' + E(x.nom) + '</h3><p><span class="etat">' + E(STATUTS[x.statut] || x.statut) + '</span><span class="niveaux">' + E(niv) + '</span></p>' +
        '<div class="chiffres"><div><b>' + noms.length + '</b><span>Processus</span></div><div><b>' + (sous.count == null ? '—' : sous.count) + '</b><span>Sous-processus</span></div>' +
        '<div><b>' + (nMod == null ? '—' : nMod) + '</b><span>Modules</span></div></div>' +
        (S.referentiels && x.proprietaire_id ? '<p class="legende">Référentiel personnel : il n’est pas mélangé à celui du collectif. Son propre guide d’édition viendra.</p>' : '') +
        (S.referentiels && !x.proprietaire_id ? '<div class="actions-ligne"><a class="bouton" href="' + E(GUIDE) + '?guide=travailler" target="_blank" rel="noopener">Éditer « comment on travaille »</a>' +
          '<a class="bouton" href="' + E(GUIDE) + '?guide=peindre" target="_blank" rel="noopener">Éditer « comment on peint »</a></div>' : '') + '</div>';
    }
    var nSit = await compter('referentiel_situations', { federation_id: c.id, niveau: { like: 'Niveau 1%' } });
    return '<div class="chiffres"><div><b>' + (nSit == null ? '—' : nSit) + '</b><span>Situations du collectif</span></div></div>' +
      '<p class="legende">Le référentiel métier collectif est le métier global, et non un poste de travail. Les situations appartiennent au collectif ; leur rattachement à un métier précis est à compléter.</p>' +
      (metiers || '<p class="legende">Aucun référentiel métier collectif pour le moment.</p>');
  }
}

/* ───── Suivi : l'équipe Skolantreuz (comptes d'administration) et le journal des actions ───── */
var ROLES = { super: 'Super administrateur', admin: 'Administrateur de la plateforme', referentiels: 'Administrateur de référentiels' };
var AIDE_ROLES = { super: 'tout : plateforme et référentiels', admin: 'comptes, offres, reversements, CGV (pas les référentiels)', referentiels: 'référentiels des collectifs (ni les comptes ni les commandes)' };
function messageErreurRpc(e) {
  var m = String((e && e.message) || e || '');
  if (/VSF07/.test(m + (e && e.code))) return 'Cette action est réservée au super administrateur.';
  if (/VSF08/.test(m + (e && e.code))) return m.replace(/^.*?:\s*/, '');
  return 'Impossible d’enregistrer pour le moment. Réessayez dans un instant.';
}
function dire(id, texte) { var m = $(id); if (m) { m.textContent = texte || ''; if (texte && m.scrollIntoView) m.scrollIntoView({ block: 'center' }); } }

async function vueSuivi() {
  if (!S.super) return '<div class="bientot"><p class="etiquette" style="margin-top:0">Suivi</p><p>Le suivi des comptes d’administration et le journal des actions sont réservés au super administrateur.</p></div>';
  var eq = await sb.rpc('vsf_equipe');
  var jr = await sb.from('vsf_journal').select('cree_le,auteur_email,action,cible,detail').order('cree_le', { ascending: false }).limit(30);
  var QUI = { equipe_definir: 'a donné un rôle à', equipe_retirer: 'a retiré l’accès de', collectif_renommer: 'a renommé le collectif', collectif_creer: 'a créé le collectif', ambassadeur_creer: 'a créé l’ambassadeur métier', ambassadeur_modifier: 'a modifié l’ambassadeur métier', entreprise_bloquer: 'a bloqué l’entreprise', entreprise_debloquer: 'a débloqué l’entreprise', entreprise_supprimer: 'a supprimé l’entreprise vide', collectif_modifier: 'a modifié la fiche du collectif', adhesion_active: 'a rattaché une entreprise à un collectif :', adhesion_retiree: 'a retiré une entreprise d’un collectif :', adhesion_en_attente: 'a mis en attente l’adhésion de', adhesion_suspendue: 'a suspendu l’adhésion de' };
  var lignes = (eq.data || []).map(function (x) {
    return '<div class="ligne-suivi"><div class="qui"><b>' + E(x.email) + '</b><span>' + E(ROLES[x.role] || x.role) + ' · ' + E(AIDE_ROLES[x.role] || '') + '</span></div>' +
      '<div class="act">' + (x.user_id === S.moi ? '<span class="etat-mini">C’est vous</span>' : '<button class="bouton petit discret" data-retirer="' + E(x.user_id) + '">Retirer</button>') + '</div></div>';
  }).join('');
  var journal = (jr.data || []).map(function (x) {
    var d = x.detail || {};
    var texte = (QUI[x.action] || x.action) + ' ' + E(x.cible || '') + (d.apres ? ' → ' + E(d.apres) : '') + (d.role ? ' (' + E(ROLES[d.role] || d.role) + ')' : '');
    return '<div class="ligne-suivi"><div class="qui"><b>' + E(x.auteur_email || '—') + '</b><span>' + texte + '</span></div><div class="act"><span class="etat-mini">' + E(jour(x.cree_le)) + '</span></div></div>';
  }).join('');
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Équipe Skolantreuz</p><h2>Qui a accès à l’administration</h2>' +
    '<p class="legende">Chaque personne doit déjà avoir un compte (s’être connectée une fois sur le site). Les rôles sont séparés : un administrateur de référentiels ne voit ni les comptes ni les commandes.</p>' +
    (eq.error ? '<p class="message">' + E(messageErreurRpc(eq.error)) + '</p>' : lignes) +
    '<div class="ajout"><label class="champ" for="eEmail">Ajouter ou changer un rôle (adresse e-mail)</label><input id="eEmail" type="email" placeholder="prenom@exemple.fr" autocomplete="off">' +
    '<label class="champ" for="eRole">Rôle</label><select id="eRole" class="champ"><option value="referentiels">Administrateur de référentiels</option><option value="admin">Administrateur de la plateforme</option><option value="super">Super administrateur</option></select>' +
    '<p class="message" id="msgEquipe" role="alert"></p><button class="bouton" id="eAjouter">Enregistrer ce rôle</button></div></section>' +
    '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Journal</p><h2>Qui a fait quoi</h2>' +
    (journal || '<p class="legende">Aucune action enregistrée pour le moment.</p>') + '</section>';
}
function brancherSuivi() {
  var a = $('eAjouter');
  if (a) a.addEventListener('click', async function () {
    var r = await sb.rpc('vsf_equipe_definir', { p_email: $('eEmail').value, p_role: $('eRole').value });
    if (r.error) return dire('msgEquipe', messageErreurRpc(r.error));
    dessiner();
  });
  document.querySelectorAll('[data-retirer]').forEach(function (b) {
    b.addEventListener('click', function () {
      var zone = b.parentNode, memoire = zone.innerHTML;
      zone.innerHTML = '<span class="etat-mini">Retirer ?</span> ';
      var oui = document.createElement('button'); oui.type = 'button'; oui.className = 'bouton petit'; oui.textContent = 'Oui';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Non';
      oui.onclick = async function () {
        var r = await sb.rpc('vsf_equipe_retirer', { p_user: b.getAttribute('data-retirer') });
        if (r.error) { zone.innerHTML = memoire; return dire('msgEquipe', messageErreurRpc(r.error)); }
        dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherSuivi(); };
      zone.appendChild(oui); zone.appendChild(non);
    });
  });
}

/* ───── Entreprises : les poupées russes (collectif → entreprises → établissements → nombre de membres) ───── */
S.collectifs = [];
async function vueEntreprises() {
  if (!S.plateforme) return '<div class="bientot"><p class="etiquette" style="margin-top:0">Entreprises</p><p>La liste des entreprises est réservée à l’administrateur de la plateforme. Un administrateur de référentiels n’y a pas accès.</p></div>';
  var r = await sb.rpc('vsf_entreprises_liste');
  if (r.error) return '<p class="message">Impossible de lire les entreprises : la mise à jour de la base (migration 16) n’est peut-être pas faite.</p>';
  var f = await sb.from('federations').select('id,name').order('created_at'); S.collectifs = f.data || [];
  var liste = r.data || [];
  var corps = liste.map(function (o) {
    var dejaIds = o.collectifs.map(function (c) { return c.id; });
    var dispo = S.collectifs.filter(function (c) { return dejaIds.indexOf(c.id) < 0; });
    var vide = o.etablissements === 0 && o.membres === 0;
    var gerer = '<div class="gerer">' + (o.bloquee
      ? '<button type="button" class="lien-mini" data-debloquer="' + E(o.id) + '">Débloquer</button>'
      : '<button type="button" class="lien-mini" data-bloquer="' + E(o.id) + '">Bloquer</button>') +
      (S.super ? (vide ? ' <button type="button" class="lien-mini" data-supprimer="' + E(o.id) + '" data-nom="' + E(o.nom) + '">Supprimer</button>' : ' <span class="resume">Suppression impossible : elle contient des données (la bloquer)</span>') : '') + '</div>';
    return '<div class="ligne-suivi entreprise' + (o.bloquee ? ' bloquee' : '') + '"><div class="qui"><b>' + E(o.nom) + (o.bloquee ? ' <span class="etat-mini">Bloquée</span>' : '') + '</b>' +
      '<span>' + o.etablissements + ' établissement' + (o.etablissements > 1 ? 's' : '') + ' · ' + o.membres + ' membre' + (o.membres > 1 ? 's' : '') + ' · créée le ' + E(jour(o.cree_le)) + (o.bloquee && o.motif ? ' · motif : ' + E(o.motif) : '') + '</span>' + gerer +
      '<div class="chips">' + o.collectifs.map(function (c) {
        return '<span class="chip-col">' + E(c.nom) + ' · ' + E(c.statut) + (c.id === o.origine ? ' · origine' : ' <button type="button" class="lien-mini" data-retirer-adh="' + E(o.id) + '|' + E(c.id) + '">Retirer</button>') + '</span>';
      }).join('') + '</div></div>' +
      '<div class="act">' + (dispo.length && !o.bloquee ? '<select id="sel-' + E(o.id) + '" aria-label="Rattacher à un collectif">' + dispo.map(function (c) { return '<option value="' + E(c.id) + '">' + E(c.name) + '</option>'; }).join('') + '</select> <button type="button" class="bouton petit" data-ajouter-adh="' + E(o.id) + '">Rattacher</button>' : '') + '</div></div>';
  }).join('');
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Entreprises</p><h2>' + liste.length + ' entreprise' + (liste.length > 1 ? 's' : '') + '</h2>' +
    '<p class="legende">Pour chaque entreprise : son nom, ses collectifs, le nombre de ses établissements et de ses membres. Jamais le contenu de l’entreprise. Une entreprise peut adhérer à plusieurs collectifs.</p>' +
    '<p class="message" id="msgAdh" role="alert"></p>' + (corps || '<p class="legende">Aucune entreprise.</p>') + '</section>';
}
function brancherEntreprises() {
  document.querySelectorAll('[data-bloquer]').forEach(function (b) {
    b.addEventListener('click', function () {
      var org = b.getAttribute('data-bloquer'), zone = b.parentNode, memoire = zone.innerHTML;
      zone.innerHTML = '<label class="champ" for="motifBloc" style="margin:0">Motif du blocage</label><input id="motifBloc" type="text" maxlength="500" autocomplete="off" style="max-width:420px"> ';
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'bouton petit'; ok.textContent = 'Bloquer';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Annuler';
      ok.onclick = async function () {
        var r = await sb.rpc('vsf_entreprise_bloquer', { p_org: org, p_bloquer: true, p_motif: $('motifBloc').value });
        if (r.error) return dire('msgAdh', messageErreurRpc(r.error));
        dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherEntreprises(); };
      zone.appendChild(ok); zone.appendChild(non); $('motifBloc').focus();
    });
  });
  document.querySelectorAll('[data-debloquer]').forEach(function (b) {
    b.addEventListener('click', async function () {
      var r = await sb.rpc('vsf_entreprise_bloquer', { p_org: b.getAttribute('data-debloquer'), p_bloquer: false, p_motif: null });
      if (r.error) return dire('msgAdh', messageErreurRpc(r.error));
      dessiner();
    });
  });
  document.querySelectorAll('[data-supprimer]').forEach(function (b) {
    b.addEventListener('click', function () {
      var org = b.getAttribute('data-supprimer'), zone = b.parentNode, memoire = zone.innerHTML;
      zone.innerHTML = '<p class="resume" style="margin:0">Suppression définitive d’une entreprise vide. Retapez son nom pour confirmer :</p><input id="confSupp" type="text" autocomplete="off" aria-label="Nom de l’entreprise à supprimer" style="max-width:420px"> ';
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'bouton petit'; ok.textContent = 'Supprimer définitivement';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'bouton petit discret'; non.textContent = 'Annuler';
      ok.onclick = async function () {
        var r = await sb.rpc('vsf_entreprise_supprimer', { p_org: org, p_confirmation: $('confSupp').value });
        if (r.error) return dire('msgAdh', messageErreurRpc(r.error));
        dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherEntreprises(); };
      zone.appendChild(ok); zone.appendChild(non); $('confSupp').focus();
    });
  });
  document.querySelectorAll('[data-ajouter-adh]').forEach(function (b) {
    b.addEventListener('click', async function () {
      var org = b.getAttribute('data-ajouter-adh'), col = $('sel-' + org).value;
      var r = await sb.rpc('vsf_adhesion_definir', { p_organisation: org, p_collectif: col, p_statut: 'active' });
      if (r.error) return dire('msgAdh', messageErreurRpc(r.error));
      dessiner();
    });
  });
  document.querySelectorAll('[data-retirer-adh]').forEach(function (b) {
    b.addEventListener('click', function () {
      var zone = b.parentNode, memoire = zone.innerHTML, ids = b.getAttribute('data-retirer-adh').split('|');
      zone.innerHTML = ' <span class="etat-mini">Retirer ?</span> ';
      var oui = document.createElement('button'); oui.type = 'button'; oui.className = 'lien-mini'; oui.textContent = 'Oui';
      var non = document.createElement('button'); non.type = 'button'; non.className = 'lien-mini'; non.textContent = 'Non';
      oui.onclick = async function () {
        var r = await sb.rpc('vsf_adhesion_definir', { p_organisation: ids[0], p_collectif: ids[1], p_statut: 'retiree' });
        if (r.error) { zone.innerHTML = memoire; brancherEntreprises(); return dire('msgAdh', messageErreurRpc(r.error)); }
        dessiner();
      };
      non.onclick = function () { zone.innerHTML = memoire; brancherEntreprises(); };
      zone.appendChild(oui); zone.appendChild(non);
    });
  });
}

function vueReservee(nom) { return '<div class="bientot"><p class="etiquette" style="margin-top:0">' + E(nom) + '</p><p>Cette partie est réservée à l’administrateur de la plateforme. Un administrateur de référentiels n’y a pas accès.</p></div>'; }
var euros = function (n) { return Number(n || 0).toLocaleString('fr-FR') + ' €'; };

/* ───── Ambassadeurs métier : la liste, la création et la modification. Valider, publier une offre, reverser : tableau de bord. ───── */
var STATUTS_AMB = { en_attente: 'En attente de validation', valide: 'Validé', suspendu: 'Suspendu' };
S.ambassadeurs = [];
async function vueAmbassadeurs() {
  if (!S.plateforme) return vueReservee('Ambassadeurs métier');
  var r = await sb.rpc('vsf_ambassadeurs_liste');
  if (r.error) return '<p class="message">Impossible de lire les ambassadeurs métier : la mise à jour de la base (migration 19 ou 20) n’est peut-être pas faite.</p>';
  var liste = S.ambassadeurs = r.data || [];
  var lignes = liste.map(function (a) {
    return '<div class="ligne-suivi"><div class="qui"><b>' + E(a.nom) + (a.atelier ? ' <span class="resume">· ' + E(a.atelier) + '</span>' : '') + '</b>' +
      '<span>' + E(a.email || 'pas d’adresse e-mail') + ' · ' + E(STATUTS_AMB[a.statut] || a.statut) + ' · ' + (a.compte_ouvert ? 'compte ouvert' : 'compte non ouvert') + ' · ' + (a.fiche_complete ? 'fiche complète' : 'fiche à compléter') + ' · ' + (a.contrat_accepte ? 'contrat accepté' + (a.contrat_version ? ' (' + E(a.contrat_version) + ')' : '') : 'contrat non accepté') + (a.collectif ? ' · collectif : ' + E(a.collectif) : '') + '</span>' +
      '<span>' + pluriel(Number(a.offres), 'offre') + ' (' + a.offres_publiees + ' publiée' + (a.offres_publiees > 1 ? 's' : '') + ', ' + a.offres_pilote + ' en pilote) · ' + pluriel(Number(a.ventes), 'vente') + ' · reste à reverser : <b>' + E(euros(a.reste_a_reverser_eur)) + '</b></span>' +
      '<div class="gerer"><button type="button" class="lien-mini" data-modifier-amb="' + E(a.id) + '">Modifier</button></div></div></div>';
  }).join('');
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Ambassadeurs métier</p><h2>' + pluriel(liste.length, 'ambassadeur') + ' métier</h2>' +
    '<p class="legende">Les maîtres artisans qui vendent leur métier sur VRAI-SAVOIRFAIRE. C’est vous qui créez leur compte. La personne se connecte ensuite avec la même adresse e-mail sur « mon-compte-ambassadeur.html », complète sa fiche et accepte le contrat. Pour valider un ambassadeur, publier une offre ou enregistrer un virement :</p>' +
    '<p><a class="bouton" href="admin.html">Ouvrir le tableau de bord</a> <button type="button" class="bouton" id="creerAmb">Créer un ambassadeur métier</button></p><div id="zoneAmb"></div>' +
    (lignes || '<p class="legende">Aucun ambassadeur métier pour le moment.</p>') + '</section>';
}
function formAmbassadeurHtml(a) {
  return '<div class="ajout"><label class="champ" for="ambNom">Nom</label><input id="ambNom" type="text" maxlength="120" value="' + E(a ? a.nom : '') + '" autocomplete="off">' +
    '<label class="champ" for="ambEmail">Adresse e-mail (celle avec laquelle la personne se connectera)</label><input id="ambEmail" type="email" maxlength="200" value="' + E(a ? a.email : '') + '" autocomplete="off">' +
    '<label class="champ" for="ambAtelier">Atelier ou entreprise (facultatif)</label><input id="ambAtelier" type="text" maxlength="120" value="' + E(a ? a.atelier : '') + '" autocomplete="off">' +
    '<p class="message" id="ambMsg" role="alert"></p><button type="button" class="bouton" id="ambOk">' + (a ? 'Enregistrer' : 'Créer cet ambassadeur métier') + '</button> <button type="button" class="bouton discret" id="ambNon">Annuler</button></div>';
}
function brancherAmbassadeurs() {
  var ouvrir = function (a) {
    var z = $('zoneAmb'); if (!z) return;
    z.innerHTML = formAmbassadeurHtml(a);
    $('ambNon').onclick = function () { z.innerHTML = ''; };
    $('ambOk').onclick = async function () {
      var r = await sb.rpc('vsf_ambassadeur_definir', { p_id: a ? a.id : null, p_nom: $('ambNom').value, p_email: $('ambEmail').value, p_atelier: $('ambAtelier').value });
      if (r.error) return dire('ambMsg', messageErreurRpc(r.error));
      dessiner();
    };
    $('ambNom').focus();
  };
  if ($('creerAmb')) $('creerAmb').onclick = function () { ouvrir(null); };
  document.querySelectorAll('[data-modifier-amb]').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = S.ambassadeurs.filter(function (x) { return x.id === b.getAttribute('data-modifier-amb'); })[0];
      if (a) { ouvrir(a); $('zoneAmb').scrollIntoView({ block: 'center' }); }
    });
  });
}

/* ───── Personnes : des nombres seulement ───── */
async function vuePersonnes() {
  if (!S.plateforme) return vueReservee('Personnes');
  var r = await sb.rpc('vsf_personnes_chiffres');
  if (r.error || !r.data) return '<p class="message">Impossible de lire les chiffres : la mise à jour de la base (migration 19) n’est peut-être pas faite.</p>';
  var d = r.data;
  var bloc = function (n, t) { return '<div><b>' + Number(n) + '</b><span>' + E(t) + '</span></div>'; };
  return '<section class="collectif"><p class="etiquette" style="margin:10px 0 0">Personnes</p><h2>' + pluriel(Number(d.comptes), 'compte') + '</h2>' +
    '<p class="legende">Des nombres seulement : jamais un nom, jamais un parcours. La liste des comptes (suspendre, rétablir) se trouve dans le tableau de bord.</p>' +
    '<p class="etiquette">Comptes</p><div class="chiffres">' + bloc(d.verifies, 'Vérifiés') + bloc(d.en_attente, 'En attente') + bloc(d.suspendus, 'Suspendus') + bloc(d.nouveaux_30j, 'Nouveaux (30 jours)') + '</div>' +
    '<p class="etiquette">Parcours</p><div class="chiffres">' + bloc(d.parcours_commences, 'Parcours commencés') + bloc(d.plans_confirmes, 'Plans confirmés') + '</div>' +
    '<p class="etiquette">Commandes</p><div class="chiffres">' + bloc(d.commandes_payees, 'Payées') + bloc(d.commandes_en_attente, 'En attente de paiement') + bloc(d.commandes_remboursees, 'Remboursées') + '</div>' +
    '<p><a class="bouton" href="admin.html">Ouvrir le tableau de bord</a></p></section>';
}

async function dessiner() {
  var jeton = S.jeton = (S.jeton || 0) + 1;   // un clic plus récent annule le dessin en cours
  var corps;
  if (S.onglet === 'collectifs') corps = await vueCollectifs();
  else if (S.onglet === 'entreprises') corps = await vueEntreprises();
  else if (S.onglet === 'ambassadeurs') corps = await vueAmbassadeurs();
  else if (S.onglet === 'personnes') corps = await vuePersonnes();
  else corps = await vueSuivi();
  if (jeton !== S.jeton) return;
  $('app').innerHTML =
    '<p class="etiquette">' + (S.plateforme ? 'Administrateur de la plateforme' : 'Administrateur de référentiels') + '</p>' +
    '<h1>Entités</h1>' +
    '<p class="legende">Les collectifs, les entreprises et les personnes que Skolantreuz gère. Vous voyez le référentiel et la gestion, jamais les données personnelles des entités.</p>' +
    ongletsHtml() + '<div>' + corps + '</div>';
  brancherSuivi();
  brancherEntreprises();
  brancherCollectifs();
  brancherAmbassadeurs();
  document.querySelectorAll('.onglets button').forEach(function (b) {
    b.addEventListener('click', function () { S.onglet = b.getAttribute('data-o'); if (S.onglet === 'collectifs') S.collectifId = null; dessiner(); });
  });
}

async function demarrer() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.replace('connexion.html?suite=' + encodeURIComponent(location.href)); return; }
  var r = await Promise.all([sb.rpc('vsf_est_admin'), sb.rpc('vsf_est_admin_referentiels'), sb.rpc('vsf_est_super')]);
  S.moi = s.data.session.user.id; S.super = r[2].data === true;
  S.plateforme = r[0].data === true; S.referentiels = r[1].data === true;
  if (!S.plateforme && !S.referentiels) {
    return $('app').innerHTML = '<p class="etiquette">Entités</p><h1>Accès réservé.</h1><p class="message">Cette page est réservée à l’équipe de VRAI-SAVOIRFAIRE.</p><a class="bouton" href="./">Retour à l’accueil</a>';
  }
  dessiner();
}
demarrer();
</script>
<script src="vsf-pop.js"></script>
