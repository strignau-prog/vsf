<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Accès privé — VRAI-SAVOIRFAIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap">
<link rel="stylesheet" href="vsf.css">
<style>
  .mdp{width:100%;min-height:44px;font:inherit;font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--ink);padding:10px 0}
  .wrap.petit{max-width:560px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="vsf-auth.js"></script>
<link rel="stylesheet" href="vsf-largeur.css"><link rel="stylesheet" href="vsf-icones.css"><link rel="stylesheet" href="vsf-epure.css"><link rel="stylesheet" href="vsf-logo.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="vsf-menu.css">
</head>
<body>
<script src="vsf-menu.js"></script>
<main class="wrap petit" id="app">
  <p class="etiquette">Accès privé</p>
  <h1>Entrez votre mot de passe.</h1>
  <p class="legende">Celui qui accompagne ce lien.</p>
  <label class="champ" for="mdp">Mot de passe</label>
  <input class="mdp" id="mdp" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="mot de passe">
  <p class="message" id="msg" role="alert"></p>
  <button class="bouton" id="bOuvrir" type="button" data-texte>Ouvrir</button>
</main>
<script>
var $ = function (id) { return document.getElementById(id); };
var code = new URLSearchParams(location.search).get('c') || '';
var occupe = false;

function dire(t) { $('msg').textContent = t || ''; }

async function ouvrir() {
  if (occupe) return;
  var mdp = $('mdp').value;
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(code)) { dire('Ce lien est incomplet. Demandez-en un nouveau.'); return; }
  if (!mdp) { dire('Entrez le mot de passe.'); $('mdp').focus(); return; }
  occupe = true; $('bOuvrir').disabled = true; dire('');
  try {
    var r = await fetch(VSF.fonctions + '/acces-prive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: VSF.cle, Authorization: 'Bearer ' + VSF.cle },
      body: JSON.stringify({ code: code, mdp: mdp })
    });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok || !j.token_hash) { dire(j.erreur || 'Impossible pour le moment. Réessayez dans un instant.'); return; }
    $('app').innerHTML = '<p class="etiquette">Accès privé</p><h1>Ouverture…</h1>';
    await VSF.sb.auth.signOut({ scope: 'local' });                 // une autre session sur cet appareil est fermée, sans toucher aux autres appareils
    var v = await VSF.sb.auth.verifyOtp({ token_hash: j.token_hash, type: 'magiclink' });
    if (v.error) throw v.error;
    await VSF.enregistrerPersonne('', '');
    var suite = (j.suite === 'diagnostic-entreprise.html' || j.suite === 'mon-passage.html') ? j.suite : './';
    location.replace(suite);
  } catch (e) {
    $('app').innerHTML = '<p class="etiquette">Accès privé</p><h1>Entrez votre mot de passe.</h1><p class="message">Impossible pour le moment. Réessayez dans un instant.</p>' +
      '<button class="bouton" type="button" onclick="location.reload()">Réessayer</button>';
  } finally { occupe = false; var b = $('bOuvrir'); if (b) b.disabled = false; }
}
$('bOuvrir').addEventListener('click', ouvrir);
$('mdp').addEventListener('keydown', function (e) { if (e.key === 'Enter') ouvrir(); });
</script>
<script src="vsf-icones.js"></script><script src="vsf-pop.js"></script><script src="vsf-logo.js"></script>
</body>
</html>
